推导差。 Composition API 用「组合函数 composable」解决：函数显式返回 ref / computed / 方法，调用处解构命名（可重命名），依赖关系与数据来源一目了然，天然支持 TS 类型推导，逻辑可跨组件复用且可嵌套组合。 加分：Vue3 仍保留 mixins 只为兼容，新代码应优先用 composables（类似 React 自定义 Hook）。"}]},{"id":"day5-s2","day":5,"title":"5.2 React 核心与 Hooks","note":"","questions":[{"id":149,"num":"Q149","tag":"原理","title":"React 的渲染流程与 Fiber 架构？","answers":["Fiber 是 React 16 引入的重写后的协调（Reconciliation）引擎，把原本递归、不可中断的同步 diff 改造成「可中断、可恢复、可设优先级」的工作单元链表结构（每个 FiberNode 对应一个组件/元素，含 child / sibling / return 指针）。","流程：JSX → React Element → beginWork（render 阶段，可中断，构建 workInProgress 树并打 effect 标记）→ completeWork → commit 阶段（不可中断，一次性把变更应用到真实 DOM，执行生命周期/useLayoutEffect/useEffect）。","双缓存机制：current 树（当前屏幕上显示的）与 workInProgress 树（正在构建的）通过 alternate 指针互相引用，构建完成后一次性切换 fiberRoot.current，保证用户不会看到半渲染的 UI。","调度：Scheduler 按优先级（Immediate / UserBlocking / Normal / Low / Idle）分配任务，用时间切片（默认 5ms）在浏览器空闲时执行，配合 lane 模型标记更新优先级，实现并发渲染（Concurrent Rendering）与可中断更新。"],"bullets":[],"code":[],"note":"","text":"React 的渲染流程与 Fiber 架构？ Fiber 是 React 16 引入的重写后的协调（Reconciliation）引擎，把原本递归、不可中断的同步 diff 改造成「可中断、可恢复、可设优先级」的工作单元链表结构（每个 FiberNode 对应一个组件/元素，含 child / sibling / return 指针）。 流程：JSX → React Element → beginWork（render 阶段，可中断，构建 workInProgress 树并打 effect 标记）→ completeWork → commit 阶段（不可中断，一次性把变更应用到真实 DOM，执行生命周期/useLayoutEffect/useEffect）。 双缓存机制：current 树（当前屏幕上显示的）与 workInProgress 树（正在构建的）通过 alternate 指针互相引用，构建完成后一次性切换 fiberRoot.current，保证用户不会看到半渲染的 UI。 调度：Scheduler 按优先级（Immediate / UserBlocking / Normal / Low / Idle）分配任务，用时间切片（默认 5ms）在浏览器空闲时执行，配合 lane 模型标记更新优先级，实现并发渲染（Concurrent Rendering）与可中断更新。"},{"id":150,"num":"Q150","tag":"必考","title":"setState 是同步还是异步？React 18 的变化？","answers":["React 18 之前：在合成事件与生命周期中是「批量更新」（表现为异步，拿不到新值），在 setTimeout / 原生事件 / Promise 回调中是同步立即更新；因为是否批处理取决于是否处于 React 的 batchedUpdates 上下文中。","React 18 起默认开启 automatic batching：无论 setTimeout、原生事件、Promise、async/await 里，多次 setState 都会自动合并为一次渲染。需要立即同步刷新可用 flushSync（谨慎使用，会破坏批处理）。","要点：setState 本身不是「异步 API」，而是「状态更新被调度/批处理」，状态对象在本次渲染中保持不变；函数式更新 setState(prev => prev + 1) 能拿到最新的 prev，适合连续多次更新；类组件 setState 第二参数回调与 componentDidUpdate 可拿到更新后的值。","useState 的 setter 用 Object.is 比较，值相同时会跳过重渲染（bail out）；对象/数组必须换引用才会更新。"],"bullets":[],"code":[],"note":"","text":"setState 是同步还是异步？React 18 的变化？ React 18 之前：在合成事件与生命周期中是「批量更新」（表现为异步，拿不到新值），在 setTimeout / 原生事件 / Promise 回调中是同步立即更新；因为是否批处理取决于是否处于 React 的 batchedUpdates 上下文中。 React 18 起默认开启 automatic batching：无论 setTimeout、原生事件、Promise、async/await 里，多次 setState 都会自动合并为一次渲染。需要立即同步刷新可用 flushSync（谨慎使用，会破坏批处理）。 要点：setState 本身不是「异步 API」，而是「状态更新被调度/批处理」，状态对象在本次渲染中保持不变；函数式更新 setState(prev => prev + 1) 能拿到最新的 prev，适合连续多次更新；类组件 setState 第二参数回调与 componentDidUpdate 可拿到更新后的值。 useState 的 setter 用 Object.is 比较，值相同时会跳过重渲染（bail out）；对象/数组必须换引用才会更新。"},{"id":151,"num":"Q151","tag":"高频","title":"Hooks 的规则与原理？为什么不能在条件/循环里调用？","answers":["规则：只在函数组件/自定义 Hook 的顶层调用，不能在条件、循环、嵌套函数里调用；只能在 React 函数中调用（自定义 Hook 以 use 开头）。","原理：函数组件的 Hook 状态以「链表/数组」形式挂在 FiberNode 的 memoizedState 上，每次渲染按调用顺序依次读取；如果顺序或数量变化（条件分支跳过某个 Hook），就会把 A Hook 的状态读到 B 上，导致状态错乱。ESLint 的 eslint-plugin-react-hooks 会静态检查这一点。","组件首次渲染走 mountXxx（创建 Hook 对象并挂链），更新走 updateXxx（复用链表节点）；useEffect 的 effect 也组成链表，靠 deps 数组决定是否重新执行。"],"bullets":[],"code":[],"note":"","text":"Hooks 的规则与原理？为什么不能在条件/循环里调用？ 规则：只在函数组件/自定义 Hook 的顶层调用，不能在条件、循环、嵌套函数里调用；只能在 React 函数中调用（自定义 Hook 以 use 开头）。 原理：函数组件的 Hook 状态以「链表/数组」形式挂在 FiberNode 的 memoizedState 上，每次渲染按调用顺序依次读取；如果顺序或数量变化（条件分支跳过某个 Hook），就会把 A Hook 的状态读到 B 上，导致状态错乱。ESLint 的 eslint-plugin-react-hooks 会静态检查这一点。 组件首次渲染走 mountXxx（创建 Hook 对象并挂链），更新走 updateXxx（复用链表节点）；useEffect 的 effect 也组成链表，靠 deps 数组决定是否重新执行。"},{"id":152,"num":"Q152","tag":"必考","title":"useEffect 的闭包陷阱？怎么解决？","answers":["原因：每次渲染都会创建一个新的函数闭包，effect 回调捕获的是「那一次渲染」的 props/state。如果 deps 为空或漏写依赖，回调里读到的永远是首次渲染的旧值（典型：定时器里 count 一直是 0）。","解决：① 依赖数组写全（ESLint exhaustive-deps）；② 用函数式更新 setCount(c => c + 1) 绕开对 count 的读取；③ 用 useRef 保存最新值（useLatest 模式：ref.current = value，回调读 ref.current）；④ 用 useReducer 把逻辑收敛；⑤ 在 useEffect 里正确 return 清理函数（清定时器、取消订阅、AbortController 取消请求）。","高频追问：useEffect 里请求数据为什么会有竞态？快速切换 tab 时旧请求后返回会覆盖新数据；用 cleanup 里的 canceled 标记或 AbortController.signal 取消，或直接上 TanStack Query / SWR。"],"bullets":[],"code":[],"note":"","text":"useEffect 的闭包陷阱？怎么解决？ 原因：每次渲染都会创建一个新的函数闭包，effect 回调捕获的是「那一次渲染」的 props/state。如果 deps 为空或漏写依赖，回调里读到的永远是首次渲染的旧值（典型：定时器里 count 一直是 0）。 解决：① 依赖数组写全（ESLint exhaustive-deps）；② 用函数式更新 setCount(c => c + 1) 绕开对 count 的读取；③ 用 useRef 保存最新值（useLatest 模式：ref.current = value，回调读 ref.current）；④ 用 useReducer 把逻辑收敛；⑤ 在 useEffect 里正确 return 清理函数（清定时器、取消订阅、AbortController 取消请求）。 高频追问：useEffect 里请求数据为什么会有竞态？快速切换 tab 时旧请求后返回会覆盖新数据；用 cleanup 里的 canceled 标记或 AbortController.signal 取消，或直接上 TanStack Query / SWR。"},{"id":153,"num":"Q153","tag":"对比","title":"useEffect、useLayoutEffect、useInsertionEffect 的区别？","answers":["useEffect：在浏览器完成绘制之后异步执行，不阻塞渲染，适合数据请求、订阅、埋点等大多数副作用。","useLayoutEffect：在 DOM 变更完成后、浏览器绘制之前同步执行，会阻塞绘制；适合读取 DOM 尺寸并同步调整布局、避免闪烁（如先测量再定位 tooltip）；SSR 下会告警（服务端无 DOM）。","useInsertionEffect：在布局副作用之前执行，专为 CSS-in-JS 库在渲染时注入 <style> 设计，业务代码基本不用。","执行顺序（一次更新）：DOM 变更 → useLayoutEffect（同步）→ 浏览器绘制 → useEffect（异步）；清理函数按同样时机先执行。"],"bullets":[],"code":[],"note":"","text":"useEffect、useLayoutEffect、useInsertionEffect 的区别？ useEffect：在浏览器完成绘制之后异步执行，不阻塞渲染，适合数据请求、订阅、埋点等大多数副作用。 useLayoutEffect：在 DOM 变更完成后、浏览器绘制之前同步执行，会阻塞绘制；适合读取 DOM 尺寸并同步调整布局、避免闪烁（如先测量再定位 tooltip）；SSR 下会告警（服务端无 DOM）。 useInsertionEffect：在布局副作用之前执行，专为 CSS-in-JS 库在渲染时注入 <style> 设计，业务代码基本不用。 执行顺序（一次更新）：DOM 变更 → useLayoutEffect（同步）→ 浏览器绘制 → useEffect（异步）；清理函数按同样时机先执行。"},{"id":154,"num":"Q154","tag":"对比","title":"useMemo、useCallback、React.memo 的区别与滥用问题？","answers":["React.memo：高阶组件，对 props 做浅比较，props 不变时跳过整个组件重渲染（组件级缓存）。","useMemo：缓存「计算结果」，依赖不变时复用值（值级缓存），适合昂贵计算或需要稳定引用的对象/数组（避免子组件因引用变化重渲染）。","useCallback：缓存「函数引用」，等价于 useMemo(() => fn, deps)，主要为了配合 React.memo 与作为 effect 依赖时保持引用稳定。","注意三者都是「缓存 + 依赖比较」，不是「性能优化万能药」：缓存本身有比较与内存成本，组件很轻或 props 每次都变时反而更慢；正确做法是先测量（React DevTools Profiler）再优化；且必须保证 deps 正确，否则会拿到旧值。","加分：React 19 的 React Compiler（原 Forget）可自动做记忆化，未来手写 memo 的必要性会下降。"],"bullets":[],"code":[],"note":"","text":"useMemo、useCallback、React.memo 的区别与滥用问题？ React.memo：高阶组件，对 props 做浅比较，props 不变时跳过整个组件重渲染（组件级缓存）。 useMemo：缓存「计算结果」，依赖不变时复用值（值级缓存），适合昂贵计算或需要稳定引用的对象/数组（避免子组件因引用变化重渲染）。 useCallback：缓存「函数引用」，等价于 useMemo(() => fn, deps)，主要为了配合 React.memo 与作为 effect 依赖时保持引用稳定。 注意三者都是「缓存 + 依赖比较」，不是「性能优化万能药」：缓存本身有比较与内存成本，组件很轻或 props 每次都变时反而更慢；正确做法是先测量（React DevTools Profiler）再优化；且必须保证 deps 正确，否则会拿到旧值。 加分：React 19 的 React Compiler（原 Forget）可自动做记忆化，未来手写 memo 的必要性会下降。"},{"id":155,"num":"Q155","tag":"高频","title":"useState / useReducer / useContext / useRef 各自适用什么？","answers":["useState：简单独立状态；useReducer：多个子值互相依赖、状态转移逻辑复杂（用 dispatch + reducer 更可测、可预测），或需要把更新逻辑下传给深层组件（传 dispatch 比传多个 setter 稳定）；useContext：跨层级共享「低频变化」的全局数据（主题、locale、登录态），但 context 变化会让所有消费组件重渲染，高频状态应拆 context / 配合状态库 / 用 useSyncExternalStore；useRef：保存不触发渲染的可变值（DOM 引用、定时器 ID、上一次的值、最新值），修改 .ref.current 不会重渲染。","forwardRef + useImperativeHandle 用于父组件调用子组件暴露的方法（Vue 里对应 defineExpose）。"],"bullets":[],"code":[],"note":"","text":"useState / useReducer / useContext / useRef 各自适用什么？ useState：简单独立状态；useReducer：多个子值互相依赖、状态转移逻辑复杂（用 dispatch + reducer 更可测、可预测），或需要把更新逻辑下传给深层组件（传 dispatch 比传多个 setter 稳定）；useContext：跨层级共享「低频变化」的全局数据（主题、locale、登录态），但 context 变化会让所有消费组件重渲染，高频状态应拆 context / 配合状态库 / 用 useSyncExternalStore；useRef：保存不触发渲染的可变值（DOM 引用、定时器 ID、上一次的值、最新值），修改 .ref.current 不会重渲染。 forwardRef + useImperativeHandle 用于父组件调用子组件暴露的方法（Vue 里对应 defineExpose）。"},{"id":156,"num":"Q156","tag":"必考","title":"React 18/19 并发特性有哪些？解决什么问题？","answers":["startTransition / useTransition：把更新标记为「非紧急」（如输入时过滤大列表），React 可中断它去优先响应输入，isPending 可显示 loading；解决「输入卡顿」与「渲染阻塞交互」。","useDeferredValue：延迟某个值的更新（类似防抖但由 React 调度，可中断、不丢中间态），适合搜索结果列表。","Suspense：让组件在「等待数据/代码」时声明式展示 fallback，配合 lazy 做代码分割、配合支持 Suspense 的数据源做流式渲染。","React 19 新增：Actions（useActionState / useOptimistic / form action，处理表单提交与乐观更新、自动处理 pending 与错误）、use()（可在渲染中读取 Promise 或 Context，甚至可在条件里调用）、ref 作为 prop（不再需要 forwardRef）、服务端组件 RSC 与 Server Actions、改进的水合错误与资源预加载 API。","核心心智：并发不是「并行计算」，而是「可中断、可丢弃、可重来、带优先级的渲染」，让高优先级交互不被低优先级渲染卡住。"],"bullets":[],"code":[],"note":"","text":"React 18/19 并发特性有哪些？解决什么问题？ startTransition / useTransition：把更新标记为「非紧急」（如输入时过滤大列表），React 可中断它去优先响应输入，isPending 可显示 loading；解决「输入卡顿」与「渲染阻塞交互」。 useDeferredValue：延迟某个值的更新（类似防抖但由 React 调度，可中断、不丢中间态），适合搜索结果列表。 Suspense：让组件在「等待数据/代码」时声明式展示 fallback，配合 lazy 做代码分割、配合支持 Suspense 的数据源做流式渲染。 React 19 新增：Actions（useActionState / useOptimistic / form action，处理表单提交与乐观更新、自动处理 pending 与错误）、use()（可在渲染中读取 Promise 或 Context，甚至可在条件里调用）、ref 作为 prop（不再需要 forwardRef）、服务端组件 RSC 与 Server Actions、改进的水合错误与资源预加载 API。 核心心智：并发不是「并行计算」，而是「可中断、可丢弃、可重来、带优先级的渲染」，让高优先级交互不被低优先级渲染卡住。"},{"id":157,"num":"Q157","tag":"原理","title":"React 合成事件（SyntheticEvent）机制？与原生事件区别？","answers":["React 把事件委托到根节点（React 17 起是 root container，16 及之前是 document），用统一插件系统把原生事件包装成 SyntheticEvent，抹平浏览器差异，并按组件树模拟捕获/冒泡。","区别：① 命名用小驼峰 onClick；② 传函数而非字符串；③ 阻止默认行为用 preventDefault（不能 return false）；④ SyntheticEvent 是池化对象（React 16 及之前事件回调后会被复用，异步读取需 e.persist()，React 17 已移除事件池）；⑤ 执行时机与原生事件顺序不同（React 17 后更贴近原生）；⑥ 想阻止原生监听器要用 e.nativeEvent.stopImmediatePropagation()。"],"bullets":[],"code":[],"note":"追问：为什么事件委托到 root 而不是 document？避免多版本 React 共存、嵌套独立应用时事件串扰，也让事件与所属 root 对应，利于 Suspense / 微前端。","text":"React 合成事件（SyntheticEvent）机制？与原生事件区别？ React 把事件委托到根节点（React 17 起是 root container，16 及之前是 document），用统一插件系统把原生事件包装成 SyntheticEvent，抹平浏览器差异，并按组件树模拟捕获/冒泡。 区别：① 命名用小驼峰 onClick；② 传函数而非字符串；③ 阻止默认行为用 preventDefault（不能 return false）；④ SyntheticEvent 是池化对象（React 16 及之前事件回调后会被复用，异步读取需 e.persist()，React 17 已移除事件池）；⑤ 执行时机与原生事件顺序不同（React 17 后更贴近原生）；⑥ 想阻止原生监听器要用 e.nativeEvent.stopImmediatePropagation()。 追问：为什么事件委托到 root 而不是 document？避免多版本 React 共存、嵌套独立应用时事件串扰，也让事件与所属 root 对应，利于 Suspense / 微前端。"},{"id":158,"num":"Q158","tag":"对比","title":"受控组件与非受控组件？","answers":["受控组件：表单值由 React state 驱动（value + onChange），单一数据源、便于即时校验、联动、提交前处理、动态设值；但每次输入都触发重渲染，大表单有性能成本。","非受控组件：值由 DOM 自己维护，通过 ref / defaultValue 读取，代码少、性能好、便于集成第三方 DOM 库；但难以实时校验与联动。","实践：绝大多数场景用受控；文件上传 <input type=file> 只能非受控；超大表单可用非受控 + FormData，或用 react-hook-form（基于非受控 + 订阅，减少重渲染）。"],"bullets":[],"code":[],"note":"","text":"受控组件与非受控组件？ 受控组件：表单值由 React state 驱动（value + onChange），单一数据源、便于即时校验、联动、提交前处理、动态设值；但每次输入都触发重渲染，大表单有性能成本。 非受控组件：值由 DOM 自己维护，通过 ref / defaultValue 读取，代码少、性能好、便于集成第三方 DOM 库；但难以实时校验与联动。 实践：绝大多数场景用受控；文件上传 <input type=file> 只能非受控；超大表单可用非受控 + FormData，或用 react-hook-form（基于非受控 + 订阅，减少重渲染）。"},{"id":159,"num":"Q159","tag":"原理","title":"React 的 diff 算法与 key？","answers":["React 采用三大启发式策略把 O(n³) 降到近似 O(n)：① 只做同层比较，跨层移动直接删除旧子树并重建；② 不同类型元素生成不同树，直接替换；③ 用 key 标识同层子节点的稳定性。","单节点 diff：key 与 type 都相同则复用 Fiber 并更新属性；key 相同 type 不同则删除重建；key 不同直接视为不同节点。","数组 diff：React 会把老节点按 key 存 Map（或按顺序线性比对），遍历新数组，用 lastPlacedIndex 判断是否需要移动——只往后移动、不往前搬（这也是「把最后一项移到最前面性能差」的原因）。","key 必须是稳定、唯一、在兄弟节点间不重复的值；用 index 作 key 在列表头插入/排序时会导致状态错位与不必要的重建。"],"bullets":[],"code":[],"note":"","text":"React 的 diff 算法与 key？ React 采用三大启发式策略把 O(n³) 降到近似 O(n)：① 只做同层比较，跨层移动直接删除旧子树并重建；② 不同类型元素生成不同树，直接替换；③ 用 key 标识同层子节点的稳定性。 单节点 diff：key 与 type 都相同则复用 Fiber 并更新属性；key 相同 type 不同则删除重建；key 不同直接视为不同节点。 数组 diff：React 会把老节点按 key 存 Map（或按顺序线性比对），遍历新数组，用 lastPlacedIndex 判断是否需要移动——只往后移动、不往前搬（这也是「把最后一项移到最前面性能差」的原因）。 key 必须是稳定、唯一、在兄弟节点间不重复的值；用 index 作 key 在列表头插入/排序时会导致状态错位与不必要的重建。"},{"id":160,"num":"Q160","tag":"原理","title":"虚拟 DOM 一定比直接操作 DOM 快吗？","answers":["不一定。虚拟 DOM 的价值不是「绝对更快」，而是「提供一个可声明、可批处理、可跨平台、可自动做最小更新的抽象层」，让开发者不必手动管理 DOM；在复杂频繁更新的场景，diff + 批量提交通常优于手写全量重排；但单次精确 DOM 操作（如只改一个文本节点）原生更快。","现代框架的差异化在于「更新粒度」：React 每次状态变更从组件根重新 render 再 diff；Vue 通过响应式依赖收集能精确知道哪个组件需要更新（组件级细粒度），Vue3 进一步用 PatchFlag 做到节点内动态属性级；Svelte / Solid 走编译期无虚拟 DOM 路线，直接生成精确更新代码。","加分：能讲出「虚拟 DOM 的开销 = 创建 VNode + diff + patch」，以及为什么 React 需要 memo 而 Vue 常常不需要。"],"bullets":[],"code":[],"note":"","text":"虚拟 DOM 一定比直接操作 DOM 快吗？ 不一定。虚拟 DOM 的价值不是「绝对更快」，而是「提供一个可声明、可批处理、可跨平台、可自动做最小更新的抽象层」，让开发者不必手动管理 DOM；在复杂频繁更新的场景，diff + 批量提交通常优于手写全量重排；但单次精确 DOM 操作（如只改一个文本节点）原生更快。 现代框架的差异化在于「更新粒度」：React 每次状态变更从组件根重新 render 再 diff；Vue 通过响应式依赖收集能精确知道哪个组件需要更新（组件级细粒度），Vue3 进一步用 PatchFlag 做到节点内动态属性级；Svelte / Solid 走编译期无虚拟 DOM 路线，直接生成精确更新代码。 加分：能讲出「虚拟 DOM 的开销 = 创建 VNode + diff + patch」，以及为什么 React 需要 memo 而 Vue 常常不需要。"},{"id":161,"num":"Q161","tag":"场景","title":"useState 的实现原理？为什么函数组件能保存状态？","answers":["状态并不存在函数里，而是挂在 FiberNode.memoizedState 的 Hook 链表上；组件函数每次渲染只是重新执行，useState 读取当前 Hook 节点的值并返回 [state, dispatch]；dispatch 把更新对象（update）加入该 Hook 的 queue，并调度一次重新渲染，下次渲染时 reducer 依次计算 queue 得到新 state。","因为链表按调用顺序对应，所以 Hook 必须稳定顺序调用；多个 useState 就是多个链表节点。手写极简 useState / useEffect 见第 7 天。"],"bullets":[],"code":[],"note":"","text":"useState 的实现原理？为什么函数组件能保存状态？ 状态并不存在函数里，而是挂在 FiberNode.memoizedState 的 Hook 链表上；组件函数每次渲染只是重新执行，useState 读取当前 Hook 节点的值并返回 [state, dispatch]；dispatch 把更新对象（update）加入该 Hook 的 queue，并调度一次重新渲染，下次渲染时 reducer 依次计算 queue 得到新 state。 因为链表按调用顺序对应，所以 Hook 必须稳定顺序调用；多个 useState 就是多个链表节点。手写极简 useState / useEffect 见第 7 天。"},{"id":162,"num":"Q162","tag":"场景","title":"React 性能优化清单？","answers":["① 先测量：React DevTools Profiler / Lighthouse 定位真正慢的组件与 commit 耗时；② 减少不必要的重渲染：React.memo + 稳定 props（useCallback/useMemo）、状态下沉、组件拆分、把大 Context 拆小或用 useSyncExternalStore；③ 列表用稳定 key、大数据用虚拟滚动（react-window / react-virtual）；④ 代码分割 React.lazy + Suspense / 路由级懒加载；⑤ 昂贵计算 useMemo、长任务用 useTransition / useDeferredValue 让位给交互；⑥ 避免在 render 里创建新对象/函数直接传给 memo 子组件；⑦ 图片懒加载与尺寸占位（减少 CLS）；⑧ 用生产构建（dev 模式慢数倍）。","加分：能说出「优化前先确认是 CPU 密集还是渲染量过大」——前者拆任务/Worker，后者减少渲染节点数。"],"bullets":[],"code":[],"note":"","text":"React 性能优化清单？ ① 先测量：React DevTools Profiler / Lighthouse 定位真正慢的组件与 commit 耗时；② 减少不必要的重渲染：React.memo + 稳定 props（useCallback/useMemo）、状态下沉、组件拆分、把大 Context 拆小或用 useSyncExternalStore；③ 列表用稳定 key、大数据用虚拟滚动（react-window / react-virtual）；④ 代码分割 React.lazy + Suspense / 路由级懒加载；⑤ 昂贵计算 useMemo、长任务用 useTransition / useDeferredValue 让位给交互；⑥ 避免在 render 里创建新对象/函数直接传给 memo 子组件；⑦ 图片懒加载与尺寸占位（减少 CLS）；⑧ 用生产构建（dev 模式慢数倍）。 加分：能说出「优化前先确认是 CPU 密集还是渲染量过大」——前者拆任务/Worker，后者减少渲染节点数。"}]},{"id":"day5-s3","day":5,"title":"5.3 框架对比、状态管理与渲染模式","note":"","questions":[{"id":163,"num":"Q163","tag":"高频","title":"Vue 与 React 的本质区别？","answers":["更新粒度：Vue 基于响应式依赖收集，数据变化时精确知道哪些组件/节点要更新，默认「细粒度」；React 基于不可变数据与自顶向下重新渲染，靠 diff 与 memo 控制范围，默认「粗粒度但可预测」。","模板 vs JSX：Vue 用模板（编译期可做静态分析、PatchFlag、静态提升，优化空间大、上手容易）；React 用 JSX（JS 全表达能力、灵活，但编译期优化信息少）。","心智模型：Vue 可变数据 + 自动追踪（写起来像改对象）；React 不可变 + 显式 setState / 函数式更新（更容易推理与时间旅行调试）。","API 演进：Vue Options API → Composition API；React class → Hooks → 并发 / RSC。生态：Vue 官方全家桶统一（Router/Pinia），React 社区方案百花齐放（Router/Redux/TanStack Query/Next.js）。","结论：没有优劣，选型看团队、生态、SSR 需求与人员熟悉度；面试切忌「踩一捧一」，讲设计取舍更容易拿高分。"],"bullets":[],"code":[],"note":"","text":"Vue 与 React 的本质区别？ 更新粒度：Vue 基于响应式依赖收集，数据变化时精确知道哪些组件/节点要更新，默认「细粒度」；React 基于不可变数据与自顶向下重新渲染，靠 diff 与 memo 控制范围，默认「粗粒度但可预测」。 模板 vs JSX：Vue 用模板（编译期可做静态分析、PatchFlag、静态提升，优化空间大、上手容易）；React 用 JSX（JS 全表达能力、灵活，但编译期优化信息少）。 心智模型：Vue 可变数据 + 自动追踪（写起来像改对象）；React 不可变 + 显式 setState / 函数式更新（更容易推理与时间旅行调试）。 API 演进：Vue Options API → Composition API；React class → Hooks → 并发 / RSC。生态：Vue 官方全家桶统一（Router/Pinia），React 社区方案百花齐放（Router/Redux/TanStack Query/Next.js）。 结论：没有优劣，选型看团队、生态、SSR 需求与人员熟悉度；面试切忌「踩一捧一」，讲设计取舍更容易拿高分。"},{"id":164,"num":"Q164","tag":"对比","title":"CSR、SSR、SSG、ISR、RSC 分别是什么？","answers":["CSR（客户端渲染）：首屏 HTML 空壳，JS 下载执行后才渲染，首屏慢、SEO 差，但前后端分离、交互切换快、服务器压力小。","SSR（服务端渲染）：每次请求在服务端生成完整 HTML，首屏快、SEO 好，但服务器有渲染压力、TTFB 变长、需要 hydration（水合）且存在双端代码约束（window/document 不可用）。","SSG（静态站点生成）：构建时预生成 HTML，可直接 CDN 托管，性能与 SEO 最佳，适合内容型站点（文档、博客、官网），缺点是数据更新要重新构建。","ISR（增量静态再生）：SSG + 按时间间隔/按需重新生成指定页面，兼顾静态性能与数据新鲜度（Next.js）。","RSC（React Server Components）：组件分服务端/客户端两类，服务端组件只在服务端执行、不进入 JS bundle、可直接访问数据库，输出一种可流式传输的中间表示；客户端组件带 'use client' 标记负责交互。收益是包体积更小、数据获取更近、减少客户端瀑布请求；代价是心智模型与边界约束复杂。","加分：hydration 的坑——服务端与客户端渲染结果不一致会报错/重渲染，避免在渲染中读 Date.now()/Math.random()/window；流式 SSR + 选择性水合可改善 TTI。"],"bullets":[],"code":[],"note":"","text":"CSR、SSR、SSG、ISR、RSC 分别是什么？ CSR（客户端渲染）：首屏 HTML 空壳，JS 下载执行后才渲染，首屏慢、SEO 差，但前后端分离、交互切换快、服务器压力小。 SSR（服务端渲染）：每次请求在服务端生成完整 HTML，首屏快、SEO 好，但服务器有渲染压力、TTFB 变长、需要 hydration（水合）且存在双端代码约束（window/document 不可用）。 SSG（静态站点生成）：构建时预生成 HTML，可直接 CDN 托管，性能与 SEO 最佳，适合内容型站点（文档、博客、官网），缺点是数据更新要重新构建。 ISR（增量静态再生）：SSG + 按时间间隔/按需重新生成指定页面，兼顾静态性能与数据新鲜度（Next.js）。 RSC（React Server Components）：组件分服务端/客户端两类，服务端组件只在服务端执行、不进入 JS bundle、可直接访问数据库，输出一种可流式传输的中间表示；客户端组件带 'use client' 标记负责交互。收益是包体积更小、数据获取更近、减少客户端瀑布请求；代价是心智模型与边界约束复杂。 加分：hydration 的坑——服务端与客户端渲染结果不一致会报错/重渲染，避免在渲染中读 Date.now()/Math.random()/window；流式 SSR + 选择性水合可改善 TTI。"},{"id":165,"num":"Q165","tag":"对比","title":"Redux、Zustand、MobX、Context 的选型？","answers":["Redux（含 Redux Toolkit）：单一 store、不可变状态、action → reducer 纯函数、可预测、devtools 时间旅行、中间件生态成熟；样板代码多（RTK 已大幅简化），适合大型团队协作与复杂状态流转。","Zustand：轻量 hooks API、基于 useSyncExternalStore 的外部 store、无 Provider、支持选择器粒度订阅与中间件，样板极少，中小型项目首选。","MobX：响应式/可变状态、自动追踪依赖，写法最简洁，但「魔法」较多、调试与可预测性弱于 Redux。","Context：适合低频全局配置（主题、locale、用户信息），不适合高频更新的业务状态（所有消费者重渲染 + 无细粒度订阅）。","加分：把「服务端状态」与「客户端状态」分开——接口数据优先用 TanStack Query / SWR（缓存、失效、重试、竞态、分页），别把接口响应一股脑塞进 Redux，这是现代 React 状态管理最重要的实践变化。"],"bullets":[],"code":[],"note":"","text":"Redux、Zustand、MobX、Context 的选型？ Redux（含 Redux Toolkit）：单一 store、不可变状态、action → reducer 纯函数、可预测、devtools 时间旅行、中间件生态成熟；样板代码多（RTK 已大幅简化），适合大型团队协作与复杂状态流转。 Zustand：轻量 hooks API、基于 useSyncExternalStore 的外部 store、无 Provider、支持选择器粒度订阅与中间件，样板极少，中小型项目首选。 MobX：响应式/可变状态、自动追踪依赖，写法最简洁，但「魔法」较多、调试与可预测性弱于 Redux。 Context：适合低频全局配置（主题、locale、用户信息），不适合高频更新的业务状态（所有消费者重渲染 + 无细粒度订阅）。 加分：把「服务端状态」与「客户端状态」分开——接口数据优先用 TanStack Query / SWR（缓存、失效、重试、竞态、分页），别把接口响应一股脑塞进 Redux，这是现代 React 状态管理最重要的实践变化。"},{"id":166,"num":"Q166","tag":"概念","title":"微前端解决了什么问题？常见方案与隔离手段？","answers":["解决：巨石应用拆分为多个可独立开发、独立构建、独立部署、技术栈可异构的子应用，实现团队自治与渐进式重构；同时带来运行时集成复杂度。","方案：iframe（隔离最彻底但体验差、通信与路由困难）、single-spa（路由调度层）、qiankun（基于 single-spa + import-html-entry，提供 JS 沙箱与样式隔离）、Module Federation（Webpack 5 / Vite 插件，构建期共享模块，运行时动态加载 remote）、Web Components / 无界（iframe + Shadow DOM 改良）。","隔离：JS 沙箱（Proxy 快照沙箱 / with + 代理 window，防止全局污染）、样式隔离（Shadow DOM 最彻底但弹窗穿透等有坑 / scoped CSS 前缀 / 动态样式表卸载）、路由与状态（主应用统一路由分发、应用间用自定义事件或全局 store 通信）、公共依赖（externals / shared 避免重复打包 React）。","风险：版本冲突、重复依赖体积、样式污染、子应用生命周期管理、监控与错误归因复杂、SEO 与首屏耗时。"],"bullets":[],"code":[],"note":"","text":"微前端解决了什么问题？常见方案与隔离手段？ 解决：巨石应用拆分为多个可独立开发、独立构建、独立部署、技术栈可异构的子应用，实现团队自治与渐进式重构；同时带来运行时集成复杂度。 方案：iframe（隔离最彻底但体验差、通信与路由困难）、single-spa（路由调度层）、qiankun（基于 single-spa + import-html-entry，提供 JS 沙箱与样式隔离）、Module Federation（Webpack 5 / Vite 插件，构建期共享模块，运行时动态加载 remote）、Web Components / 无界（iframe + Shadow DOM 改良）。 隔离：JS 沙箱（Proxy 快照沙箱 / with + 代理 window，防止全局污染）、样式隔离（Shadow DOM 最彻底但弹窗穿透等有坑 / scoped CSS 前缀 / 动态样式表卸载）、路由与状态（主应用统一路由分发、应用间用自定义事件或全局 store 通信）、公共依赖（externals / shared 避免重复打包 React）。 风险：版本冲突、重复依赖体积、样式污染、子应用生命周期管理、监控与错误归因复杂、SEO 与首屏耗时。"},{"id":167,"num":"Q167","tag":"场景","title":"Next.js / Nuxt 的核心能力？","answers":["Next.js：文件系统路由（App Router / Pages Router）、SSR/SSG/ISR/RSC、API Routes / Route Handlers、Server Actions、图片优化 next/image、字体优化、代码分割、middleware、增量水合与流式渲染。","Nuxt（Vue）：约定式目录、SSR/SSG/混合渲染、Nitro 服务端引擎（可部署到 Serverless/Edge）、auto-imports、useFetch/useAsyncData 处理 SSR 数据双端一致、模块生态与 layers。","共同价值：把渲染模式、路由、数据获取、构建部署这些「框架之上的框架」问题标准化，降低全栈门槛。"],"bullets":[],"code":[],"note":"","text":"Next.js / Nuxt 的核心能力？ Next.js：文件系统路由（App Router / Pages Router）、SSR/SSG/ISR/RSC、API Routes / Route Handlers、Server Actions、图片优化 next/image、字体优化、代码分割、middleware、增量水合与流式渲染。 Nuxt（Vue）：约定式目录、SSR/SSG/混合渲染、Nitro 服务端引擎（可部署到 Serverless/Edge）、auto-imports、useFetch/useAsyncData 处理 SSR 数据双端一致、模块生态与 layers。 共同价值：把渲染模式、路由、数据获取、构建部署这些「框架之上的框架」问题标准化，降低全栈门槛。"},{"id":168,"num":"Q168","tag":"场景","title":"项目里遇到过最难的框架问题是什么？（开放题答题模板）","answers":["答题结构：背景（什么场景、量级）→ 现象与量化指标（卡顿 X ms / 内存 X MB / LCP X s）→ 定位过程（用什么工具、排除了什么）→ 根因 → 方案（含取舍与备选方案）→ 结果与验证数据 → 沉淀（规范/工具/复盘）。","可用素材：长列表虚拟滚动、大表单受控重渲染、useEffect 竞态、key 用 index 导致表单错位、Context 过大导致全树重渲染、Pinia/Vuex 状态设计不合理、路由懒加载与预加载策略、SSR 水合不一致、打包体积过大（分析工具 + 分包 + 按需引入）。"],"bullets":[],"code":[],"note":"面试官真正想听的是「你怎么发现问题、怎么验证有效」，一定要带上具体数字与工具名，不要只说「我做了性能优化」。","text":"项目里遇到过最难的框架问题是什么？（开放题答题模板） 答题结构：背景（什么场景、量级）→ 现象与量化指标（卡顿 X ms / 内存 X MB / LCP X s）→ 定位过程（用什么工具、排除了什么）→ 根因 → 方案（含取舍与备选方案）→ 结果与验证数据 → 沉淀（规范/工具/复盘）。 可用素材：长列表虚拟滚动、大表单受控重渲染、useEffect 竞态、key 用 index 导致表单错位、Context 过大导致全树重渲染、Pinia/Vuex 状态设计不合理、路由懒加载与预加载策略、SSR 水合不一致、打包体积过大（分析工具 + 分包 + 按需引入）。 面试官真正想听的是「你怎么发现问题、怎么验证有效」，一定要带上具体数字与工具名，不要只说「我做了性能优化」。"}]}]},{"id":"day6","day":6,"title":"第 6 天｜工程化、TypeScript 与性能优化","short":"工程化、TypeScript 与性能优化","note":"目标：2026 年工程化已经从「加分项」变成「必考项」。答题从「会配置」升级到「会决策」：为什么选它、代价是什么、怎么量化效果。今天也补上 TypeScript 与 Node/Git 的常考八股。","sections":[{"id":"day6-s1","day":6,"title":"6.1 构建工具：Webpack 与 Vite","note":"","questions":[{"id":169,"num":"Q169","tag":"必考","title":"Webpack 的构建流程？Loader 与 Plugin 的区别？","answers":["流程：① 读取配置与 CLI 参数合并；② 从 entry 出发创建 Compiler，调用 run → compile，创建 Compilation；③ 用 resolver 解析模块路径，递归构建依赖图；④ 对匹配的文件调用对应 Loader 链（从右到左、从下到上）把非 JS 资源转成 JS 模块；⑤ 生成 AST 分析依赖与导出，包装成模块函数；⑥ 按 chunk 分组、生成 runtime 与 manifest；⑦ 输出 assets 到 output.path（emitAssets），全程通过 Tapable 的钩子广播生命周期事件。","Loader 是「文件转换器」：输入源码字符串、输出处理后的 JS 字符串（或 sourcemap），运行在模块加载阶段，专注单文件转换（babel-loader、css-loader、ts-loader、file-loader、vue-loader）。可链式、可同步/异步、可通过 pitch 阶段提前返回。","Plugin 是「构建生命周期扩展器」：通过 compiler.hooks.xxx.tap / tapAsync 接入任意钩子，能访问整个编译过程与资源，做打包优化、资源生成、环境变量注入、HTML 生成（HtmlWebpackPlugin）、清理（旧版 CleanPlugin）、分析（BundleAnalyzer）等。Plugin 能力覆盖 Loader，但 Loader 更专一。","加分：Loader 本质是函数（this 上有 context、可 emitFile），Plugin 是带 apply(compiler) 方法的类；Tapable 提供 SyncHook / AsyncSeriesHook 等钩子类型。"],"bullets":[],"code":[],"note":"","text":"Webpack 的构建流程？Loader 与 Plugin 的区别？ 流程：① 读取配置与 CLI 参数合并；② 从 entry 出发创建 Compiler，调用 run → compile，创建 Compilation；③ 用 resolver 解析模块路径，递归构建依赖图；④ 对匹配的文件调用对应 Loader 链（从右到左、从下到上）把非 JS 资源转成 JS 模块；⑤ 生成 AST 分析依赖与导出，包装成模块函数；⑥ 按 chunk 分组、生成 runtime 与 manifest；⑦ 输出 assets 到 output.path（emitAssets），全程通过 Tapable 的钩子广播生命周期事件。 Loader 是「文件转换器」：输入源码字符串、输出处理后的 JS 字符串（或 sourcemap），运行在模块加载阶段，专注单文件转换（babel-loader、css-loader、ts-loader、file-loader、vue-loader）。可链式、可同步/异步、可通过 pitch 阶段提前返回。 Plugin 是「构建生命周期扩展器」：通过 compiler.hooks.xxx.tap / tapAsync 接入任意钩子，能访问整个编译过程与资源，做打包优化、资源生成、环境变量注入、HTML 生成（HtmlWebpackPlugin）、清理（旧版 CleanPlugin）、分析（BundleAnalyzer）等。Plugin 能力覆盖 Loader，但 Loader 更专一。 加分：Loader 本质是函数（this 上有 context、可 emitFile），Plugin 是带 apply(compiler) 方法的类；Tapable 提供 SyncHook / AsyncSeriesHook 等钩子类型。"},{"id":170,"num":"Q170","tag":"高频","title":"Webpack 的优化手段有哪些？","answers":["构建速度：① 持久化缓存 cache: { type: 'filesystem' }（Webpack 5）；② babel-loader / ts-loader 开启缓存与 include/exclude 精确范围；③ 用 esbuild / swc 替代 Babel 做转译；④ thread-loader / parallel-webpack 并行（进程开销需权衡）；⑤ 缩小 resolve.modules / extensions / alias；⑥ module.noParse 跳过已打包的大库；⑦ externals 排除 CDN 引入的依赖；⑧ DllPlugin（旧方案，Webpack 5 已被持久缓存替代）；⑨ 升级到 Rspack / Vite / Turbopack。","产物体积：① Tree Shaking（ESM + production + sideEffects）；② splitChunks 拆 vendor / 公共模块 / 运行时；③ 动态 import() 路由级懒加载；④ 压缩 TerserPlugin / CssMinimizerPlugin、gzip/brotli 预压缩；⑤ 图片压缩与 WebP/AVIF、内联小图；⑥ Moment.js 等大库按需引入（babel-plugin-import、dayjs 替换）；⑦ browserslist 精准目标减少 polyfill。","运行性能：contenthash 长缓存、runtimeChunk 单独抽离避免 hash 连锁失效、prefetch/preload 提示、module federation 共享依赖。"],"bullets":[],"code":[],"note":"","text":"Webpack 的优化手段有哪些？ 构建速度：① 持久化缓存 cache: { type: 'filesystem' }（Webpack 5）；② babel-loader / ts-loader 开启缓存与 include/exclude 精确范围；③ 用 esbuild / swc 替代 Babel 做转译；④ thread-loader / parallel-webpack 并行（进程开销需权衡）；⑤ 缩小 resolve.modules / extensions / alias；⑥ module.noParse 跳过已打包的大库；⑦ externals 排除 CDN 引入的依赖；⑧ DllPlugin（旧方案，Webpack 5 已被持久缓存替代）；⑨ 升级到 Rspack / Vite / Turbopack。 产物体积：① Tree Shaking（ESM + production + sideEffects）；② splitChunks 拆 vendor / 公共模块 / 运行时；③ 动态 import() 路由级懒加载；④ 压缩 TerserPlugin / CssMinimizerPlugin、gzip/brotli 预压缩；⑤ 图片压缩与 WebP/AVIF、内联小图；⑥ Moment.js 等大库按需引入（babel-plugin-import、dayjs 替换）；⑦ browserslist 精准目标减少 polyfill。 运行性能：contenthash 长缓存、runtimeChunk 单独抽离避免 hash 连锁失效、prefetch/preload 提示、module federation 共享依赖。"},{"id":171,"num":"Q171","tag":"原理","title":"Webpack HMR（热更新）原理？","answers":["① 开发服务器启动，向浏览器注入 HMR runtime 客户端，与 dev-server 建立 WebSocket 长连接；② 文件变更触发重新编译，Webpack 生成「本次变更的模块清单 + 新模块代码（hot-update.json / hot-update.js）」并计算新的 hash；③ 服务端通过 WebSocket 推送 hash 与更新清单；④ 客户端 runtime 用 JSONP/动态 script 拉取增量 chunk；⑤ 调用 module.hot.accept 注册的回调，替换旧模块并重新执行受影响模块，若没有 accept 处理函数则冒泡到上层直到刷新整页。","对比 Vite 的 HMR：Vite 基于原生 ESM，直接让浏览器重新请求变更模块（带时间戳失效缓存），精度到模块级、无需重新打包整个 bundle，因此项目越大差距越明显。"],"bullets":[],"code":[],"note":"","text":"Webpack HMR（热更新）原理？ ① 开发服务器启动，向浏览器注入 HMR runtime 客户端，与 dev-server 建立 WebSocket 长连接；② 文件变更触发重新编译，Webpack 生成「本次变更的模块清单 + 新模块代码（hot-update.json / hot-update.js）」并计算新的 hash；③ 服务端通过 WebSocket 推送 hash 与更新清单；④ 客户端 runtime 用 JSONP/动态 script 拉取增量 chunk；⑤ 调用 module.hot.accept 注册的回调，替换旧模块并重新执行受影响模块，若没有 accept 处理函数则冒泡到上层直到刷新整页。 对比 Vite 的 HMR：Vite 基于原生 ESM，直接让浏览器重新请求变更模块（带时间戳失效缓存），精度到模块级、无需重新打包整个 bundle，因此项目越大差距越明显。"},{"id":172,"num":"Q172","tag":"必考","title":"Vite 为什么快？依赖预构建做了什么？","answers":["开发期快的原因：① 浏览器原生支持 ESM，Vite 只做「按需编译 + 单文件转换」，不做整包 bundle，冷启动时只处理入口与首屏需要的模块；② 依赖预构建：用 esbuild（Go 编写、并行、比 JS 工具快 10~100 倍）把 node_modules 里的第三方依赖提前转成 ESM 并合并成少数几个文件，解决两个问题——CommonJS/UMD 转 ESM、把 lodash 这类「一个包几百个模块」合并成单文件减少请求瀑布；③ 预构建结果缓存在 node_modules/.vite，依赖不变时秒启；④ HMR 基于 ESM 边界，只失效变更模块；⑤ 按需编译，源码用原生 ESM 交给浏览器，只在请求时做 TS/JSX/Vue SFC 转换。","生产构建仍用 Rollup（打包、Tree Shaking、代码分割、静态资源处理更成熟），因为原生 ESM 在生产环境会有大量请求、无法做细粒度优化；Vite 通过 build.rollupOptions 暴露配置。","局限：首屏大量模块请求时的「请求瀑布」、SSR/库模式配置更复杂、部分 CommonJS 生态兼容问题、老浏览器需 legacy 插件。"],"bullets":[],"code":[],"note":"","text":"Vite 为什么快？依赖预构建做了什么？ 开发期快的原因：① 浏览器原生支持 ESM，Vite 只做「按需编译 + 单文件转换」，不做整包 bundle，冷启动时只处理入口与首屏需要的模块；② 依赖预构建：用 esbuild（Go 编写、并行、比 JS 工具快 10~100 倍）把 node_modules 里的第三方依赖提前转成 ESM 并合并成少数几个文件，解决两个问题——CommonJS/UMD 转 ESM、把 lodash 这类「一个包几百个模块」合并成单文件减少请求瀑布；③ 预构建结果缓存在 node_modules/.vite，依赖不变时秒启；④ HMR 基于 ESM 边界，只失效变更模块；⑤ 按需编译，源码用原生 ESM 交给浏览器，只在请求时做 TS/JSX/Vue SFC 转换。 生产构建仍用 Rollup（打包、Tree Shaking、代码分割、静态资源处理更成熟），因为原生 ESM 在生产环境会有大量请求、无法做细粒度优化；Vite 通过 build.rollupOptions 暴露配置。 局限：首屏大量模块请求时的「请求瀑布」、SSR/库模式配置更复杂、部分 CommonJS 生态兼容问题、老浏览器需 legacy 插件。"},{"id":173,"num":"Q173","tag":"对比","title":"Vite 与 Webpack 怎么选？","answers":["Webpack：生态最全、loader/plugin 海量、对复杂场景（微前端 Module Federation、非标准资源、老项目、精细 chunk 控制）支持成熟； but 冷启动与 HMR 随项目增大线性变慢。","Vite：开发体验（冷启动、HMR）碾压，配置简洁，适合现代浏览器、Vue/React 新项目、SSR/库模式也基本够用；生产用 Rollup，超大型项目的构建产物优化能力略弱于 Webpack 的可控度。","决策口径：新项目默认 Vite；已有巨型 Webpack 项目迁移要评估插件替代成本，可先上 Rspack / esbuild-loader 渐进提速；需要 Module Federation 或极其定制化的构建流程时 Webpack 更稳。"],"bullets":[],"code":[],"note":"加分：能说出 esbuild（Go，快但不支持 AST 级插件/产物体量大）、SWC（Rust，转译 + 压缩，可替代 Babel）、Rspack（Rust，兼容 Webpack 生态）、Turbopack（Next.js，Rust 增量）的定位差异。","text":"Vite 与 Webpack 怎么选？ Webpack：生态最全、loader/plugin 海量、对复杂场景（微前端 Module Federation、非标准资源、老项目、精细 chunk 控制）支持成熟； but 冷启动与 HMR 随项目增大线性变慢。 Vite：开发体验（冷启动、HMR）碾压，配置简洁，适合现代浏览器、Vue/React 新项目、SSR/库模式也基本够用；生产用 Rollup，超大型项目的构建产物优化能力略弱于 Webpack 的可控度。 决策口径：新项目默认 Vite；已有巨型 Webpack 项目迁移要评估插件替代成本，可先上 Rspack / esbuild-loader 渐进提速；需要 Module Federation 或极其定制化的构建流程时 Webpack 更稳。 加分：能说出 esbuild（Go，快但不支持 AST 级插件/产物体量大）、SWC（Rust，转译 + 压缩，可替代 Babel）、Rspack（Rust，兼容 Webpack 生态）、Turbopack（Next.js，Rust 增量）的定位差异。"},{"id":174,"num":"Q174","tag":"原理","title":"Babel 的工作流程？polyfill 怎么打？","answers":["三阶段：解析 Parse（@babel/parser 生成 AST）→ 转换 Transform（@babel/traverse 遍历 AST，插件对节点增删改）→ 生成 Generate（@babel/generator 输出代码 + sourcemap）。","@babel/preset-env 根据 browserslist / targets 决定要转哪些语法；语法转换（箭头函数、解构）靠 transform 插件，新增 API（Promise、Array.includes、Object.fromEntries）需要 polyfill。","polyfill 方案：① @babel/polyfill（已废弃，全局污染）；② useBuiltIns: 'usage' + core-js（按用到的 API 按需引入，仍污染全局但体积可控）；③ @babel/plugin-transform-runtime + @babel/runtime-corejs3（沙箱化、不污染全局，适合库开发）；④ 现代做法：不再为老浏览器打包大量 polyfill，用 differential serving（module/nomodule 双产物）或只按 targets 精准注入。","加分：构建工具链里 Babel 只负责「降级语法」，模块打包与 Tree Shaking 由 Webpack/Rollup 负责；TS 用 babel 的 @babel/preset-typescript 只做类型擦除、不做类型检查（检查交给 tsc --noEmit 或 fork-ts-checker）。"],"bullets":[],"code":[],"note":"","text":"Babel 的工作流程？polyfill 怎么打？ 三阶段：解析 Parse（@babel/parser 生成 AST）→ 转换 Transform（@babel/traverse 遍历 AST，插件对节点增删改）→ 生成 Generate（@babel/generator 输出代码 + sourcemap）。 @babel/preset-env 根据 browserslist / targets 决定要转哪些语法；语法转换（箭头函数、解构）靠 transform 插件，新增 API（Promise、Array.includes、Object.fromEntries）需要 polyfill。 polyfill 方案：① @babel/polyfill（已废弃，全局污染）；② useBuiltIns: 'usage' + core-js（按用到的 API 按需引入，仍污染全局但体积可控）；③ @babel/plugin-transform-runtime + @babel/runtime-corejs3（沙箱化、不污染全局，适合库开发）；④ 现代做法：不再为老浏览器打包大量 polyfill，用 differential serving（module/nomodule 双产物）或只按 targets 精准注入。 加分：构建工具链里 Babel 只负责「降级语法」，模块打包与 Tree Shaking 由 Webpack/Rollup 负责；TS 用 babel 的 @babel/preset-typescript 只做类型擦除、不做类型检查（检查交给 tsc --noEmit 或 fork-ts-checker）。"},{"id":175,"num":"Q175","tag":"概念","title":"contenthash、hash、chunkhash 的区别？为什么长缓存要用 contenthash？","answers":["hash 是整次编译的全局哈希，任一文件变化会让所有产物文件名都变，缓存全部失效；chunkhash 按 chunk 计算，某个入口变化只影响该 chunk（但 CSS 与 JS 同 chunk 时会互相牵连）；contenthash 按「文件内容」计算，内容不变文件名就不变，最精确。","配套做法：① 输出文件名带 [name].[contenthash:8].js；② runtimeChunk: 'single' 把模块清单单独抽出，避免 runtime 变化引起所有 chunk hash 变化；③ splitChunks 抽 vendor，业务代码改动不影响第三方依赖的长缓存；④ HTML 入口用 no-cache，静态资源用 max-age=31536000, immutable；⑤ 保证 moduleIds/chunkIds 稳定（Webpack 5 默认 deterministic）。"],"bullets":[],"code":[],"note":"","text":"contenthash、hash、chunkhash 的区别？为什么长缓存要用 contenthash？ hash 是整次编译的全局哈希，任一文件变化会让所有产物文件名都变，缓存全部失效；chunkhash 按 chunk 计算，某个入口变化只影响该 chunk（但 CSS 与 JS 同 chunk 时会互相牵连）；contenthash 按「文件内容」计算，内容不变文件名就不变，最精确。 配套做法：① 输出文件名带 [name].[contenthash:8].js；② runtimeChunk: 'single' 把模块清单单独抽出，避免 runtime 变化引起所有 chunk hash 变化；③ splitChunks 抽 vendor，业务代码改动不影响第三方依赖的长缓存；④ HTML 入口用 no-cache，静态资源用 max-age=31536000, immutable；⑤ 保证 moduleIds/chunkIds 稳定（Webpack 5 默认 deterministic）。"}]},{"id":"day6-s2","day":6,"title":"6.2 包管理、Monorepo 与工程规范","note":"","questions":[{"id":176,"num":"Q176","tag":"高频","title":"pnpm 为什么比 npm / yarn 快、省空间？","answers":["① 全局内容寻址存储（content-addressable store）：所有包只在本机存一份，项目里用硬链接指向 store，多个项目/多版本复用同一份文件，避免 npm 的重复拷贝；② 符号链接 + 严格 node_modules 结构：只有直接依赖出现在顶层 node_modules，间接依赖放在 .pnpm 里通过软链访问，天然防止「幽灵依赖」（phantom dependency，代码能引用到未声明的包）与「依赖分身」；③ 并行安装与更快的解析算法；④ 原生支持 workspace / Monorepo，filter 命令可按包执行脚本。","代价：符号链接对某些工具（老版本 Webpack、部分 Node 原生模块、Electron 打包）兼容性需验证，可用 node-linker=hoisted 降级回扁平结构。","对比：npm v3+ 扁平化（带来幽灵依赖与分身问题）、yarn v1 扁平 + yarn.lock、yarn Berry PnP（无 node_modules，用 .pnp.cjs 映射，最严格但兼容性挑战大）。"],"bullets":[],"code":[],"note":"","text":"pnpm 为什么比 npm / yarn 快、省空间？ ① 全局内容寻址存储（content-addressable store）：所有包只在本机存一份，项目里用硬链接指向 store，多个项目/多版本复用同一份文件，避免 npm 的重复拷贝；② 符号链接 + 严格 node_modules 结构：只有直接依赖出现在顶层 node_modules，间接依赖放在 .pnpm 里通过软链访问，天然防止「幽灵依赖」（phantom dependency，代码能引用到未声明的包）与「依赖分身」；③ 并行安装与更快的解析算法；④ 原生支持 workspace / Monorepo，filter 命令可按包执行脚本。 代价：符号链接对某些工具（老版本 Webpack、部分 Node 原生模块、Electron 打包）兼容性需验证，可用 node-linker=hoisted 降级回扁平结构。 对比：npm v3+ 扁平化（带来幽灵依赖与分身问题）、yarn v1 扁平 + yarn.lock、yarn Berry PnP（无 node_modules，用 .pnp.cjs 映射，最严格但兼容性挑战大）。"},{"id":177,"num":"Q177","tag":"概念","title":"Monorepo 的价值与常见工具？","answers":["价值：多个包/应用共用一个仓库与统一依赖版本、原子化提交与跨包改动、共享配置与组件库、统一 CI/CD、便于重构；代价是仓库体积、构建与权限复杂度提升。","工具：pnpm workspace / yarn workspace / npm workspaces（依赖层）；Lerna（发布与版本管理，现多与 Nx 配合）；Turborepo / Nx（任务编排、增量构建与远程缓存，靠哈希跳过未变化的任务）；Changesets（语义化版本与 CHANGELOG）；Rush（超大规模）。","关键实践：只构建受影响包（--filter ...[origin/main]）、远程缓存复用、统一 lint/test/typecheck 流水线、避免所有包共用一份无边界的 tsconfig。"],"bullets":[],"code":[],"note":"","text":"Monorepo 的价值与常见工具？ 价值：多个包/应用共用一个仓库与统一依赖版本、原子化提交与跨包改动、共享配置与组件库、统一 CI/CD、便于重构；代价是仓库体积、构建与权限复杂度提升。 工具：pnpm workspace / yarn workspace / npm workspaces（依赖层）；Lerna（发布与版本管理，现多与 Nx 配合）；Turborepo / Nx（任务编排、增量构建与远程缓存，靠哈希跳过未变化的任务）；Changesets（语义化版本与 CHANGELOG）；Rush（超大规模）。 关键实践：只构建受影响包（--filter ...[origin/main]）、远程缓存复用、统一 lint/test/typecheck 流水线、避免所有包共用一份无边界的 tsconfig。"},{"id":178,"num":"Q178","tag":"基础","title":"Git 常考命令与工作流？","answers":["概念：工作区 → 暂存区（index）→ 本地仓库 → 远程仓库；三个区对应 add / commit / push。HEAD 指向当前分支最新提交，^ 与 ~ 表示父提交。","常考：merge vs rebase（merge 保留真实历史产生合并节点；rebase 变基使历史线性但改写提交，已 push 的公共分支禁止 rebase）；revert（生成一个反向新提交，安全）vs reset（移动 HEAD，--soft/--mixed/--hard 逐级危险）；cherry-pick 摘取单个提交；stash 暂存工作区；reflog 找回误删提交；bisect 二分定位引入 bug 的提交；tag 打版本。","分支模型：Git Flow（master/develop/feature/release/hotfix，偏重）、GitHub Flow / Trunk-Based（主干 + 短生命周期分支 + PR + CI，现代主流），配合 squash merge 保持主干整洁。"],"bullets":[],"code":[],"note":"追问：merge 冲突怎么解？看懂 <<<<<<< / ======= / >>>>>>> 三段，手动保留正确内容后 git add + commit；冲突多的功能分支可先 rebase 主分支再逐提交解冲突。","text":"Git 常考命令与工作流？ 概念：工作区 → 暂存区（index）→ 本地仓库 → 远程仓库；三个区对应 add / commit / push。HEAD 指向当前分支最新提交，^ 与 ~ 表示父提交。 常考：merge vs rebase（merge 保留真实历史产生合并节点；rebase 变基使历史线性但改写提交，已 push 的公共分支禁止 rebase）；revert（生成一个反向新提交，安全）vs reset（移动 HEAD，--soft/--mixed/--hard 逐级危险）；cherry-pick 摘取单个提交；stash 暂存工作区；reflog 找回误删提交；bisect 二分定位引入 bug 的提交；tag 打版本。 分支模型：Git Flow（master/develop/feature/release/hotfix，偏重）、GitHub Flow / Trunk-Based（主干 + 短生命周期分支 + PR + CI，现代主流），配合 squash merge 保持主干整洁。 追问：merge 冲突怎么解？看懂 <<<<<<< / ======= / >>>>>>> 三段，手动保留正确内容后 git add + commit；冲突多的功能分支可先 rebase 主分支再逐提交解冲突。"},{"id":179,"num":"Q179","tag":"基础","title":"前端代码规范与质量保障怎么做？","answers":["工具链：ESLint（代码质量）+ Prettier（格式）+ Stylelint（CSS）+ TypeScript（类型）+ EditorConfig（编辑器一致）+ husky / lint-staged（提交前只检查暂存文件）+ commitlint（约定式提交）+ CI 里跑 lint / typecheck / test / build。","测试：单元测试（Vitest / Jest，函数与 Hook）、组件测试（Testing Library / Vue Test Utils，测行为而非实现细节）、E2E（Playwright / Cypress，测关键业务流程）、覆盖率与快照（谨慎用快照，容易变成无意义变更）；TDD（先写测试）与 BDD（用业务语言描述行为）。","加分：能讲出「规范要自动化且卡在 CI，而不是靠人肉 review」，以及 lint-staged 为什么只对暂存文件跑（速度与避免历史债务阻塞）。"],"bullets":[],"code":[],"note":"","text":"前端代码规范与质量保障怎么做？ 工具链：ESLint（代码质量）+ Prettier（格式）+ Stylelint（CSS）+ TypeScript（类型）+ EditorConfig（编辑器一致）+ husky / lint-staged（提交前只检查暂存文件）+ commitlint（约定式提交）+ CI 里跑 lint / typecheck / test / build。 测试：单元测试（Vitest / Jest，函数与 Hook）、组件测试（Testing Library / Vue Test Utils，测行为而非实现细节）、E2E（Playwright / Cypress，测关键业务流程）、覆盖率与快照（谨慎用快照，容易变成无意义变更）；TDD（先写测试）与 BDD（用业务语言描述行为）。 加分：能讲出「规范要自动化且卡在 CI，而不是靠人肉 review」，以及 lint-staged 为什么只对暂存文件跑（速度与避免历史债务阻塞）。"},{"id":180,"num":"Q180","tag":"场景","title":"CI/CD 流水线怎么设计？灰度与回滚？","answers":["流程：PR 触发 lint / typecheck / unit test / build 预览环境 → 合并主干后构建产物（Docker 镜像或静态资源 + 内容 hash）→ 部署到测试/预发 → 自动化 E2E / 冒烟 → 灰度发布（按用户 ID/地域/百分比/白名单分流，或金丝雀）→ 观测指标（错误率、性能、转化）→ 全量。","回滚：静态资源保留历史版本 + HTML 入口可切换（秒级回滚）、镜像保留上一版本 tag、feature flag 一键关停；数据库变更要做向前兼容的双写/迁移。","加分：能说出「灰度看什么指标」（JS 错误率、接口 5xx、LCP/INP、核心转化漏斗）与「为什么静态资源用 hash 文件名 + HTML 不缓存」（回滚只需换 HTML 引用）。"],"bullets":[],"code":[],"note":"","text":"CI/CD 流水线怎么设计？灰度与回滚？ 流程：PR 触发 lint / typecheck / unit test / build 预览环境 → 合并主干后构建产物（Docker 镜像或静态资源 + 内容 hash）→ 部署到测试/预发 → 自动化 E2E / 冒烟 → 灰度发布（按用户 ID/地域/百分比/白名单分流，或金丝雀）→ 观测指标（错误率、性能、转化）→ 全量。 回滚：静态资源保留历史版本 + HTML 入口可切换（秒级回滚）、镜像保留上一版本 tag、feature flag 一键关停；数据库变更要做向前兼容的双写/迁移。 加分：能说出「灰度看什么指标」（JS 错误率、接口 5xx、LCP/INP、核心转化漏斗）与「为什么静态资源用 hash 文件名 + HTML 不缓存」（回滚只需换 HTML 引用）。"}]},{"id":"day6-s3","day":6,"title":"6.3 TypeScript","note":"","questions":[{"id":181,"num":"Q181","tag":"对比","title":"interface 与 type 的区别？","answers":["相同点：都能描述对象/函数形状、都可扩展、都能被实现。","差异：① interface 可被多次声明并自动合并（declaration merging，适合扩展第三方库类型），type 重复声明会报错；② interface 只能描述对象/函数/类结构，type 可描述任意类型（联合、交叉、原始类型别名、元组、映射类型、条件类型、模板字面量类型）；③ interface 可被 extends / implements，type 用 & 交叉实现扩展；④ type 支持 typeof / keyof / infer 等类型运算，interface 更适合对外暴露的公共 API（错误提示更友好、可合并）。","实践建议：描述对象/类结构优先 interface，需要联合/工具类型/类型运算时用 type；团队保持一致即可。"],"bullets":[],"code":[],"note":"","text":"interface 与 type 的区别？ 相同点：都能描述对象/函数形状、都可扩展、都能被实现。 差异：① interface 可被多次声明并自动合并（declaration merging，适合扩展第三方库类型），type 重复声明会报错；② interface 只能描述对象/函数/类结构，type 可描述任意类型（联合、交叉、原始类型别名、元组、映射类型、条件类型、模板字面量类型）；③ interface 可被 extends / implements，type 用 & 交叉实现扩展；④ type 支持 typeof / keyof / infer 等类型运算，interface 更适合对外暴露的公共 API（错误提示更友好、可合并）。 实践建议：描述对象/类结构优先 interface，需要联合/工具类型/类型运算时用 type；团队保持一致即可。"},{"id":182,"num":"Q182","tag":"必考","title":"any、unknown、never、void 的区别？","answers":["any：关闭类型检查，可赋任意值、可任意访问属性与调用，等价于退回 JS，具有「传染性」，应严格禁用（noImplicitAny / eslint no-explicit-any）。","unknown：类型安全的顶层类型，任何值都能赋给它，但使用前必须收窄（typeof / instanceof / 类型断言 / 类型保护），不能随便取属性或调用；适合替代 any 处理外部输入。","never：永不存在的值的类型，是底部类型；用于「永远抛错/死循环的函数返回值」、穷尽性检查（exhaustive check，switch default 里 const _: never = x）、以及条件类型里过滤（T extends never ? ...）。","void：函数没有返回值（与 undefined 不同：void 表示「不关心返回值」，所以返回 void 的函数可以返回任意值给回调使用）；undefined 是一个具体值类型。"],"bullets":[],"code":[],"note":"","text":"any、unknown、never、void 的区别？ any：关闭类型检查，可赋任意值、可任意访问属性与调用，等价于退回 JS，具有「传染性」，应严格禁用（noImplicitAny / eslint no-explicit-any）。 unknown：类型安全的顶层类型，任何值都能赋给它，但使用前必须收窄（typeof / instanceof / 类型断言 / 类型保护），不能随便取属性或调用；适合替代 any 处理外部输入。 never：永不存在的值的类型，是底部类型；用于「永远抛错/死循环的函数返回值」、穷尽性检查（exhaustive check，switch default 里 const _: never = x）、以及条件类型里过滤（T extends never ? ...）。 void：函数没有返回值（与 undefined 不同：void 表示「不关心返回值」，所以返回 void 的函数可以返回任意值给回调使用）；undefined 是一个具体值类型。"},{"id":183,"num":"Q183","tag":"必考","title":"泛型是什么？常见内置工具类型有哪些？","answers":["泛型是「类型参数化」，把类型当参数传入，让函数/类/接口在保持类型信息的同时复用（function identity<T>(arg: T): T；约束用 T extends Constraint；默认值 <T = string>）。","内置工具类型：Partial / Required / Readonly、Pick<T,K> / Omit<T,K>、Record<K,V>、Exclude<T,U> / Extract<T,U> / NonNullable<T>、ReturnType<F> / Parameters<F> / ConstructorParameters / InstanceType、Awaited<T>、Uppercase/Lowercase/Capitalize/Uncapitalize（模板字面量）、ThisParameterType / OmitThisParameter。","加分：能说出关键类型的底层实现——映射类型 `[K in keyof T]?: T[K]`、条件类型 `T extends U ? X : Y`、infer 推断、keyof 索引查询、分布式条件类型（裸类型参数 + 联合类型会逐个分发）；以及为什么判断两个类型完全相等要用 `(<T>() => T extends X ? 1 : 2) extends (<T>() => T extends Y ? 1 : 2) ? true : false` 这种技巧（避免分发与 any 干扰）。"],"bullets":[],"code":[],"note":"","text":"泛型是什么？常见内置工具类型有哪些？ 泛型是「类型参数化」，把类型当参数传入，让函数/类/接口在保持类型信息的同时复用（function identity<T>(arg: T): T；约束用 T extends Constraint；默认值 <T = string>）。 内置工具类型：Partial / Required / Readonly、Pick<T,K> / Omit<T,K>、Record<K,V>、Exclude<T,U> / Extract<T,U> / NonNullable<T>、ReturnType<F> / Parameters<F> / ConstructorParameters / InstanceType、Awaited<T>、Uppercase/Lowercase/Capitalize/Uncapitalize（模板字面量）、ThisParameterType / OmitThisParameter。 加分：能说出关键类型的底层实现——映射类型 `[K in keyof T]?: T[K]`、条件类型 `T extends U ? X : Y`、infer 推断、keyof 索引查询、分布式条件类型（裸类型参数 + 联合类型会逐个分发）；以及为什么判断两个类型完全相等要用 `(<T>() => T extends X ? 1 : 2) extends (<T>() => T extends Y ? 1 : 2) ? true : false` 这种技巧（避免分发与 any 干扰）。"},{"id":184,"num":"Q184","tag":"概念","title":"类型体操常见题：联合转交叉、DeepReadonly、获取路径类型？","answers":["联合转交叉：`type UnionToIntersection<U> = (U extends any ? (x: U) => void : never) extends (x: infer I) => void ? I : never`，利用函数参数位置的逆变与 infer 推导。","DeepReadonly：`type DeepReadonly<T> = T extends Function ? T : T extends object ? { readonly [K in keyof T]: DeepReadonly<T[K]> } : T`（注意处理数组、Map/Set、内置对象与循环引用，生产可直接用 type-fest）。","路径类型：`type Path<T> = ...` 用递归映射 + 模板字面量 `${K}.${Path<T[K]>}` 生成 'user.address.city' 这样的字符串联合。","面试策略：类型体操题先看「是否真的要手写」，能讲清映射类型 / 条件类型 / infer / 递归 / 分发这几个原语就够，不必死记答案。"],"bullets":[],"code":[],"note":"","text":"类型体操常见题：联合转交叉、DeepReadonly、获取路径类型？ 联合转交叉：`type UnionToIntersection<U> = (U extends any ? (x: U) => void : never) extends (x: infer I) => void ? I : never`，利用函数参数位置的逆变与 infer 推导。 DeepReadonly：`type DeepReadonly<T> = T extends Function ? T : T extends object ? { readonly [K in keyof T]: DeepReadonly<T[K]> } : T`（注意处理数组、Map/Set、内置对象与循环引用，生产可直接用 type-fest）。 路径类型：`type Path<T> = ...` 用递归映射 + 模板字面量 `${K}.${Path<T[K]>}` 生成 'user.address.city' 这样的字符串联合。 面试策略：类型体操题先看「是否真的要手写」，能讲清映射类型 / 条件类型 / infer / 递归 / 分发这几个原语就够，不必死记答案。"},{"id":185,"num":"Q185","tag":"概念","title":"类型保护、断言与声明文件？","answers":["类型保护：typeof / instanceof / in / 字面量相等判断，以及自定义类型谓词 `function isString(x: unknown): x is string { return typeof x === 'string' }`；配合控制流分析自动收窄。","断言：`as T` / 尖括号（JSX 里不能用）、非空断言 `!`、`as const`（把字面量收窄为只读字面量类型）、双重断言 `as unknown as T`（危险信号）。断言只是告诉编译器，不做运行时检查，真实边界要用 zod / io-ts 做运行时校验。","声明文件 .d.ts：declare 声明全局类型/模块，为无类型的 JS 库补类型（@types/*）；declare module '*.svg' 处理非代码资源；/// <reference> 引用；tsconfig 关键项：strict、noImplicitAny、strictNullChecks、target/module/moduleResolution、paths/baseUrl、jsx、skipLibCheck、isolatedModules、noEmit。"],"bullets":[],"code":[],"note":"","text":"类型保护、断言与声明文件？ 类型保护：typeof / instanceof / in / 字面量相等判断，以及自定义类型谓词 `function isString(x: unknown): x is string { return typeof x === 'string' }`；配合控制流分析自动收窄。 断言：`as T` / 尖括号（JSX 里不能用）、非空断言 `!`、`as const`（把字面量收窄为只读字面量类型）、双重断言 `as unknown as T`（危险信号）。断言只是告诉编译器，不做运行时检查，真实边界要用 zod / io-ts 做运行时校验。 声明文件 .d.ts：declare 声明全局类型/模块，为无类型的 JS 库补类型（@types/*）；declare module '*.svg' 处理非代码资源；/// <reference> 引用；tsconfig 关键项：strict、noImplicitAny、strictNullChecks、target/module/moduleResolution、paths/baseUrl、jsx、skipLibCheck、isolatedModules、noEmit。"},{"id":186,"num":"Q186","tag":"对比","title":"协变、逆变、双变与 TS 的严格函数类型？","answers":["协变（covariant）：子类型可以赋给父类型（返回值位置，Dog → Animal 可赋给 () => Animal）；逆变（contravariant）：参数位置方向相反（处理 Animal 的函数可以赋给「处理 Dog 的函数」类型），双变（bivariant）两者皆可（不安全）。","strictFunctionTypes 开启后，函数参数按逆变检查（方法声明仍是双变以保持兼容），这正是「函数参数位置 infer 能得到交叉类型」的原理。","实践意义：理解它才能解释「为什么 (x: Dog) => void 不能随便赋给 (x: Animal) => void」以及事件回调、比较函数的类型报错。"],"bullets":[],"code":[],"note":"","text":"协变、逆变、双变与 TS 的严格函数类型？ 协变（covariant）：子类型可以赋给父类型（返回值位置，Dog → Animal 可赋给 () => Animal）；逆变（contravariant）：参数位置方向相反（处理 Animal 的函数可以赋给「处理 Dog 的函数」类型），双变（bivariant）两者皆可（不安全）。 strictFunctionTypes 开启后，函数参数按逆变检查（方法声明仍是双变以保持兼容），这正是「函数参数位置 infer 能得到交叉类型」的原理。 实践意义：理解它才能解释「为什么 (x: Dog) => void 不能随便赋给 (x: Animal) => void」以及事件回调、比较函数的类型报错。"}]},{"id":"day6-s4","day":6,"title":"6.4 性能优化体系","note":"","questions":[{"id":187,"num":"Q187","tag":"必考","title":"首屏加载慢，你从哪里下手？（完整排查思路）","answers":["先测量再优化，顺序是：① 用 Lighthouse / WebPageTest / RUM 拿到真实数据，拆指标：TTFB → FCP → LCP → INP/TBT → CLS，定位瓶颈阶段；② 网络阶段：TTFB 高查服务端/数据库/CDN/HTTP 版本；资源下载慢查体积（bundle 分析）、压缩（br/gzip）、CDN、HTTP/2/3、缓存命中率、DNS/TLS 握手（preconnect）；③ 解析阶段：查 JS 阻塞（defer/async、代码分割）、CSS 阻塞（内联关键 CSS）、字体 FOIT（font-display: swap + preload）、第三方脚本（延迟加载/沙箱）；④ 渲染阶段：查 LCP 元素（通常是大图/标题），做优先级提示（fetchpriority=\"high\"、preload）、SSR/SSG、骨架屏、避免客户端瀑布请求；⑤ 交互阶段：拆长任务、Web Worker、虚拟列表、防抖节流、useTransition；⑥ 稳定性：图片/广告/iframe 设宽高或 aspect-ratio、预留骨架，降低 CLS。","优化后必须用同口径数据验证（实验室 + 线上 RUM P75/P95），并说明取舍（预加载过多会抢带宽、SSR 增加服务器成本、内联 CSS 失去缓存）。"],"bullets":[],"code":[],"note":"高分信号：主动说「不要用 Lighthouse 分数当结论，要看分位数和真实用户指标」「先定量再动手」「每个优化给出预期收益与副作用」。","text":"首屏加载慢，你从哪里下手？（完整排查思路） 先测量再优化，顺序是：① 用 Lighthouse / WebPageTest / RUM 拿到真实数据，拆指标：TTFB → FCP → LCP → INP/TBT → CLS，定位瓶颈阶段；② 网络阶段：TTFB 高查服务端/数据库/CDN/HTTP 版本；资源下载慢查体积（bundle 分析）、压缩（br/gzip）、CDN、HTTP/2/3、缓存命中率、DNS/TLS 握手（preconnect）；③ 解析阶段：查 JS 阻塞（defer/async、代码分割）、CSS 阻塞（内联关键 CSS）、字体 FOIT（font-display: swap + preload）、第三方脚本（延迟加载/沙箱）；④ 渲染阶段：查 LCP 元素（通常是大图/标题），做优先级提示（fetchpriority=\"high\"、preload）、SSR/SSG、骨架屏、避免客户端瀑布请求；⑤ 交互阶段：拆长任务、Web Worker、虚拟列表、防抖节流、useTransition；⑥ 稳定性：图片/广告/iframe 设宽高或 aspect-ratio、预留骨架，降低 CLS。 优化后必须用同口径数据验证（实验室 + 线上 RUM P75/P95），并说明取舍（预加载过多会抢带宽、SSR 增加服务器成本、内联 CSS 失去缓存）。 高分信号：主动说「不要用 Lighthouse 分数当结论，要看分位数和真实用户指标」「先定量再动手」「每个优化给出预期收益与副作用」。"},{"id":188,"num":"Q188","tag":"高频","title":"Core Web Vitals 三项指标怎么优化？","answers":["LCP（最大内容绘制，目标 ≤2.5s）：优化 TTFB（CDN/缓存/SSR）、给 LCP 图片 preload + fetchpriority=\"high\" + 合适尺寸与 WebP/AVIF、避免懒加载首屏图、内联关键 CSS、剔除渲染阻塞 JS、字体 font-display: swap / preload、减少客户端数据瀑布（SSR 或并行请求）。","INP（交互到下一帧，目标 ≤200ms，已取代 FID）：拆分超过 50ms 的长任务（scheduler.yield / setTimeout 分片 / requestIdleCallback）、把计算移到 Web Worker、减少事件回调里的同步 DOM 读写、避免大范围重渲染（memo / 状态下沉 / 虚拟列表）、用 useTransition 让位给输入、减少第三方脚本。","CLS（累积布局偏移，目标 ≤0.1）：所有 img/iframe/video 显式 width/height 或 aspect-ratio、字体加载用 size-adjust / fallback 度量覆盖、不要在已有内容上方动态插入 banner/广告（预留空间）、动画只用 transform/opacity、避免用 setTimeout 做布局位移。","测量：web-vitals 库 / PerformanceObserver 采集 LCP、INP、CLS 条目，按 P75 上报；DevTools Performance 的 Experience / Layout Shifts 轨道定位具体元素。"],"bullets":[],"code":[],"note":"","text":"Core Web Vitals 三项指标怎么优化？ LCP（最大内容绘制，目标 ≤2.5s）：优化 TTFB（CDN/缓存/SSR）、给 LCP 图片 preload + fetchpriority=\"high\" + 合适尺寸与 WebP/AVIF、避免懒加载首屏图、内联关键 CSS、剔除渲染阻塞 JS、字体 font-display: swap / preload、减少客户端数据瀑布（SSR 或并行请求）。 INP（交互到下一帧，目标 ≤200ms，已取代 FID）：拆分超过 50ms 的长任务（scheduler.yield / setTimeout 分片 / requestIdleCallback）、把计算移到 Web Worker、减少事件回调里的同步 DOM 读写、避免大范围重渲染（memo / 状态下沉 / 虚拟列表）、用 useTransition 让位给输入、减少第三方脚本。 CLS（累积布局偏移，目标 ≤0.1）：所有 img/iframe/video 显式 width/height 或 aspect-ratio、字体加载用 size-adjust / fallback 度量覆盖、不要在已有内容上方动态插入 banner/广告（预留空间）、动画只用 transform/opacity、避免用 setTimeout 做布局位移。 测量：web-vitals 库 / PerformanceObserver 采集 LCP、INP、CLS 条目，按 P75 上报；DevTools Performance 的 Experience / Layout Shifts 轨道定位具体元素。"},{"id":189,"num":"Q189","tag":"场景","title":"代码分割与懒加载怎么做？预加载策略？","answers":["分割：路由级 `React.lazy(() => import('./Page'))` / Vue 的 `defineAsyncComponent` 或路由 component: () => import()；组件级按交互懒加载（弹窗、富文本编辑器、图表库）；Webpack splitChunks / Vite manualChunks 抽 vendor 与公共模块；动态 import 支持魔法注释 webpackPrefetch / webpackPreload 或 Vite 的 /* @vite-ignore */。","prefetch vs preload：preload 用于「当前页面马上要用」的高优先级资源（关键字体、LCP 图、首屏 JS），prefetch 用于「下一次导航可能用到」的低优先级资源（闲置时下载）；滥用 prefetch 会浪费用户流量。","注意：分包不是越细越好——过细导致请求瀑布与 HTTP/2 头部开销，过粗导致首屏加载无用代码；按「路由 + 变更频率 + 体积阈值」三个维度决策，并用 bundle analyzer 驗證。"],"bullets":[],"code":[],"note":"","text":"代码分割与懒加载怎么做？预加载策略？ 分割：路由级 `React.lazy(() => import('./Page'))` / Vue 的 `defineAsyncComponent` 或路由 component: () => import()；组件级按交互懒加载（弹窗、富文本编辑器、图表库）；Webpack splitChunks / Vite manualChunks 抽 vendor 与公共模块；动态 import 支持魔法注释 webpackPrefetch / webpackPreload 或 Vite 的 /* @vite-ignore */。 prefetch vs preload：preload 用于「当前页面马上要用」的高优先级资源（关键字体、LCP 图、首屏 JS），prefetch 用于「下一次导航可能用到」的低优先级资源（闲置时下载）；滥用 prefetch 会浪费用户流量。 注意：分包不是越细越好——过细导致请求瀑布与 HTTP/2 头部开销，过粗导致首屏加载无用代码；按「路由 + 变更频率 + 体积阈值」三个维度决策，并用 bundle analyzer 驗證。"},{"id":190,"num":"Q190","tag":"场景","title":"图片与字体优化清单？","answers":["图片：选对格式（WebP/AVIF，照片用有损、图标用 SVG）、按 DPR 提供 srcset/sizes 响应式图片、压缩与质量调优、懒加载 loading=\"lazy\"（首屏 LCP 图不要懒加载并加 fetchpriority=\"high\"）、显式宽高防 CLS、CDN 图片处理（裁剪/缩放/格式协商 Accept）、雪碧图在 HTTP/2 后基本不再需要、关键小图内联 base64（<4KB）。","字体：font-display: swap / optional 避免 FOIT、preload 关键字体、子集化（中文按需分包，unicode-range）、用 woff2、减少字重数量、用 size-adjust / ascent-override 让 fallback 字体度量接近，减少切换时的 CLS、系统字体栈兜底。"],"bullets":[],"code":[],"note":"","text":"图片与字体优化清单？ 图片：选对格式（WebP/AVIF，照片用有损、图标用 SVG）、按 DPR 提供 srcset/sizes 响应式图片、压缩与质量调优、懒加载 loading=\"lazy\"（首屏 LCP 图不要懒加载并加 fetchpriority=\"high\"）、显式宽高防 CLS、CDN 图片处理（裁剪/缩放/格式协商 Accept）、雪碧图在 HTTP/2 后基本不再需要、关键小图内联 base64（<4KB）。 字体：font-display: swap / optional 避免 FOIT、preload 关键字体、子集化（中文按需分包，unicode-range）、用 woff2、减少字重数量、用 size-adjust / ascent-override 让 fallback 字体度量接近，减少切换时的 CLS、系统字体栈兜底。"},{"id":191,"num":"Q191","tag":"场景","title":"大文件上传怎么做？（高频场景题 + 追问）","answers":["基础方案：切片（Blob.prototype.slice，常用 1~5MB）→ 计算文件 hash（Web Worker + spark-md5 抽样 hash，避免阻塞主线程）→ 并发上传（限制 3~6 路，Promise 池）→ 服务端按 hash + index 存分片 → 全部完成后发合并请求 → 秒传（服务端已存在同 hash 直接返回）→ 断点续传（上传前先查已上传分片列表，只传缺失的）。","必答追问：① 分片大小怎么定？太小请求数多、触发限流与连接开销；太大单次失败重传代价高、内存占用大；一般 1~5MB，按网络类型与服务端限制动态调；② 失败重试：指数退避 + 最大次数，区分可重试错误（网络/5xx）与不可重试（4xx 参数错）；③ 断网恢复：本地持久化 uploadId 与已传分片，恢复后先校验再补传；④ 并发数：按浏览器同域连接上限与服务端负载压测给出数字（常见 3~6）；⑤ 服务端怎么知道传完：显式 merge 请求 + 分片计数/位图校验，或有分片落库后由定时任务扫描；⑥ 内存：用切片流式读取，别一次性 readAsArrayBuffer 整个大文件；hash 放 Worker；⑦ 安全：校验文件类型（魔数而非后缀）、大小限制、鉴权、分片归属用户、防重放。"],"bullets":[],"code":[],"note":"加分：能主动谈「可靠性与性能的平衡」并给出具体数字和理由，是这道题从及格到高分的分水岭。","text":"大文件上传怎么做？（高频场景题 + 追问） 基础方案：切片（Blob.prototype.slice，常用 1~5MB）→ 计算文件 hash（Web Worker + spark-md5 抽样 hash，避免阻塞主线程）→ 并发上传（限制 3~6 路，Promise 池）→ 服务端按 hash + index 存分片 → 全部完成后发合并请求 → 秒传（服务端已存在同 hash 直接返回）→ 断点续传（上传前先查已上传分片列表，只传缺失的）。 必答追问：① 分片大小怎么定？太小请求数多、触发限流与连接开销；太大单次失败重传代价高、内存占用大；一般 1~5MB，按网络类型与服务端限制动态调；② 失败重试：指数退避 + 最大次数，区分可重试错误（网络/5xx）与不可重试（4xx 参数错）；③ 断网恢复：本地持久化 uploadId 与已传分片，恢复后先校验再补传；④ 并发数：按浏览器同域连接上限与服务端负载压测给出数字（常见 3~6）；⑤ 服务端怎么知道传完：显式 merge 请求 + 分片计数/位图校验，或有分片落库后由定时任务扫描；⑥ 内存：用切片流式读取，别一次性 readAsArrayBuffer 整个大文件；hash 放 Worker；⑦ 安全：校验文件类型（魔数而非后缀）、大小限制、鉴权、分片归属用户、防重放。 加分：能主动谈「可靠性与性能的平衡」并给出具体数字和理由，是这道题从及格到高分的分水岭。"},{"id":192,"num":"Q192","tag":"场景","title":"如何排查页面卡顿 / 内存泄漏？","answers":["卡顿：DevTools Performance 录制 → 看 Main 线程长任务（>50ms 标红）、Layout / Recalculate Style 频繁触发（布局抖动）、GC 频繁、帧率掉到 60fps 以下 → 定位到具体函数 → 按「拆任务 / 减 DOM / 用 transform / Worker / 缓存布局读取」处理。也可监听 PerformanceObserver('longtask') 线上采集。","内存：Memory 面板 → 三次 GC 后拍 Heap Snapshot 对比 → 看 Retainers 引用链找「Detached HTMLDivElement」（脱离 DOM 但被引用）、不断增长的数组/Map、闭包持有大对象；Allocation instrumentation 看分配来源；Performance 勾选 Memory 看 JS Heap 是否阶梯上升不回落。","典型根因：未清理定时器/事件监听/订阅、全局缓存无淘汰、闭包引用 DOM、console.log 保留对象、第三方 SDK 未 destroy。"],"bullets":[],"code":[],"note":"","text":"如何排查页面卡顿 / 内存泄漏？ 卡顿：DevTools Performance 录制 → 看 Main 线程长任务（>50ms 标红）、Layout / Recalculate Style 频繁触发（布局抖动）、GC 频繁、帧率掉到 60fps 以下 → 定位到具体函数 → 按「拆任务 / 减 DOM / 用 transform / Worker / 缓存布局读取」处理。也可监听 PerformanceObserver('longtask') 线上采集。 内存：Memory 面板 → 三次 GC 后拍 Heap Snapshot 对比 → 看 Retainers 引用链找「Detached HTMLDivElement」（脱离 DOM 但被引用）、不断增长的数组/Map、闭包持有大对象；Allocation instrumentation 看分配来源；Performance 勾选 Memory 看 JS Heap 是否阶梯上升不回落。 典型根因：未清理定时器/事件监听/订阅、全局缓存无淘汰、闭包引用 DOM、console.log 保留对象、第三方 SDK 未 destroy。"},{"id":193,"num":"Q193","tag":"概念","title":"前端缓存体系有哪些层？","answers":["从近到远：① 内存/变量缓存（memoize、组件状态、Map，最快但刷新即失）；② 浏览器缓存（强缓存/协商缓存，CDN 静态资源长缓存）；③ Service Worker Cache Storage（离线、可编程策略）；④ 本地存储（localStorage / IndexedDB，接口数据、草稿、离线队列）；⑤ HTTP 缓存 / CDN 边缘缓存（s-maxage、stale-while-revalidate）；⑥ 服务端缓存（Redis、页面静态化、SSR 缓存）；⑦ 数据层缓存（TanStack Query / SWR 的 staleTime、gcTime、失效与重验证）。","一致性关键：缓存键设计（URL + 参数 + 用户维度 + Vary）、失效策略（版本化文件名、主动 purge、staleTime、TTL）、穿透/击穿/雪崩的防护（空值缓存、互斥重建、随机 TTL 抖动）。"],"bullets":[],"code":[],"note":"","text":"前端缓存体系有哪些层？ 从近到远：① 内存/变量缓存（memoize、组件状态、Map，最快但刷新即失）；② 浏览器缓存（强缓存/协商缓存，CDN 静态资源长缓存）；③ Service Worker Cache Storage（离线、可编程策略）；④ 本地存储（localStorage / IndexedDB，接口数据、草稿、离线队列）；⑤ HTTP 缓存 / CDN 边缘缓存（s-maxage、stale-while-revalidate）；⑥ 服务端缓存（Redis、页面静态化、SSR 缓存）；⑦ 数据层缓存（TanStack Query / SWR 的 staleTime、gcTime、失效与重验证）。 一致性关键：缓存键设计（URL + 参数 + 用户维度 + Vary）、失效策略（版本化文件名、主动 purge、staleTime、TTL）、穿透/击穿/雪崩的防护（空值缓存、互斥重建、随机 TTL 抖动）。"}]},{"id":"day6-s5","day":6,"title":"6.5 Node.js、测试与其他常考基础","note":"","questions":[{"id":194,"num":"Q194","tag":"基础","title":"Node.js 的特点与适用场景？","answers":["基于 V8 + libuv，单线程事件循环 + 非阻塞 I/O（底层用线程池处理文件/加密/DNS 等），擅长 I/O 密集型高并发（BFF、网关、实时通信、SSR、工具链），不适合 CPU 密集计算（用 Worker Threads / 子进程 / 原生扩展）。","前端要掌握的 Node 能力：CommonJS/ESM 互操作、package.json（exports/main/module/types、scripts、engines、sideEffects）、npm 生命周期、BFF 聚合接口、SSR、CLI 工具、流（Stream）与背压、进程管理（cluster / PM2）、环境变量与配置。","加分：能说出 libuv 的线程池默认 4 线程（UV_THREADPOOL_SIZE 可调），以及为什么「Node 是单线程」准确说法是「JS 执行主线程单线程」。"],"bullets":[],"code":[],"note":"","text":"Node.js 的特点与适用场景？ 基于 V8 + libuv，单线程事件循环 + 非阻塞 I/O（底层用线程池处理文件/加密/DNS 等），擅长 I/O 密集型高并发（BFF、网关、实时通信、SSR、工具链），不适合 CPU 密集计算（用 Worker Threads / 子进程 / 原生扩展）。 前端要掌握的 Node 能力：CommonJS/ESM 互操作、package.json（exports/main/module/types、scripts、engines、sideEffects）、npm 生命周期、BFF 聚合接口、SSR、CLI 工具、流（Stream）与背压、进程管理（cluster / PM2）、环境变量与配置。 加分：能说出 libuv 的线程池默认 4 线程（UV_THREADPOOL_SIZE 可调），以及为什么「Node 是单线程」准确说法是「JS 执行主线程单线程」。"},{"id":195,"num":"Q195","tag":"概念","title":"CommonJS 与 ESM 在 Node 里如何互操作？","answers":["判断依据：文件扩展名 .mjs / .cjs、package.json 的 \"type\": \"module\"、以及 exports 的 import/require 条件导出。","ESM 可以 import CJS（拿到 module.exports 作为默认导出，具名导出靠静态分析有限的 cjs-module-lexer）；CJS 不能 require ESM（因为 require 是同步而 ESM 可含顶层 await），但 Node 22+ 已实验性支持 require(esm)。","ESM 里没有 __dirname / __filename / require，用 import.meta.url + fileURLToPath 替代；包入口用 exports 字段做条件导出，避免 main 被绕过导致的「双包风险」（同一库同时被 CJS 与 ESM 加载产生两份实例）。"],"bullets":[],"code":[],"note":"","text":"CommonJS 与 ESM 在 Node 里如何互操作？ 判断依据：文件扩展名 .mjs / .cjs、package.json 的 \"type\": \"module\"、以及 exports 的 import/require 条件导出。 ESM 可以 import CJS（拿到 module.exports 作为默认导出，具名导出靠静态分析有限的 cjs-module-lexer）；CJS 不能 require ESM（因为 require 是同步而 ESM 可含顶层 await），但 Node 22+ 已实验性支持 require(esm)。 ESM 里没有 __dirname / __filename / require，用 import.meta.url + fileURLToPath 替代；包入口用 exports 字段做条件导出，避免 main 被绕过导致的「双包风险」（同一库同时被 CJS 与 ESM 加载产生两份实例）。"},{"id":196,"num":"Q196","tag":"对比","title":"进程、线程、协程与 Web Worker？","answers":["进程是资源分配的最小单位，有独立地址空间，隔离好、切换开销大；线程是 CPU 调度的最小单位，共享进程内存，切换开销小但需要处理同步与竞态；协程是用户态的轻量「可暂停/恢复」执行单元（JS 的生成器、async/await 可看作协程思维），切换不需要内核参与。","浏览器里 Web Worker 是真正的独立线程（不能访问 DOM、postMessage 通信、结构化克隆），主线程负责 UI；Node 的 worker_threads 同理，适合 CPU 密集任务；cluster / child_process 是多进程方案。","加分：能说出「JS 单线程 + 事件循环」解决的是 I/O 并发而非并行计算，以及为什么 UI 线程不能被阻塞（会导致掉帧与无响应）。"],"bullets":[],"code":[],"note":"","text":"进程、线程、协程与 Web Worker？ 进程是资源分配的最小单位，有独立地址空间，隔离好、切换开销大；线程是 CPU 调度的最小单位，共享进程内存，切换开销小但需要处理同步与竞态；协程是用户态的轻量「可暂停/恢复」执行单元（JS 的生成器、async/await 可看作协程思维），切换不需要内核参与。 浏览器里 Web Worker 是真正的独立线程（不能访问 DOM、postMessage 通信、结构化克隆），主线程负责 UI；Node 的 worker_threads 同理，适合 CPU 密集任务；cluster / child_process 是多进程方案。 加分：能说出「JS 单线程 + 事件循环」解决的是 I/O 并发而非并行计算，以及为什么 UI 线程不能被阻塞（会导致掉帧与无响应）。"},{"id":197,"num":"Q197","tag":"概念","title":"设计模式里前端常考哪些？","answers":["单例（全局 store、Modal 管理器、登录态）、工厂 / 抽象工厂（根据类型创建组件或请求适配器）、策略（表单校验规则、支付方式、折扣计算，消除 if/else）、代理（Proxy 实现缓存/懒加载/权限校验，Vue3 响应式）、观察者（Observer 直接通知）与发布订阅（EventEmitter / mitt，通过事件中心解耦，区别在是否有中间人）、装饰器（@ 装饰器、高阶组件 HOC、中间件）、适配器（统一不同后端接口/第三方 SDK）、组合（组件树、compose）、享元（大量相似对象的共享元数据）、责任链（中间件 koa/express、审批流）。","加分：把设计模式和框架实现对应起来讲（Redux middleware 是责任链 + 装饰器，React HOC 是装饰器，Vue 响应式是观察者 + 代理，EventEmitter 是发布订阅）。"],"bullets":[],"code":[],"note":"","text":"设计模式里前端常考哪些？ 单例（全局 store、Modal 管理器、登录态）、工厂 / 抽象工厂（根据类型创建组件或请求适配器）、策略（表单校验规则、支付方式、折扣计算，消除 if/else）、代理（Proxy 实现缓存/懒加载/权限校验，Vue3 响应式）、观察者（Observer 直接通知）与发布订阅（EventEmitter / mitt，通过事件中心解耦，区别在是否有中间人）、装饰器（@ 装饰器、高阶组件 HOC、中间件）、适配器（统一不同后端接口/第三方 SDK）、组合（组件树、compose）、享元（大量相似对象的共享元数据）、责任链（中间件 koa/express、审批流）。 加分：把设计模式和框架实现对应起来讲（Redux middleware 是责任链 + 装饰器，React HOC 是装饰器，Vue 响应式是观察者 + 代理，EventEmitter 是发布订阅）。"},{"id":198,"num":"Q198","tag":"基础","title":"数据结构与算法，前端要掌握到什么程度？","answers":["必须熟练：数组/字符串双指针与滑动窗口、哈希表计数、栈（括号匹配、单调栈）、队列、链表反转与快慢指针、二叉树递归/层序/BST、排序（快排、归并、堆排序思想与复杂度）、二分查找、DFS/BFS、前缀和、简单动态规划（爬楼梯、背包思想、最长递增子序列 LIS）、贪心。","复杂度：常见操作的 O(1)/O(log n)/O(n)/O(n log n)/O(n²)，能分析时间/空间复杂度与稳定性；能解释为什么 Vue3 diff 用 LIS、为什么虚拟列表用二分定位。","前端特色题：数组扁平化、去重、深拷贝、LRU 缓存（Map + 双向链表或利用 Map 插入顺序）、大数相加、模板字符串解析、虚拟 DOM diff、事件总线、并发控制、JSONP、Promise 系列。完整手写见第 7 天。"],"bullets":[],"code":[],"note":"","text":"数据结构与算法，前端要掌握到什么程度？ 必须熟练：数组/字符串双指针与滑动窗口、哈希表计数、栈（括号匹配、单调栈）、队列、链表反转与快慢指针、二叉树递归/层序/BST、排序（快排、归并、堆排序思想与复杂度）、二分查找、DFS/BFS、前缀和、简单动态规划（爬楼梯、背包思想、最长递增子序列 LIS）、贪心。 复杂度：常见操作的 O(1)/O(log n)/O(n)/O(n log n)/O(n²)，能分析时间/空间复杂度与稳定性；能解释为什么 Vue3 diff 用 LIS、为什么虚拟列表用二分定位。 前端特色题：数组扁平化、去重、深拷贝、LRU 缓存（Map + 双向链表或利用 Map 插入顺序）、大数相加、模板字符串解析、虚拟 DOM diff、事件总线、并发控制、JSONP、Promise 系列。完整手写见第 7 天。"}]}]},{"id":"day7","day":7,"title":"第 7 天｜手写代码全集 + 场景题 + 模拟面试","short":"手写代码全集 + 场景题 + 模拟面试","note":"目标：前六天是「会说」，今天是「会写」。手写题的评分点不是背出代码，而是：边界条件（this、参数、循环引用、空数组）、复杂度、以及能主动说出面试官会追问什么。建议每题先自己写一遍，再对照下面实现。","sections":[{"id":"day7-s1","day":7,"title":"7.1 必背手写题（基础篇）","note":"","questions":[{"id":199,"num":"Q199","tag":"手写","title":"实现防抖 debounce（支持立即执行、cancel、this 与参数透传）。","answers":["思路：闭包保存 timer；每次触发先 clearTimeout 再重新计时；用 apply 保留 this 与参数；immediate 模式靠「timer 是否存在」判断是否首次触发；cancel 清定时器并置空。","易漏点：忘记返回函数、忘记透传 this、immediate 模式下 timer 置空时机、cancel 后状态复位。应用：搜索联想、输入校验、resize 结束、按钮防重复提交。"],"bullets":[],"code":[["function debounce(fn, wait = 300, immediate = false) {","  let timer = null","  function debounced(...args) {","    const ctx = this","    if (timer) clearTimeout(timer)","    if (immediate && !timer) fn.apply(ctx, args)","    timer = setTimeout(() => {","      timer = null","      if (!immediate) fn.apply(ctx, args)","    }, wait)","  }","  debounced.cancel = () => { clearTimeout(timer); timer = null }","  return debounced","}"]],"note":"","text":"实现防抖 debounce（支持立即执行、cancel、this 与参数透传）。 思路：闭包保存 timer；每次触发先 clearTimeout 再重新计时；用 apply 保留 this 与参数；immediate 模式靠「timer 是否存在」判断是否首次触发；cancel 清定时器并置空。 易漏点：忘记返回函数、忘记透传 this、immediate 模式下 timer 置空时机、cancel 后状态复位。应用：搜索联想、输入校验、resize 结束、按钮防重复提交。 function debounce(fn, wait = 300, immediate = false) {   let timer = null   function debounced(...args) {     const ctx = this     if (timer) clearTimeout(timer)     if (immediate && !timer) fn.apply(ctx, args)     timer = setTimeout(() => {       timer = null       if (!immediate) fn.apply(ctx, args)     }, wait)   }   debounced.cancel = () => { clearTimeout(timer); timer = null }   return debounced }"},{"id":200,"num":"Q200","tag":"手写","title":"实现节流 throttle（支持 leading / trailing / cancel）。","answers":["思路：用时间戳判断距离上次执行是否超过 wait；不足则把「末次调用」放到定时器里补发；leading=false 时首次也要等一个 wait。","易错点：时间戳与定时器混用时要互斥（执行了一个就清掉另一个）、trailing 补发时 last 的更新、cancel 后状态复位。复杂度 O(1)。"],"bullets":[],"code":[["function throttle(fn, wait = 300, { leading = true, trailing = true } = {}) {","  let last = 0, timer = null","  function throttled(...args) {","    const now = Date.now(), ctx = this","    if (!last && !leading) last = now","    const remain = wait - (now - last)","    if (remain <= 0 || remain > wait) {","      if (timer) { clearTimeout(timer); timer = null }","      last = now","      fn.apply(ctx, args)","    } else if (trailing && !timer) {","      timer = setTimeout(() => {","        last = leading ? Date.now() : 0","        timer = null","        fn.apply(ctx, args)","      }, remain)","    }","  }","  throttled.cancel = () => { clearTimeout(timer); timer = null; last = 0 }","  return throttled","}"]],"note":"","text":"实现节流 throttle（支持 leading / trailing / cancel）。 思路：用时间戳判断距离上次执行是否超过 wait；不足则把「末次调用」放到定时器里补发；leading=false 时首次也要等一个 wait。 易错点：时间戳与定时器混用时要互斥（执行了一个就清掉另一个）、trailing 补发时 last 的更新、cancel 后状态复位。复杂度 O(1)。 function throttle(fn, wait = 300, { leading = true, trailing = true } = {}) {   let last = 0, timer = null   function throttled(...args) {     const now = Date.now(), ctx = this     if (!last && !leading) last = now     const remain = wait - (now - last)     if (remain <= 0 || remain > wait) {       if (timer) { clearTimeout(timer); timer = null }       last = now       fn.apply(ctx, args)     } else if (trailing && !timer) {       timer = setTimeout(() => {         last = leading ? Date.now() : 0         timer = null         fn.apply(ctx, args)       }, remain)     }   }   throttled.cancel = () => { clearTimeout(timer); timer = null; last = 0 }   return throttled }"},{"id":201,"num":"Q201","tag":"手写","title":"实现深拷贝 deepClone（处理循环引用、Symbol、Date/RegExp/Map/Set、原型链）。","answers":["思路：WeakMap 缓存已拷贝对象解决循环引用；基本类型与函数直接返回；特殊内置对象单独构造；用 Object.create(Object.getPrototypeOf(src)) 保留原型；用 Reflect.ownKeys 覆盖不可枚举属性与 Symbol 键。","易漏点：循环引用（不处理会爆栈）、Symbol 键（Object.keys 取不到）、Date/RegExp/Map/Set（普通递归会变成空对象）、原型丢失、函数如何处理（通常直接复用引用）。"],"bullets":[],"code":[["function deepClone(src, cache = new WeakMap()) {","  if (src === null || typeof src !== 'object') return src   // 基本类型 / 函数","  if (src instanceof Date) return new Date(src.getTime())","  if (src instanceof RegExp) return new RegExp(src.source, src.flags)","  if (cache.has(src)) return cache.get(src)","  if (src instanceof Map) {","    const m = new Map(); cache.set(src, m)","    src.forEach((v, k) => m.set(deepClone(k, cache), deepClone(v, cache)))","    return m","  }","  if (src instanceof Set) {","    const s = new Set(); cache.set(src, s)","    src.forEach(v => s.add(deepClone(v, cache)))","    return s","  }","  const out = Array.isArray(src) ? [] : Object.create(Object.getPrototypeOf(src))","  cache.set(src, out)","  Reflect.ownKeys(src).forEach(k => { out[k] = deepClone(src[k], cache) })","  return out","}"]],"note":"追问：structuredClone 与它的差异？原生支持循环引用、Map/Set/Date/ArrayBuffer，但不支持函数、DOM 节点、Proxy 与自定义原型（会变成普通对象）。","text":"实现深拷贝 deepClone（处理循环引用、Symbol、Date/RegExp/Map/Set、原型链）。 思路：WeakMap 缓存已拷贝对象解决循环引用；基本类型与函数直接返回；特殊内置对象单独构造；用 Object.create(Object.getPrototypeOf(src)) 保留原型；用 Reflect.ownKeys 覆盖不可枚举属性与 Symbol 键。 易漏点：循环引用（不处理会爆栈）、Symbol 键（Object.keys 取不到）、Date/RegExp/Map/Set（普通递归会变成空对象）、原型丢失、函数如何处理（通常直接复用引用）。 function deepClone(src, cache = new WeakMap()) {   if (src === null || typeof src !== 'object') return src   // 基本类型 / 函数   if (src instanceof Date) return new Date(src.getTime())   if (src instanceof RegExp) return new RegExp(src.source, src.flags)   if (cache.has(src)) return cache.get(src)   if (src instanceof Map) {     const m = new Map(); cache.set(src, m)     src.forEach((v, k) => m.set(deepClone(k, cache), deepClone(v, cache)))     return m   }   if (src instanceof Set) {     const s = new Set(); cache.set(src, s)     src.forEach(v => s.add(deepClone(v, cache)))     return s   }   const out = Array.isArray(src) ? [] : Object.create(Object.getPrototypeOf(src))   cache.set(src, out)   Reflect.ownKeys(src).forEach(k => { out[k] = deepClone(src[k], cache) })   return out } 追问：structuredClone 与它的差异？原生支持循环引用、Map/Set/Date/ArrayBuffer，但不支持函数、DOM 节点、Proxy 与自定义原型（会变成普通对象）。"},{"id":202,"num":"Q202","tag":"手写","title":"实现 call / apply / bind。","answers":["call/apply：把函数临时挂到 context 上，通过 `ctx.fn()` 触发隐式绑定得到正确 this，用完 delete；用 Symbol 作键避免覆盖同名属性；context 为 null/undefined 时用 globalThis 并做 Object() 包装（原始值转包装对象）。","bind：返回新函数；要处理 ① 预设参数 + 调用参数拼接；② 被 new 调用时 this 应指向新实例而不是绑定的 ctx（用 this instanceof bound 判断）；③ 原型链继承（否则 new 出来的实例拿不到原函数原型方法）。"],"bullets":[],"code":[["Function.prototype.myCall = function (ctx, ...args) {","  ctx = ctx == null ? globalThis : Object(ctx)","  const key = Symbol('fn')","  ctx[key] = this","  const res = ctx[key](...args)","  delete ctx[key]","  return res","}","Function.prototype.myApply = function (ctx, args = []) {","  ctx = ctx == null ? globalThis : Object(ctx)","  const key = Symbol('fn')","  ctx[key] = this","  const res = ctx[key](...args)","  delete ctx[key]","  return res","}","Function.prototype.myBind = function (ctx, ...preset) {","  const self = this","  function bound(...args) {","    const realCtx = this instanceof bound ? this : ctx","    return self.apply(realCtx, [...preset, ...args])","  }","  if (self.prototype) bound.prototype = Object.create(self.prototype)","  return bound","}"]],"note":"","text":"实现 call / apply / bind。 call/apply：把函数临时挂到 context 上，通过 `ctx.fn()` 触发隐式绑定得到正确 this，用完 delete；用 Symbol 作键避免覆盖同名属性；context 为 null/undefined 时用 globalThis 并做 Object() 包装（原始值转包装对象）。 bind：返回新函数；要处理 ① 预设参数 + 调用参数拼接；② 被 new 调用时 this 应指向新实例而不是绑定的 ctx（用 this instanceof bound 判断）；③ 原型链继承（否则 new 出来的实例拿不到原函数原型方法）。 Function.prototype.myCall = function (ctx, ...args) {   ctx = ctx == null ? globalThis : Object(ctx)   const key = Symbol('fn')   ctx[key] = this   const res = ctx[key](...args)   delete ctx[key]   return res } Function.prototype.myApply = function (ctx, args = []) {   ctx = ctx == null ? globalThis : Object(ctx)   const key = Symbol('fn')   ctx[key] = this   const res = ctx[key](...args)   delete ctx[key]   return res } Function.prototype.myBind = function (ctx, ...preset) {   const self = this   function bound(...args) {     const realCtx = this instanceof bound ? this : ctx     return self.apply(realCtx, [...preset, ...args])   }   if (self.prototype) bound.prototype = Object.create(self.prototype)   return bound }"},{"id":203,"num":"Q203","tag":"手写","title":"实现 new 操作符与 instanceof。","answers":["new 四步：创建空对象并 linking 原型 → apply 执行构造函数 → 判断返回值是否为对象/函数 → 返回实例或该返回值。最常见漏点是「构造函数返回对象时覆盖」。","instanceof：沿原型链比对；先校验右侧是函数、左侧是对象/函数；用 Object.getPrototypeOf 逐层上溯直到 null。"],"bullets":[],"code":[["function myNew(Ctor, ...args) {","  const obj = Object.create(Ctor.prototype)","  const ret = Ctor.apply(obj, args)","  return (ret !== null && (typeof ret === 'object' || typeof ret === 'function')) ? ret : obj","}","function myInstanceof(left, right) {","  if (typeof right !== 'function') throw new TypeError('Right side must be callable')","  if (left === null || (typeof left !== 'object' && typeof left !== 'function')) return false","  let p = Object.getPrototypeOf(left)","  while (p) {","    if (p === right.prototype) return true","    p = Object.getPrototypeOf(p)","  }","  return false","}"]],"note":"","text":"实现 new 操作符与 instanceof。 new 四步：创建空对象并 linking 原型 → apply 执行构造函数 → 判断返回值是否为对象/函数 → 返回实例或该返回值。最常见漏点是「构造函数返回对象时覆盖」。 instanceof：沿原型链比对；先校验右侧是函数、左侧是对象/函数；用 Object.getPrototypeOf 逐层上溯直到 null。 function myNew(Ctor, ...args) {   const obj = Object.create(Ctor.prototype)   const ret = Ctor.apply(obj, args)   return (ret !== null && (typeof ret === 'object' || typeof ret === 'function')) ? ret : obj } function myInstanceof(left, right) {   if (typeof right !== 'function') throw new TypeError('Right side must be callable')   if (left === null || (typeof left !== 'object' && typeof left !== 'function')) return false   let p = Object.getPrototypeOf(left)   while (p) {     if (p === right.prototype) return true     p = Object.getPrototypeOf(p)   }   return false }"},{"id":204,"num":"Q204","tag":"手写","title":"实现寄生组合继承与 Object.create。","answers":["关键点：用 Object.create(Parent.prototype) 代替 new Parent() 挂原型（避免父构造函数执行两次、原型上残留实例属性），并修正 constructor 指向。子类里用 Parent.call(this) 继承实例属性。"],"bullets":[],"code":[["function Parent(name) { this.name = name; this.list = [1, 2] }","Parent.prototype.say = function () { return this.name }","function Child(name, age) { Parent.call(this, name); this.age = age }","Child.prototype = Object.create(Parent.prototype)","Child.prototype.constructor = Child","function myCreate(proto, props) {","  function F() {}","  F.prototype = proto","  const o = new F()","  if (props) Object.defineProperties(o, props)","  return o","}"]],"note":"","text":"实现寄生组合继承与 Object.create。 关键点：用 Object.create(Parent.prototype) 代替 new Parent() 挂原型（避免父构造函数执行两次、原型上残留实例属性），并修正 constructor 指向。子类里用 Parent.call(this) 继承实例属性。 function Parent(name) { this.name = name; this.list = [1, 2] } Parent.prototype.say = function () { return this.name } function Child(name, age) { Parent.call(this, name); this.age = age } Child.prototype = Object.create(Parent.prototype) Child.prototype.constructor = Child function myCreate(proto, props) {   function F() {}   F.prototype = proto   const o = new F()   if (props) Object.defineProperties(o, props)   return o }"},{"id":205,"num":"Q205","tag":"手写","title":"实现 Promise.all / race / allSettled / any / finally。","answers":["通用要点：① 用 Promise.resolve 包装非 Promise 值；② 结果数组按下标写入以保序；③ all 空数组要立即 resolve([])；④ 计数用独立变量而不是 res.length（稀疏数组会误判）；⑤ allSettled 永不 reject；⑥ any 全失败时抛 AggregateError。"],"bullets":[],"code":[["Promise.myAll = tasks => new Promise((resolve, reject) => {","  const res = [], n = tasks.length","  if (!n) return resolve(res)","  let count = 0","  tasks.forEach((t, i) => Promise.resolve(t).then(v => {","    res[i] = v","    if (++count === n) resolve(res)","  }, reject))","})","Promise.myRace = tasks => new Promise((resolve, reject) =>","  tasks.forEach(t => Promise.resolve(t).then(resolve, reject)))","Promise.myAllSettled = tasks => Promise.all(tasks.map(t =>","  Promise.resolve(t).then(","    value => ({ status: 'fulfilled', value }),","    reason => ({ status: 'rejected', reason })","  )))","Promise.myAny = tasks => new Promise((resolve, reject) => {","  const errs = []; let n = 0","  if (!tasks.length) return reject(new AggregateError([], 'All promises rejected'))","  tasks.forEach((t, i) => Promise.resolve(t).then(resolve, e => {","    errs[i] = e","    if (++n === tasks.length) reject(new AggregateError(errs, 'All promises rejected'))","  }))","})","Promise.prototype.myFinally = function (fn) {","  return this.then(","    v => Promise.resolve(fn()).then(() => v),","    e => Promise.resolve(fn()).then(() => { throw e })","  )","}"]],"note":"","text":"实现 Promise.all / race / allSettled / any / finally。 通用要点：① 用 Promise.resolve 包装非 Promise 值；② 结果数组按下标写入以保序；③ all 空数组要立即 resolve([])；④ 计数用独立变量而不是 res.length（稀疏数组会误判）；⑤ allSettled 永不 reject；⑥ any 全失败时抛 AggregateError。 Promise.myAll = tasks => new Promise((resolve, reject) => {   const res = [], n = tasks.length   if (!n) return resolve(res)   let count = 0   tasks.forEach((t, i) => Promise.resolve(t).then(v => {     res[i] = v     if (++count === n) resolve(res)   }, reject)) }) Promise.myRace = tasks => new Promise((resolve, reject) =>   tasks.forEach(t => Promise.resolve(t).then(resolve, reject))) Promise.myAllSettled = tasks => Promise.all(tasks.map(t =>   Promise.resolve(t).then(     value => ({ status: 'fulfilled', value }),     reason => ({ status: 'rejected', reason })   ))) Promise.myAny = tasks => new Promise((resolve, reject) => {   const errs = []; let n = 0   if (!tasks.length) return reject(new AggregateError([], 'All promises rejected'))   tasks.forEach((t, i) => Promise.resolve(t).then(resolve, e => {     errs[i] = e     if (++n === tasks.length) reject(new AggregateError(errs, 'All promises rejected'))   })) }) Promise.prototype.myFinally = function (fn) {   return this.then(     v => Promise.resolve(fn()).then(() => v),     e => Promise.resolve(fn()).then(() => { throw e })   ) }"},{"id":206,"num":"Q206","tag":"手写","title":"实现符合 Promises/A+ 核心的 MyPromise（面试版）。","answers":["必答要点：① 三态且不可逆；② then 返回新 Promise（链式）；③ 回调异步执行（queueMicrotask 模拟微任务）；④ resolvePromise 决议过程：处理 x === p2 循环、thenable 吸收、只调用一次（called 锁）、错误捕获；⑤ 值穿透（缺省回调补默认值）；⑥ executor 抛错要 reject。","追问高频：为什么 then 回调要异步？规范保证执行顺序一致、避免 Zalgo（有时同步有时异步）；为什么需要 called 锁？防止恶意 thenable 既 resolve 又 reject。"],"bullets":[],"code":[["class MyPromise {","  constructor(executor) {","    this.status = 'pending'; this.value = undefined","    this.onFulfilled = []; this.onRejected = []","    const resolve = v => {","      if (v instanceof MyPromise) return v.then(resolve, reject)","      queueMicrotask(() => {","        if (this.status !== 'pending') return","        this.status = 'fulfilled'; this.value = v","        this.onFulfilled.forEach(fn => fn(v))","      })","    }","    const reject = r => queueMicrotask(() => {","      if (this.status !== 'pending') return","      this.status = 'rejected'; this.value = r","      this.onRejected.forEach(fn => fn(r))","    })","    try { executor(resolve, reject) } catch (e) { reject(e) }","  }","  then(onF = v => v, onR = e => { throw e }) {","    const p2 = new MyPromise((resolve, reject) => {","      const run = (fn, val) => queueMicrotask(() => {","        try { resolvePromise(p2, fn(val), resolve, reject) } catch (e) { reject(e) }","      })","      if (this.status === 'fulfilled') run(onF, this.value)","      else if (this.status === 'rejected') run(onR, this.value)","      else {","        this.onFulfilled.push(v => run(onF, v))","        this.onRejected.push(r => run(onR, r))","      }","    })","    return p2","  }","  catch(fn) { return this.then(null, fn) }","  static resolve(v) { return v instanceof MyPromise ? v : new MyPromise(r => r(v)) }","  static reject(r) { return new MyPromise((_, j) => j(r)) }","}","function resolvePromise(p2, x, resolve, reject) {","  if (x === p2) return reject(new TypeError('Chaining cycle detected'))","  if (x instanceof MyPromise) return x.then(resolve, reject)","  if (x !== null && (typeof x === 'object' || typeof x === 'function')) {","    let called = false","    try {","      const then = x.then","      if (typeof then === 'function') {","        then.call(x,","          y => { if (called) return; called = true; resolvePromise(p2, y, resolve, reject) },","          r => { if (called) return; called = true; reject(r) })","      } else resolve(x)","    } catch (e) { if (!called) { called = true; reject(e) } }","  } else resolve(x)","}"]],"note":"","text":"实现符合 Promises/A+ 核心的 MyPromise（面试版）。 必答要点：① 三态且不可逆；② then 返回新 Promise（链式）；③ 回调异步执行（queueMicrotask 模拟微任务）；④ resolvePromise 决议过程：处理 x === p2 循环、thenable 吸收、只调用一次（called 锁）、错误捕获；⑤ 值穿透（缺省回调补默认值）；⑥ executor 抛错要 reject。 追问高频：为什么 then 回调要异步？规范保证执行顺序一致、避免 Zalgo（有时同步有时异步）；为什么需要 called 锁？防止恶意 thenable 既 resolve 又 reject。 class MyPromise {   constructor(executor) {     this.status = 'pending'; this.value = undefined     this.onFulfilled = []; this.onRejected = []     const resolve = v => {       if (v instanceof MyPromise) return v.then(resolve, reject)       queueMicrotask(() => {         if (this.status !== 'pending') return         this.status = 'fulfilled'; this.value = v         this.onFulfilled.forEach(fn => fn(v))       })     }     const reject = r => queueMicrotask(() => {       if (this.status !== 'pending') return       this.status = 'rejected'; this.value = r       this.onRejected.forEach(fn => fn(r))     })     try { executor(resolve, reject) } catch (e) { reject(e) }   }   then(onF = v => v, onR = e => { throw e }) {     const p2 = new MyPromise((resolve, reject) => {       const run = (fn, val) => queueMicrotask(() => {         try { resolvePromise(p2, fn(val), resolve, reject) } catch (e) { reject(e) }       })       if (this.status === 'fulfilled') run(onF, this.value)       else if (this.status === 'rejected') run(onR, this.value)       else {         this.onFulfilled.push(v => run(onF, v))         this.onRejected.push(r => run(onR, r))       }     })     return p2   }   catch(fn) { return this.then(null, fn) }   static resolve(v) { return v instanceof MyPromise ? v : new MyPromise(r => r(v)) }   static reject(r) { return new MyPromise((_, j) => j(r)) } } function resolvePromise(p2, x, resolve, reject) {   if (x === p2) return reject(new TypeError('Chaining cycle detected'))   if (x instanceof MyPromise) return x.then(resolve, reject)   if (x !== null && (typeof x === 'object' || typeof x === 'function')) {     let called = false     try {       const then = x.then       if (typeof then === 'function') {         then.call(x,           y => { if (called) return; called = true; resolvePromise(p2, y, resolve, reject) },           r => { if (called) return; called = true; reject(r) })       } else resolve(x)     } catch (e) { if (!called) { called = true; reject(e) } }   } else resolve(x) }"},{"id":207,"num":"Q207","tag":"手写","title":"实现并发控制（Promise 调度池）。","answers":["思路：维护 `i`（下一个待执行任务下标）与 `done`（已完成数），启动 min(limit, total) 个 worker，每个 worker 完成后自动领取下一个任务（递归补位），全部完成 resolve 结果数组。","必答追问：limit 怎么定？浏览器同域并发上限、服务端限流、内存占用三者权衡，一般 3~6；失败策略？快速失败（reject）还是全部完成后用 allSettled 语义收集；任务必须是「返回 Promise 的函数」而不是已启动的 Promise（否则无法真正限流）。"],"bullets":[],"code":[["function limit(tasks, limit = 3) {","  return new Promise((resolve, reject) => {","    const total = tasks.length, results = []","    let i = 0, done = 0","    if (!total) return resolve(results)","    const run = () => {","      if (i >= total) return","      const idx = i++","      Promise.resolve(tasks[idx]()).then(v => {","        results[idx] = v","        if (++done === total) resolve(results)","        else run()","      }).catch(reject)","    }","    Array.from({ length: Math.min(limit, total) }, run)","  })","}"]],"note":"","text":"实现并发控制（Promise 调度池）。 思路：维护 `i`（下一个待执行任务下标）与 `done`（已完成数），启动 min(limit, total) 个 worker，每个 worker 完成后自动领取下一个任务（递归补位），全部完成 resolve 结果数组。 必答追问：limit 怎么定？浏览器同域并发上限、服务端限流、内存占用三者权衡，一般 3~6；失败策略？快速失败（reject）还是全部完成后用 allSettled 语义收集；任务必须是「返回 Promise 的函数」而不是已启动的 Promise（否则无法真正限流）。 function limit(tasks, limit = 3) {   return new Promise((resolve, reject) => {     const total = tasks.length, results = []     let i = 0, done = 0     if (!total) return resolve(results)     const run = () => {       if (i >= total) return       const idx = i++       Promise.resolve(tasks[idx]()).then(v => {         results[idx] = v         if (++done === total) resolve(results)         else run()       }).catch(reject)     }     Array.from({ length: Math.min(limit, total) }, run)   }) }"},{"id":208,"num":"Q208","tag":"手写","title":"实现函数柯里化 curry 与 compose / pipe。","answers":["curry：收集参数直到数量 >= fn.length 再执行，否则返回新的 curry；局限：fn.length 不计算 rest 参数与默认值参数，且无法处理占位符（可拓展支持 `_` 占位）。","compose 从右到左、pipe 从左到右，都用 reduce 实现；注意 compose 参数为 0 时应返回恒等函数 x => x。"],"bullets":[],"code":[["function curry(fn, ...preset) {","  return function curried(...args) {","    const all = [...preset, ...args]","    return all.length >= fn.length ? fn.apply(this, all) : curry(fn, ...all)","  }","}","const compose = (...fns) => fns.length === 0 ? (x => x)","  : fns.reduce((a, b) => (...args) => a(b(...args)))","const pipe = (...fns) => fns.length === 0 ? (x => x)","  : fns.reduce((a, b) => (...args) => b(a(...args)))"]],"note":"","text":"实现函数柯里化 curry 与 compose / pipe。 curry：收集参数直到数量 >= fn.length 再执行，否则返回新的 curry；局限：fn.length 不计算 rest 参数与默认值参数，且无法处理占位符（可拓展支持 `_` 占位）。 compose 从右到左、pipe 从左到右，都用 reduce 实现；注意 compose 参数为 0 时应返回恒等函数 x => x。 function curry(fn, ...preset) {   return function curried(...args) {     const all = [...preset, ...args]     return all.length >= fn.length ? fn.apply(this, all) : curry(fn, ...all)   } } const compose = (...fns) => fns.length === 0 ? (x => x)   : fns.reduce((a, b) => (...args) => a(b(...args))) const pipe = (...fns) => fns.length === 0 ? (x => x)   : fns.reduce((a, b) => (...args) => b(a(...args)))"},{"id":209,"num":"Q209","tag":"手写","title":"数组扁平化 flatten、去重 unique、按字段去重。","answers":["flatten 用 reduce + concat + 递归并控制 depth；注意 depth 为 0 时返回浅拷贝、flat 会跳过稀疏数组空位。去重优先 [...new Set(arr)]（NaN 也等价，基于 SameValueZero）；对象数组用 Map 按 key 去重，保持首次出现顺序。"],"bullets":[],"code":[["function flatten(arr, depth = Infinity) {","  return depth > 0 ? arr.reduce((acc, v) =>","    acc.concat(Array.isArray(v) ? flatten(v, depth - 1) : v), []) : arr.slice()","}","const unique = arr => [...new Set(arr)]","function uniqueBy(arr, key) {","  const seen = new Map(), res = []","  for (const x of arr) {","    const k = typeof key === 'function' ? key(x) : x[key]","    if (!seen.has(k)) { seen.set(k, true); res.push(x) }","  }","  return res","}"]],"note":"","text":"数组扁平化 flatten、去重 unique、按字段去重。 flatten 用 reduce + concat + 递归并控制 depth；注意 depth 为 0 时返回浅拷贝、flat 会跳过稀疏数组空位。去重优先 [...new Set(arr)]（NaN 也等价，基于 SameValueZero）；对象数组用 Map 按 key 去重，保持首次出现顺序。 function flatten(arr, depth = Infinity) {   return depth > 0 ? arr.reduce((acc, v) =>     acc.concat(Array.isArray(v) ? flatten(v, depth - 1) : v), []) : arr.slice() } const unique = arr => [...new Set(arr)] function uniqueBy(arr, key) {   const seen = new Map(), res = []   for (const x of arr) {     const k = typeof key === 'function' ? key(x) : x[key]     if (!seen.has(k)) { seen.set(k, true); res.push(x) }   }   return res }"},{"id":210,"num":"Q210","tag":"手写","title":"实现 LRU 缓存（get / put 都是 O(1)）。","answers":["利用 Map 的插入顺序：命中后先 delete 再 set，把它移到队尾（最近使用）；put 超容量时删 `map.keys().next().value`（最久未使用）。复杂度 O(1)，空间 O(capacity)。","追问：为什么不用普通对象？需要有序且频繁删除头部，Map 更合适；Vue 的 keep-alive 用 keys 数组 + cache 对象实现同样的 LRU 思想。"],"bullets":[],"code":[["class LRU {","  constructor(cap) { this.cap = cap; this.map = new Map() }","  get(key) {","    if (!this.map.has(key)) return -1","    const v = this.map.get(key)","    this.map.delete(key); this.map.set(key, v)","    return v","  }","  put(key, value) {","    if (this.map.has(key)) this.map.delete(key)","    this.map.set(key, value)","    if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value)","  }","}"]],"note":"","text":"实现 LRU 缓存（get / put 都是 O(1)）。 利用 Map 的插入顺序：命中后先 delete 再 set，把它移到队尾（最近使用）；put 超容量时删 `map.keys().next().value`（最久未使用）。复杂度 O(1)，空间 O(capacity)。 追问：为什么不用普通对象？需要有序且频繁删除头部，Map 更合适；Vue 的 keep-alive 用 keys 数组 + cache 对象实现同样的 LRU 思想。 class LRU {   constructor(cap) { this.cap = cap; this.map = new Map() }   get(key) {     if (!this.map.has(key)) return -1     const v = this.map.get(key)     this.map.delete(key); this.map.set(key, v)     return v   }   put(key, value) {     if (this.map.has(key)) this.map.delete(key)     this.map.set(key, value)     if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value)   } }"},{"id":211,"num":"Q211","tag":"手写","title":"实现发布订阅 EventEmitter（on / once / off / emit / clear）。","answers":["要点：用 Map<string, Function[]> 存事件；once 用包装函数并在执行时自动解绑；emit 时先拷贝一份数组再遍历（防止回调里增删监听器影响本次遍历）；emit 的 this 指向 emitter；off 要能移除 once 包装后的引用（可返回 unsubscribe，或保存 origin 映射）。"],"bullets":[],"code":[["class EventEmitter {","  constructor() { this.events = new Map() }","  on(name, fn) {","    const list = this.events.get(name) || []","    list.push(fn); this.events.set(name, list)","    return () => this.off(name, fn)","  }","  once(name, fn) {","    const wrap = (...args) => { this.off(name, wrap); fn.apply(this, args) }","    wrap.origin = fn","    return this.on(name, wrap)","  }","  off(name, fn) {","    const list = this.events.get(name) || []","    this.events.set(name, list.filter(f => f !== fn && f.origin !== fn))","  }","  emit(name, ...args) {","    ;[...(this.events.get(name) || [])].forEach(fn => fn.apply(this, args))","  }","  clear(name) { name ? this.events.delete(name) : this.events.clear() }","}"]],"note":"","text":"实现发布订阅 EventEmitter（on / once / off / emit / clear）。 要点：用 Map<string, Function[]> 存事件；once 用包装函数并在执行时自动解绑；emit 时先拷贝一份数组再遍历（防止回调里增删监听器影响本次遍历）；emit 的 this 指向 emitter；off 要能移除 once 包装后的引用（可返回 unsubscribe，或保存 origin 映射）。 class EventEmitter {   constructor() { this.events = new Map() }   on(name, fn) {     const list = this.events.get(name) || []     list.push(fn); this.events.set(name, list)     return () => this.off(name, fn)   }   once(name, fn) {     const wrap
