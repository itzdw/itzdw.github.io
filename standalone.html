  <title>前端八股文 · 一周速背工作台（单文件版）</title>
  <style>
/* 前端八股文工作台 · 移动端优先样式 */
:root {
  --fs: 1;
  --bg: #f2f6fb;
  --surface: #ffffff;
  --surface-2: #eaf1f9;
  --surface-3: #e2ebf5;
  --text: #18253a;
  --text-2: #5c6d84;
  --text-3: #8595aa;
  --border: #dce6f1;
  --primary: #1f4e79;
  --primary-2: #3b82f6;
  --primary-soft: #e7f0fb;
  --success: #159a5b;
  --success-soft: #e3f6ec;
  --warn: #d98218;
  --warn-soft: #fff2df;
  --danger: #d64545;
  --danger-soft: #fdeaea;
  --code-bg: #101d30;
  --code-text: #dbe7f6;
  --shadow: 0 4px 18px rgba(24, 52, 90, .08);
  --shadow-lg: 0 12px 32px rgba(24, 52, 90, .16);
  --radius: 16px;
  --radius-sm: 10px;
  --maxw: 540px;
}

html[data-theme="dark"] {
  --bg: #0d1726;
  --surface: #152234;
  --surface-2: #1b2c42;
  --surface-3: #243850;
  --text: #e8f0fa;
  --text-2: #9fb2c9;
  --text-3: #70859e;
  --border: #2a3d56;
  --primary: #6aa9f0;
  --primary-2: #8fc0ff;
  --primary-soft: #1c3552;
  --success: #4bd08d;
  --success-soft: #173b2c;
  --warn: #f0b256;
  --warn-soft: #3a2c17;
  --danger: #f07a7a;
  --danger-soft: #3b2024;
  --shadow: 0 4px 18px rgba(0, 0, 0, .3);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--fs, 1)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--primary-2); text-decoration: none; }
svg.ic { width: 1.25rem; height: 1.25rem; flex: none; display: block; }
.hidden { display: none !important; }

/* ---------- 布局 ---------- */
.app-shell {
  position: relative;
  width: 100%;
  max-width: var(--maxw);
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  box-shadow: 0 0 60px rgba(20, 45, 80, .12);
}
@media (min-width: 600px) {
  body { background: #dfe8f2; }
  html[data-theme="dark"] body { background: #060d18; }
  .app-shell { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
}
.app-header {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: .6rem;
  padding: calc(env(safe-area-inset-top) + .7rem) 1rem .7rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.app-header .h-title { font-size: 1.05rem; font-weight: 700; letter-spacing: .01em; flex: 1; min-width: 0; }
.app-header .h-title small { display: block; font-size: .7rem; font-weight: 500; color: var(--text-3); margin-top: .05rem; }
.app-header .h-actions { display: flex; gap: .35rem; }
.app-main {
  padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom));
  outline: none;
  min-height: 60vh;
}
.page { animation: fadeUp .28s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page { animation: none; } }

/* ---------- 底部 Tab ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  z-index: 40; width: 100%; max-width: var(--maxw);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .15rem; padding: .5rem 0 .45rem; min-height: 3.4rem;
  color: var(--text-3); font-size: .68rem; font-weight: 600;
  transition: color .18s;
}
.tab .ic { width: 1.35rem; height: 1.35rem; }
.tab.active { color: var(--primary); }
html[data-theme="dark"] .tab.active { color: var(--primary-2); }
.tab:active { opacity: .7; }
.tab-fab {
  width: 2.6rem; height: 2.6rem; margin-top: -.9rem;
  display: grid; place-items: center; border-radius: 50%;
  background: linear-gradient(145deg, var(--primary), var(--primary-2));
  color: #fff; box-shadow: 0 6px 16px rgba(31, 78, 121, .4);
}
.tab-fab .ic { width: 1.35rem; height: 1.35rem; }
.tab-primary span:last-child { color: var(--primary); font-weight: 700; }

/* ---------- 通用组件 ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1rem; margin-bottom: .85rem;
}
.card.tight { padding: .8rem .9rem; }
.card.flat { box-shadow: none; }
.hero-card {
  background: linear-gradient(140deg, #1f4e79, #2f74bd 62%, #4b9be6);
  color: #fff; border: 0; position: relative; overflow: hidden;
  padding: 1.15rem; border-radius: 20px; box-shadow: 0 10px 26px rgba(31, 78, 121, .28);
}
.hero-card::after {
  content: ''; position: absolute; right: -3rem; top: -3.5rem;
  width: 10rem; height: 10rem; border-radius: 50%;
  background: rgba(255, 255, 255, .09);
}
.hero-card .hero-kicker { font-size: .72rem; opacity: .82; letter-spacing: .08em; }
.hero-card .hero-title { font-size: 1.35rem; font-weight: 800; margin: .3rem 0 .2rem; }
.hero-card .hero-sub { font-size: .8rem; opacity: .88; }
.hero-card .hero-progress { margin-top: .9rem; }
.hero-card .hero-btn { margin-top: .95rem; width: 100%; }

.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 1.15rem .15rem .55rem; gap: .5rem;
}
.section-head h2 { font-size: .95rem; margin: 0; font-weight: 700; }
.section-head .link { font-size: .75rem; color: var(--primary-2); display: flex; align-items: center; gap: .15rem; }
.section-head .link .ic { width: .9rem; height: .9rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.75rem; padding: .55rem 1rem; border-radius: 12px;
  font-size: .85rem; font-weight: 700; background: var(--surface-2);
  color: var(--text); border: 1px solid var(--border);
  transition: transform .12s, filter .12s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(145deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-sm { min-height: 2.2rem; padding: .35rem .75rem; font-size: .75rem; border-radius: 10px; }
.btn-block { width: 100%; }
.btn .ic { width: 1rem; height: 1rem; }
.btn-light { background: rgba(255, 255, 255, .18); color: #fff; border: 1px solid rgba(255, 255, 255, .32); }
.icon-btn {
  width: 2.35rem; height: 2.35rem; display: grid; place-items: center;
  border-radius: 10px; color: var(--text-2); background: var(--surface-2);
  border: 1px solid var(--border); flex: none;
}
.icon-btn:active { transform: scale(.93); }
.icon-btn.on { color: var(--warn); }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: .75rem .5rem; text-align: center;
}
.stat-num { font-size: 1.35rem; font-weight: 800; line-height: 1.2; color: var(--primary); }
html[data-theme="dark"] .stat-num { color: var(--primary-2); }
.stat-label { font-size: .68rem; color: var(--text-3); margin-top: .15rem; }

.progress { height: .5rem; background: rgba(255, 255, 255, .25); border-radius: 99px; overflow: hidden; }
.progress.solid { background: var(--surface-3); }
.progress-fill { height: 100%; background: #fff; border-radius: 99px; transition: width .5s ease; }
.progress.solid .progress-fill { background: linear-gradient(90deg, var(--primary), var(--primary-2)); }
.progress-caption { display: flex; justify-content: space-between; font-size: .7rem; opacity: .85; margin-top: .35rem; }

.chip-row { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .3rem .65rem; border-radius: 99px; font-size: .72rem; font-weight: 600;
  background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
}
.chip.active { background: var(--primary); color: #fff; border-color: transparent; }
.chip .ic { width: .8rem; height: .8rem; }
.tag {
  display: inline-block; padding: .12rem .45rem; border-radius: 6px;
  font-size: .65rem; font-weight: 700; background: var(--primary-soft);
  color: var(--primary); white-space: nowrap;
}
html[data-theme="dark"] .tag { color: var(--primary-2); }
.tag.tag-green { background: var(--success-soft); color: var(--success); }
.tag.tag-orange { background: var(--warn-soft); color: var(--warn); }
.tag.tag-red { background: var(--danger-soft); color: var(--danger); }

/* ---------- 搜索 / 分段控件 ---------- */
.search-box {
  display: flex; align-items: center; gap: .5rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: .15rem .7rem; min-height: 2.7rem;
  box-shadow: var(--shadow);
}
.search-box .ic { color: var(--text-3); width: 1.05rem; height: 1.05rem; }
.search-box input { flex: 1; border: 0; outline: 0; background: transparent; font-size: .85rem; min-width: 0; }
.search-box input::placeholder { color: var(--text-3); }
.seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: .2rem; gap: .15rem; }
.seg button { flex: 1; min-height: 2.2rem; border-radius: 9px; font-size: .75rem; font-weight: 600; color: var(--text-2); }
.seg button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
html[data-theme="dark"] .seg button.active { color: var(--primary-2); }

/* ---------- 列表 ---------- */
.day-list, .q-list, .row-list { display: flex; flex-direction: column; gap: .55rem; }
.day-item {
  display: flex; align-items: center; gap: .8rem; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: .8rem .9rem; box-shadow: var(--shadow);
}
.day-item:active { transform: scale(.99); }
.day-num {
  width: 2.5rem; height: 2.5rem; flex: none; border-radius: 12px;
  display: grid; place-items: center; font-weight: 800; font-size: .95rem;
  background: var(--primary-soft); color: var(--primary);
}
html[data-theme="dark"] .day-num { color: var(--primary-2); }
.day-item.done .day-num { background: var(--success-soft); color: var(--success); }
.day-info { flex: 1; min-width: 0; }
.day-info strong { display: block; font-size: .87rem; }
.day-info small { display: block; font-size: .7rem; color: var(--text-3); margin-top: .1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-item .ic { color: var(--text-3); width: 1rem; height: 1rem; }
.mini-bar { height: .28rem; background: var(--surface-3); border-radius: 99px; margin-top: .4rem; overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--success); border-radius: 99px; }

.q-item {
  display: flex; gap: .7rem; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; padding: .75rem .85rem;
}
.q-item:active { transform: scale(.99); }
.q-num { font-size: .68rem; font-weight: 800; color: var(--text-3); padding-top: .15rem; flex: none; font-variant-numeric: tabular-nums; }
.q-body { flex: 1; min-width: 0; }
.q-title { font-size: .83rem; font-weight: 600; line-height: 1.5; word-break: break-word; }
.q-meta { display: flex; align-items: center; gap: .4rem; margin-top: .4rem; flex-wrap: wrap; }
.q-item .ic { color: var(--text-3); width: .95rem; height: .95rem; align-self: center; }
.dot { width: .4rem; height: .4rem; border-radius: 50%; flex: none; }
.dot.g3 { background: var(--success); } .dot.g2 { background: var(--warn); } .dot.g1 { background: var(--danger); } .dot.g0 { background: var(--text-3); }

.row-item {
  display: flex; align-items: center; gap: .7rem; width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; padding: .8rem .9rem; text-align: left;
}
.row-item .ic.lead { color: var(--primary); width: 1.15rem; height: 1.15rem; }
html[data-theme="dark"] .row-item .ic.lead { color: var(--primary-2); }
.row-item .r-body { flex: 1; min-width: 0; }
.row-item .r-body strong { font-size: .85rem; display: block; }
.row-item .r-body small { font-size: .7rem; color: var(--text-3); }
.row-item .r-tail { font-size: .75rem; color: var(--text-3); display: flex; align-items: center; gap: .3rem; }

/* ---------- 题目详情 / 答案 ---------- */
.q-head { margin-bottom: .85rem; }
.q-head .q-line { display: flex; align-items: flex-start; gap: .5rem; }
.q-head h1 { font-size: 1.08rem; line-height: 1.5; margin: .35rem 0 0; word-break: break-word; }
.q-head .q-sub { display: flex; gap: .45rem; align-items: center; margin-top: .55rem; flex-wrap: wrap; font-size: .7rem; color: var(--text-3); }
.answer-block { margin-top: .6rem; }
.answer-text { font-size: .86rem; line-height: 1.72; margin: 0 0 .55rem; word-break: break-word; }
.answer-text:last-child { margin-bottom: 0; }
.answer-text b { color: var(--primary); }
html[data-theme="dark"] .answer-text b { color: var(--primary-2); }
.bullet-list { margin: .2rem 0 .6rem; padding: 0; list-style: none; }
.bullet-list li { position: relative; padding-left: 1rem; font-size: .83rem; line-height: 1.65; margin-bottom: .3rem; }
.bullet-list li::before { content: ''; position: absolute; left: .1rem; top: .62rem; width: .32rem; height: .32rem; border-radius: 50%; background: var(--primary-2); }
.note-box {
  display: flex; gap: .5rem; background: var(--warn-soft); color: var(--text);
  border-left: 3px solid var(--warn); border-radius: 8px;
  padding: .65rem .75rem; font-size: .8rem; line-height: 1.6; margin: .65rem 0;
}
.note-box .ic { width: 1rem; height: 1rem; color: var(--warn); margin-top: .2rem; }
.note-box strong { color: var(--warn); }

.code-block { margin: .7rem 0; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid #22344d; }
.code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .4rem .65rem; background: rgba(255, 255, 255, .05);
  color: #8fa9c7; font-size: .68rem; font-weight: 600;
}
.code-head .code-copy { display: flex; align-items: center; gap: .25rem; color: #9ec5ef; font-size: .68rem; padding: .2rem .4rem; border-radius: 6px; }
.code-head .code-copy .ic { width: .85rem; height: .85rem; }
.code-head .code-copy:active { background: rgba(255, 255, 255, .1); }
.code-body {
  margin: 0; padding: .7rem .8rem; overflow-x: auto; -webkit-overflow-scrolling: touch;
  color: var(--code-text); font-size: .73rem; line-height: 1.6;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  white-space: pre; tab-size: 2;
}
.code-body code { font: inherit; }

.reveal-mask {
  display: grid; place-items: center; gap: .5rem; padding: 1.6rem 1rem;
  background: var(--surface-2); border: 1px dashed var(--border);
  border-radius: 12px; color: var(--text-3); font-size: .8rem; text-align: center;
}
.reveal-mask .ic { width: 1.5rem; height: 1.5rem; }

.mastery-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .9rem; }
.grade-btn {
  min-height: 3.2rem; border-radius: 12px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: .1rem;
  font-size: .78rem; font-weight: 700; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
}
.grade-btn small { font-size: .62rem; font-weight: 500; opacity: .75; }
.grade-btn:active { transform: scale(.96); }
.grade-btn.g1 { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.grade-btn.g2 { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.grade-btn.g3 { background: var(--success-soft); color: var(--success); border-color: transparent; }
.grade-btn.current { outline: 2px solid currentColor; outline-offset: 2px; }

.q-nav { display: flex; gap: .5rem; margin-top: 1rem; }
.q-nav .btn { flex: 1; }

/* ---------- 翻卡自测 ---------- */
.flash-wrap { perspective: 1200px; }
.flash-card {
  position: relative; min-height: 15rem; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); padding: 1.2rem;
  display: flex; flex-direction: column;
  transition: transform .35s ease;
}
.flash-card.revealed { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(.98); } 60% { transform: scale(1.01); } 100% { transform: none; } }
.flash-top { display: flex; justify-content: space-between; align-items: center; font-size: .72rem; color: var(--text-3); }
.flash-title { font-size: 1.02rem; font-weight: 700; line-height: 1.6; margin: 1rem 0 .5rem; word-break: break-word; }
.flash-answer { margin-top: .8rem; border-top: 1px dashed var(--border); padding-top: .8rem; animation: fadeUp .3s ease both; }
.flash-actions { display: flex; gap: .5rem; margin-top: 1rem; }
.flash-actions .btn { flex: 1; }
.review-footer { display: flex; align-items: center; gap: .6rem; margin-top: 1rem; font-size: .72rem; color: var(--text-3); }
.review-footer .progress { flex: 1; }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--border); }
.data-table { border-collapse: collapse; width: 100%; min-width: 100%; font-size: .73rem; }
.data-table th, .data-table td { padding: .55rem .6rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
.data-table th { background: var(--primary); color: #fff; font-weight: 700; white-space: nowrap; position: sticky; top: 0; }
.data-table tr:nth-child(even) td { background: var(--surface-2); }
.data-table tr:last-child td { border-bottom: 0; }
.data-table td:first-child { font-weight: 700; white-space: nowrap; }

/* ---------- 设置 ---------- */
.setting-group { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.setting-row { display: flex; align-items: center; gap: .7rem; padding: .8rem .9rem; border-bottom: 1px solid var(--border); min-height: 3.2rem; }
.setting-row:last-child { border-bottom: 0; }
.setting-row .ic { color: var(--primary); width: 1.1rem; height: 1.1rem; }
html[data-theme="dark"] .setting-row .ic { color: var(--primary-2); }
.setting-row .s-body { flex: 1; min-width: 0; }
.setting-row .s-body strong { font-size: .84rem; display: block; }
.setting-row .s-body small { font-size: .7rem; color: var(--text-3); display: block; }
.switch { width: 2.8rem; height: 1.6rem; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: .18rem; left: .18rem; width: 1.24rem; height: 1.24rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch.on { background: var(--primary-2); }
.switch.on i { transform: translateX(1.2rem); }

.empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-3); }
.empty .ic { width: 2.4rem; height: 2.4rem; margin: 0 auto .6rem; opacity: .55; }
.empty p { font-size: .82rem; margin: 0; }
.tip-line { font-size: .72rem; color: var(--text-3); line-height: 1.6; margin: .6rem .15rem 0; }

/* ---------- 横幅 / Toast / 弹窗 ---------- */
.banner {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  bottom: calc(4.6rem + env(safe-area-inset-bottom));
  width: calc(100% - 1.5rem); max-width: calc(var(--maxw) - 1.5rem);
  display: flex; align-items: center; gap: .6rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: .7rem .75rem; box-shadow: var(--shadow-lg);
  animation: fadeUp .3s ease both;
}
.banner-icon { width: 2.2rem; height: 2.2rem; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.banner-body { flex: 1; min-width: 0; }
.banner-body strong { font-size: .82rem; display: block; }
.banner-body p { font-size: .7rem; color: var(--text-3); margin: .1rem 0 0; line-height: 1.45; }
.banner-update { bottom: calc(4.6rem + env(safe-area-inset-bottom)); }
.banner-update .banner-body { padding-left: .3rem; }
.toast {
  position: fixed; z-index: 80; left: 50%; transform: translate(-50%, 1rem);
  bottom: calc(5rem + env(safe-area-inset-bottom));
  background: rgba(20, 32, 50, .94); color: #fff; font-size: .8rem;
  padding: .6rem 1rem; border-radius: 99px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; max-width: 85%; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90; background: rgba(8, 18, 32, .55);
  display: grid; place-items: center; padding: 1.2rem; animation: fadeUp .2s ease;
}
.modal {
  width: 100%; max-width: 22rem; background: var(--surface);
  border-radius: 18px; padding: 1.2rem; box-shadow: var(--shadow-lg);
}
.modal h3 { margin: 0 0 .5rem; font-size: 1rem; }
.modal p { font-size: .82rem; color: var(--text-2); line-height: 1.65; margin: 0 0 .9rem; }
.modal .modal-actions { display: flex; gap: .5rem; }
.modal .modal-actions .btn { flex: 1; }
.modal ol { font-size: .8rem; color: var(--text-2); line-height: 1.8; padding-left: 1.2rem; margin: 0 0 1rem; }

</style>

<script>
/**
 * 前端八股文工作台 · 客户端状态持久化层
 *
 * 设计原则（遵循 web-client-state-persistence 的 Core Pattern）：
 * 1. 存储后端与业务状态解耦：现在用 localStorage，未来可替换为 IndexedDB / 服务端 DB。
 * 2. 所有接口异步（Promise），业务代码无需感知后端是同步还是异步。
 * 3. 按命名 scope 隔离：progress / prefs / session / review，避免互相污染。
 * 4. save 采用 patch 合并语义，字段设为 undefined 表示删除该字段。
 *
 * 迁移到数据库：实现 StorageBackend 的 get/set/remove/keys，注入 StateStore 即可，
 * 例如 new BaguwenStateStore(new ServerDBBackend({ endpoint: '/api/state' }))。
 */
(function (root) {
  'use strict';

  const PREFIX = 'baguwen:v1:';

  class StorageBackend {
    async get(scope) { throw new Error('get() not implemented'); }
    async set(scope, data) { throw new Error('set() not implemented'); }
    async remove(scope) { throw new Error('remove() not implemented'); }
    async keys() { return []; }
  }

  class LocalStorageBackend extends StorageBackend {
    async get(scope) {
      try {
        const raw = root.localStorage.getItem(scope);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.warn('[StateStore] get failed', e);
        return null;
      }
    }
    async set(scope, data) {
      try {
        root.localStorage.setItem(scope, JSON.stringify(data));
        return true;
      } catch (e) {
        console.warn('[StateStore] set failed', e);
        return false;
      }
    }
    async remove(scope) {
      try { root.localStorage.removeItem(scope); return true; }
      catch (e) { console.warn('[StateStore] remove failed', e); return false; }
    }
    async keys() {
      try {
        const out = [];
        for (let i = 0; i < root.localStorage.length; i++) {
          const k = root.localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) out.push(k);
        }
        return out;
      } catch (e) { return []; }
    }
  }

  /** 隐私模式 / localStorage 被禁用时的内存降级，保证应用不崩。 */
  class MemoryBackend extends StorageBackend {
    constructor() { super(); this.map = new Map(); }
    async get(scope) { return this.map.has(scope) ? this.map.get(scope) : null; }
    async set(scope, data) { this.map.set(scope, data); return true; }
    async remove(scope) { this.map.delete(scope); return true; }
    async keys() { return Array.from(this.map.keys()); }
  }

  function pickBackend() {
    try {
      const probe = PREFIX + '__probe__';
      root.localStorage.setItem(probe, '1');
      root.localStorage.removeItem(probe);
      return new LocalStorageBackend();
    } catch (e) {
      console.warn('[StateStore] localStorage unavailable, fallback to memory');
      return new MemoryBackend();
    }
  }

  class StateStore {
    constructor(backend) {
      this.backend = backend || pickBackend();
    }
    key(scope) { return PREFIX + scope; }
    async load(scope) {
      return await this.backend.get(this.key(scope));
    }
    async save(scope, patch) {
      const key = this.key(scope);
      const existing = (await this.backend.get(key)) || {};
      const next = Object.assign({}, existing, patch);
      Object.keys(next).forEach(k => next[k] === undefined && delete next[k]);
      await this.backend.set(key, next);
      return next;
    }
    async remove(scope) {
      return await this.backend.remove(this.key(scope));
    }
    /** 清空本应用的全部状态（保留其它站点数据）。 */
    async clear() {
      const keys = await this.backend.keys();
      for (const k of keys) await this.backend.remove(k);
      return true;
    }
    /** 导出全部状态，用于备份 / 跨设备迁移。 */
    async exportAll() {
      const keys = await this.backend.keys();
      const out = {};
      for (const k of keys) out[k] = await this.backend.get(k);
      return { version: 1, exportedAt: new Date().toISOString(), data: out };
    }
    async importAll(payload) {
      if (!payload || !payload.data) throw new Error('invalid backup');
      for (const [k, v] of Object.entries(payload.data)) {
        if (k.indexOf(PREFIX) === 0) await this.backend.set(k, v);
      }
      return true;
    }
  }

  root.BaguwenStorageBackend = StorageBackend;
  root.BaguwenLocalStorageBackend = LocalStorageBackend;
  root.BaguwenMemoryBackend = MemoryBackend;
  root.BaguwenStateStore = StateStore;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

53-1）的整数运算，如大额金额、雪花 ID。"},{"id":2,"num":"Q002","tag":"基础","title":"typeof 能判断哪些类型？为什么 typeof null === 'object'？","answers":["typeof 返回 'undefined'、'boolean'、'number'、'string'、'symbol'、'bigint'、'function'、'object' 八种字符串。数组、普通对象、null 都返回 'object'，无法细分。","typeof null === 'object' 是 JS 最初实现的历史 bug：值用低位类型标签存储，对象的标签是 000，而 null 的机器码全为 0，被误判为对象；为保持向后兼容一直没有修复。","typeof 对未声明的变量也返回 'undefined'（不报错），这是它唯一不会抛 ReferenceError 的场景；但对 let/const 暂时性死区中的变量仍会抛错。"],"bullets":[],"code":[],"note":"","text":"typeof 能判断哪些类型？为什么 typeof null === 'object'？ typeof 返回 'undefined'、'boolean'、'number'、'string'、'symbol'、'bigint'、'function'、'object' 八种字符串。数组、普通对象、null 都返回 'object'，无法细分。 typeof null === 'object' 是 JS 最初实现的历史 bug：值用低位类型标签存储，对象的标签是 000，而 null 的机器码全为 0，被误判为对象；为保持向后兼容一直没有修复。 typeof 对未声明的变量也返回 'undefined'（不报错），这是它唯一不会抛 ReferenceError 的场景；但对 let/const 暂时性死区中的变量仍会抛错。"},{"id":3,"num":"Q003","tag":"对比","title":"判断数据类型的几种方式及各自缺陷？","answers":["typeof：适合原始类型（除 null）与函数判断，无法区分数组、对象、null。","instanceof：沿原型链查找，适合判断自定义类实例；无法判断原始类型，跨 iframe / 多 realm 会失效（不同全局对象的原型不共享）。","Object.prototype.toString.call(x)：最通用，返回 '[object Array]'、'[object Null]' 等；注意 Symbol.toStringTag 可被改写，需谨慎。","Array.isArray(x)：判断数组最可靠，跨 realm 依然有效；constructor 判断不可靠（可被改写、null 无 constructor）。"],"bullets":[],"code":[["Object.prototype.toString.call(null)  // '[object Null]'","Object.prototype.toString.call([])    // '[object Array]'","Object.prototype.toString.call(()=>{}) // '[object Function]'"]],"note":"","text":"判断数据类型的几种方式及各自缺陷？ typeof：适合原始类型（除 null）与函数判断，无法区分数组、对象、null。 instanceof：沿原型链查找，适合判断自定义类实例；无法判断原始类型，跨 iframe / 多 realm 会失效（不同全局对象的原型不共享）。 Object.prototype.toString.call(x)：最通用，返回 '[object Array]'、'[object Null]' 等；注意 Symbol.toStringTag 可被改写，需谨慎。 Array.isArray(x)：判断数组最可靠，跨 realm 依然有效；constructor 判断不可靠（可被改写、null 无 constructor）。 Object.prototype.toString.call(null)  // '[object Null]' Object.prototype.toString.call([])    // '[object Array]' Object.prototype.toString.call(()=>{}) // '[object Function]'"},{"id":4,"num":"Q004","tag":"对比","title":"null 与 undefined 的区别？","answers":["undefined 表示「声明了但未赋值」，是变量未初始化、函数无返回值、对象属性不存在、函数形参未传时的默认值；null 表示「有意为空」，是一个需要显式赋值的对象空指针。","typeof undefined === 'undefined'，typeof null === 'object'；Number(undefined) 是 NaN，Number(null) 是 0；== 下两者相等（undefined == null 为 true），=== 下不等。","JSON.stringify 会忽略值为 undefined 的属性，但保留 null；undefined 不是合法 JSON 值。"],"bullets":[],"code":[],"note":"","text":"null 与 undefined 的区别？ undefined 表示「声明了但未赋值」，是变量未初始化、函数无返回值、对象属性不存在、函数形参未传时的默认值；null 表示「有意为空」，是一个需要显式赋值的对象空指针。 typeof undefined === 'undefined'，typeof null === 'object'；Number(undefined) 是 NaN，Number(null) 是 0；== 下两者相等（undefined == null 为 true），=== 下不等。 JSON.stringify 会忽略值为 undefined 的属性，但保留 null；undefined 不是合法 JSON 值。"},{"id":5,"num":"Q005","tag":"原理","title":"堆和栈有什么区别？闭包变量存在哪里？","answers":["栈内存连续、由系统自动分配释放、容量小、访问快，存放函数调用帧、局部变量与原始值；堆内存不连续、容量大、由垃圾回收器管理，存放对象等引用类型的值。","面试标准答法：原始类型存栈、引用类型的「地址」存栈而「值」存堆。补充加分点：V8 中原始类型也常被编码进堆或直接放寄存器，闭包捕获的变量会被提升到堆中的 Context 对象，因此闭包变量不会因为栈帧销毁而消失。"],"bullets":[],"code":[],"note":"","text":"堆和栈有什么区别？闭包变量存在哪里？ 栈内存连续、由系统自动分配释放、容量小、访问快，存放函数调用帧、局部变量与原始值；堆内存不连续、容量大、由垃圾回收器管理，存放对象等引用类型的值。 面试标准答法：原始类型存栈、引用类型的「地址」存栈而「值」存堆。补充加分点：V8 中原始类型也常被编码进堆或直接放寄存器，闭包捕获的变量会被提升到堆中的 Context 对象，因此闭包变量不会因为栈帧销毁而消失。"},{"id":6,"num":"Q006","tag":"高频","title":"为什么 0.1 + 0.2 !== 0.3？怎么解决？","answers":["JS 使用 IEEE 754 双精度浮点数（64 位：1 符号位 + 11 指数位 + 52 尾数位），0.1、0.2 的二进制是无限循环小数，存储时被截断产生精度误差，相加后误差放大，结果约为 0.30000000000000004。","解决办法：① 用 Number.EPSILON 比较：Math.abs(a-b) < Number.EPSILON；② 先放大为整数再运算后缩小，如 (0.1*100 + 0.2*100)/100；③ 用 toFixed(n) 后转 Number（注意四舍五入误差）；④ 金额计算用 BigInt 或 decimal.js / big.js 等库，不要直接用浮点。"],"bullets":[],"code":[["Number.EPSILON // 2.220446049250313e-16"]],"note":"追问：Number.MAX_SAFE_INTEGER 是 2^53-1，为什么？因为 52 位尾数加隐含的 1 位共 53 位有效二进制位。","text":"为什么 0.1 + 0.2 !== 0.3？怎么解决？ JS 使用 IEEE 754 双精度浮点数（64 位：1 符号位 + 11 指数位 + 52 尾数位），0.1、0.2 的二进制是无限循环小数，存储时被截断产生精度误差，相加后误差放大，结果约为 0.30000000000000004。 解决办法：① 用 Number.EPSILON 比较：Math.abs(a-b) < Number.EPSILON；② 先放大为整数再运算后缩小，如 (0.1*100 + 0.2*100)/100；③ 用 toFixed(n) 后转 Number（注意四舍五入误差）；④ 金额计算用 BigInt 或 decimal.js / big.js 等库，不要直接用浮点。 Number.EPSILON // 2.220446049250313e-16 追问：Number.MAX_SAFE_INTEGER 是 2^53-1，为什么？因为 52 位尾数加隐含的 1 位共 53 位有效二进制位。"},{"id":7,"num":"Q007","tag":"概念","title":"NaN 是什么？isNaN 与 Number.isNaN 的区别？","answers":["NaN 表示「不是一个数」，是全局唯一不等于自身的值（NaN !== NaN），typeof NaN === 'number'。它来自 0/0、parseInt 失败、无效数学运算等。","全局 isNaN 会先把参数强制转成数字再判断，因此 isNaN('abc') 为 true、isNaN([]) 为 false；Number.isNaN 不做类型转换，只有值本身是 NaN 才返回 true，更可靠。","判断 NaN 推荐 Number.isNaN(x) 或 x !== x；Object.is(NaN, NaN) 为 true。"],"bullets":[],"code":[],"note":"","text":"NaN 是什么？isNaN 与 Number.isNaN 的区别？ NaN 表示「不是一个数」，是全局唯一不等于自身的值（NaN !== NaN），typeof NaN === 'number'。它来自 0/0、parseInt 失败、无效数学运算等。 全局 isNaN 会先把参数强制转成数字再判断，因此 isNaN('abc') 为 true、isNaN([]) 为 false；Number.isNaN 不做类型转换，只有值本身是 NaN 才返回 true，更可靠。 判断 NaN 推荐 Number.isNaN(x) 或 x !== x；Object.is(NaN, NaN) 为 true。"},{"id":8,"num":"Q008","tag":"概念","title":"如何获取「安全的」 undefined？void 0 是什么？","answers":["void 是一元运算符，会对表达式求值但始终返回 undefined，void 0 是最常见的写法。因为在非严格模式下局部作用域可以声明一个叫 undefined 的变量并改写它（全局 undefined 不可写但可被遮蔽），用 void 0 可以保证拿到真正的 undefined。","现代代码中直接用 undefined 即可，但压缩器（如 Terser）会把 undefined 压缩成 void 0，因为更短。"],"bullets":[],"code":[],"note":"","text":"如何获取「安全的」 undefined？void 0 是什么？ void 是一元运算符，会对表达式求值但始终返回 undefined，void 0 是最常见的写法。因为在非严格模式下局部作用域可以声明一个叫 undefined 的变量并改写它（全局 undefined 不可写但可被遮蔽），用 void 0 可以保证拿到真正的 undefined。 现代代码中直接用 undefined 即可，但压缩器（如 Terser）会把 undefined 压缩成 void 0，因为更短。"},{"id":9,"num":"Q009","tag":"高频","title":"哪些值是假值？== 的隐式转换规则是什么？","answers":["假值共 8 个（ES2020 起）：false、0、-0、0n、''、null、undefined、NaN；其余对象（含 []、{}、new Boolean(false)）都是真值。","== 规则：① 类型相同按 === 比较；② null 与 undefined 相等且不与任何其它值相等；③ String 与 Number 比较，字符串转 Number；④ 有 Boolean 则布尔转 Number；⑤ 对象与原始值比较，对象先 ToPrimitive（先 valueOf 后 toString，可用 Symbol.toPrimitive 覆盖）；⑥ NaN 与任何值都不相等。","工程建议：一律用 ===，仅在 `x == null` 这种同时判 null/undefined 的惯用写法中可用 ==。"],"bullets":[],"code":[],"note":"","text":"哪些值是假值？== 的隐式转换规则是什么？ 假值共 8 个（ES2020 起）：false、0、-0、0n、''、null、undefined、NaN；其余对象（含 []、{}、new Boolean(false)）都是真值。 == 规则：① 类型相同按 === 比较；② null 与 undefined 相等且不与任何其它值相等；③ String 与 Number 比较，字符串转 Number；④ 有 Boolean 则布尔转 Number；⑤ 对象与原始值比较，对象先 ToPrimitive（先 valueOf 后 toString，可用 Symbol.toPrimitive 覆盖）；⑥ NaN 与任何值都不相等。 工程建议：一律用 ===，仅在 `x == null` 这种同时判 null/undefined 的惯用写法中可用 ==。"},{"id":10,"num":"Q010","tag":"输出题","title":"[] == ![] 为什么是 true？","answers":["拆解：![] 先把 [] 转布尔（对象恒为 true）再取反得到 false；于是表达式变成 [] == false；有布尔则转数字，false → 0；[] == 0 时对象 ToPrimitive，[].valueOf() 返回自身不是原始值，继续 [].toString() 得到 ''；'' == 0 时字符串转数字为 0；0 == 0 为 true。"],"bullets":[],"code":[],"note":"延伸：{} == !{} 为 false，因为 {} 转字符串是 '[object Object]'，转数字是 NaN。","text":"[] == ![] 为什么是 true？ 拆解：![] 先把 [] 转布尔（对象恒为 true）再取反得到 false；于是表达式变成 [] == false；有布尔则转数字，false → 0；[] == 0 时对象 ToPrimitive，[].valueOf() 返回自身不是原始值，继续 [].toString() 得到 ''；'' == 0 时字符串转数字为 0；0 == 0 为 true。 延伸：{} == !{} 为 false，因为 {} 转字符串是 '[object Object]'，转数字是 NaN。"},{"id":11,"num":"Q011","tag":"输出题","title":"['1','2','3'].map(parseInt) 的结果是什么？","answers":["结果是 [1, NaN, NaN]。map 回调接收 (item, index, array)，等价于 parseInt('1',0) → 1（radix 为 0 视为 10）、parseInt('2',1) → NaN（1 不是合法进制）、parseInt('3',2) → NaN（二进制里没有 3）。","修复：arr.map(Number) 或 arr.map(x => parseInt(x, 10))。"],"bullets":[],"code":[],"note":"追问：parseInt 的第二个参数 radix 合法范围是 2~36，为 0/undefined 时按 10 处理（字符串以 0x 开头按 16）。","text":"['1','2','3'].map(parseInt) 的结果是什么？ 结果是 [1, NaN, NaN]。map 回调接收 (item, index, array)，等价于 parseInt('1',0) → 1（radix 为 0 视为 10）、parseInt('2',1) → NaN（1 不是合法进制）、parseInt('3',2) → NaN（二进制里没有 3）。 修复：arr.map(Number) 或 arr.map(x => parseInt(x, 10))。 追问：parseInt 的第二个参数 radix 合法范围是 2~36，为 0/undefined 时按 10 处理（字符串以 0x 开头按 16）。"},{"id":12,"num":"Q012","tag":"原理","title":"对象转原始值（ToPrimitive）的完整流程？","answers":["① 若存在 Symbol.toPrimitive 方法，调用它并传入 hint（'number' / 'string' / 'default'），返回原始值则结束；② 否则按 hint 决定顺序：hint 为 'string' 时先 toString 后 valueOf，其它情况先 valueOf 后 toString；③ 依次调用，只要返回原始值就采用；④ 都返回对象则抛 TypeError。","Date 对象特殊：默认 hint 是 'string'，所以 Date 与数字相加走字符串拼接；普通对象默认 hint 是 'default'，先走 valueOf（返回自身）再走 toString 得 '[object Object]'。"],"bullets":[],"code":[["const obj = { [Symbol.toPrimitive](hint){ return hint === 'number' ? 42 : 'hi' } }","obj + 1      // 'hi1'","Number(obj)  // 42"]],"note":"","text":"对象转原始值（ToPrimitive）的完整流程？ ① 若存在 Symbol.toPrimitive 方法，调用它并传入 hint（'number' / 'string' / 'default'），返回原始值则结束；② 否则按 hint 决定顺序：hint 为 'string' 时先 toString 后 valueOf，其它情况先 valueOf 后 toString；③ 依次调用，只要返回原始值就采用；④ 都返回对象则抛 TypeError。 Date 对象特殊：默认 hint 是 'string'，所以 Date 与数字相加走字符串拼接；普通对象默认 hint 是 'default'，先走 valueOf（返回自身）再走 toString 得 '[object Object]'。 const obj = { [Symbol.toPrimitive](hint){ return hint === 'number' ? 42 : 'hi' } } obj + 1      // 'hi1' Number(obj)  // 42"},{"id":13,"num":"Q013","tag":"原理","title":"+ 运算符什么时候做字符串拼接？","answers":["一元 + 会做 ToNumber；二元 + 先把两边 ToPrimitive（hint 为 default），只要有一边结果是字符串就做拼接，否则都转数字做加法。","所以 [] + {} 是 '[object Object]'，{} + [] 在控制台常被解析成代码块 + 一元加号得到 0，1 + '2' 是 '12'，'1' + 2 + 3 是 '123'，1 + 2 + '3' 是 '33'。"],"bullets":[],"code":[],"note":"","text":"+ 运算符什么时候做字符串拼接？ 一元 + 会做 ToNumber；二元 + 先把两边 ToPrimitive（hint 为 default），只要有一边结果是字符串就做拼接，否则都转数字做加法。 所以 [] + {} 是 '[object Object]'，{} + [] 在控制台常被解析成代码块 + 一元加号得到 0，1 + '2' 是 '12'，'1' + 2 + 3 是 '123'，1 + 2 + '3' 是 '33'。"},{"id":14,"num":"Q014","tag":"手写见第 7 天","title":"如何判断一个对象是空对象？有哪些坑？","answers":["① Object.keys(obj).length === 0（只算自身可枚举属性，Symbol 键不算）；② Reflect.ownKeys(obj).length === 0（包含不可枚举与 Symbol）；③ JSON.stringify(obj) === '{}'（会忽略 undefined / 函数 / Symbol，且无法处理循环引用）。","坑：Object.keys 不含原型链上的属性、不含不可枚举属性、不含 Symbol；若要连原型链一起判断，需先 Object.getPrototypeOf(obj) === Object.prototype。"],"bullets":[],"code":[],"note":"","text":"如何判断一个对象是空对象？有哪些坑？ ① Object.keys(obj).length === 0（只算自身可枚举属性，Symbol 键不算）；② Reflect.ownKeys(obj).length === 0（包含不可枚举与 Symbol）；③ JSON.stringify(obj) === '{}'（会忽略 undefined / 函数 / Symbol，且无法处理循环引用）。 坑：Object.keys 不含原型链上的属性、不含不可枚举属性、不含 Symbol；若要连原型链一起判断，需先 Object.getPrototypeOf(obj) === Object.prototype。"},{"id":15,"num":"Q015","tag":"对比","title":"浅拷贝与深拷贝的区别？JSON 方式有哪些缺陷？","answers":["浅拷贝只复制第一层：基本类型复制值，嵌套对象仍共享地址（Object.assign、展开运算符、Array.prototype.slice、concat 都是浅拷贝）。深拷贝递归复制所有层级，新旧对象完全隔离。","JSON.parse(JSON.stringify(obj)) 的缺陷：忽略 undefined、函数、Symbol 键值；Date 变字符串；RegExp、Error、Map、Set 变 {}；Infinity/NaN 变 null；无法处理循环引用会抛错；会丢失原型链与不可枚举属性。","生产可用 structuredClone（浏览器/Node 17+，支持循环引用、Map/Set/Date，但不支持函数、DOM 节点、原型）。手写深拷贝见第 7 天。"],"bullets":[],"code":[],"note":"","text":"浅拷贝与深拷贝的区别？JSON 方式有哪些缺陷？ 浅拷贝只复制第一层：基本类型复制值，嵌套对象仍共享地址（Object.assign、展开运算符、Array.prototype.slice、concat 都是浅拷贝）。深拷贝递归复制所有层级，新旧对象完全隔离。 JSON.parse(JSON.stringify(obj)) 的缺陷：忽略 undefined、函数、Symbol 键值；Date 变字符串；RegExp、Error、Map、Set 变 {}；Infinity/NaN 变 null；无法处理循环引用会抛错；会丢失原型链与不可枚举属性。 生产可用 structuredClone（浏览器/Node 17+，支持循环引用、Map/Set/Date，但不支持函数、DOM 节点、原型）。手写深拷贝见第 7 天。"}]},{"id":"day1-s2","day":1,"title":"1.2 原型、原型链与继承","note":"","questions":[{"id":16,"num":"Q016","tag":"原理","title":"讲清楚 prototype、__proto__、constructor 三者的关系。","answers":["每个函数都有 prototype 属性，指向一个对象（原型对象），用于存放实例共享的方法；每个对象都有内部槽 [[Prototype]]（通过 __proto__ 访问，或 Object.getPrototypeOf），指向创建它的构造函数的 prototype；原型对象上有 constructor 属性，指回构造函数本身。","关系公式：实例.__proto__ === 构造函数.prototype；构造函数.prototype.constructor === 构造函数；构造函数.prototype.__proto__ === Object.prototype；Object.prototype.__proto__ === null（原型链终点）。","注意 __proto__ 是历史遗留的访问器（位于 Object.prototype），ES6 才标准化，现代代码请用 Object.getPrototypeOf / Object.setPrototypeOf / Object.create。"],"bullets":[],"code":[],"note":"","text":"讲清楚 prototype、__proto__、constructor 三者的关系。 每个函数都有 prototype 属性，指向一个对象（原型对象），用于存放实例共享的方法；每个对象都有内部槽 [[Prototype]]（通过 __proto__ 访问，或 Object.getPrototypeOf），指向创建它的构造函数的 prototype；原型对象上有 constructor 属性，指回构造函数本身。 关系公式：实例.__proto__ === 构造函数.prototype；构造函数.prototype.constructor === 构造函数；构造函数.prototype.__proto__ === Object.prototype；Object.prototype.__proto__ === null（原型链终点）。 注意 __proto__ 是历史遗留的访问器（位于 Object.prototype），ES6 才标准化，现代代码请用 Object.getPrototypeOf / Object.setPrototypeOf / Object.create。"},{"id":17,"num":"Q017","tag":"原理","title":"什么是原型链？属性查找过程是怎样的？","answers":["访问对象属性时，先查对象自身（OwnProperty）；没有则沿 [[Prototype]] 逐层向上查找，直到 Object.prototype，再到 null 停止；这条链就是原型链。找到就返回，全链没有则返回 undefined。","写入属性不受原型链影响（只会写自身，除非原型上有 setter 或属性是只读的，严格模式下会抛错）。这也是「实例共享方法、独享数据」的实现基础。"],"bullets":[],"code":[],"note":"","text":"什么是原型链？属性查找过程是怎样的？ 访问对象属性时，先查对象自身（OwnProperty）；没有则沿 [[Prototype]] 逐层向上查找，直到 Object.prototype，再到 null 停止；这条链就是原型链。找到就返回，全链没有则返回 undefined。 写入属性不受原型链影响（只会写自身，除非原型上有 setter 或属性是只读的，严格模式下会抛错）。这也是「实例共享方法、独享数据」的实现基础。"},{"id":18,"num":"Q018","tag":"基础","title":"获取对象原型的方法有哪些？","answers":["obj.__proto__（不推荐）、Object.getPrototypeOf(obj)（推荐）、obj.constructor.prototype（constructor 可被篡改，不可靠）、Reflect.getPrototypeOf(obj)。","判断原型关系：Object.prototype.isPrototypeOf(obj)、instanceof、Object.getPrototypeOf(obj) === Ctor.prototype。"],"bullets":[],"code":[],"note":"","text":"获取对象原型的方法有哪些？ obj.__proto__（不推荐）、Object.getPrototypeOf(obj)（推荐）、obj.constructor.prototype（constructor 可被篡改，不可靠）、Reflect.getPrototypeOf(obj)。 判断原型关系：Object.prototype.isPrototypeOf(obj)、instanceof、Object.getPrototypeOf(obj) === Ctor.prototype。"},{"id":19,"num":"Q019","tag":"高频","title":"new 操作符到底做了什么？","answers":["① 创建一个新空对象；② 把该对象的 [[Prototype]] 指向构造函数的 prototype；③ 以该对象为 this 执行构造函数；④ 若构造函数显式返回一个对象，则返回该对象；若返回原始值则忽略，返回新创建的对象。","手写实现要点见第 7 天（含「返回对象时覆盖」和「原型指向」两个易漏点）。"],"bullets":[],"code":[],"note":"","text":"new 操作符到底做了什么？ ① 创建一个新空对象；② 把该对象的 [[Prototype]] 指向构造函数的 prototype；③ 以该对象为 this 执行构造函数；④ 若构造函数显式返回一个对象，则返回该对象；若返回原始值则忽略，返回新创建的对象。 手写实现要点见第 7 天（含「返回对象时覆盖」和「原型指向」两个易漏点）。"},{"id":20,"num":"Q020","tag":"原理","title":"instanceof 的原理？手写的注意点？","answers":["沿左值的原型链逐层查找，判断右值.prototype 是否出现在链上，直到 null。本质是原型链比对，不是类型判断。","缺陷：原始类型恒为 false（1 instanceof Number 为 false）；跨 iframe 失效；右值 prototype 可被改写导致结果不稳定。Symbol.hasInstance 可自定义 instanceof 行为。","实现要点：while (obj = Object.getPrototypeOf(obj)) 逐一比对，注意处理左边是原始值、右边不是函数的情况。"],"bullets":[],"code":[],"note":"","text":"instanceof 的原理？手写的注意点？ 沿左值的原型链逐层查找，判断右值.prototype 是否出现在链上，直到 null。本质是原型链比对，不是类型判断。 缺陷：原始类型恒为 false（1 instanceof Number 为 false）；跨 iframe 失效；右值 prototype 可被改写导致结果不稳定。Symbol.hasInstance 可自定义 instanceof 行为。 实现要点：while (obj = Object.getPrototypeOf(obj)) 逐一比对，注意处理左边是原始值、右边不是函数的情况。"},{"id":21,"num":"Q021","tag":"对比","title":"JavaScript 实现继承有哪几种方式？各自缺点？","answers":["① 原型链继承：Child.prototype = new Parent()，缺点是无法向父构造函数传参、父类引用类型属性被所有实例共享。","② 借用构造函数（call/apply）：在子构造函数里 Parent.call(this)，能传参且属性独立，但无法继承原型上的方法，方法无法复用。","③ 组合继承：①+②，最常用，但父构造函数会被调用两次，实例与原型上都有一份父属性。","④ 原型式继承：Object.create(parent)，类似浅拷贝一个对象，引用属性仍共享。","⑤ 寄生式继承：在④基础上包一层函数添加方法，方法无法复用。","⑥ 寄生组合继承：用 Object.create(Parent.prototype) 设置原型并修正 constructor，只调用一次父构造函数，是 ES5 时代最优解。","⑦ ES6 class extends：语法糖，底层仍基于原型；子类必须在 constructor 中先 super() 才能用 this，因为派生类的 this 由父类构造创建。"],"bullets":[],"code":[],"note":"","text":"JavaScript 实现继承有哪几种方式？各自缺点？ ① 原型链继承：Child.prototype = new Parent()，缺点是无法向父构造函数传参、父类引用类型属性被所有实例共享。 ② 借用构造函数（call/apply）：在子构造函数里 Parent.call(this)，能传参且属性独立，但无法继承原型上的方法，方法无法复用。 ③ 组合继承：①+②，最常用，但父构造函数会被调用两次，实例与原型上都有一份父属性。 ④ 原型式继承：Object.create(parent)，类似浅拷贝一个对象，引用属性仍共享。 ⑤ 寄生式继承：在④基础上包一层函数添加方法，方法无法复用。 ⑥ 寄生组合继承：用 Object.create(Parent.prototype) 设置原型并修正 constructor，只调用一次父构造函数，是 ES5 时代最优解。 ⑦ ES6 class extends：语法糖，底层仍基于原型；子类必须在 constructor 中先 super() 才能用 this，因为派生类的 this 由父类构造创建。"},{"id":22,"num":"Q022","tag":"高频","title":"寄生组合继承为什么是最优解？核心代码思路？","answers":["组合继承的问题是父构造函数执行两次：一次 new Parent() 挂原型时，一次 Parent.call(this) 初始化属性时，导致子类原型上有多余的父实例属性。","寄生组合继承改为「不 new Parent，而是用 Object.create(Parent.prototype) 造一个只继承原型方法的空对象」，再用 Object.setPrototypeOf / 修正 constructor，这样父构造函数只在子类 constructor 里被调用一次。"],"bullets":[],"code":[["function Child(...args) { Parent.apply(this, args) }","Child.prototype = Object.create(Parent.prototype)","Child.prototype.constructor = Child"]],"note":"","text":"寄生组合继承为什么是最优解？核心代码思路？ 组合继承的问题是父构造函数执行两次：一次 new Parent() 挂原型时，一次 Parent.call(this) 初始化属性时，导致子类原型上有多余的父实例属性。 寄生组合继承改为「不 new Parent，而是用 Object.create(Parent.prototype) 造一个只继承原型方法的空对象」，再用 Object.setPrototypeOf / 修正 constructor，这样父构造函数只在子类 constructor 里被调用一次。 function Child(...args) { Parent.apply(this, args) } Child.prototype = Object.create(Parent.prototype) Child.prototype.constructor = Child"},{"id":23,"num":"Q023","tag":"对比","title":"ES6 class 与 ES5 构造函数有什么区别？","answers":["class 本质仍是原型继承的语法糖，但有 5 个差异：① class 不存在变量提升（有暂时性死区），必须先定义后使用；② class 内部默认严格模式；③ class 的方法定义在原型上且不可枚举（Object.keys 取不到）；④ 必须用 new 调用，直接调用会抛 TypeError；⑤ 支持 extends / super / static / 私有字段 #x，且派生类必须 super() 后才能访问 this。","另：class 的静态方法可被子类继承（子类.__proto__ 指向父类），这是 ES6 特有的「双链」结构。"],"bullets":[],"code":[],"note":"","text":"ES6 class 与 ES5 构造函数有什么区别？ class 本质仍是原型继承的语法糖，但有 5 个差异：① class 不存在变量提升（有暂时性死区），必须先定义后使用；② class 内部默认严格模式；③ class 的方法定义在原型上且不可枚举（Object.keys 取不到）；④ 必须用 new 调用，直接调用会抛 TypeError；⑤ 支持 extends / super / static / 私有字段 #x，且派生类必须 super() 后才能访问 this。 另：class 的静态方法可被子类继承（子类.__proto__ 指向父类），这是 ES6 特有的「双链」结构。"},{"id":24,"num":"Q024","tag":"场景","title":"Object.create(null) 有什么用？","answers":["创建一个没有原型（[[Prototype]] 为 null）的纯净对象，没有 toString / hasOwnProperty / constructor 等继承属性。","用途：① 实现字典 / Map 时避免键名与原型属性冲突（如用户输入 'toString'、'__proto__' 造成原型污染）；② 减少原型链查找开销。注意它无法直接调用 obj.toString()，要用 Object.prototype.toString.call(obj)。"],"bullets":[],"code":[],"note":"","text":"Object.create(null) 有什么用？ 创建一个没有原型（[[Prototype]] 为 null）的纯净对象，没有 toString / hasOwnProperty / constructor 等继承属性。 用途：① 实现字典 / Map 时避免键名与原型属性冲突（如用户输入 'toString'、'__proto__' 造成原型污染）；② 减少原型链查找开销。注意它无法直接调用 obj.toString()，要用 Object.prototype.toString.call(obj)。"}]},{"id":"day1-s3","day":1,"title":"1.3 作用域、闭包与 this","note":"","questions":[{"id":25,"num":"Q025","tag":"原理","title":"什么是作用域、词法作用域和作用域链？","answers":["作用域是变量与函数的可访问范围，JS 采用词法（静态）作用域：作用域在函数「定义时」就确定，而不是调用时。ES6 后有全局、函数、块级（{} + let/const）三级作用域。","作用域链是查找变量时由内向外的一系列变量对象（VO/AO 或词法环境 Environment Record）构成的链条，最外层是全局对象；查找沿链向上，找到即停止，找不到抛 ReferenceError。","延伸：闭包之所以能「记住」定义时的变量，正是词法作用域 + 外部词法环境引用的结果，与调用位置无关。"],"bullets":[],"code":[],"note":"","text":"什么是作用域、词法作用域和作用域链？ 作用域是变量与函数的可访问范围，JS 采用词法（静态）作用域：作用域在函数「定义时」就确定，而不是调用时。ES6 后有全局、函数、块级（{} + let/const）三级作用域。 作用域链是查找变量时由内向外的一系列变量对象（VO/AO 或词法环境 Environment Record）构成的链条，最外层是全局对象；查找沿链向上，找到即停止，找不到抛 ReferenceError。 延伸：闭包之所以能「记住」定义时的变量，正是词法作用域 + 外部词法环境引用的结果，与调用位置无关。"},{"id":26,"num":"Q026","tag":"高频","title":"var / let / const 的区别？什么是暂时性死区？","answers":["var：函数作用域、存在变量提升（声明提升到顶部并初始化为 undefined）、可重复声明、可重新赋值、全局 var 会成为 window 属性。","let/const：块级作用域、有暂时性死区（TDZ，声明前访问抛 ReferenceError，虽然引擎已为其分配空间但未初始化）、同一作用域不可重复声明、不会挂到 window 上。const 声明时必须初始化，且绑定不可重新赋值（对象内部属性仍可改，需 Object.freeze 才能冻结）。"],"bullets":[],"code":[["console.log(a) // undefined（var 提升）","console.log(b) // ReferenceError（TDZ）","var a = 1; let b = 2"]],"note":"","text":"var / let / const 的区别？什么是暂时性死区？ var：函数作用域、存在变量提升（声明提升到顶部并初始化为 undefined）、可重复声明、可重新赋值、全局 var 会成为 window 属性。 let/const：块级作用域、有暂时性死区（TDZ，声明前访问抛 ReferenceError，虽然引擎已为其分配空间但未初始化）、同一作用域不可重复声明、不会挂到 window 上。const 声明时必须初始化，且绑定不可重新赋值（对象内部属性仍可改，需 Object.freeze 才能冻结）。 console.log(a) // undefined（var 提升） console.log(b) // ReferenceError（TDZ） var a = 1; let b = 2"},{"id":27,"num":"Q027","tag":"原理","title":"变量提升与函数提升的优先级？","answers":["同一作用域内，函数声明整体提升（包含函数体），var 声明只提升声明不提升赋值；函数提升优先于 var 提升。同名的函数声明与 var 声明，最终以函数为准（除非后续有赋值覆盖）。","函数表达式（var f = function(){}）只提升 var 声明，调用时是 undefined 会报 TypeError。let/const/class 也存在提升，但因 TDZ 表现为「不可访问」。"],"bullets":[],"code":[],"note":"","text":"变量提升与函数提升的优先级？ 同一作用域内，函数声明整体提升（包含函数体），var 声明只提升声明不提升赋值；函数提升优先于 var 提升。同名的函数声明与 var 声明，最终以函数为准（除非后续有赋值覆盖）。 函数表达式（var f = function(){}）只提升 var 声明，调用时是 undefined 会报 TypeError。let/const/class 也存在提升，但因 TDZ 表现为「不可访问」。"},{"id":28,"num":"Q028","tag":"必考","title":"什么是闭包？原理、用途与缺点？","answers":["定义：函数与其定义时所在词法环境的组合；当一个函数在其定义的作用域之外被调用，仍能访问该作用域的变量，就产生了闭包（更严谨的说法：所有函数都有 [[Environment]] 引用外层词法环境，只是内部函数被外部保留时最明显）。","原理：外层函数执行完毕后，其词法环境因为仍被内部函数引用而无法被 GC 回收，变量被保存在堆中的 Context 里。","用途：① 数据私有化 / 模块模式（IIFE、单例）；② 柯里化与函数工厂；③ 防抖节流保存定时器；④ 缓存 / memoize；⑤ 循环中的变量保存；⑥ React Hooks 的状态保存。","缺点：变量常驻内存，使用不当会造成内存泄漏；比直接访问略慢。处理办法：不再使用时把引用置为 null。"],"bullets":[],"code":[],"note":"追问：闭包一定导致内存泄漏吗？不一定，V8 会分析未被内部函数引用的变量并回收，只有被引用的变量才保留；真正的泄漏多来自未清理的定时器、事件监听、DOM 引用与全局变量。","text":"什么是闭包？原理、用途与缺点？ 定义：函数与其定义时所在词法环境的组合；当一个函数在其定义的作用域之外被调用，仍能访问该作用域的变量，就产生了闭包（更严谨的说法：所有函数都有 [[Environment]] 引用外层词法环境，只是内部函数被外部保留时最明显）。 原理：外层函数执行完毕后，其词法环境因为仍被内部函数引用而无法被 GC 回收，变量被保存在堆中的 Context 里。 用途：① 数据私有化 / 模块模式（IIFE、单例）；② 柯里化与函数工厂；③ 防抖节流保存定时器；④ 缓存 / memoize；⑤ 循环中的变量保存；⑥ React Hooks 的状态保存。 缺点：变量常驻内存，使用不当会造成内存泄漏；比直接访问略慢。处理办法：不再使用时把引用置为 null。 追问：闭包一定导致内存泄漏吗？不一定，V8 会分析未被内部函数引用的变量并回收，只有被引用的变量才保留；真正的泄漏多来自未清理的定时器、事件监听、DOM 引用与全局变量。"},{"id":29,"num":"Q029","tag":"输出题","title":"经典循环打印问题：为什么全是 5？怎么修？","answers":["原因：var 是函数作用域，整个循环共享同一个 i；setTimeout 回调在同步循环结束后才执行，此时 i 已经是 5。箭头函数捕获的是同一个词法环境里的 i 的引用，不是当时的值。","修复方案：① 把 var 改成 let（每次迭代创建新的块级绑定，最简）；② 用 IIFE 把 i 作为参数传进去形成新闭包；③ setTimeout 第三个参数传参；④ 用 forEach 等自带函数作用域的迭代。"],"bullets":[],"code":[["for (var i = 0; i < 5; i++) { setTimeout(() => console.log(i), 1000) }"],["for (let i = 0; i < 5; i++) setTimeout(() => console.log(i), 1000) // 0 1 2 3 4"]],"note":"","text":"经典循环打印问题：为什么全是 5？怎么修？ 原因：var 是函数作用域，整个循环共享同一个 i；setTimeout 回调在同步循环结束后才执行，此时 i 已经是 5。箭头函数捕获的是同一个词法环境里的 i 的引用，不是当时的值。 修复方案：① 把 var 改成 let（每次迭代创建新的块级绑定，最简）；② 用 IIFE 把 i 作为参数传进去形成新闭包；③ setTimeout 第三个参数传参；④ 用 forEach 等自带函数作用域的迭代。 for (var i = 0; i < 5; i++) { setTimeout(() => console.log(i), 1000) } for (let i = 0; i < 5; i++) setTimeout(() => console.log(i), 1000) // 0 1 2 3 4"},{"id":30,"num":"Q030","tag":"必考","title":"this 的绑定规则与优先级？","answers":["优先级从高到低：① new 绑定（this 指向新创建的实例）；② 显式绑定 call / apply / bind（指向传入对象，传 null/undefined 在非严格模式退化为全局）；③ 隐式绑定（作为对象方法调用，指向该对象，注意赋值给变量后丢失）；④ 默认绑定（普通函数调用，非严格模式指向全局 window，严格模式为 undefined）。","箭头函数不适用以上规则：它没有自己的 this，沿作用域链继承外层（定义时）的 this，且无法被 call/apply/bind 改变，不能作为构造函数，没有 arguments、super、new.target。"],"bullets":[],"code":[],"note":"追问：`obj.fn()` 与 `(obj.fn)()` 相同，但 `(obj.fn = obj.fn)()` 会丢失 this，因为赋值表达式返回值是函数本身。","text":"this 的绑定规则与优先级？ 优先级从高到低：① new 绑定（this 指向新创建的实例）；② 显式绑定 call / apply / bind（指向传入对象，传 null/undefined 在非严格模式退化为全局）；③ 隐式绑定（作为对象方法调用，指向该对象，注意赋值给变量后丢失）；④ 默认绑定（普通函数调用，非严格模式指向全局 window，严格模式为 undefined）。 箭头函数不适用以上规则：它没有自己的 this，沿作用域链继承外层（定义时）的 this，且无法被 call/apply/bind 改变，不能作为构造函数，没有 arguments、super、new.target。 追问：`obj.fn()` 与 `(obj.fn)()` 相同，但 `(obj.fn = obj.fn)()` 会丢失 this，因为赋值表达式返回值是函数本身。"},{"id":31,"num":"Q031","tag":"对比","title":"call、apply、bind 的区别与实现要点？","answers":["三者都用于改变 this：call(thisArg, a, b) 立即执行、参数逐个传；apply(thisArg, [a,b]) 立即执行、参数用数组（类数组也可）；bind(thisArg, a) 返回一个 permanently 绑定 this 的新函数，不立即执行，支持柯里化式分步传参，且返回的函数被 new 调用时绑定的 this 会被忽略（但预设参数仍生效）。","手写要点：把函数临时挂到 context 上用 `context.fn()` 触发隐式绑定，调用后 delete；call/apply 用 Symbol 作临时键避免覆盖；bind 要处理原型继承（fBound.prototype = Object.create(this.prototype)）与 new 时 this instanceof fBound 的判断。完整实现见第 7 天。"],"bullets":[],"code":[],"note":"","text":"call、apply、bind 的区别与实现要点？ 三者都用于改变 this：call(thisArg, a, b) 立即执行、参数逐个传；apply(thisArg, [a,b]) 立即执行、参数用数组（类数组也可）；bind(thisArg, a) 返回一个 permanently 绑定 this 的新函数，不立即执行，支持柯里化式分步传参，且返回的函数被 new 调用时绑定的 this 会被忽略（但预设参数仍生效）。 手写要点：把函数临时挂到 context 上用 `context.fn()` 触发隐式绑定，调用后 delete；call/apply 用 Symbol 作临时键避免覆盖；bind 要处理原型继承（fBound.prototype = Object.create(this.prototype)）与 new 时 this instanceof fBound 的判断。完整实现见第 7 天。"},{"id":32,"num":"Q032","tag":"概念","title":"严格模式 'use strict' 有哪些限制？","answers":["① 未声明变量赋值不再隐式创建全局变量，直接抛 ReferenceError；② 默认绑定的 this 为 undefined 而非 window；③ 禁止 with、禁止给只读属性/不可扩展对象赋值（静默失败变抛错）；④ 函数参数不能重名，禁止八进制字面量；⑤ eval 有独立作用域，不再污染外层；⑥ 禁止删除不可删除属性、arguments.callee/caller 被禁用；⑦ 对象字面量属性重复会报错（ES6 后已放宽）。","ES6 模块与 class 内部默认就是严格模式，无需手写。"],"bullets":[],"code":[],"note":"","text":"严格模式 'use strict' 有哪些限制？ ① 未声明变量赋值不再隐式创建全局变量，直接抛 ReferenceError；② 默认绑定的 this 为 undefined 而非 window；③ 禁止 with、禁止给只读属性/不可扩展对象赋值（静默失败变抛错）；④ 函数参数不能重名，禁止八进制字面量；⑤ eval 有独立作用域，不再污染外层；⑥ 禁止删除不可删除属性、arguments.callee/caller 被禁用；⑦ 对象字面量属性重复会报错（ES6 后已放宽）。 ES6 模块与 class 内部默认就是严格模式，无需手写。"},{"id":33,"num":"Q033","tag":"概念","title":"eval 和 with 为什么被禁止？","answers":["eval 把字符串当代码执行，会破坏词法作用域的静态可分析性，导致引擎无法做优化（去优化、内联缓存失效），且有代码注入安全风险；非严格模式下还会污染外层作用域。with 会动态改变作用域链，同样让引擎无法在编译期确定变量归属。","替代方案：用 JSON.parse 解析数据、用对象解构 / 属性访问代替 with，用 Function 构造器也要谨慎（只在全局作用域执行，比 eval 稍可控）。"],"bullets":[],"code":[],"note":"","text":"eval 和 with 为什么被禁止？ eval 把字符串当代码执行，会破坏词法作用域的静态可分析性，导致引擎无法做优化（去优化、内联缓存失效），且有代码注入安全风险；非严格模式下还会污染外层作用域。with 会动态改变作用域链，同样让引擎无法在编译期确定变量归属。 替代方案：用 JSON.parse 解析数据、用对象解构 / 属性访问代替 with，用 Function 构造器也要谨慎（只在全局作用域执行，比 eval 稍可控）。"},{"id":34,"num":"Q034","tag":"原理","title":"V8 的垃圾回收机制？","answers":["主流是「标记-清除」（Mark-Sweep）：从根对象（全局、当前调用栈、活动闭包等 GC Roots）出发标记可达对象，清除未标记的。配合标记-整理（Mark-Compact）解决内存碎片。","V8 采用分代回收：新生代用 Scavenge（Cheney 算法，From/To 两个 semispace 复制存活对象，晋升条件是经历过一次回收或 To 空间超过 25%）；老生代用 Mark-Sweep + Mark-Compact。","为减少全停顿（Stop-The-World），还有增量标记、惰性清理、并发标记、三色标记法与写屏障。加分点：引用计数因循环引用问题已不作为主算法（IE 旧时代 COM 对象用过）。"],"bullets":[],"code":[],"note":"","text":"V8 的垃圾回收机制？ 主流是「标记-清除」（Mark-Sweep）：从根对象（全局、当前调用栈、活动闭包等 GC Roots）出发标记可达对象，清除未标记的。配合标记-整理（Mark-Compact）解决内存碎片。 V8 采用分代回收：新生代用 Scavenge（Cheney 算法，From/To 两个 semispace 复制存活对象，晋升条件是经历过一次回收或 To 空间超过 25%）；老生代用 Mark-Sweep + Mark-Compact。 为减少全停顿（Stop-The-World），还有增量标记、惰性清理、并发标记、三色标记法与写屏障。加分点：引用计数因循环引用问题已不作为主算法（IE 旧时代 COM 对象用过）。"},{"id":35,"num":"Q035","tag":"高频","title":"哪些操作会造成内存泄漏？如何排查？","answers":["① 意外的全局变量（未声明变量、this 指向 window）；② 忘记 clearInterval / clearTimeout / cancelAnimationFrame；③ 移除 DOM 前未解绑事件监听（尤其闭包引用了 DOM）；④ 闭包长期持有大对象；⑤ 脱离 DOM 的引用（把节点存在数组/Map 里，节点从页面移除但引用还在）；⑥ 未清理的观察者、订阅、WebSocket；⑦ console.log 持有大对象引用；⑧ 缓存无淘汰策略（用 WeakMap / LRU 解决）。","排查：Chrome DevTools Memory 面板拍 Heap Snapshot 对比（三次 GC 后对比 retained size）、Allocation instrumentation on timeline 看分配栈、Performance 看 JS Heap 曲线是否阶梯上升。"],"bullets":[],"code":[],"note":"加分：WeakMap / WeakSet 的键是弱引用，不阻止 GC，适合给 DOM 节点挂元数据；WeakRef + FinalizationRegistry（ES2021）可做更细的生命周期管理。","text":"哪些操作会造成内存泄漏？如何排查？ ① 意外的全局变量（未声明变量、this 指向 window）；② 忘记 clearInterval / clearTimeout / cancelAnimationFrame；③ 移除 DOM 前未解绑事件监听（尤其闭包引用了 DOM）；④ 闭包长期持有大对象；⑤ 脱离 DOM 的引用（把节点存在数组/Map 里，节点从页面移除但引用还在）；⑥ 未清理的观察者、订阅、WebSocket；⑦ console.log 持有大对象引用；⑧ 缓存无淘汰策略（用 WeakMap / LRU 解决）。 排查：Chrome DevTools Memory 面板拍 Heap Snapshot 对比（三次 GC 后对比 retained size）、Allocation instrumentation on timeline 看分配栈、Performance 看 JS Heap 曲线是否阶梯上升。 加分：WeakMap / WeakSet 的键是弱引用，不阻止 GC，适合给 DOM 节点挂元数据；WeakRef + FinalizationRegistry（ES2021）可做更细的生命周期管理。"}]},{"id":"day1-s4","day":1,"title":"1.4 对象、数组与常用 API","note":"","questions":[{"id":36,"num":"Q036","tag":"对比","title":"Object.is、===、== 的区别？","answers":["== 会做隐式类型转换；=== 不做转换但有两个特例：NaN !== NaN、+0 === -0；Object.is 与 === 基本一致，但修正这两点：Object.is(NaN, NaN) 为 true，Object.is(+0, -0) 为 false（底层用 SameValue 算法）。","Object.is 常用于 polyfill 与框架内部做精确比较，React 的 useState / useEffect 依赖比较用的就是 Object.is（Object.is 语义）。"],"bullets":[],"code":[],"note":"","text":"Object.is、===、== 的区别？ == 会做隐式类型转换；=== 不做转换但有两个特例：NaN !== NaN、+0 === -0；Object.is 与 === 基本一致，但修正这两点：Object.is(NaN, NaN) 为 true，Object.is(+0, -0) 为 false（底层用 SameValue 算法）。 Object.is 常用于 polyfill 与框架内部做精确比较，React 的 useState / useEffect 依赖比较用的就是 Object.is（Object.is 语义）。"},{"id":37,"num":"Q037","tag":"基础","title":"数组哪些方法会改变原数组？哪些不会？","answers":["会改变（变异方法，共 9 个）：push、pop、shift、unshift、splice、sort、reverse、fill、copyWithin。","不改变：map、filter、reduce、forEach、slice、concat、join、find、findIndex、some、every、includes、indexOf、flat、flatMap、at、toSorted/toReversed/toSpliced（ES2023 新增的非变异版本）。","注意：map/filter 返回新数组，但元素是引用类型时仍共享对象地址；forEach 无法 break（用 some/every 或 for...of 替代）；sort 默认按字符串 Unicode 排序，需传比较函数 (a,b)=>a-b。"],"bullets":[],"code":[],"note":"","text":"数组哪些方法会改变原数组？哪些不会？ 会改变（变异方法，共 9 个）：push、pop、shift、unshift、splice、sort、reverse、fill、copyWithin。 不改变：map、filter、reduce、forEach、slice、concat、join、find、findIndex、some、every、includes、indexOf、flat、flatMap、at、toSorted/toReversed/toSpliced（ES2023 新增的非变异版本）。 注意：map/filter 返回新数组，但元素是引用类型时仍共享对象地址；forEach 无法 break（用 some/every 或 for...of 替代）；sort 默认按字符串 Unicode 排序，需传比较函数 (a,b)=>a-b。"},{"id":38,"num":"Q038","tag":"对比","title":"for...in、for...of、forEach 有什么区别？","answers":["for...in 遍历对象自身 + 原型链上的可枚举属性（键名，含字符串键，不含 Symbol），顺序不保证，适合遍历普通对象但需 hasOwnProperty 过滤。","for...of 遍历可迭代对象（实现了 Symbol.iterator，如数组、字符串、Set、Map、NodeList、arguments、生成器），拿到的是值，支持 break/continue/return 与 await。普通对象不可直接 for...of（需 Symbol.iterator 或 Object.keys 包装）。","forEach 是数组方法，遍历索引与值，无法中断（抛异常才能停），会跳过稀疏数组的空位；for 循环最灵活且性能最好。"],"bullets":[],"code":[],"note":"","text":"for...in、for...of、forEach 有什么区别？ for...in 遍历对象自身 + 原型链上的可枚举属性（键名，含字符串键，不含 Symbol），顺序不保证，适合遍历普通对象但需 hasOwnProperty 过滤。 for...of 遍历可迭代对象（实现了 Symbol.iterator，如数组、字符串、Set、Map、NodeList、arguments、生成器），拿到的是值，支持 break/continue/return 与 await。普通对象不可直接 for...of（需 Symbol.iterator 或 Object.keys 包装）。 forEach 是数组方法，遍历索引与值，无法中断（抛异常才能停），会跳过稀疏数组的空位；for 循环最灵活且性能最好。"},{"id":39,"num":"Q039","tag":"概念","title":"类数组对象是什么？如何转成真数组？","answers":["有 length 属性和数字索引、但没有数组方法（如 arguments、NodeList、HTMLCollection、字符串、{0:'a',1:'b',length:2}）。","转换方式：Array.from(x)（还能传 mapFn，且能处理可迭代对象）、展开运算符 [...x]（要求有 Symbol.iterator）、Array.prototype.slice.call(x)、Array.prototype.concat.apply([], x)、Array.from(new Set(x)) 顺带去重。"],"bullets":[],"code":[],"note":"追问：Array.from({length: 3}, (_, i) => i) 是快速生成 0/1/2 的常用技巧。","text":"类数组对象是什么？如何转成真数组？ 有 length 属性和数字索引、但没有数组方法（如 arguments、NodeList、HTMLCollection、字符串、{0:'a',1:'b',length:2}）。 转换方式：Array.from(x)（还能传 mapFn，且能处理可迭代对象）、展开运算符 [...x]（要求有 Symbol.iterator）、Array.prototype.slice.call(x)、Array.prototype.concat.apply([], x)、Array.from(new Set(x)) 顺带去重。 追问：Array.from({length: 3}, (_, i) => i) 是快速生成 0/1/2 的常用技巧。"},{"id":40,"num":"Q040","tag":"对比","title":"Object.assign 与对象展开运算符的异同？深浅拷贝问题？","answers":["两者都是浅拷贝，Object.assign(target, ...sources) 会修改并返回 target；展开 `{...a, ...b}` 创建新对象。两者都只复制自身可枚举属性（含 Symbol），都不复制原型与不可枚举属性。","区别：Object.assign 会触发目标对象上的 setter，展开不会；同名属性都是后者覆盖前者；Object.assign 的第一个参数为 null/undefined 会抛错。"],"bullets":[],"code":[],"note":"","text":"Object.assign 与对象展开运算符的异同？深浅拷贝问题？ 两者都是浅拷贝，Object.assign(target, ...sources) 会修改并返回 target；展开 `{...a, ...b}` 创建新对象。两者都只复制自身可枚举属性（含 Symbol），都不复制原型与不可枚举属性。 区别：Object.assign 会触发目标对象上的 setter，展开不会；同名属性都是后者覆盖前者；Object.assign 的第一个参数为 null/undefined 会抛错。"},{"id":41,"num":"Q041","tag":"概念","title":"函数柯里化、偏函数与 compose/pipe 是什么？","answers":["柯里化（curry）：把 f(a,b,c) 变成 f(a)(b)(c)，每次只接收部分参数并返回新函数，参数凑齐再执行。用途：参数复用、延迟执行、函数组合（如 add(1)(2)(3)）。","偏函数（partial）：固定部分参数生成一个新函数，但剩余参数一次性传入（bind 就是典型偏函数应用）。","compose 从右到左组合函数（compose(f,g,h)(x) === f(g(h(x)))），pipe 从左到右。实现都基于 reduce / reduceRight。完整手写见第 7 天。"],"bullets":[],"code":[],"note":"","text":"函数柯里化、偏函数与 compose/pipe 是什么？ 柯里化（curry）：把 f(a,b,c) 变成 f(a)(b)(c)，每次只接收部分参数并返回新函数，参数凑齐再执行。用途：参数复用、延迟执行、函数组合（如 add(1)(2)(3)）。 偏函数（partial）：固定部分参数生成一个新函数，但剩余参数一次性传入（bind 就是典型偏函数应用）。 compose 从右到左组合函数（compose(f,g,h)(x) === f(g(h(x)))），pipe 从左到右。实现都基于 reduce / reduceRight。完整手写见第 7 天。"},{"id":42,"num":"Q042","tag":"场景","title":"['1','2','3'] 求和、数组去重、数组扁平化各有几种写法？","answers":["求和：reduce((s, x) => s + Number(x), 0)；去重：[...new Set(arr)]（NaN 也能去重）、filter + indexOf、reduce + includes；对象数组按 key 去重可用 Map。","扁平化：arr.flat(Infinity)、arr.reduce + concat + 递归、JSON.stringify 正则替换（不推荐）、生成器 yield*。手写 flatten 见第 7 天。"],"bullets":[],"code":[],"note":"追问：flat 默认深度 1，会跳过空位；flatMap 等价于 map + flat(1)，但只能展一层。","text":"['1','2','3'] 求和、数组去重、数组扁平化各有几种写法？ 求和：reduce((s, x) => s + Number(x), 0)；去重：[...new Set(arr)]（NaN 也能去重）、filter + indexOf、reduce + includes；对象数组按 key 去重可用 Map。 扁平化：arr.flat(Infinity)、arr.reduce + concat + 递归、JSON.stringify 正则替换（不推荐）、生成器 yield*。手写 flatten 见第 7 天。 追问：flat 默认深度 1，会跳过空位；flatMap 等价于 map + flat(1)，但只能展一层。"}]}]},{"id":"day2","day":2,"title":"第 2 天｜异步编程、Event Loop 与 ES6+","short":"异步编程、Event Loop 与 ES6+","note":"目标：把「同步/异步 + Promise + 事件循环」这一组连问题一次打通。面试官最爱在这里出代码输出题，务必按「同步 → 微任务 → 宏任务」的顺序动手推演，不要凭感觉。","sections":[{"id":"day2-s1","day":2,"title":"2.1 事件循环（Event Loop）","note":"","questions":[{"id":43,"num":"Q043","tag":"必考","title":"讲清楚浏览器的事件循环机制。","answers":["JS 是单线程，靠「调用栈 + 任务队列 + 事件循环」实现异步：同步代码进调用栈依次执行；遇到异步 API 交给浏览器/运行时其他线程（定时器线程、网络线程等）处理，完成后把回调放入对应任务队列；调用栈清空后，事件循环先清空全部微任务队列，再取一个宏任务执行，如此反复。","宏任务（Macrotask）：script 整体代码、setTimeout/setInterval、I/O、UI 渲染、postMessage、MessageChannel、requestAnimationFrame（严格说 rAF 在渲染阶段）、setImmediate（Node）。","微任务（Microtask）：Promise.then/catch/finally、MutationObserver、queueMicrotask、process.nextTick（Node，优先级最高）、await 后面的代码。","关键规则：每次「一个宏任务 → 清空整个微任务队列 → 必要时渲染 → 下一个宏任务」。微任务里新产生的微任务会在本轮继续执行完（可能饿死宏任务）。"],"bullets":[],"code":[],"note":"","text":"讲清楚浏览器的事件循环机制。 JS 是单线程，靠「调用栈 + 任务队列 + 事件循环」实现异步：同步代码进调用栈依次执行；遇到异步 API 交给浏览器/运行时其他线程（定时器线程、网络线程等）处理，完成后把回调放入对应任务队列；调用栈清空后，事件循环先清空全部微任务队列，再取一个宏任务执行，如此反复。 宏任务（Macrotask）：script 整体代码、setTimeout/setInterval、I/O、UI 渲染、postMessage、MessageChannel、requestAnimationFrame（严格说 rAF 在渲染阶段）、setImmediate（Node）。 微任务（Microtask）：Promise.then/catch/finally、MutationObserver、queueMicrotask、process.nextTick（Node，优先级最高）、await 后面的代码。 关键规则：每次「一个宏任务 → 清空整个微任务队列 → 必要时渲染 → 下一个宏任务」。微任务里新产生的微任务会在本轮继续执行完（可能饿死宏任务）。"},{"id":44,"num":"Q044","tag":"输出题","title":"请写出下面代码的输出顺序并解释。","answers":["输出：1 → 4 → 3 → 2。同步代码先输出 1、4；同步代码执行完后清空微任务，输出 3；最后取宏任务 setTimeout，输出 2。","注意：setTimeout(fn, 0) 不是立刻执行，HTML 规范规定嵌套定时器最小延迟约 4ms，且要等当前宏任务与所有微任务结束。"],"bullets":[],"code":[["console.log('1')","setTimeout(() => console.log('2'), 0)","Promise.resolve().then(() => console.log('3'))","console.log('4')"]],"note":"","text":"请写出下面代码的输出顺序并解释。 输出：1 → 4 → 3 → 2。同步代码先输出 1、4；同步代码执行完后清空微任务，输出 3；最后取宏任务 setTimeout，输出 2。 注意：setTimeout(fn, 0) 不是立刻执行，HTML 规范规定嵌套定时器最小延迟约 4ms，且要等当前宏任务与所有微任务结束。 console.log('1') setTimeout(() => console.log('2'), 0) Promise.resolve().then(() => console.log('3')) console.log('4')"},{"id":45,"num":"Q045","tag":"输出题","title":"async / await 与 Promise 混用的执行顺序。","answers":["输出：A → D → B → C。await 之前的代码（含 await 表达式求值）是同步的，输出 A；await 之后的代码等价于放进 Promise.then 微任务；于是同步输出 D；微任务队列按入队顺序为 B 再 C。","加分：await 一个非 Promise 值会被 Promise.resolve 包装；await 后面的代码总是在微任务里执行，哪怕 await 的是已决议的 Promise。"],"bullets":[],"code":[["async function f() { console.log('A'); await null; console.log('B') }","f(); Promise.resolve().then(() => console.log('C')); console.log('D')"]],"note":"","text":"async / await 与 Promise 混用的执行顺序。 输出：A → D → B → C。await 之前的代码（含 await 表达式求值）是同步的，输出 A；await 之后的代码等价于放进 Promise.then 微任务；于是同步输出 D；微任务队列按入队顺序为 B 再 C。 加分：await 一个非 Promise 值会被 Promise.resolve 包装；await 后面的代码总是在微任务里执行，哪怕 await 的是已决议的 Promise。 async function f() { console.log('A'); await null; console.log('B') } f(); Promise.resolve().then(() => console.log('C')); console.log('D')"},{"id":46,"num":"Q046","tag":"输出题","title":"嵌套 Promise + 定时器的完整推演。","answers":["输出：5 → 3 → 1 → 2 → 4。同步 5；首轮微任务 3（并把 4 的定时器排入宏任务）；下一个宏任务是第一个 setTimeout 输出 1，其回调内产生的微任务 2 立刻在本轮清空；再下一个宏任务输出 4。"],"bullets":[],"code":[["setTimeout(() => { console.log(1); Promise.resolve().then(() => console.log(2)) }, 0)","Promise.resolve().then(() => { console.log(3); setTimeout(() => console.log(4), 0) })","console.log(5)"]],"note":"口诀：一轮只取一个宏任务，但微任务要「清空到见底」，且宏任务回调里新产生的微任务在本轮末尾就执行。","text":"嵌套 Promise + 定时器的完整推演。 输出：5 → 3 → 1 → 2 → 4。同步 5；首轮微任务 3（并把 4 的定时器排入宏任务）；下一个宏任务是第一个 setTimeout 输出 1，其回调内产生的微任务 2 立刻在本轮清空；再下一个宏任务输出 4。 setTimeout(() => { console.log(1); Promise.resolve().then(() => console.log(2)) }, 0) Promise.resolve().then(() => { console.log(3); setTimeout(() => console.log(4), 0) }) console.log(5) 口诀：一轮只取一个宏任务，但微任务要「清空到见底」，且宏任务回调里新产生的微任务在本轮末尾就执行。"},{"id":47,"num":"Q047","tag":"对比","title":"浏览器与 Node.js 的事件循环有什么区别？","answers":["浏览器：宏任务队列 → 微任务队列 → 渲染，循环。Node（libuv）分 6 个阶段：timers → pending callbacks → idle/prepare → poll → check → close callbacks；每个阶段执行完（以及各阶段之间）清空微任务。","Node 特有：setImmediate 在 check 阶段执行，process.nextTick 队列优先级高于 Promise 微任务，会在当前操作结束后立即清空（可能先于所有微任务）。","Node v11 之后行为与浏览器趋同：每个定时器/Immediate 执行后都会清空微任务，不再像旧版本那样先清空整个 timers 队列。","注意：setTimeout(fn,0) 与 setImmediate 在顶层代码里执行顺序不保证（受进程启动耗时影响），在 I/O 回调内则 setImmediate 一定先于 setTimeout。"],"bullets":[],"code":[],"note":"","text":"浏览器与 Node.js 的事件循环有什么区别？ 浏览器：宏任务队列 → 微任务队列 → 渲染，循环。Node（libuv）分 6 个阶段：timers → pending callbacks → idle/prepare → poll → check → close callbacks；每个阶段执行完（以及各阶段之间）清空微任务。 Node 特有：setImmediate 在 check 阶段执行，process.nextTick 队列优先级高于 Promise 微任务，会在当前操作结束后立即清空（可能先于所有微任务）。 Node v11 之后行为与浏览器趋同：每个定时器/Immediate 执行后都会清空微任务，不再像旧版本那样先清空整个 timers 队列。 注意：setTimeout(fn,0) 与 setImmediate 在顶层代码里执行顺序不保证（受进程启动耗时影响），在 I/O 回调内则 setImmediate 一定先于 setTimeout。"},{"id":48,"num":"Q048","tag":"原理","title":"为什么要有微任务？MutationObserver 为什么是微任务？","answers":["微任务用于「在当前任务结束后、下一次渲染/宏任务前」立即执行高优先级、需要原子化的工作，避免中间状态被用户看到，也避免多一次宏任务调度带来的延迟。","MutationObserver 需在 DOM 变化后、浏览器渲染前批量回调，若做成宏任务会导致多次渲染之间状态不一致；做成同步又可能在一次 DOM 批量修改中触发无数次回调，所以微任务最合适。"],"bullets":[],"code":[],"note":"","text":"为什么要有微任务？MutationObserver 为什么是微任务？ 微任务用于「在当前任务结束后、下一次渲染/宏任务前」立即执行高优先级、需要原子化的工作，避免中间状态被用户看到，也避免多一次宏任务调度带来的延迟。 MutationObserver 需在 DOM 变化后、浏览器渲染前批量回调，若做成宏任务会导致多次渲染之间状态不一致；做成同步又可能在一次 DOM 批量修改中触发无数次回调，所以微任务最合适。"},{"id":49,"num":"Q049","tag":"场景","title":"requestAnimationFrame、requestIdleCallback 分别适合做什么？","answers":["rAF 在浏览器每次重绘前执行（约 16.7ms 一次，后台标签页暂停），适合做动画、逐帧 DOM 读写，能避免丢帧与布局抖动；不要再在 rAF 里做耗时计算。","requestIdleCallback 在浏览器空闲时执行，适合埋点上报、非关键预加载、低优先级数据处理；有 deadline.timeRemaining() 与 timeout 参数，不能保证一定执行，不适合关键逻辑。"],"bullets":[],"code":[],"note":"","text":"requestAnimationFrame、requestIdleCallback 分别适合做什么？ rAF 在浏览器每次重绘前执行（约 16.7ms 一次，后台标签页暂停），适合做动画、逐帧 DOM 读写，能避免丢帧与布局抖动；不要再在 rAF 里做耗时计算。 requestIdleCallback 在浏览器空闲时执行，适合埋点上报、非关键预加载、低优先级数据处理；有 deadline.timeRemaining() 与 timeout 参数，不能保证一定执行，不适合关键逻辑。"}]},{"id":"day2-s2","day":2,"title":"2.2 Promise 与 async / await","note":"","questions":[{"id":50,"num":"Q050","tag":"原理","title":"Promise 是什么？解决了什么问题？A+ 规范要点？","answers":["Promise 是异步结果的占位对象，有 pending / fulfilled / rejected 三种状态，状态一旦改变不可逆（pending → fulfilled 或 pending → rejected），且只能改变一次。","解决回调地狱、提供统一的错误捕获（catch）与链式组合能力，让异步流程可写、可读、可组合。","Promises/A+ 要点：① then 必须返回新的 Promise（因此可链式）；② then 接收 onFulfilled / onRejected，回调返回值 x 要走 [[Resolve]]（Promise Resolution Procedure），若 x 是 thenable 会递归展开并吸收其状态；③ 回调必须异步执行（微任务）；④ 错误冒泡到最近的 catch；⑤ 值穿透（then 里没传函数时向后传值）。"],"bullets":[],"code":[],"note":"","text":"Promise 是什么？解决了什么问题？A+ 规范要点？ Promise 是异步结果的占位对象，有 pending / fulfilled / rejected 三种状态，状态一旦改变不可逆（pending → fulfilled 或 pending → rejected），且只能改变一次。 解决回调地狱、提供统一的错误捕获（catch）与链式组合能力，让异步流程可写、可读、可组合。 Promises/A+ 要点：① then 必须返回新的 Promise（因此可链式）；② then 接收 onFulfilled / onRejected，回调返回值 x 要走 [[Resolve]]（Promise Resolution Procedure），若 x 是 thenable 会递归展开并吸收其状态；③ 回调必须异步执行（微任务）；④ 错误冒泡到最近的 catch；⑤ 值穿透（then 里没传函数时向后传值）。"},{"id":51,"num":"Q051","tag":"高频","title":"Promise 的静态方法有哪些？区别与适用场景？","answers":["Promise.all：全部成功才 resolve，结果数组按输入顺序（不是完成顺序）；任一 reject 立即 reject（其余仍会继续执行，只是结果被丢弃）。适合互相依赖的并发请求。","Promise.allSettled（ES2020）：等所有都结束，返回 [{status, value/reason}]，永不 reject。适合批量任务需要逐个看结果。","Promise.race：第一个「敲定」的就返回（无论成功失败）。适合超时控制、多源竞速。","Promise.any（ES2021）：第一个成功的就 resolve；全部失败才 reject 一个 AggregateError。适合多 CDN 兜底。","Promise.resolve / Promise.reject：快速创建已决议 Promise；Promise.withResolvers（ES2024）可一次性拿到 promise / resolve / reject。"],"bullets":[],"code":[],"note":"","text":"Promise 的静态方法有哪些？区别与适用场景？ Promise.all：全部成功才 resolve，结果数组按输入顺序（不是完成顺序）；任一 reject 立即 reject（其余仍会继续执行，只是结果被丢弃）。适合互相依赖的并发请求。 Promise.allSettled（ES2020）：等所有都结束，返回 [{status, value/reason}]，永不 reject。适合批量任务需要逐个看结果。 Promise.race：第一个「敲定」的就返回（无论成功失败）。适合超时控制、多源竞速。 Promise.any（ES2021）：第一个成功的就 resolve；全部失败才 reject 一个 AggregateError。适合多 CDN 兜底。 Promise.resolve / Promise.reject：快速创建已决议 Promise；Promise.withResolvers（ES2024）可一次性拿到 promise / resolve / reject。"},{"id":52,"num":"Q052","tag":"场景","title":"如何给 Promise 加超时控制？如何做并发限制？","answers":["超时：Promise.race([task, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))])，记得在 finally 里 clearTimeout 并考虑用 AbortController 真正取消请求（race 只是忽略结果，请求仍在跑）。","并发限制：维护一个执行池，用「递归补位」或 Promise.race 池化：启动 limit 个 worker，每个 worker 完成后从队列取下一个任务继续，直到队列空；最后 Promise.all(workers)。完整实现见第 7 天。"],"bullets":[],"code":[],"note":"","text":"如何给 Promise 加超时控制？如何做并发限制？ 超时：Promise.race([task, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))])，记得在 finally 里 clearTimeout 并考虑用 AbortController 真正取消请求（race 只是忽略结果，请求仍在跑）。 并发限制：维护一个执行池，用「递归补位」或 Promise.race 池化：启动 limit 个 worker，每个 worker 完成后从队列取下一个任务继续，直到队列空；最后 Promise.all(workers)。完整实现见第 7 天。"},{"id":53,"num":"Q053","tag":"对比","title":"Promise 链式调用中 then / catch / finally 的细节。","answers":["then 返回新 Promise；回调 return 普通值 → 下一个 then 收到该值；return Promise → 等待其决议；throw 或返回 rejected Promise → 跳到最近的 catch；没有对应处理函数时错误会继续向后冒泡。","catch 本质就是 then(null, onRejected)，catch 之后仍可继续 then（错误已被「处理」），所以 catch 放末尾还是中间影响后续链路。","finally 无论成败都执行，回调不接收参数，且返回的 Promise 会「透传」原结果；若 finally 里抛错或返回 rejected Promise，会覆盖原结果。"],"bullets":[],"code":[],"note":"","text":"Promise 链式调用中 then / catch / finally 的细节。 then 返回新 Promise；回调 return 普通值 → 下一个 then 收到该值；return Promise → 等待其决议；throw 或返回 rejected Promise → 跳到最近的 catch；没有对应处理函数时错误会继续向后冒泡。 catch 本质就是 then(null, onRejected)，catch 之后仍可继续 then（错误已被「处理」），所以 catch 放末尾还是中间影响后续链路。 finally 无论成败都执行，回调不接收参数，且返回的 Promise 会「透传」原结果；若 finally 里抛错或返回 rejected Promise，会覆盖原结果。"},{"id":54,"num":"Q054","tag":"高频","title":"async / await 的原理、错误处理与陷阱？","answers":["async 函数永远返回 Promise；await 会暂停当前 async 函数的执行（不阻塞整个线程），把后续代码注册为微任务，等 Promise 决议后恢复。生成器 + 自动执行器（如 co）是其语法糖等价实现。","错误处理：try...catch 包住 await，或 await p.catch(...)，或统一在调用处 .catch；多个 await 可以包在同一个 try 里，也可用 Promise.allSettled 收集。","陷阱：① 无依赖的多个请求顺序 await 会串行变慢，应改用 Promise.all；② 在 forEach / map 里直接 await 不会按预期串行，map 配合 Promise.all 才能并发；③ 循环里 await 要注意是否需要串行；④ await 的错误若未捕获会造成 unhandledrejection。"],"bullets":[],"code":[],"note":"","text":"async / await 的原理、错误处理与陷阱？ async 函数永远返回 Promise；await 会暂停当前 async 函数的执行（不阻塞整个线程），把后续代码注册为微任务，等 Promise 决议后恢复。生成器 + 自动执行器（如 co）是其语法糖等价实现。 错误处理：try...catch 包住 await，或 await p.catch(...)，或统一在调用处 .catch；多个 await 可以包在同一个 try 里，也可用 Promise.allSettled 收集。 陷阱：① 无依赖的多个请求顺序 await 会串行变慢，应改用 Promise.all；② 在 forEach / map 里直接 await 不会按预期串行，map 配合 Promise.all 才能并发；③ 循环里 await 要注意是否需要串行；④ await 的错误若未捕获会造成 unhandledrejection。"},{"id":55,"num":"Q055","tag":"对比","title":"异步编程的演进：回调 → Promise → Generator → async/await。","answers":["回调：简单但易形成回调地狱、无法用 try/catch 捕获异步错误、控制反转（信任问题）。","Promise：链式、错误冒泡、状态不可逆，但仍有大量 then 样板与「Promise 化」改造成本。","Generator + co：用 yield 暂停/恢复，可写出看起来同步的异步流程，但需要额外执行器。","async/await：语言级支持，同步写法 + 原生错误捕获 + 与 Promise 完全互通，是当前标准；缺点是容易误写成串行、顶层 await 需 ESM 环境支持。"],"bullets":[],"code":[],"note":"","text":"异步编程的演进：回调 → Promise → Generator → async/await。 回调：简单但易形成回调地狱、无法用 try/catch 捕获异步错误、控制反转（信任问题）。 Promise：链式、错误冒泡、状态不可逆，但仍有大量 then 样板与「Promise 化」改造成本。 Generator + co：用 yield 暂停/恢复，可写出看起来同步的异步流程，但需要额外执行器。 async/await：语言级支持，同步写法 + 原生错误捕获 + 与 Promise 完全互通，是当前标准；缺点是容易误写成串行、顶层 await 需 ESM 环境支持。"},{"id":56,"num":"Q056","tag":"概念","title":"什么是 Promise 穿透、值吸收与 thenable？","answers":["值穿透：then() 不传回调时，Promise 会把上一个结果原样传给下一个 then（规范里 onFulfilled 缺省时替换为 v => v）。","thenable：任何带 then 方法的对象或函数；Promise Resolution Procedure 会尝试调用它的 then 并把决议权交给它，因此可以实现与第三方 Promise 库互通，也带来「then 被反复读取」的安全风险（规范规定只取一次并加锁）。","Promise.resolve(thenable) 会展开它；Promise.reject(thenable) 不会展开，直接把 thenable 当 reason。"],"bullets":[],"code":[],"note":"","text":"什么是 Promise 穿透、值吸收与 thenable？ 值穿透：then() 不传回调时，Promise 会把上一个结果原样传给下一个 then（规范里 onFulfilled 缺省时替换为 v => v）。 thenable：任何带 then 方法的对象或函数；Promise Resolution Procedure 会尝试调用它的 then 并把决议权交给它，因此可以实现与第三方 Promise 库互通，也带来「then 被反复读取」的安全风险（规范规定只取一次并加锁）。 Promise.resolve(thenable) 会展开它；Promise.reject(thenable) 不会展开，直接把 thenable 当 reason。"},{"id":57,"num":"Q057","tag":"场景","title":"unhandledrejection 与全局错误如何处理？","answers":["浏览器监听 window.addEventListener('unhandledrejection', e => ...) 与 'error' 事件；Node 用 process.on('unhandledRejection') / 'uncaughtException'。","线上应接入前端监控 SDK：捕获 JS 运行时错误、资源加载错误（capture 阶段监听）、未处理 Promise 拒绝、接口异常，配合 sourcemap 还原堆栈与用户行为面包屑。"],"bullets":[],"code":[],"note":"","text":"unhandledrejection 与全局错误如何处理？ 浏览器监听 window.addEventListener('unhandledrejection', e => ...) 与 'error' 事件；Node 用 process.on('unhandledRejection') / 'uncaughtException'。 线上应接入前端监控 SDK：捕获 JS 运行时错误、资源加载错误（capture 阶段监听）、未处理 Promise 拒绝、接口异常，配合 sourcemap 还原堆栈与用户行为面包屑。"}]},{"id":"day2-s3","day":2,"title":"2.3 ES6+ 语法与特性","note":"","questions":[{"id":58,"num":"Q058","tag":"对比","title":"箭头函数与普通函数的区别？","answers":["① 没有自己的 this / arguments / super / new.target，沿词法作用域继承外层；② 不能作为构造函数（无 prototype，new 会抛 TypeError）；③ 不能用 yield（不能做生成器）；④ 语法更简洁，单表达式可隐式返回，返回对象字面量要加括号；⑤ call/apply/bind 无法改变其 this（但能传参）。","适用场景：回调、数组方法、需要固定 this 的简短函数；不适用场景：对象方法（需要 this 指向对象）、构造函数、需要 arguments、原型方法、事件处理里需要 this 指向 DOM 元素时。"],"bullets":[],"code":[],"note":"","text":"箭头函数与普通函数的区别？ ① 没有自己的 this / arguments / super / new.target，沿词法作用域继承外层；② 不能作为构造函数（无 prototype，new 会抛 TypeError）；③ 不能用 yield（不能做生成器）；④ 语法更简洁，单表达式可隐式返回，返回对象字面量要加括号；⑤ call/apply/bind 无法改变其 this（但能传参）。 适用场景：回调、数组方法、需要固定 this 的简短函数；不适用场景：对象方法（需要 this 指向对象）、构造函数、需要 arguments、原型方法、事件处理里需要 this 指向 DOM 元素时。"},{"id":59,"num":"Q059","tag":"基础","title":"解构赋值、模板字符串、展开/剩余运算符的用法与坑？","answers":["解构支持数组按位置、对象按属性名，可设默认值、别名、嵌套解构、剩余收集；默认值只在值为 undefined 时生效（null 不触发）。","模板字符串支持多行、插值 ${}、标签模板（tagged template，可用于 styled-components、防 XSS 转义、国际化）。","展开运算符 ... 用于数组/对象浅拷贝与合并（要求可迭代 / 可枚举），剩余参数必须放最后且只能有一个；对象展开不复制原型与不可枚举属性。"],"bullets":[],"code":[],"note":"","text":"解构赋值、模板字符串、展开/剩余运算符的用法与坑？ 解构支持数组按位置、对象按属性名，可设默认值、别名、嵌套解构、剩余收集；默认值只在值为 undefined 时生效（null 不触发）。 模板字符串支持多行、插值 ${}、标签模板（tagged template，可用于 styled-components、防 XSS 转义、国际化）。 展开运算符 ... 用于数组/对象浅拷贝与合并（要求可迭代 / 可枚举），剩余参数必须放最后且只能有一个；对象展开不复制原型与不可枚举属性。"},{"id":60,"num":"Q060","tag":"概念","title":"可选链 ?.、空值合并 ??、逻辑赋值运算符的区别？","answers":["?. 在引用为 null/undefined 时短路返回 undefined，不抛错（obj?.a?.b、fn?.()、arr?.[0]）；不能用于赋值左侧。","?? 只在左侧为 null 或 undefined 时返回右侧，与 || 不同（|| 会把 0、''、false 也当作假值），因此配置默认值、保留 0 更应该用 ??。","逻辑赋值：??=、||=、&&=；?? 与 ||/&& 不能无括号混用（语法错误）。"],"bullets":[],"code":[],"note":"","text":"可选链 ?.、空值合并 ??、逻辑赋值运算符的区别？ ?. 在引用为 null/undefined 时短路返回 undefined，不抛错（obj?.a?.b、fn?.()、arr?.[0]）；不能用于赋值左侧。 ?? 只在左侧为 null 或 undefined 时返回右侧，与 || 不同（|| 会把 0、''、false 也当作假值），因此配置默认值、保留 0 更应该用 ??。 逻辑赋值：??=、||=、&&=；?? 与 ||/&& 不能无括号混用（语法错误）。"},{"id":61,"num":"Q061","tag":"原理","title":"Symbol 的特性与内置 Symbol？","answers":["Symbol 是唯一且不可变的原始值，主要作为对象属性键（不参与 for...in / Object.keys，需用 Reflect.ownKeys 或 Object.getOwnPropertySymbols 获取），可避免属性名冲突。","Symbol.for(key) 会在全局注册表复用同一 Symbol，Symbol() 每次都新建；Symbol.keyFor 可反查全局注册的 key。","常用内置 well-known Symbol：Symbol.iterator（可迭代协议）、Symbol.toPrimitive（类型转换）、Symbol.toStringTag（影响 Object.prototype.toString）、Symbol.hasInstance（自定义 instanceof）、Symbol.species、Symbol.asyncIterator、Symbol.match/replace/search/split。"],"bullets":[],"code":[],"note":"","text":"Symbol 的特性与内置 Symbol？ Symbol 是唯一且不可变的原始值，主要作为对象属性键（不参与 for...in / Object.keys，需用 Reflect.ownKeys 或 Object.getOwnPropertySymbols 获取），可避免属性名冲突。 Symbol.for(key) 会在全局注册表复用同一 Symbol，Symbol() 每次都新建；Symbol.keyFor 可反查全局注册的 key。 常用内置 well-known Symbol：Symbol.iterator（可迭代协议）、Symbol.toPrimitive（类型转换）、Symbol.toStringTag（影响 Object.prototype.toString）、Symbol.hasInstance（自定义 instanceof）、Symbol.species、Symbol.asyncIterator、Symbol.match/replace/search/split。"},{"id":62,"num":"Q062","tag":"对比","title":"Set / Map / WeakSet / WeakMap 的区别与场景？","answers":["Set：值唯一集合（SameValueZero 比较，NaN 等于自身），有 add/delete/has/size，可迭代，常用于去重。","Map：键值对集合，键可以是任意类型（对象、函数、NaN），保持插入顺序，有 get/set/has/delete/size，可迭代；比普通对象更适合做字典（无原型污染、键类型不限、size 直接可用、频繁增删性能更好）。","WeakSet / WeakMap：键（或元素）必须是对象且为弱引用，不阻止 GC，因此不可遍历、没有 size；适合给 DOM 节点/对象挂私有元数据、缓存计算结果、避免内存泄漏。","注意：WeakMap 的 key 必须是对象，value 可以是任意值；弱的是 key，不是 value。"],"bullets":[],"code":[],"note":"","text":"Set / Map / WeakSet / WeakMap 的区别与场景？ Set：值唯一集合（SameValueZero 比较，NaN 等于自身），有 add/delete/has/size，可迭代，常用于去重。 Map：键值对集合，键可以是任意类型（对象、函数、NaN），保持插入顺序，有 get/set/has/delete/size，可迭代；比普通对象更适合做字典（无原型污染、键类型不限、size 直接可用、频繁增删性能更好）。 WeakSet / WeakMap：键（或元素）必须是对象且为弱引用，不阻止 GC，因此不可遍历、没有 size；适合给 DOM 节点/对象挂私有元数据、缓存计算结果、避免内存泄漏。 注意：WeakMap 的 key 必须是对象，value 可以是任意值；弱的是 key，不是 value。"},{"id":63,"num":"Q063","tag":"原理","title":"Proxy 与 Reflect 是什么？Object.defineProperty 为什么不够用？","answers":["Proxy 创建一个对象代理，可拦截 13 种基本操作（get/set/has/deleteProperty/ownKeys/getOwnPropertyDescriptor/defineProperty/preventExtensions/getPrototypeOf/setPrototypeOf/isExtensible/apply/construct），是真正的「元编程」能力。","Object.defineProperty 只能拦截单个属性的 get/set，无法感知属性新增/删除、数组 push/length 变化、in 操作符、Object.keys 等；Vue2 因此需要重写数组 7 个变异方法并额外提供 $set/$delete。","Reflect 提供与 Proxy trap 一一对应的默认行为方法，统一了原本散落在 Object 上的内部方法，且返回值更合理（如 Reflect.set 返回布尔而非抛错），配合 receiver 参数可正确修正 this 指向（Vue3 响应式的关键）。"],"bullets":[],"code":[],"note":"追问：Proxy 的缺点？兼容性（IE 不支持、无法 polyfill）、代理对象与原始对象 !==、需要配合 Reflect 保证 receiver 正确、对性能有轻微开销。","text":"Proxy 与 Reflect 是什么？Object.defineProperty 为什么不够用？ Proxy 创建一个对象代理，可拦截 13 种基本操作（get/set/has/deleteProperty/ownKeys/getOwnPropertyDescriptor/defineProperty/preventExtensions/getPrototypeOf/setPrototypeOf/isExtensible/apply/construct），是真正的「元编程」能力。 Object.defineProperty 只能拦截单个属性的 get/set，无法感知属性新增/删除、数组 push/length 变化、in 操作符、Object.keys 等；Vue2 因此需要重写数组 7 个变异方法并额外提供 $set/$delete。 Reflect 提供与 Proxy trap 一一对应的默认行为方法，统一了原本散落在 Object 上的内部方法，且返回值更合理（如 Reflect.set 返回布尔而非抛错），配合 receiver 参数可正确修正 this 指向（Vue3 响应式的关键）。 追问：Proxy 的缺点？兼容性（IE 不支持、无法 polyfill）、代理对象与原始对象 !==、需要配合 Reflect 保证 receiver 正确、对性能有轻微开销。"},{"id":64,"num":"Q064","tag":"原理","title":"迭代器（Iterator）与生成器（Generator）？","answers":["可迭代协议：对象实现 [Symbol.iterator]() 返回一个迭代器；迭代器协议：有 next() 返回 {value, done}。数组、字符串、Set、Map、arguments、NodeList 原生可迭代。","生成器 function* 用 yield 暂停/恢复执行，返回的是迭代器对象（同时也是可迭代的）；next(v) 可向内部传值，throw 可向内部抛错，return 可提前结束；yield* 可委托给另一个可迭代对象。","应用：自定义遍历、惰性计算/无限序列、异步流程控制（co / async-await 雏形）、大数据分批处理、redux-saga。"],"bullets":[],"code":[],"note":"","text":"迭代器（Iterator）与生成器（Generator）？ 可迭代协议：对象实现 [Symbol.iterator]() 返回一个迭代器；迭代器协议：有 next() 返回 {value, done}。数组、字符串、Set、Map、arguments、NodeList 原生可迭代。 生成器 function* 用 yield 暂停/恢复执行，返回的是迭代器对象（同时也是可迭代的）；next(v) 可向内部传值，throw 可向内部抛错，return 可提前结束；yield* 可委托给另一个可迭代对象。 应用：自定义遍历、惰性计算/无限序列、异步流程控制（co / async-await 雏形）、大数据分批处理、redux-saga。"},{"id":65,"num":"Q065","tag":"对比","title":"CommonJS、AMD、CMD、UMD、ESM 的区别？","answers":["CommonJS（Node）：require / module.exports，运行时同步加载，输出的是值的「拷贝」（原始类型拷贝、对象浅拷贝引用），模块首次加载后缓存，支持动态任意位置 require。","AMD（RequireJS）：define/require，依赖前置、异步加载，浏览器端；CMD（SeaJS）：就近依赖、延迟执行，更贴近 CommonJS 书写习惯。UMD 是兼容 CJS/AMD/全局变量的包装格式。","ESM（ES Module）：import/export，编译时静态分析（顶层、不能动态写在条件里，可用 import() 动态导入），输出「值的只读引用/绑定」——模块内部变量变化会反映到所有导入方；自动严格模式；支持 Tree Shaking、循环依赖更安全、支持 top-level await。","循环依赖：CJS 可能拿到不完整的 exports（因为按执行顺序取拷贝）；ESM 因为是 live binding，只要不在初始化阶段读取就不会出错（可能报 TDZ）。"],"bullets":[],"code":[],"note":"","text":"CommonJS、AMD、CMD、UMD、ESM 的区别？ CommonJS（Node）：require / module.exports，运行时同步加载，输出的是值的「拷贝」（原始类型拷贝、对象浅拷贝引用），模块首次加载后缓存，支持动态任意位置 require。 AMD（RequireJS）：define/require，依赖前置、异步加载，浏览器端；CMD（SeaJS）：就近依赖、延迟执行，更贴近 CommonJS 书写习惯。UMD 是兼容 CJS/AMD/全局变量的包装格式。 ESM（ES Module）：import/export，编译时静态分析（顶层、不能动态写在条件里，可用 import() 动态导入），输出「值的只读引用/绑定」——模块内部变量变化会反映到所有导入方；自动严格模式；支持 Tree Shaking、循环依赖更安全、支持 top-level await。 循环依赖：CJS 可能拿到不完整的 exports（因为按执行顺序取拷贝）；ESM 因为是 live binding，只要不在初始化阶段读取就不会出错（可能报 TDZ）。"},{"id":66,"num":"Q066","tag":"高频","title":"为什么 Tree Shaking 只对 ESM 有效？","answers":["Tree Shaking 依赖「静态分析」：ESM 的 import/export 是编译时确定的静态结构，打包器能在不执行代码的情况下判断哪些导出未被引用并剔除；CommonJS 的 require 可以是变量、可以写在条件/函数里，还可能在运行时给 exports 动态挂属性，无法静态推断。","生效前提：① 使用 ESM；② 打包器开启 production 优化；③ package.json 设 sideEffects: false 或数组标注有副作用的文件；④ 避免把整个模块赋值成对象再取属性（会阻碍分析）；⑤ Babel/TS 不要先把 ESM 转成 CJS。"],"bullets":[],"code":[],"note":"","text":"为什么 Tree Shaking 只对 ESM 有效？ Tree Shaking 依赖「静态分析」：ESM 的 import/export 是编译时确定的静态结构，打包器能在不执行代码的情况下判断哪些导出未被引用并剔除；CommonJS 的 require 可以是变量、可以写在条件/函数里，还可能在运行时给 exports 动态挂属性，无法静态推断。 生效前提：① 使用 ESM；② 打包器开启 production 优化；③ package.json 设 sideEffects: false 或数组标注有副作用的文件；④ 避免把整个模块赋值成对象再取属性（会阻碍分析）；⑤ Babel/TS 不要先把 ESM 转成 CJS。"},{"id":67,"num":"Q067","tag":"基础","title":"let/const 的暂时性死区、块级作用域在循环中的表现？","answers":["let 在 for 循环头部每次迭代都会创建一个新的绑定，并把上一轮的值复制过来，所以 setTimeout 里能拿到各自的值；这是「每次迭代新环境」而不是简单的块级作用域。","TDZ 存在于从块开始到声明语句之间的区域，typeof 一个 TDZ 中的变量也会抛 ReferenceError（与未声明变量不同）。"],"bullets":[],"code":[],"note":"","text":"let/const 的暂时性死区、块级作用域在循环中的表现？ let 在 for 循环头部每次迭代都会创建一个新的绑定，并把上一轮的值复制过来，所以 setTimeout 里能拿到各自的值；这是「每次迭代新环境」而不是简单的块级作用域。 TDZ 存在于从块开始到声明语句之间的区域，typeof 一个 TDZ 中的变量也会抛 ReferenceError（与未声明变量不同）。"},{"id":68,"num":"Q068","tag":"概念","title":"ES6 之后还有哪些高频新特性值得说？","answers":["ES2016：** 指数运算符、Array.includes；ES2017：Object.values/entries、padStart/padEnd、async/await、共享内存；ES2018：异步迭代、对象展开、Promise.finally；ES2019：flat/flatMap、Object.fromEntries、trimStart；ES2020：可选链、??、BigInt、Promise.allSettled、globalThis；ES2021：Promise.any、WeakRef、逻辑赋值、数字分隔符 1_000_000；ES2022：顶层 await、class 私有字段 #x、静态块、Array.at、Object.hasOwn、Error cause；ES2023：toSorted/toReversed/toSpliced/findLast、Array.fromAsync（后续）；ES2024：Promise.withResolvers、Object.groupBy、Map.groupBy、正则 v 标志。"],"bullets":[],"code":[],"note":"面试加分：能说出「ES 现在是按年份发布、TC39 四阶段流程（Stage 0~3 提案 → Stage 4 纳入标准）」会显得体系完整。","text":"ES6 之后还有哪些高频新特性值得说？ ES2016：** 指数运算符、Array.includes；ES2017：Object.values/entries、padStart/padEnd、async/await、共享内存；ES2018：异步迭代、对象展开、Promise.finally；ES2019：flat/flatMap、Object.fromEntries、trimStart；ES2020：可选链、??、BigInt、Promise.allSettled、globalThis；ES2021：Promise.any、WeakRef、逻辑赋值、数字分隔符 1_000_000；ES2022：顶层 await、class 私有字段 #x、静态块、Array.at、Object.hasOwn、Error cause；ES2023：toSorted/toReversed/toSpliced/findLast、Array.fromAsync（后续）；ES2024：Promise.withResolvers、Object.groupBy、Map.groupBy、正则 v 标志。 面试加分：能说出「ES 现在是按年份发布、TC39 四阶段流程（Stage 0~3 提案 → Stage 4 纳入标准）」会显得体系完整。"}]},{"id":"day2-s4","day":2,"title":"2.4 DOM 事件与异步常见场景","note":"","questions":[{"id":69,"num":"Q069","tag":"原理","title":"DOM 事件流三个阶段？事件委托的原理与好处？","answers":["捕获阶段（window → document → ... → 目标父级）→ 目标阶段 → 冒泡阶段（目标 → 父级 → window）。addEventListener 第三个参数 useCapture 为 true 时在捕获阶段触发；{capture, once, passive} 是更现代的配置。","事件委托：利用事件冒泡，把监听器绑在父元素上，通过 event.target 判断实际触发元素（配合 closest / matches）。好处：减少监听器数量与内存占用、动态新增子元素无需重新绑定；坏处：不冒泡的事件（focus/blur/mouseenter/mouseleave）不适用，需要额外判断层数。","阻止：stopPropagation 阻止继续传播、stopImmediatePropagation 还阻止同元素剩余监听器、preventDefault 阻止默认行为（passive: true 时 preventDefault 无效）。"],"bullets":[],"code":[],"note":"","text":"DOM 事件流三个阶段？事件委托的原理与好处？ 捕获阶段（window → document → ... → 目标父级）→ 目标阶段 → 冒泡阶段（目标 → 父级 → window）。addEventListener 第三个参数 useCapture 为 true 时在捕获阶段触发；{capture, once, passive} 是更现代的配置。 事件委托：利用事件冒泡，把监听器绑在父元素上，通过 event.target 判断实际触发元素（配合 closest / matches）。好处：减少监听器数量与内存占用、动态新增子元素无需重新绑定；坏处：不冒泡的事件（focus/blur/mouseenter/mouse
