leave）不适用，需要额外判断层数。 阻止：stopPropagation 阻止继续传播、stopImmediatePropagation 还阻止同元素剩余监听器、preventDefault 阻止默认行为（passive: true 时 preventDefault 无效）。"},{"id":70,"num":"Q070","tag":"对比","title":"mouseover 与 mouseenter、target 与 currentTarget 的区别？","answers":["mouseover/mouseout 会冒泡，移到子元素时也会触发；mouseenter/mouseleave 不冒泡，只在进出元素边界时触发一次，性能更好。同理有 mouseover→mouseenter 的一一对应关系。","event.target 是实际触发事件的最深层元素；event.currentTarget 是绑定监听器的那个元素（等于监听器内的 this，箭头函数除外）。"],"bullets":[],"code":[],"note":"","text":"mouseover 与 mouseenter、target 与 currentTarget 的区别？ mouseover/mouseout 会冒泡，移到子元素时也会触发；mouseenter/mouseleave 不冒泡，只在进出元素边界时触发一次，性能更好。同理有 mouseover→mouseenter 的一一对应关系。 event.target 是实际触发事件的最深层元素；event.currentTarget 是绑定监听器的那个元素（等于监听器内的 this，箭头函数除外）。"},{"id":71,"num":"Q071","tag":"场景","title":"Ajax / fetch / axios 的区别？fetch 有哪些坑？","answers":["XMLHttpRequest 是老式回调 API；fetch 是浏览器原生 Promise API，语义更现代；axios 基于 XHR（浏览器）/http（Node）封装，提供拦截器、自动 JSON 转换、取消、超时、进度、统一错误处理。","fetch 的坑：① 只有网络错误才 reject，HTTP 4xx/5xx 仍会 resolve，需手动检查 res.ok；② 默认不带 cookie，需 credentials: 'include'；③ 没有原生超时（用 AbortController）与上传进度；④ 响应体只能读一次（body 是流，需要 clone()）；⑤ 不支持请求/响应拦截，需自己封装。"],"bullets":[],"code":[],"note":"","text":"Ajax / fetch / axios 的区别？fetch 有哪些坑？ XMLHttpRequest 是老式回调 API；fetch 是浏览器原生 Promise API，语义更现代；axios 基于 XHR（浏览器）/http（Node）封装，提供拦截器、自动 JSON 转换、取消、超时、进度、统一错误处理。 fetch 的坑：① 只有网络错误才 reject，HTTP 4xx/5xx 仍会 resolve，需手动检查 res.ok；② 默认不带 cookie，需 credentials: 'include'；③ 没有原生超时（用 AbortController）与上传进度；④ 响应体只能读一次（body 是流，需要 clone()）；⑤ 不支持请求/响应拦截，需自己封装。"},{"id":72,"num":"Q072","tag":"场景","title":"防抖与节流的区别与应用场景？","answers":["防抖 debounce：事件停止触发 n 毫秒后才执行一次，中途再次触发则重新计时；适合搜索框联想、输入校验、窗口 resize 结束后重排、按钮防重复提交（立即执行版）。","节流 throttle：n 毫秒内最多执行一次，适合 scroll 加载、拖拽、鼠标移动、高频点击、滚动位置上报。","实现要点：防抖用闭包保存 timer 并 clearTimeout；节流可用时间戳或定时器实现，需要处理首次立即执行、末次补发、this 与参数透传、cancel 方法。完整代码见第 7 天。"],"bullets":[],"code":[],"note":"","text":"防抖与节流的区别与应用场景？ 防抖 debounce：事件停止触发 n 毫秒后才执行一次，中途再次触发则重新计时；适合搜索框联想、输入校验、窗口 resize 结束后重排、按钮防重复提交（立即执行版）。 节流 throttle：n 毫秒内最多执行一次，适合 scroll 加载、拖拽、鼠标移动、高频点击、滚动位置上报。 实现要点：防抖用闭包保存 timer 并 clearTimeout；节流可用时间戳或定时器实现，需要处理首次立即执行、末次补发、this 与参数透传、cancel 方法。完整代码见第 7 天。"},{"id":73,"num":"Q073","tag":"场景","title":"页面中有 10 万条数据如何渲染不卡顿？","answers":["① 虚拟列表（只渲染可视区 + 缓冲区的少量 DOM，通过滚动位置计算 startIndex 与 translateY 偏移，需要固定/可估算行高，不定高需缓存测量值）；② 时间分片（requestAnimationFrame / requestIdleCallback 分批插入，或 setTimeout 分片）；③ DocumentFragment 批量插入减少回流；④ 分页 / 无限滚动 + 数据懒加载；⑤ 用 canvas 渲染超大规模表格；⑥ 避免每条数据都挂事件监听，用事件委托。"],"bullets":[],"code":[],"note":"追问：虚拟列表如何处理不定高？维护一个位置缓存数组 + 二分查找定位，滚动时用预估高度先渲染再异步测量并修正偏移。","text":"页面中有 10 万条数据如何渲染不卡顿？ ① 虚拟列表（只渲染可视区 + 缓冲区的少量 DOM，通过滚动位置计算 startIndex 与 translateY 偏移，需要固定/可估算行高，不定高需缓存测量值）；② 时间分片（requestAnimationFrame / requestIdleCallback 分批插入，或 setTimeout 分片）；③ DocumentFragment 批量插入减少回流；④ 分页 / 无限滚动 + 数据懒加载；⑤ 用 canvas 渲染超大规模表格；⑥ 避免每条数据都挂事件监听，用事件委托。 追问：虚拟列表如何处理不定高？维护一个位置缓存数组 + 二分查找定位，滚动时用预估高度先渲染再异步测量并修正偏移。"}]}]},{"id":"day3","day":3,"title":"第 3 天｜HTML、CSS 与浏览器渲染","short":"HTML、CSS 与浏览器渲染","note":"目标：HTML/CSS 题看似简单，但「渲染流程 + BFC + 层叠上下文 + 居中方案」是区分度最高的四块。CSS 题一定要能边说边写出代码，光背概念不够。","sections":[{"id":"day3-s1","day":3,"title":"3.1 HTML 基础与语义化","note":"","questions":[{"id":74,"num":"Q074","tag":"基础","title":"DOCTYPE 的作用？标准模式与怪异模式有什么区别？","answers":["<!DOCTYPE html> 告诉浏览器使用哪个 HTML 规范解析文档，决定是否触发标准模式（Standards Mode）。HTML5 之前需要引用 DTD（如 HTML 4.01 Strict/Transitional），HTML5 不再基于 SGML，所以只需写 <!DOCTYPE html>。","怪异模式（Quirks Mode）为兼容老页面而存在，差异包括：盒模型默认 border-box 计算方式不同（IE 旧盒模型 width 含 padding+border）、行内元素垂直对齐、table 中字体继承、百分比高度解析、margin 塌陷处理、document.documentElement.clientWidth 取值等。","判断方式：document.compatMode 返回 'CSS1Compat'（标准）或 'BackCompat'（怪异）。"],"bullets":[],"code":[],"note":"","text":"DOCTYPE 的作用？标准模式与怪异模式有什么区别？ <!DOCTYPE html> 告诉浏览器使用哪个 HTML 规范解析文档，决定是否触发标准模式（Standards Mode）。HTML5 之前需要引用 DTD（如 HTML 4.01 Strict/Transitional），HTML5 不再基于 SGML，所以只需写 <!DOCTYPE html>。 怪异模式（Quirks Mode）为兼容老页面而存在，差异包括：盒模型默认 border-box 计算方式不同（IE 旧盒模型 width 含 padding+border）、行内元素垂直对齐、table 中字体继承、百分比高度解析、margin 塌陷处理、document.documentElement.clientWidth 取值等。 判断方式：document.compatMode 返回 'CSS1Compat'（标准）或 'BackCompat'（怪异）。"},{"id":75,"num":"Q075","tag":"概念","title":"什么是 HTML 语义化？好处是什么？","answers":["用正确的标签表达正确的内容结构：header/nav/main/article/section/aside/footer/h1~h6/p/ul/li/figure/time/strong/em 等，而不是全用 div + span。","好处：① 无障碍（屏幕阅读器、键盘导航可理解结构）；② SEO（爬虫更容易抓取权重与内容层级）；③ 可维护性与团队协作；④ 无 CSS/JS 时仍可读；⑤ 移动端/阅读模式适配更好。"],"bullets":[],"code":[],"note":"易考点：b 与 strong（strong 有语义强调）、i 与 em（em 强调语气）、title 与 h1（title 是浏览器标签/收藏标题与 SEO，h1 是页面内容主标题）、img 的 alt（图片失效时的替代文本、无障碍与 SEO）与 title（悬停提示）。","text":"什么是 HTML 语义化？好处是什么？ 用正确的标签表达正确的内容结构：header/nav/main/article/section/aside/footer/h1~h6/p/ul/li/figure/time/strong/em 等，而不是全用 div + span。 好处：① 无障碍（屏幕阅读器、键盘导航可理解结构）；② SEO（爬虫更容易抓取权重与内容层级）；③ 可维护性与团队协作；④ 无 CSS/JS 时仍可读；⑤ 移动端/阅读模式适配更好。 易考点：b 与 strong（strong 有语义强调）、i 与 em（em 强调语气）、title 与 h1（title 是浏览器标签/收藏标题与 SEO，h1 是页面内容主标题）、img 的 alt（图片失效时的替代文本、无障碍与 SEO）与 title（悬停提示）。"},{"id":76,"num":"Q076","tag":"对比","title":"link 与 @import 引入 CSS 的区别？","answers":["link 是 HTML 标签，属于 DOM 元素，页面加载时并行下载，权重与顺序可控，可被 JS 动态插入，兼容性好；@import 是 CSS 规则，必须写在样式表最前面，会等包含它的 CSS 下载解析完后才发起请求（串行），可能造成 FOUC 与渲染阻塞，且无法用 JS 动态控制。","结论：一律用 link；@import 只在 CSS 预处理器/组件化按需合并时内部使用（构建后会被打平）。"],"bullets":[],"code":[],"note":"","text":"link 与 @import 引入 CSS 的区别？ link 是 HTML 标签，属于 DOM 元素，页面加载时并行下载，权重与顺序可控，可被 JS 动态插入，兼容性好；@import 是 CSS 规则，必须写在样式表最前面，会等包含它的 CSS 下载解析完后才发起请求（串行），可能造成 FOUC 与渲染阻塞，且无法用 JS 动态控制。 结论：一律用 link；@import 只在 CSS 预处理器/组件化按需合并时内部使用（构建后会被打平）。"},{"id":77,"num":"Q077","tag":"高频","title":"script 的 defer 与 async 有什么区别？","answers":["普通 <script>：下载与执行都会阻塞 HTML 解析，执行完才继续解析，所以一般放 body 末尾。","defer：异步下载、不阻塞解析，等 HTML 解析完成、DOMContentLoaded 之前按文档顺序执行；适合有依赖顺序、需要操作 DOM 的脚本。","async：异步下载、下载完立即执行，执行时仍会阻塞解析，且多个 async 脚本执行顺序不确定；适合完全独立、不操作 DOM 的脚本（统计、广告）。","两者都只对外部脚本有效（有 src），且 async 优先级高于 defer（同时写时以 async 为准）；type=\"module\" 默认具备 defer 行为。"],"bullets":[],"code":[],"note":"","text":"script 的 defer 与 async 有什么区别？ 普通 <script>：下载与执行都会阻塞 HTML 解析，执行完才继续解析，所以一般放 body 末尾。 defer：异步下载、不阻塞解析，等 HTML 解析完成、DOMContentLoaded 之前按文档顺序执行；适合有依赖顺序、需要操作 DOM 的脚本。 async：异步下载、下载完立即执行，执行时仍会阻塞解析，且多个 async 脚本执行顺序不确定；适合完全独立、不操作 DOM 的脚本（统计、广告）。 两者都只对外部脚本有效（有 src），且 async 优先级高于 defer（同时写时以 async 为准）；type=\"module\" 默认具备 defer 行为。"},{"id":78,"num":"Q078","tag":"基础","title":"HTML5 新增了哪些特性？移除了哪些元素？","answers":["新增：语义化标签、canvas/svg、video/audio、localStorage/sessionStorage、IndexedDB、Web Workers、WebSocket、Geolocation、拖放 API、History API（pushState）、表单新类型（email/date/range/number/color）与属性（placeholder/required/autocomplete/pattern）、web SQL 废弃、contenteditable、data-* 自定义属性、拖放、SVG 内联、WebRTC、requestAnimationFrame 等。","移除/废弃：纯表现层标签 font/center/big/strike/u/s、frame/frameset/noframes、acronym/applet/basefont/dir 等；用 CSS 与语义标签替代。"],"bullets":[],"code":[],"note":"","text":"HTML5 新增了哪些特性？移除了哪些元素？ 新增：语义化标签、canvas/svg、video/audio、localStorage/sessionStorage、IndexedDB、Web Workers、WebSocket、Geolocation、拖放 API、History API（pushState）、表单新类型（email/date/range/number/color）与属性（placeholder/required/autocomplete/pattern）、web SQL 废弃、contenteditable、data-* 自定义属性、拖放、SVG 内联、WebRTC、requestAnimationFrame 等。 移除/废弃：纯表现层标签 font/center/big/strike/u/s、frame/frameset/noframes、acronym/applet/basefont/dir 等；用 CSS 与语义标签替代。"},{"id":79,"num":"Q079","tag":"对比","title":"Cookie、localStorage、sessionStorage、IndexedDB 的区别？","answers":["Cookie：4KB 左右，随每次同源 HTTP 请求自动携带（浪费带宽），可设 expires/max-age、domain/path、HttpOnly（防 JS 读取）、Secure、SameSite；适合会话标识，不适合存大量数据。","localStorage：约 5MB，同源持久存储，除非手动清除否则永不过期，跨标签页共享（storage 事件可通信），只存字符串。","sessionStorage：约 5MB，仅当前标签页/会话有效，关闭标签页即清除，刷新保留，新开标签页不共享（从当前页 window.open 的会复制一份独立副本）。","IndexedDB：浏览器端事务型 NoSQL 数据库，容量大（通常为磁盘配额的比例），支持索引、异步、结构化克隆，适合离线缓存、大量结构化数据。","共同点：都受同源策略限制；都不宜存敏感信息（XSS 可读 localStorage），敏感令牌优先放 HttpOnly + Secure Cookie。"],"bullets":[],"code":[],"note":"","text":"Cookie、localStorage、sessionStorage、IndexedDB 的区别？ Cookie：4KB 左右，随每次同源 HTTP 请求自动携带（浪费带宽），可设 expires/max-age、domain/path、HttpOnly（防 JS 读取）、Secure、SameSite；适合会话标识，不适合存大量数据。 localStorage：约 5MB，同源持久存储，除非手动清除否则永不过期，跨标签页共享（storage 事件可通信），只存字符串。 sessionStorage：约 5MB，仅当前标签页/会话有效，关闭标签页即清除，刷新保留，新开标签页不共享（从当前页 window.open 的会复制一份独立副本）。 IndexedDB：浏览器端事务型 NoSQL 数据库，容量大（通常为磁盘配额的比例），支持索引、异步、结构化克隆，适合离线缓存、大量结构化数据。 共同点：都受同源策略限制；都不宜存敏感信息（XSS 可读 localStorage），敏感令牌优先放 HttpOnly + Secure Cookie。"},{"id":80,"num":"Q080","tag":"场景","title":"如何实现浏览器多个标签页之间通信？","answers":["① localStorage 的 storage 事件（同域、当前页不触发、其他标签页触发，最常用）；② BroadcastChannel API（同源，语义最清晰）；③ SharedWorker（同源，可维护共享状态与长连接）；④ WebSocket / SSE 经由服务端转发；⑤ IndexedDB 轮询或 postMessage + window.open 引用；⑥ cookie 轮询（已少用）。","注意 storage 事件只在同一浏览器同一源、且值真正发生变化时触发；BroadcastChannel 需要显式 close 避免泄漏。"],"bullets":[],"code":[],"note":"","text":"如何实现浏览器多个标签页之间通信？ ① localStorage 的 storage 事件（同域、当前页不触发、其他标签页触发，最常用）；② BroadcastChannel API（同源，语义最清晰）；③ SharedWorker（同源，可维护共享状态与长连接）；④ WebSocket / SSE 经由服务端转发；⑤ IndexedDB 轮询或 postMessage + window.open 引用；⑥ cookie 轮询（已少用）。 注意 storage 事件只在同一浏览器同一源、且值真正发生变化时触发；BroadcastChannel 需要显式 close 避免泄漏。"},{"id":81,"num":"Q081","tag":"对比","title":"Canvas 与 SVG 的区别？","answers":["Canvas 是位图、基于像素的立即模式绘图 API，通过 JS 逐帧绘制，绘制后不保留图形对象，放大失真；适合大量对象、游戏、图表大数据量、图像处理、像素级操作。","SVG 是矢量、基于 XML 的保留模式，每个图形都是 DOM 节点，可用 CSS 设置样式、绑定事件、支持缩放不失真、可被搜索引擎索引、方便无障碍；适合图标、地图、中小规模交互图表、需要动画与响应式缩放的场景。","性能分界：对象数量少（数百）用 SVG 更方便，上千上万个对象或高频重绘用 Canvas / WebGL。"],"bullets":[],"code":[],"note":"","text":"Canvas 与 SVG 的区别？ Canvas 是位图、基于像素的立即模式绘图 API，通过 JS 逐帧绘制，绘制后不保留图形对象，放大失真；适合大量对象、游戏、图表大数据量、图像处理、像素级操作。 SVG 是矢量、基于 XML 的保留模式，每个图形都是 DOM 节点，可用 CSS 设置样式、绑定事件、支持缩放不失真、可被搜索引擎索引、方便无障碍；适合图标、地图、中小规模交互图表、需要动画与响应式缩放的场景。 性能分界：对象数量少（数百）用 SVG 更方便，上千上万个对象或高频重绘用 Canvas / WebGL。"},{"id":82,"num":"Q082","tag":"场景","title":"前端 SEO 需要注意什么？","answers":["① 服务端渲染 / 预渲染（SSR、SSG、Prerender），因为纯 CSR 的初始 HTML 空壳不利于抓取；② 语义化标签与合理的 h1~h6 层级（一个页面一个 h1）；③ title / description / keywords（后者已基本无效）/ canonical / Open Graph；④ 图片加 alt、给链接用真实 href；⑤ 合理的 URL、sitemap.xml、robots.txt；⑥ 首屏性能（Core Web Vitals 已纳入排名因素）；⑦ 结构化数据 JSON-LD（Schema.org）；⑧ 避免大量 iframe、避免重要内容靠 JS 异步注入；⑨ 移动端适配与 HTTPS。"],"bullets":[],"code":[],"note":"","text":"前端 SEO 需要注意什么？ ① 服务端渲染 / 预渲染（SSR、SSG、Prerender），因为纯 CSR 的初始 HTML 空壳不利于抓取；② 语义化标签与合理的 h1~h6 层级（一个页面一个 h1）；③ title / description / keywords（后者已基本无效）/ canonical / Open Graph；④ 图片加 alt、给链接用真实 href；⑤ 合理的 URL、sitemap.xml、robots.txt；⑥ 首屏性能（Core Web Vitals 已纳入排名因素）；⑦ 结构化数据 JSON-LD（Schema.org）；⑧ 避免大量 iframe、避免重要内容靠 JS 异步注入；⑨ 移动端适配与 HTTPS。"},{"id":83,"num":"Q083","tag":"概念","title":"attribute 与 property 的区别？disabled 与 readonly？","answers":["attribute 是 HTML 标签上的字符串属性（getAttribute/setAttribute），property 是 DOM 对象上的 JS 属性；多数 attribute 与 property 一一对应（id、class→className），但 value/checked/selected 特殊：property 反映当前实时状态，attribute 反映初始 HTML 值。","disabled：表单元素禁用、不参与校验、不随表单提交、值不被提交；readonly：只读但值会提交，且只对 input/textarea 有效，用户仍可聚焦复制。"],"bullets":[],"code":[],"note":"","text":"attribute 与 property 的区别？disabled 与 readonly？ attribute 是 HTML 标签上的字符串属性（getAttribute/setAttribute），property 是 DOM 对象上的 JS 属性；多数 attribute 与 property 一一对应（id、class→className），但 value/checked/selected 特殊：property 反映当前实时状态，attribute 反映初始 HTML 值。 disabled：表单元素禁用、不参与校验、不随表单提交、值不被提交；readonly：只读但值会提交，且只对 input/textarea 有效，用户仍可聚焦复制。"}]},{"id":"day3-s2","day":3,"title":"3.2 浏览器渲染原理","note":"","questions":[{"id":84,"num":"Q084","tag":"必考","title":"浏览器从拿到 HTML 到页面显示，中间发生了什么？","answers":["① 解析 HTML 构建 DOM 树（遇到 CSS 并行下载并构建 CSSOM，遇到 JS 会阻塞/暂停解析）；② DOM + CSSOM 合成渲染树 Render Tree（不含 display:none、head 等不可见节点）；③ 布局 Layout/Reflow：计算每个节点的几何位置与尺寸；④ 绘制 Paint：生成绘制记录，填充像素（背景、文字、边框等）；⑤ 合成 Composite：按层（Layer）栅格化，由合成线程合成并输出到屏幕。","随后还有交互阶段的回流/重绘与 JS 执行；首屏相关事件：DOMContentLoaded（HTML 解析完、defer 脚本执行完，不等待图片等资源）、load（所有资源加载完）。"],"bullets":[],"code":[],"note":"加分：现代浏览器是多进程架构（Browser / Renderer / GPU / Network / Plugin 进程），渲染进程内有主线程、合成线程、光栅化线程；CSS 是「渲染阻塞资源」，JS 是「解析阻塞资源」。","text":"浏览器从拿到 HTML 到页面显示，中间发生了什么？ ① 解析 HTML 构建 DOM 树（遇到 CSS 并行下载并构建 CSSOM，遇到 JS 会阻塞/暂停解析）；② DOM + CSSOM 合成渲染树 Render Tree（不含 display:none、head 等不可见节点）；③ 布局 Layout/Reflow：计算每个节点的几何位置与尺寸；④ 绘制 Paint：生成绘制记录，填充像素（背景、文字、边框等）；⑤ 合成 Composite：按层（Layer）栅格化，由合成线程合成并输出到屏幕。 随后还有交互阶段的回流/重绘与 JS 执行；首屏相关事件：DOMContentLoaded（HTML 解析完、defer 脚本执行完，不等待图片等资源）、load（所有资源加载完）。 加分：现代浏览器是多进程架构（Browser / Renderer / GPU / Network / Plugin 进程），渲染进程内有主线程、合成线程、光栅化线程；CSS 是「渲染阻塞资源」，JS 是「解析阻塞资源」。"},{"id":85,"num":"Q085","tag":"原理","title":"CSS 和 JS 分别是如何阻塞渲染的？","answers":["CSS 不阻塞 DOM 解析，但阻塞渲染（Render Tree 需要 CSSOM）与 JS 执行（JS 可能要读样式，所以浏览器会等前面的 CSS 加载完再执行 JS）。因此 CSS 放 head 里尽早加载，避免 FOUC。","JS 默认阻塞 HTML 解析（因为可能 document.write 改 DOM）；加 defer/async 可解除下载阻塞。CSS 放最前面、JS 放最后或加 defer，是优化关键渲染路径的核心。","浏览器有预解析（Preload Scanner）：主线程被阻塞时，后台线程仍会扫描后续 HTML 提前发起资源请求；<link rel=preload/prefetch/preconnect/dns-prefetch> 可主动提示优先级。"],"bullets":[],"code":[],"note":"","text":"CSS 和 JS 分别是如何阻塞渲染的？ CSS 不阻塞 DOM 解析，但阻塞渲染（Render Tree 需要 CSSOM）与 JS 执行（JS 可能要读样式，所以浏览器会等前面的 CSS 加载完再执行 JS）。因此 CSS 放 head 里尽早加载，避免 FOUC。 JS 默认阻塞 HTML 解析（因为可能 document.write 改 DOM）；加 defer/async 可解除下载阻塞。CSS 放最前面、JS 放最后或加 defer，是优化关键渲染路径的核心。 浏览器有预解析（Preload Scanner）：主线程被阻塞时，后台线程仍会扫描后续 HTML 提前发起资源请求；<link rel=preload/prefetch/preconnect/dns-prefetch> 可主动提示优先级。"},{"id":86,"num":"Q086","tag":"高频","title":"什么是重排（回流）、重绘与合成？如何减少？","answers":["重排 Reflow：几何属性变化（宽高、位置、字体大小、增删 DOM、窗口 resize、读取 offset/scroll/client 系列或 getComputedStyle 触发强制同步布局），需要重新计算布局，代价最大，且会波及子元素与后续兄弟节点。","重绘 Repaint：外观变化但不影响布局（color、background、visibility、box-shadow），跳过布局只重画像素。","合成 Composite：只改 transform / opacity（且元素在独立合成层）时，跳过布局与绘制，由 GPU 合成，代价最小。","优化：① 批量修改样式（用 class 切换、cssText、先 display:none 再改再显示、DocumentFragment）；② 避免循环中交替读写布局属性（读写分离，缓存 offsetWidth）；③ 用 transform/top 替代 top/left 做动画；④ 对频繁动画元素用 will-change / translateZ(0) 提升合成层（勿滥用，占显存）；⑤ 用 requestAnimationFrame 合并帧内变更；⑥ 避免在布局抖动时频繁 getBoundingClientRect。"],"bullets":[],"code":[],"note":"","text":"什么是重排（回流）、重绘与合成？如何减少？ 重排 Reflow：几何属性变化（宽高、位置、字体大小、增删 DOM、窗口 resize、读取 offset/scroll/client 系列或 getComputedStyle 触发强制同步布局），需要重新计算布局，代价最大，且会波及子元素与后续兄弟节点。 重绘 Repaint：外观变化但不影响布局（color、background、visibility、box-shadow），跳过布局只重画像素。 合成 Composite：只改 transform / opacity（且元素在独立合成层）时，跳过布局与绘制，由 GPU 合成，代价最小。 优化：① 批量修改样式（用 class 切换、cssText、先 display:none 再改再显示、DocumentFragment）；② 避免循环中交替读写布局属性（读写分离，缓存 offsetWidth）；③ 用 transform/top 替代 top/left 做动画；④ 对频繁动画元素用 will-change / translateZ(0) 提升合成层（勿滥用，占显存）；⑤ 用 requestAnimationFrame 合并帧内变更；⑥ 避免在布局抖动时频繁 getBoundingClientRect。"},{"id":87,"num":"Q087","tag":"概念","title":"为什么操作 DOM 很慢？","answers":["DOM 不是纯 JS 对象，而是渲染引擎与 JS 引擎之间的跨语言/跨进程桥梁（JS 在 V8，DOM 在渲染引擎），每次访问都有桥接成本；更关键的是 DOM 修改会触发样式计算、布局、绘制、合成整条渲染流水线，频繁修改会造成大量重排重绘。","优化思路：减少 DOM 操作次数（批量、模板字符串一次性 innerHTML、DocumentFragment、虚拟 DOM 做差异合并）、缓存查询结果、事件委托减少监听器、动画用 CSS/transform。"],"bullets":[],"code":[],"note":"","text":"为什么操作 DOM 很慢？ DOM 不是纯 JS 对象，而是渲染引擎与 JS 引擎之间的跨语言/跨进程桥梁（JS 在 V8，DOM 在渲染引擎），每次访问都有桥接成本；更关键的是 DOM 修改会触发样式计算、布局、绘制、合成整条渲染流水线，频繁修改会造成大量重排重绘。 优化思路：减少 DOM 操作次数（批量、模板字符串一次性 innerHTML、DocumentFragment、虚拟 DOM 做差异合并）、缓存查询结果、事件委托减少监听器、动画用 CSS/transform。"},{"id":88,"num":"Q088","tag":"场景","title":"如何优化关键渲染路径（CRP）？","answers":["目标：最小化关键资源数量、字节数与关键路径长度。做法：① CSS 内联首屏关键样式、其余异步加载（media/print、preload + onload 切换）；② JS 加 defer/async、代码分割按需加载；③ 资源压缩（gzip/brotli）、minify、图片压缩与 WebP/AVIF；④ preconnect / dns-prefetch / preload 关键字体与 LCP 图片；⑤ 服务端 HTTP/2、CDN、缓存；⑥ 字体 font-display: swap 避免 FOIT；⑦ SSR/SSG 让首屏 HTML 直接可见；⑧ 减少第三方脚本。"],"bullets":[],"code":[],"note":"","text":"如何优化关键渲染路径（CRP）？ 目标：最小化关键资源数量、字节数与关键路径长度。做法：① CSS 内联首屏关键样式、其余异步加载（media/print、preload + onload 切换）；② JS 加 defer/async、代码分割按需加载；③ 资源压缩（gzip/brotli）、minify、图片压缩与 WebP/AVIF；④ preconnect / dns-prefetch / preload 关键字体与 LCP 图片；⑤ 服务端 HTTP/2、CDN、缓存；⑥ 字体 font-display: swap 避免 FOIT；⑦ SSR/SSG 让首屏 HTML 直接可见；⑧ 减少第三方脚本。"},{"id":89,"num":"Q089","tag":"概念","title":"CSS 选择器为什么从右往左解析？","answers":["浏览器用「从右向左」匹配：先找出所有最右侧选择器命中的候选元素，再向上验证祖先条件，能快速过滤掉绝大多数节点（若从左往右，需要遍历所有元素再逐个往下找后代，候选集几乎不缩小）。","优化：避免通配符与深层后代选择器、少用属性选择器与复杂伪类、给关键元素加类、控制选择器长度；现代浏览器的 Bloom Filter / 样式共享等技术已大幅降低开销，但保持选择器简洁仍是好习惯。"],"bullets":[],"code":[],"note":"","text":"CSS 选择器为什么从右往左解析？ 浏览器用「从右向左」匹配：先找出所有最右侧选择器命中的候选元素，再向上验证祖先条件，能快速过滤掉绝大多数节点（若从左往右，需要遍历所有元素再逐个往下找后代，候选集几乎不缩小）。 优化：避免通配符与深层后代选择器、少用属性选择器与复杂伪类、给关键元素加类、控制选择器长度；现代浏览器的 Bloom Filter / 样式共享等技术已大幅降低开销，但保持选择器简洁仍是好习惯。"}]},{"id":"day3-s3","day":3,"title":"3.3 CSS 核心概念","note":"","questions":[{"id":90,"num":"Q090","tag":"基础","title":"标准盒模型与 IE 盒模型的区别？box-sizing 怎么用？","answers":["标准盒模型（content-box）：width 只含 content，实际占宽 = width + padding + border + margin；IE/怪异盒模型（border-box）：width 已包含 content + padding + border，实际占宽 = width + margin。","全局设置 `*, *::before, *::after { box-sizing: border-box }` 是现代标准做法，布局计算更直观；注意 border-box 下 content 宽度会被压缩，padding 过大时内容区可能变 0。"],"bullets":[],"code":[],"note":"","text":"标准盒模型与 IE 盒模型的区别？box-sizing 怎么用？ 标准盒模型（content-box）：width 只含 content，实际占宽 = width + padding + border + margin；IE/怪异盒模型（border-box）：width 已包含 content + padding + border，实际占宽 = width + margin。 全局设置 `*, *::before, *::after { box-sizing: border-box }` 是现代标准做法，布局计算更直观；注意 border-box 下 content 宽度会被压缩，padding 过大时内容区可能变 0。"},{"id":91,"num":"Q091","tag":"必考","title":"CSS 选择器优先级如何计算？","answers":["按 (a, b, c, d) 四元组逐位比较：a = 内联 style（1,0,0,0）；b = ID 选择器个数；c = 类/属性/伪类个数；d = 元素/伪元素个数。从左到右逐位比大小，某位大者胜出，胜出后不再比较低位（所以「11 个类」也压不过 1 个 ID 是常见误区——实际上按位比较时 b 位不同已定胜负）。","特殊规则：!important 优先级最高（同层级比较时，作者 !important > 内联 !important 需看来源；用户 !important > 作者 !important）；同优先级后者覆盖前者；继承来的样式优先级最低（低于通配符）；:where() 权重为 0，:is()/:has()/否定伪类取参数中最高权重；!important 不参与层叠层（@layer）比较时按层顺序反转。","来源优先级（从低到高）：浏览器默认 < 用户普通 < 作者普通 < 动画 < 作者 !important < 用户 !important < 过渡。"],"bullets":[],"code":[],"note":"","text":"CSS 选择器优先级如何计算？ 按 (a, b, c, d) 四元组逐位比较：a = 内联 style（1,0,0,0）；b = ID 选择器个数；c = 类/属性/伪类个数；d = 元素/伪元素个数。从左到右逐位比大小，某位大者胜出，胜出后不再比较低位（所以「11 个类」也压不过 1 个 ID 是常见误区——实际上按位比较时 b 位不同已定胜负）。 特殊规则：!important 优先级最高（同层级比较时，作者 !important > 内联 !important 需看来源；用户 !important > 作者 !important）；同优先级后者覆盖前者；继承来的样式优先级最低（低于通配符）；:where() 权重为 0，:is()/:has()/否定伪类取参数中最高权重；!important 不参与层叠层（@layer）比较时按层顺序反转。 来源优先级（从低到高）：浏览器默认 < 用户普通 < 作者普通 < 动画 < 作者 !important < 用户 !important < 过渡。"},{"id":92,"num":"Q092","tag":"对比","title":"伪类与伪元素的区别？::before 与 :before？","answers":["伪类（单冒号，如 :hover/:focus/:nth-child/:not）表示元素的某种状态或位置，不创建新元素；伪元素（双冒号，如 ::before/::after/::first-line/::selection/::placeholder）创建或选中抽象的子部分，不在 DOM 树中。","CSS3 规定伪元素用双冒号以区分伪类，:before 是 CSS2 遗留写法，浏览器仍兼容；伪元素必须有 content 属性才渲染，默认是 inline 元素，不能用于替换元素（img、input）内部。"],"bullets":[],"code":[],"note":"","text":"伪类与伪元素的区别？::before 与 :before？ 伪类（单冒号，如 :hover/:focus/:nth-child/:not）表示元素的某种状态或位置，不创建新元素；伪元素（双冒号，如 ::before/::after/::first-line/::selection/::placeholder）创建或选中抽象的子部分，不在 DOM 树中。 CSS3 规定伪元素用双冒号以区分伪类，:before 是 CSS2 遗留写法，浏览器仍兼容；伪元素必须有 content 属性才渲染，默认是 inline 元素，不能用于替换元素（img、input）内部。"},{"id":93,"num":"Q093","tag":"基础","title":"哪些 CSS 属性可继承？","answers":["可继承：字体相关（font-family/size/weight/style/line-height）、文本相关（color、text-align、text-indent、letter-spacing、word-spacing、white-space、text-transform、direction）、visibility、cursor、list-style、quotes、border-collapse 等。","不可继承：盒模型（width/height/margin/padding/border）、display、position/float、background、opacity、transform、overflow（多数）等。","强制继承用 inherit；重置用 initial / unset / revert / revert-layer。"],"bullets":[],"code":[],"note":"","text":"哪些 CSS 属性可继承？ 可继承：字体相关（font-family/size/weight/style/line-height）、文本相关（color、text-align、text-indent、letter-spacing、word-spacing、white-space、text-transform、direction）、visibility、cursor、list-style、quotes、border-collapse 等。 不可继承：盒模型（width/height/margin/padding/border）、display、position/float、background、opacity、transform、overflow（多数）等。 强制继承用 inherit；重置用 initial / unset / revert / revert-layer。"},{"id":94,"num":"Q094","tag":"对比","title":"隐藏元素的几种方式及差异？","answers":["display:none：不占位、不渲染、不响应事件、不可被无障碍读取，会触发重排；visibility:hidden：占位、不可见、不响应事件、子元素可用 visibility:visible 覆盖，只触发重绘；opacity:0：占位、透明、仍响应事件、可被屏幕阅读器读取、会创建合成层；position:absolute + left:-9999px 或 clip-path：视觉隐藏但保留可访问性（屏幕阅读器方案）；content-visibility:hidden 跳过子树渲染但保留布局与可访问性。","追问：display:none 元素的 background-image 会不会加载？主流浏览器中一般不加载（Chrome 会跳过），但 img 的 src 在 DOM 解析阶段通常仍会发起请求。"],"bullets":[],"code":[],"note":"","text":"隐藏元素的几种方式及差异？ display:none：不占位、不渲染、不响应事件、不可被无障碍读取，会触发重排；visibility:hidden：占位、不可见、不响应事件、子元素可用 visibility:visible 覆盖，只触发重绘；opacity:0：占位、透明、仍响应事件、可被屏幕阅读器读取、会创建合成层；position:absolute + left:-9999px 或 clip-path：视觉隐藏但保留可访问性（屏幕阅读器方案）；content-visibility:hidden 跳过子树渲染但保留布局与可访问性。 追问：display:none 元素的 background-image 会不会加载？主流浏览器中一般不加载（Chrome 会跳过），但 img 的 src 在 DOM 解析阶段通常仍会发起请求。"},{"id":95,"num":"Q095","tag":"高频","title":"水平垂直居中有哪些方案？（至少说出 6 种）","answers":["① Flex：父 `display:flex; justify-content:center; align-items:center`（最常用）；② Grid：父 `display:grid; place-items:center` 或子 `margin:auto`；③ 绝对定位 + transform：`position:absolute; top:50%; left:50%; transform:translate(-50%,-50%)`（无需知道尺寸）；④ 绝对定位 + margin:auto：`top/right/bottom/left:0; margin:auto`（需固定宽高）；⑤ 绝对定位 + 负 margin（需知道宽高）；⑥ 父 `display:table-cell; vertical-align:middle; text-align:center` + 子 inline-block；⑦ line-height = height + text-align:center（单行文字）；⑧ 伪元素 + vertical-align 幽灵节点方案。","加分：Flex/Grid 方案天然支持内容尺寸自适应；transform 方案可能触发新的合成层且文字发虚（可用 translate3d 或整数像素规避）。"],"bullets":[],"code":[],"note":"","text":"水平垂直居中有哪些方案？（至少说出 6 种） ① Flex：父 `display:flex; justify-content:center; align-items:center`（最常用）；② Grid：父 `display:grid; place-items:center` 或子 `margin:auto`；③ 绝对定位 + transform：`position:absolute; top:50%; left:50%; transform:translate(-50%,-50%)`（无需知道尺寸）；④ 绝对定位 + margin:auto：`top/right/bottom/left:0; margin:auto`（需固定宽高）；⑤ 绝对定位 + 负 margin（需知道宽高）；⑥ 父 `display:table-cell; vertical-align:middle; text-align:center` + 子 inline-block；⑦ line-height = height + text-align:center（单行文字）；⑧ 伪元素 + vertical-align 幽灵节点方案。 加分：Flex/Grid 方案天然支持内容尺寸自适应；transform 方案可能触发新的合成层且文字发虚（可用 translate3d 或整数像素规避）。"},{"id":96,"num":"Q096","tag":"必考","title":"BFC 是什么？如何触发？能解决什么问题？","answers":["BFC（Block Formatting Context，块级格式化上下文）是一个独立的渲染区域，内部块级盒子按普通流垂直排列，内部布局不影响外部，外部也不影响内部。","触发条件：根元素 html；float 不为 none；position 为 absolute/fixed；display 为 inline-block / table-cell / table-caption / flex / grid / flow-root；overflow 不为 visible（hidden/auto/scroll）；contain: layout/content/paint。","作用：① 清除浮动（父元素触发 BFC 后高度会包含浮动子元素）；② 阻止上下相邻 margin 合并（塌陷）；③ 阻止元素被浮动元素覆盖，实现自适应两栏布局（右侧 overflow:hidden）。","推荐用 `display: flow-root` 触发，语义最干净、无 overflow 副作用。"],"bullets":[],"code":[],"note":"","text":"BFC 是什么？如何触发？能解决什么问题？ BFC（Block Formatting Context，块级格式化上下文）是一个独立的渲染区域，内部块级盒子按普通流垂直排列，内部布局不影响外部，外部也不影响内部。 触发条件：根元素 html；float 不为 none；position 为 absolute/fixed；display 为 inline-block / table-cell / table-caption / flex / grid / flow-root；overflow 不为 visible（hidden/auto/scroll）；contain: layout/content/paint。 作用：① 清除浮动（父元素触发 BFC 后高度会包含浮动子元素）；② 阻止上下相邻 margin 合并（塌陷）；③ 阻止元素被浮动元素覆盖，实现自适应两栏布局（右侧 overflow:hidden）。 推荐用 `display: flow-root` 触发，语义最干净、无 overflow 副作用。"},{"id":97,"num":"Q097","tag":"原理","title":"外边距塌陷（margin collapsing）的规则？","answers":["相邻兄弟元素的上下 margin 会合并，取两者较大值（同为正取最大，同为负取绝对值最大，一正一负取和）；父元素与第一个/最后一个子元素之间，若父没有 border/padding/inline 内容/BFC 隔离，上下 margin 会合并并「溢出」到父元素外侧；空块级元素自身上下 margin 也会合并。","避免：给父触发 BFC（overflow:hidden、flow-root）、加 border/padding、用 flex/grid 容器、改用 padding 或 gap。注意水平方向 margin 不会合并，行内元素与绝对定位元素不合并。"],"bullets":[],"code":[],"note":"","text":"外边距塌陷（margin collapsing）的规则？ 相邻兄弟元素的上下 margin 会合并，取两者较大值（同为正取最大，同为负取绝对值最大，一正一负取和）；父元素与第一个/最后一个子元素之间，若父没有 border/padding/inline 内容/BFC 隔离，上下 margin 会合并并「溢出」到父元素外侧；空块级元素自身上下 margin 也会合并。 避免：给父触发 BFC（overflow:hidden、flow-root）、加 border/padding、用 flex/grid 容器、改用 padding 或 gap。注意水平方向 margin 不会合并，行内元素与绝对定位元素不合并。"},{"id":98,"num":"Q098","tag":"原理","title":"清除浮动的方法与 clear 的原理？","answers":["方法：① 父元素触发 BFC（overflow:hidden / display:flow-root）；② 末尾加空元素 `clear:both`（多余标签，不推荐）；③ 伪元素 clearfix（推荐）：","④ 父元素也浮动或绝对定位（有副作用）。clear 的原理：给元素添加额外的「清除空间」，使其上边框边界下移到指定方向所有浮动元素的下边缘之下，从而撑开父容器高度。","zoom:1 是 IE 私有属性，用来触发 hasLayout 达到类似 BFC 的效果，属于历史 hack。"],"bullets":[],"code":[[".clearfix::after { content: ''; display: block; clear: both }"]],"note":"","text":"清除浮动的方法与 clear 的原理？ 方法：① 父元素触发 BFC（overflow:hidden / display:flow-root）；② 末尾加空元素 `clear:both`（多余标签，不推荐）；③ 伪元素 clearfix（推荐）： ④ 父元素也浮动或绝对定位（有副作用）。clear 的原理：给元素添加额外的「清除空间」，使其上边框边界下移到指定方向所有浮动元素的下边缘之下，从而撑开父容器高度。 zoom:1 是 IE 私有属性，用来触发 hasLayout 达到类似 BFC 的效果，属于历史 hack。 .clearfix::after { content: ''; display: block; clear: both }"},{"id":99,"num":"Q099","tag":"概念","title":"什么是层叠上下文（Stacking Context）？层叠顺序如何？","answers":["层叠上下文是元素在 z 轴上的独立渲染单元，内部子元素的 z-index 只在该上下文内比较，无法越过父级与外部元素比较。","触发条件：根元素；position 为 relative/absolute 且 z-index 不为 auto（flex/grid 子项 z-index 不为 auto 即可）；opacity < 1；transform / filter / backdrop-filter / perspective / clip-path / mask 不为 none；will-change 指定上述属性；isolation: isolate；contain: paint；mix-blend-mode 不为 normal。","同一层叠上下文内从底到顶大致顺序：背景/边框 → 负 z-index → 块级盒 → 浮动盒 → 行内/行内块 → z-index:0/auto 的定位元素 → 正 z-index。z-index 只在定位元素（或 flex/grid 子项）上生效。"],"bullets":[],"code":[],"note":"","text":"什么是层叠上下文（Stacking Context）？层叠顺序如何？ 层叠上下文是元素在 z 轴上的独立渲染单元，内部子元素的 z-index 只在该上下文内比较，无法越过父级与外部元素比较。 触发条件：根元素；position 为 relative/absolute 且 z-index 不为 auto（flex/grid 子项 z-index 不为 auto 即可）；opacity < 1；transform / filter / backdrop-filter / perspective / clip-path / mask 不为 none；will-change 指定上述属性；isolation: isolate；contain: paint；mix-blend-mode 不为 normal。 同一层叠上下文内从底到顶大致顺序：背景/边框 → 负 z-index → 块级盒 → 浮动盒 → 行内/行内块 → z-index:0/auto 的定位元素 → 正 z-index。z-index 只在定位元素（或 flex/grid 子项）上生效。"},{"id":100,"num":"Q100","tag":"对比","title":"Flex 布局常用属性与经典场景？","answers":["容器：display:flex、flex-direction、flex-wrap、justify-content（主轴）、align-items（交叉轴单行）、align-content（多行）、gap、flex-flow。","项目：flex: grow shrink basis（推荐简写 flex:1 = 1 1 0%）、align-self、order、flex-basis。","注意：`flex: 1` 的 basis 是 0% 而不是 auto，因此按内容均分会失败（等分内容不等宽），要按内容比例可用 flex:auto；flex 子项默认 min-width:auto 导致内容撑破不收缩，需设 min-width:0 才能触发文本省略。","经典场景：水平垂直居中、两栏/三栏自适应（侧栏固定 flex:0 0 200px + 主区 flex:1）、等高布局（align-items:stretch 默认）、粘性底部（margin-top:auto）、均分导航。"],"bullets":[],"code":[],"note":"","text":"Flex 布局常用属性与经典场景？ 容器：display:flex、flex-direction、flex-wrap、justify-content（主轴）、align-items（交叉轴单行）、align-content（多行）、gap、flex-flow。 项目：flex: grow shrink basis（推荐简写 flex:1 = 1 1 0%）、align-self、order、flex-basis。 注意：`flex: 1` 的 basis 是 0% 而不是 auto，因此按内容均分会失败（等分内容不等宽），要按内容比例可用 flex:auto；flex 子项默认 min-width:auto 导致内容撑破不收缩，需设 min-width:0 才能触发文本省略。 经典场景：水平垂直居中、两栏/三栏自适应（侧栏固定 flex:0 0 200px + 主区 flex:1）、等高布局（align-items:stretch 默认）、粘性底部（margin-top:auto）、均分导航。"},{"id":101,"num":"Q101","tag":"对比","title":"Grid 布局相比 Flex 的优势？","answers":["Flex 是一维（一行或一列），Grid 是二维（同时控制行列）。Grid 用 grid-template-columns/rows、fr、repeat(auto-fit, minmax(200px, 1fr))、gap、grid-area / grid-template-areas、auto-flow、place-items 等。","优势：二维对齐无需嵌套、自适应卡片布局一行代码 `repeat(auto-fill, minmax(240px, 1fr))`、可命名区域做整页骨架、行列间距 gap 不产生 margin 塌陷、支持隐式网格与 dense 填充。","实践建议：整体页面骨架 / 卡片墙用 Grid，组件内部一维排列用 Flex，两者常组合使用。"],"bullets":[],"code":[],"note":"","text":"Grid 布局相比 Flex 的优势？ Flex 是一维（一行或一列），Grid 是二维（同时控制行列）。Grid 用 grid-template-columns/rows、fr、repeat(auto-fit, minmax(200px, 1fr))、gap、grid-area / grid-template-areas、auto-flow、place-items 等。 优势：二维对齐无需嵌套、自适应卡片布局一行代码 `repeat(auto-fill, minmax(240px, 1fr))`、可命名区域做整页骨架、行列间距 gap 不产生 margin 塌陷、支持隐式网格与 dense 填充。 实践建议：整体页面骨架 / 卡片墙用 Grid，组件内部一维排列用 Flex，两者常组合使用。"},{"id":102,"num":"Q102","tag":"对比","title":"常见 CSS 布局实现：两栏、三栏、圣杯与双飞翼。","answers":["两栏（左固定右自适应）：Flex（左 flex:0 0 200px，右 flex:1）、BFC（左 float:left，右 overflow:hidden）、Grid（grid-template-columns: 200px 1fr）、绝对定位 + margin-left。","三栏（左右固定中间自适应）：Flex 最简；Grid 一行；圣杯布局用「全部左浮动 + 父 padding 留白 + 左负 margin + relative 定位」，中间栏优先渲染（DOM 顺序主内容在前，利于 SEO 与首屏）；双飞翼在中间栏内再嵌一层 div 用 margin 留白，避免相对定位。","等高：Flex align-items:stretch、Grid 默认拉伸、table-cell、padding-bottom 大值 + margin-bottom 负值 hack。"],"bullets":[],"code":[],"note":"","text":"常见 CSS 布局实现：两栏、三栏、圣杯与双飞翼。 两栏（左固定右自适应）：Flex（左 flex:0 0 200px，右 flex:1）、BFC（左 float:left，右 overflow:hidden）、Grid（grid-template-columns: 200px 1fr）、绝对定位 + margin-left。 三栏（左右固定中间自适应）：Flex 最简；Grid 一行；圣杯布局用「全部左浮动 + 父 padding 留白 + 左负 margin + relative 定位」，中间栏优先渲染（DOM 顺序主内容在前，利于 SEO 与首屏）；双飞翼在中间栏内再嵌一层 div 用 margin 留白，避免相对定位。 等高：Flex align-items:stretch、Grid 默认拉伸、table-cell、padding-bottom 大值 + margin-bottom 负值 hack。"},{"id":103,"num":"Q103","tag":"场景","title":"移动端 1px 问题与适配方案？","answers":["原因：高清屏 dpr=2/3 时，1 个 CSS 像素对应 2/3 个物理像素，直接写 border:1px 看起来偏粗。","方案：① 伪元素 + transform: scaleY(0.5)（最通用，配合 @media (-webkit-min-device-pixel-ratio: 2) 按 dpr 缩放）；② box-shadow: 0 0.5px 0；③ 直接写 0.5px（部分 iOS 支持，Android 不保证）；④ 用 border-image 或 SVG 画线；⑤ viewport 设 initial-scale=1/dpr（会造成整体适配复杂，已少用）。","适配方案：rem（配合 flexible / postcss-pxtorem，根据根字体大小换算）、vw/vh（1vw = 视口宽 1%，配合 postcss-px-to-viewport，注意与 rem 二选一）、Flex/Grid 弹性布局 + 媒体查询、响应式断点、容器查询 @container。"],"bullets":[],"code":[],"note":"","text":"移动端 1px 问题与适配方案？ 原因：高清屏 dpr=2/3 时，1 个 CSS 像素对应 2/3 个物理像素，直接写 border:1px 看起来偏粗。 方案：① 伪元素 + transform: scaleY(0.5)（最通用，配合 @media (-webkit-min-device-pixel-ratio: 2) 按 dpr 缩放）；② box-shadow: 0 0.5px 0；③ 直接写 0.5px（部分 iOS 支持，Android 不保证）；④ 用 border-image 或 SVG 画线；⑤ viewport 设 initial-scale=1/dpr（会造成整体适配复杂，已少用）。 适配方案：rem（配合 flexible / postcss-pxtorem，根据根字体大小换算）、vw/vh（1vw = 视口宽 1%，配合 postcss-px-to-viewport，注意与 rem 二选一）、Flex/Grid 弹性布局 + 媒体查询、响应式断点、容器查询 @container。"},{"id":104,"num":"Q104","tag":"对比","title":"transition、animation、transform 的区别与性能？","answers":["transition：需要触发条件（:hover、class 变化），只有起止两个状态，一次性、不可循环、不需要关键帧。","animation：用 @keyframes 定义多关键帧，可自动播放、循环（iteration-count）、alternate、延时、控制播放状态（animation-play-state），无需触发条件。","transform（translate/scale/rotate/skew）与 opacity 的动画只走合成阶段（跳过 Layout/Paint），性能最好；改变 top/left/width/height 触发布局，代价高。用 will-change 提前提升图层，但滥用会导致显存暴涨与图层爆炸。","JS 动画（setTimeout/rAF）灵活可做复杂物理效果，但主线程繁忙易掉帧；CSS 动画由合成线程驱动更流畅。rAF 的最小间隔 ≈ 1000/60 ≈ 16.7ms（高刷屏更小）。"],"bullets":[],"code":[],"note":"","text":"transition、animation、transform 的区别与性能？ transition：需要触发条件（:hover、class 变化），只有起止两个状态，一次性、不可循环、不需要关键帧。 animation：用 @keyframes 定义多关键帧，可自动播放、循环（iteration-count）、alternate、延时、控制播放状态（animation-play-state），无需触发条件。 transform（translate/scale/rotate/skew）与 opacity 的动画只走合成阶段（跳过 Layout/Paint），性能最好；改变 top/left/width/height 触发布局，代价高。用 will-change 提前提升图层，但滥用会导致显存暴涨与图层爆炸。 JS 动画（setTimeout/rAF）灵活可做复杂物理效果，但主线程繁忙易掉帧；CSS 动画由合成线程驱动更流畅。rAF 的最小间隔 ≈ 1000/60 ≈ 16.7ms（高刷屏更小）。"},{"id":105,"num":"Q105","tag":"概念","title":"设备像素、CSS 像素、DPR、PPI 与三种 viewport？","answers":["设备像素（物理像素）是屏幕实际发光点；CSS 像素是逻辑像素，1 CSS px 在 dpr=2 的屏上占 2×2 物理像素；DPR = 设备像素 / CSS 像素（window.devicePixelRatio）；PPI 是每英寸物理像素密度。","layout viewport（布局视口，文档宽度，移动端默认约 980px）、visual viewport（用户当前可见区域，可缩放/滚动）、ideal viewport（理想视口 = 设备宽度，通过 `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` 让 layout viewport 等于它）。"],"bullets":[],"code":[],"note":"","text":"设备像素、CSS 像素、DPR、PPI 与三种 viewport？ 设备像素（物理像素）是屏幕实际发光点；CSS 像素是逻辑像素，1 CSS px 在 dpr=2 的屏上占 2×2 物理像素；DPR = 设备像素 / CSS 像素（window.devicePixelRatio）；PPI 是每英寸物理像素密度。 layout viewport（布局视口，文档宽度，移动端默认约 980px）、visual viewport（用户当前可见区域，可缩放/滚动）、ideal viewport（理想视口 = 设备宽度，通过 `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` 让 layout viewport 等于它）。"},{"id":106,"num":"Q106","tag":"基础","title":"图片格式怎么选？CSS Sprites、base64 的利弊？","answers":["JPG：有损、体积小、不支持透明，适合照片；PNG：无损、支持 alpha 透明，体积大，适合图标/需要透明；GIF：256 色、支持简单动画；WebP：同时支持有损/无损/透明/动画，体积比 JPG/PNG 小约 25~35%；AVIF 压缩率更高但编码慢、兼容性略差；SVG：矢量、无损缩放、可被 CSS 控制，适合图标与简单图形。","CSS Sprites：把小图合并到一张大图用 background-position 定位，减少 HTTP 请求（HTTP/1.1 时代价值大）；缺点：维护成本高、单图失败影响全部、无法单独懒加载、放大模糊。HTTP/2 多路复用后收益下降，图标优先用 SVG / iconfont / 内联 SVG。","base64：内联减少请求，但体积增大约 1/3、无法独立缓存、阻塞 CSS/HTML 解析、无法懒加载；只适合极小且复用度高的图片（构建工具通常 <4KB 自动内联）。"],"bullets":[],"code":[],"note":"","text":"图片格式怎么选？CSS Sprites、base64 的利弊？ JPG：有损、体积小、不支持透明，适合照片；PNG：无损、支持 alpha 透明，体积大，适合图标/需要透明；GIF：256 色、支持简单动画；WebP：同时支持有损/无损/透明/动画，体积比 JPG/PNG 小约 25~35%；AVIF 压缩率更高但编码慢、兼容性略差；SVG：矢量、无损缩放、可被 CSS 控制，适合图标与简单图形。 CSS Sprites：把小图合并到一张大图用 background-position 定位，减少 HTTP 请求（HTTP/1.1 时代价值大）；缺点：维护成本高、单图失败影响全部、无法单独懒加载、放大模糊。HTTP/2 多路复用后收益下降，图标优先用 SVG / iconfont / 内联 SVG。 base64：内联减少请求，但体积增大约 1/3、无法独立缓存、阻塞 CSS/HTML 解析、无法懒加载；只适合极小且复用度高的图片（构建工具通常 <4KB 自动内联）。"},{"id":107,"num":"Q107","tag":"基础","title":"单行/多行文本溢出省略怎么写？","answers":["注意多行方案依赖 -webkit- 前缀（现代 Chrome/Safari/Firefox 已广泛支持 line-clamp），且必须配合 flex 子项 min-width:0 才能在 Flex 布局里生效。"],"bullets":[],"code":[["/* 单行 */",".ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }","/* 多行（WebKit 内核） */",".ellipsis2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }"]],"note":"","text":"单行/多行文本溢出省略怎么写？ 注意多行方案依赖 -webkit- 前缀（现代 Chrome/Safari/Firefox 已广泛支持 line-clamp），且必须配合 flex 子项 min-width:0 才能在 Flex 布局里生效。 /* 单行 */ .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap } /* 多行（WebKit 内核） */ .ellipsis2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }"},{"id":108,"num":"Q108","tag":"概念","title":"响应式设计、媒体查询、容器查询与 CSS 新特性？","answers":["响应式：一套代码适配多端，核心是流体网格（%/fr/vw）、弹性图片（max-width:100%）、媒体查询断点（@media (min-width: 768px)）与移动优先。","媒体查询基于「视口/设备」尺寸，容器查询 @container 基于「父容器」尺寸，组件级复用更合理：先给父 `container-type: inline-size`，再 `@container (min-width: 400px) { ... }`。","其它高频新特性：:has()（父选择器 / 「根据子元素选父元素」）、:is()/:where()（选择器列表简化、权重差异）、@layer（层叠层，控制优先级）、subgrid、color-mix()、CSS 变量 --var + var()、逻辑属性 margin-inline/padding-block、aspect-ratio、gap、scroll-snap、backdrop-filter。"],"bullets":[],"code":[],"note":"","text":"响应式设计、媒体查询、容器查询与 CSS 新特性？ 响应式：一套代码适配多端，核心是流体网格（%/fr/vw）、弹性图片（max-width:100%）、媒体查询断点（@media (min-width: 768px)）与移动优先。 媒体查询基于「视口/设备」尺寸，容器查询 @container 基于「父容器」尺寸，组件级复用更合理：先给父 `container-type: inline-size`，再 `@container (min-width: 400px) { ... }`。 其它高频新特性：:has()（父选择器 / 「根据子元素选父元素」）、:is()/:where()（选择器列表简化、权重差异）、@layer（层叠层，控制优先级）、subgrid、color-mix()、CSS 变量 --var + var()、逻辑属性 margin-inline/padding-block、aspect-ratio、gap、scroll-snap、backdrop-filter。"}]}]},{"id":"day4","day":4,"title":"第 4 天｜浏览器、网络协议与前端安全","short":"浏览器、网络协议与前端安全","note":"目标：把「输入 URL 发生了什么」这条主线拉通，它能一题带出 DNS、TCP、TLS、HTTP、缓存、渲染、跨域、安全十余个考点，是最值得准备的一条「串题」。","sections":[{"id":"day4-s1","day":4,"title":"4.1 从输入 URL 到页面显示（超级串题）","note":"","questions":[{"id":109,"num":"Q109","tag":"必考","title":"在浏览器地址栏输入 URL 并回车，到页面显示，发生了什么？","answers":["① 解析 URL：补全协议（https）、分析域名/端口/路径/参数/片段标识符（# 后的片段不会发给服务器）。","② DNS 解析：依次查浏览器缓存 → 系统缓存 / hosts → 本地 DNS 服务器（递归）→ 根域 → 顶级域 → 权威域名服务器，拿到 IP；期间可用 DNS 预取（dns-prefetch）与 CDN 调度。","③ 建立连接：TCP 三次握手（SYN → SYN+ACK → ACK），若是 HTTPS 还要进行 TLS 握手协商对称密钥；HTTP/3 则用 QUIC over UDP，把传输与加密握手合并，0/1-RTT 建连。","④ 发送请求：构造请求行、请求头（含 Cookie、UA、Accept、缓存相关字段）、请求体；强缓存命中则直接返回本地副本，跳过网络。","⑤ 服务端处理：负载均衡 / 反向代理 / 网关 → 应用服务 → 可能命中 CDN 边缘缓存或服务端缓存 → 返回响应（状态码、响应头、响应体）。","⑥ 浏览器接收：若 301/302 则重新发起请求；若 304 则用本地缓存；解析响应体并按第 3 天讲的渲染流水线构建 DOM/CSSOM/Render Tree → Layout → Paint → Composite。","⑦ 加载子资源：解析到 img/script/link 等继续发起请求， DOMContentLoaded 在 HTML 解析完成后触发，load 在所有资源加载完成后触发。","⑧ 连接复用：HTTP/1.1 keep-alive 或 HTTP/2 多路复用保持连接；断开时 TCP 四次挥手。"],"bullets":[],"code":[],"note":"高分答法：不要平铺直叙，主动分「网络层 / 协议层 / 浏览器渲染层」三段，并在每段抛出可量化优化点（preconnect、CDN、缓存策略、关键渲染路径），最后补一句 Core Web Vitals 指标验证。","text":"在浏览器地址栏输入 URL 并回车，到页面显示，发生了什么？ ① 解析 URL：补全协议（https）、分析域名/端口/路径/参数/片段标识符（# 后的片段不会发给服务器）。 ② DNS 解析：依次查浏览器缓存 → 系统缓存 / hosts → 本地 DNS 服务器（递归）→ 根域 → 顶级域 → 权威域名服务器，拿到 IP；期间可用 DNS 预取（dns-prefetch）与 CDN 调度。 ③ 建立连接：TCP 三次握手（SYN → SYN+ACK → ACK），若是 HTTPS 还要进行 TLS 握手协商对称密钥；HTTP/3 则用 QUIC over UDP，把传输与加密握手合并，0/1-RTT 建连。 ④ 发送请求：构造请求行、请求头（含 Cookie、UA、Accept、缓存相关字段）、请求体；强缓存命中则直接返回本地副本，跳过网络。 ⑤ 服务端处理：负载均衡 / 反向代理 / 网关 → 应用服务 → 可能命中 CDN 边缘缓存或服务端缓存 → 返回响应（状态码、响应头、响应体）。 ⑥ 浏览器接收：若 301/302 则重新发起请求；若 304 则用本地缓存；解析响应体并按第 3 天讲的渲染流水线构建 DOM/CSSOM/Render Tree → Layout → Paint → Composite。 ⑦ 加载子资源：解析到 img/script/link 等继续发起请求， DOMContentLoaded 在 HTML 解析完成后触发，load 在所有资源加载完成后触发。 ⑧ 连接复用：HTTP/1.1 keep-alive 或 HTTP/2 多路复用保持连接；断开时 TCP 四次挥手。 高分答法：不要平铺直叙，主动分「网络层 / 协议层 / 浏览器渲染层」三段，并在每段抛出可量化优化点（preconnect、CDN、缓存策略、关键渲染路径），最后补一句 Core Web Vitals 指标验证。"},{"id":110,"num":"Q110","tag":"原理","title":"DNS 为什么用 UDP？DNS 查询过程？","answers":["DNS 主要用 UDP 53 端口：单次查询/响应数据量小（<512 字节），UDP 无需握手、开销低、延迟小，服务器能支撑极高并发；若响应超过 512 字节（含 DNSSEC、大量记录）或做区域传送（AXFR），则改用 TCP。","查询过程：先查各级缓存（浏览器、操作系统、hosts、本地 DNS 缓存），未命中则本地 DNS 服务器递归查询：根服务器返回 TLD 地址 → TLD 服务器返回权威 DNS 地址 → 权威 DNS 返回最终 IP，沿途结果按 TTL 缓存。","相关优化：DNS 预解析 <link rel=\"dns-prefetch\">、preconnect 提前完成 DNS+TCP+TLS、CDN 通过 CNAME 与智能调度把用户导向最近边缘节点。"],"bullets":[],"code":[],"note":"","text":"DNS 为什么用 UDP？DNS 查询过程？ DNS 主要用 UDP 53 端口：单次查询/响应数据量小（<512 字节），UDP 无需握手、开销低、延迟小，服务器能支撑极高并发；若响应超过 512 字节（含 DNSSEC、大量记录）或做区域传送（AXFR），则改用 TCP。 查询过程：先查各级缓存（浏览器、操作系统、hosts、本地 DNS 缓存），未命中则本地 DNS 服务器递归查询：根服务器返回 TLD 地址 → TLD 服务器返回权威 DNS 地址 → 权威 DNS 返回最终 IP，沿途结果按 TTL 缓存。 相关优化：DNS 预解析 <link rel=\"dns-prefetch\">、preconnect 提前完成 DNS+TCP+TLS、CDN 通过 CNAME 与智能调度把用户导向最近边缘节点。"},{"id":111,"num":"Q111","tag":"原理","title":"TCP 三次握手与四次挥手，为什么是三次/四次？","answers":["三次握手：客户端 SYN(seq=x) → 服务端 SYN+ACK(seq=y, ack=x+1) → 客户端 ACK(ack=y+1)。三次是为了双方都确认「自己的发送与接收能力、对方的发送与接收能力」正常，并同步初始序列号；两次无法确认客户端的接收能力，也防止已失效的 SYN 突然到达造成错误连接。","四次挥手：主动方 FIN → 被动方 ACK（此时被动方可能还有数据要发，进入 CLOSE_WAIT）→ 被动方 FIN → 主动方 ACK（进入 TIME_WAIT，等待 2MSL 才关闭）。多出来的一次是因为 TCP 是全双工，被动方收到 FIN 后不能立刻把「自己的 FIN」合并发出，要先 ACK 再等数据发完。","TIME_WAIT 等 2MSL 的原因：① 保证最后一个 ACK 能到达对端（若丢失，对端会重发 FIN）；② 让本次连接的残余报文在网络中消散，避免污染新连接。"],"bullets":[],"code":[],"note":"","text":"TCP 三次握手与四次挥手，为什么是三次/四次？ 三次握手：客户端 SYN(seq=x) → 服务端 SYN+ACK(seq=y, ack=x+1) → 客户端 ACK(ack=y+1)。三次是为了双方都确认「自己的发送与接收能力、对方的发送与接收能力」正常，并同步初始序列号；两次无法确认客户端的接收能力，也防止已失效的 SYN 突然到达造成错误连接。 四次挥手：主动方 FIN → 被动方 ACK（此时被动方可能还有数据要发，进入 CLOSE_WAIT）→ 被动方 FIN → 主动方 ACK（进入 TIME_WAIT，等待 2MSL 才关闭）。多出来的一次是因为 TCP 是全双工，被动方收到 FIN 后不能立刻把「自己的 FIN」合并发出，要先 ACK 再等数据发完。 TIME_WAIT 等 2MSL 的原因：① 保证最后一个 ACK 能到达对端（若丢失，对端会重发 FIN）；② 让本次连接的残余报文在网络中消散，避免污染新连接。"},{"id":112,"num":"Q112","tag":"对比","title":"TCP 与 UDP 的区别？","answers":["TCP：面向连接、可靠（确认重传、序号、流量控制、拥塞控制）、有序、字节流、头部 20 字节起、有队头阻塞，适合 HTTP/1.1、文件传输、邮件。","UDP：无连接、不保证可靠与顺序、无拥塞控制、面向报文、头部 8 字节、低延迟，适合 DNS、视频通话、直播、QUIC/HTTP3、实时游戏。","加分：HTTP/2 虽用多路复用解决了「应用层队头阻塞」，但底层仍是单条 TCP，丢包时仍会触发 TCP 层队头阻塞；HTTP/3 基于 QUIC（UDP 上实现可靠传输 + TLS 1.3），每个流独立，才彻底解决。"],"bullets":[],"code":[],"note":"","text":"TCP 与 UDP 的区别？ TCP：面向连接、可靠（确认重传、序号、流量控制、拥塞控制）、有序、字节流、头部 20 字节起、有队头阻塞，适合 HTTP/1.1、文件传输、邮件。 UDP：无连接、不保证可靠与顺序、无拥塞控制、面向报文、头部 8 字节、低延迟，适合 DNS、视频通话、直播、QUIC/HTTP3、实时游戏。 加分：HTTP/2 虽用多路复用解决了「应用层队头阻塞」，但底层仍是单条 TCP，丢包时仍会触发 TCP 层队头阻塞；HTTP/3 基于 QUIC（UDP 上实现可靠传输 + TLS 1.3），每个流独立，才彻底解决。"},{"id":113,"num":"Q113","tag":"原理","title":"HTTPS 的加密过程？对称加密与非对称加密如何配合？","answers":["HTTP 明文传输，存在窃听、篡改、冒充三大风险；HTTPS = HTTP + TLS（SSL 是前身），提供加密、身份认证、完整性校验。","流程（TLS 1.2 经典）：① 客户端 ClientHello（支持的版本、加密套件、随机数 A）；② 服务端 ServerHello（选定套件、随机数 B）+ 数字证书（含公钥、域名、CA 签名）；③ 客户端验证证书链（CA 公信、域名匹配、有效期、是否吊销 OCSP/CRL）；④ 客户端生成随机数 C（pre-master），用服务端公钥加密发送；⑤ 双方用 A+B+C 通过 PRF 生成相同的会话密钥（对称密钥）；⑥ 之后用对称加密通信，用 MAC/HMAC 保证完整性。","为什么用三个随机数：让密钥不依赖单方的随机性，防止某一方伪随机数被预测，同时每次会话密钥不同（前向安全的一部分）；更现代的做法是 ECDHE 密钥交换，客户端与服务端各生成临时椭圆曲线公私钥，直接协商出会话密钥，天然具备前向安全（即使私钥泄露，历史会话也无法解密），TLS 1.3 已只保留这种 DH 类套件并把握手压缩到 1-RTT（会话恢复可 0-RTT）。","为什么不全程非对称：非对称加密计算慢、且有长度限制，只适合在握手阶段做身份认证与密钥交换；对称加密（AES-GCM/ChaCha20）适合高速加密大量数据。"],"bullets":[],"code":[],"note":"追问：中间人攻击为什么被证书挡住？因为证书由受信任 CA 用私钥签名，浏览器内置 CA 公钥可验签，攻击者无法伪造被信任的域名证书；除非用户安装了恶意根证书或遭遇证书误签发。","text":"HTTPS 的加密过程？对称加密与非对称加密如何配合？ HTTP 明文传输，存在窃听、篡改、冒充三大风险；HTTPS = HTTP + TLS（SSL 是前身），提供加密、身份认证、完整性校验。 流程（TLS 1.2 经典）：① 客户端 ClientHello（支持的版本、加密套件、随机数 A）；② 服务端 ServerHello（选定套件、随机数 B）+ 数字证书（含公钥、域名、CA 签名）；③ 客户端验证证书链（CA 公信、域名匹配、有效期、是否吊销 OCSP/CRL）；④ 客户端生成随机数 C（pre-master），用服务端公钥加密发送；⑤ 双方用 A+B+C 通过 PRF 生成相同的会话密钥（对称密钥）；⑥ 之后用对称加密通信，用 MAC/HMAC 保证完整性。 为什么用三个随机数：让密钥不依赖单方的随机性，防止某一方伪随机数被预测，同时每次会话密钥不同（前向安全的一部分）；更现代的做法是 ECDHE 密钥交换，客户端与服务端各生成临时椭圆曲线公私钥，直接协商出会话密钥，天然具备前向安全（即使私钥泄露，历史会话也无法解密），TLS 1.3 已只保留这种 DH 类套件并把握手压缩到 1-RTT（会话恢复可 0-RTT）。 为什么不全程非对称：非对称加密计算慢、且有长度限制，只适合在握手阶段做身份认证与密钥交换；对称加密（AES-GCM/ChaCha20）适合高速加密大量数据。 追问：中间人攻击为什么被证书挡住？因为证书由受信任 CA 用私钥签名，浏览器内置 CA 公钥可验签，攻击者无法伪造被信任的域名证书；除非用户安装了恶意根证书或遭遇证书误签发。"},{"id":114,"num":"Q114","tag":"场景","title":"CDN 的作用与原理？","answers":["CDN 把静态资源缓存到全球边缘节点，用户请求被 DNS 调度到就近节点，减少 RTT、降低源站压力、提升可用性与抗攻击能力。","关键机制：CNAME 解析到 CDN 域名 + 智能调度（基于地理位置、运营商、节点负载、健康检查）；缓存策略（Cache-Control / s-maxage / 边缘规则）；回源（未命中或过期时回源站拉取）；缓存刷新（主动 purge / 版本号文件名 hash 是更稳妥的做法）；动静分离与边缘计算。","注意：Cookie 隔离，静态资源用独立无 Cookie 域名，避免每个请求都带上一大坨 Cookie 浪费带宽。"],"bullets":[],"code":[],"note":"","text":"CDN 的作用与原理？ CDN 把静态资源缓存到全球边缘节点，用户请求被 DNS 调度到就近节点，减少 RTT、降低源站压力、提升可用性与抗攻击能力。 关键机制：CNAME 解析到 CDN 域名 + 智能调度（基于地理位置、运营商、节点负载、健康检查）；缓存策略（Cache-Control / s-maxage / 边缘规则）；回源（未命中或过期时回源站拉取）；缓存刷新（主动 purge / 版本号文件名 hash 是更稳妥的做法）；动静分离与边缘计算。 注意：Cookie 隔离，静态资源用独立无 Cookie 域名，避免每个请求都带上一大坨 Cookie 浪费带宽。"}]},{"id":"day4-s2","day":4,"title":"4.2 HTTP 协议与缓存","note":"","questions":[{"id":115,"num":"Q115","tag":"对比","title":"GET 与 POST 的区别？（别只背表面的 4 条）","answers":["语义（RFC 最重要的一条）：GET 是安全且幂等的「获取资源」，POST 是「提交/创建资源」，非幂等、不安全。","工程差异：GET 参数在 URL（长度受浏览器/服务器限制，通常 2KB~8KB 不等，不是协议限制）、会被浏览器缓存与保留在历史记录/日志中、只支持 ASCII 且会被 URL 编码、可收藏；POST 参数在 body（支持多种编码，大小由服务端配置限制）、默认不缓存、刷新会提示重新提交、更适合传敏感或大量数据。","常见误区纠正：GET 也可以有 body（规范没禁止，只是多数实现会忽略）；POST 也不比 GET「更安全」（都不加密，需 HTTPS）；GET 传参长度限制来自浏览器/服务器实现而非 HTTP 协议；GET 请求并非一定只发一个 TCP 包。","其它方法：PUT（整体替换，幂等）、PATCH（部分更新）、DELETE（幂等）、HEAD（只取响应头）、OPTIONS（预检 / 查询支持的方法）、TRACE、CONNECT。"],"bullets":[],"code":[],"note":"","text":"GET 与 POST 的区别？（别只背表面的 4 条） 语义（RFC 最重要的一条）：GET 是安全且幂等的「获取资源」，POST 是「提交/创建资源」，非幂等、不安全。 工程差异：GET 参数在 URL（长度受浏览器/服务器限制，通常 2KB~8KB 不等，不是协议限制）、会被浏览器缓存与保留在历史记录/日志中、只支持 ASCII 且会被 URL 编码、可收藏；POST 参数在 body（支持多种编码，大小由服务端配置限制）、默认不缓存、刷新会提示重新提交、更适合传敏感或大量数据。 常见误区纠正：GET 也可以有 body（规范没禁止，只是多数实现会忽略）；POST 也不比 GET「更安全」（都不加密，需 HTTPS）；GET 传参长度限制来自浏览器/服务器实现而非 HTTP 协议；GET 请求并非一定只发一个 TCP 包。 其它方法：PUT（整体替换，幂等）、PATCH（部分更新）、DELETE（幂等）、HEAD（只取响应头）、OPTIONS（预检 / 查询支持的方法）、TRACE、CONNECT。"},{"id":116,"num":"Q116","tag":"基础","title":"常见 HTTP 状态码？","answers":["1xx 信息：100 Continue（大请求体前先问服务端是否接受）、101 Switching Protocols（WebSocket 升级）、103 Early Hints。","2xx 成功：200 OK、201 Created、204 No Content（无响应体，常用于 DELETE / OPTIONS 预检）、206 Partial Content（断点续传 / Range 分片）。","3xx 重定向：301 永久（可被浏览器/搜索引擎缓存，换域名要谨慎）、302 临时、303 See Other、304 Not Modified（协商缓存命中）、307/308 保留方法与请求体的重定向（307 临时 / 308 永久，比 302/301 更严格）。","4xx 客户端错误：400 参数错误、401 未认证（需登录）、403 已认证但无权限、404 不存在、405 方法不允许、409 冲突、413 请求体过大、415 不支持的媒体类型、429 请求过多（限流）。","5xx 服务端错误：500 内部错误、502 网关收到上游无效响应、503 服务不可用（过载/维护）、504 网关超时。"],"bullets":[],"code":[],"note":"","text":"常见 HTTP 状态码？ 1xx 信息：100 Continue（大请求体前先问服务端是否接受）、101 Switching Protocols（WebSocket 升级）、103 Early Hints。 2xx 成功：200 OK、201 Created、204 No Content（无响应体，常用于 DELETE / OPTIONS 预检）、206 Partial Content（断点续传 / Range 分片）。 3xx 重定向：301 永久（可被浏览器/搜索引擎缓存，换域名要谨慎）、302 临时、303 See Other、304 Not Modified（协商缓存命中）、307/308 保留方法与请求体的重定向（307 临时 / 308 永久，比 302/301 更严格）。 4xx 客户端错误：400 参数错误、401 未认证（需登录）、403 已认证但无权限、404 不存在、405 方法不允许、409 冲突、413 请求体过大、415 不支持的媒体类型、429 请求过多（限流）。 5xx 服务端错误：500 内部错误、502 网关收到上游无效响应、503 服务不可用（过载/维护）、504 网关超时。"},{"id":117,"num":"Q117","tag":"必考","title":"HTTP/1.0、1.1、2.0、3.0 的演进？","answers":["HTTP/1.0：默认短连接，每个请求一次 TCP 握手；不支持 Host 头（无法虚拟主机）；缓存用 Expires / Last-Modified。","HTTP/1.1：默认长连接 keep-alive（Connection: keep-alive）、管线化 pipelining（因队头阻塞基本废弃）、Host 头必需、支持分块传输 chunked、断点续传 Range、新增 Cache-Control / ETag、OPTIONS、更多状态码；但同一域名浏览器仍有 6~8 个并发连接限制，且存在队头阻塞。","HTTP/2：二进制分帧（不再是文本）、多路复用（一个连接上并行多个 Stream，解决应用层队头阻塞）、HPACK 头部压缩（静态表 + 动态表 + Huffman）、服务端推送 Server Push（实践中效果不佳，已被多数浏览器弃用）、流优先级、要求 HTTPS（事实标准）。遗留问题：TCP 层丢包队头阻塞、握手延迟。","HTTP/3：基于 QUIC（UDP 之上实现可靠传输、拥塞控制与内置 TLS 1.3），0/1-RTT 建连、连接迁移（用 Connection ID，切 Wi-Fi/4G 不断线）、每个流独立无队头阻塞；缺点：UDP 在部分网络被限速/阻断、服务端与中间件改造成本。"],"bullets":[],"code":[],"note":"高频追问：HTTP/2 还需要合并资源（雪碧图、域名分片、合并 JS）吗？不需要，反而有害——域名分片会破坏多路复用，合并大文件会降低缓存命中率与粒度；正确做法是按路由细粒度分包 + 长缓存 + hash 文件名。","text":"HTTP/1.0、1.1、2.0、3.0 的演进？ HTTP/1.0：默认短连接，每个请求一次 TCP 握手；不支持 Host 头（无法虚拟主机）；缓存用 Expires / Last-Modified。 HTTP/1.1：默认长连接 keep-alive（Connection: keep-alive）、管线化 pipelining（因队头阻塞基本废弃）、Host 头必需、支持分块传输 chunked、断点续传 Range、新增 Cache-Control / ETag、OPTIONS、更多状态码；但同一域名浏览器仍有 6~8 个并发连接限制，且存在队头阻塞。 HTTP/2：二进制分帧（不再是文本）、多路复用（一个连接上并行多个 Stream，解决应用层队头阻塞）、HPACK 头部压缩（静态表 + 动态表 + Huffman）、服务端推送 Server Push（实践中效果不佳，已被多数浏览器弃用）、流优先级、要求 HTTPS（事实标准）。遗留问题：TCP 层丢包队头阻塞、握手延迟。 HTTP/3：基于 QUIC（UDP 之上实现可靠传输、拥塞控制与内置 TLS 1.3），0/1-RTT 建连、连接迁移（用 Connection ID，切 Wi-Fi/4G 不断线）、每个流独立无队头阻塞；缺点：UDP 在部分网络被限速/阻断、服务端与中间件改造成本。 高频追问：HTTP/2 还需要合并资源（雪碧图、域名分片、合并 JS）吗？不需要，反而有害——域名分片会破坏多路复用，合并大文件会降低缓存命中率与粒度；正确做法是按路由细粒度分包 + 长缓存 + hash 文件名。"},{"id":118,"num":"Q118","tag":"必考","title":"强缓存与协商缓存的完整流程？","answers":["强缓存：浏览器直接用本地副本，不发网络请求，状态码显示 200 (from disk cache / memory cache)。字段：Cache-Control（HTTP/1.1，优先级高，max-age=秒数、no-cache、no-store、private、public、s-maxage、immutable）、Expires（HTTP/1.0，绝对时间，依赖客户端时钟，已淘汰）。","协商缓存：强缓存失效后，浏览器带条件字段发请求，服务端判断资源未变则返回 304 Not Modified（无响应体），浏览器复用本地副本；变了返回 200 + 新资源。","字段配对：Last-Modified（服务端响应，秒级精度）↔ If-Modified-Since（请求）；ETag（资源唯一标识，精度更高、可处理秒级内多次修改与内容不变的场景）↔ If-None-Match（请求）。ETag 优先级高于 Last-Modified。","Cache-Control: no-cache 不是「不缓存」，而是「每次都必须向服务端协商验证」；no-store 才是真正不缓存（用于含敏感信息的响应）。","最佳实践：带内容 hash 的静态资源用 `Cache-Control: max-age=31536000, immutable`；HTML 入口用 `no-cache` 或短 max-age，保证发版后能拿到新的资源引用；API 响应按业务设置 private/no-store。"],"bullets":[],"code":[],"note":"","text":"强缓存与协商缓存的完整流程？ 强缓存：浏览器直接用本地副本，不发网络请求，状态码显示 200 (from disk cache / memory cache)。字段：Cache-Control（HTTP/1.1，优先级高，max-age=秒数、no-cache、no-store、private、public、s-maxage、immutable）、Expires（HTTP/1.0，绝对时间，依赖客户端时钟，已淘汰）。 协商缓存：强缓存失效后，浏览器带条件字段发请求，服务端判断资源未变则返回 304 Not Modified（无响应体），浏览器复用本地副本；变了返回 200 + 新资源。 字段配对：Last-Modified（服务端响应，秒级精度）↔ If-Modified-Since（请求）；ETag（资源唯一标识，精度更高、可处理秒级内多次修改与内容不变的场景）↔ If-None-Match（请求）。ETag 优先级高于 Last-Modified。 Cache-Control: no-cache 不是「不缓存」，而是「每次都必须向服务端协商验证」；no-store 才是真正不缓存（用于含敏感信息的响应）。 最佳实践：带内容 hash 的静态资源用 `Cache-Control: max-age=31536000, immutable`；HTML 入口用 `no-cache` 或短 max-age，保证发版后能拿到新的资源引用；API 响应按业务设置 private/no-store。"},{"id":119,"num":"Q119","tag":"场景","title":"用户刷新 / 强制刷新时缓存行为如何？","answers":["正常地址栏回车：强缓存优先，命中直接用；F5 刷新：请求带上 Cache-Control: max-age=0（或 no-cache 语义），强缓存失效但协商缓存仍可能命中 304；Ctrl+F5 强制刷新：带 Cache-Control: no-cache 且不带 If-None-Match / If-Modified-Since（或带 Pragma: no-cache），绕过全部缓存重新拉取。","开发调试用 DevTools 勾选 Disable cache；线上排查优先看 Response Headers 的 Cache-Control、Age、ETag 与 Size 列是否显示 from cache。"],"bullets":[],"code":[],"note":"","text":"用户刷新 / 强制刷新时缓存行为如何？ 正常地址栏回车：强缓存优先，命中直接用；F5 刷新：请求带上 Cache-Control: max-age=0（或 no-cache 语义），强缓存失效但协商缓存仍可能命中 304；Ctrl+F5 强制刷新：带 Cache-Control: no-cache 且不带 If-None-Match / If-Modified-Since（或带 Pragma: no-cache），绕过全部缓存重新拉取。 开发调试用 DevTools 勾选 Disable cache；线上排查优先看 Response Headers 的 Cache-Control、Age、ETag 与 Size 列是否显示 from cache。"},{"id":120,"num":"Q120","tag":"必考","title":"什么是同源策略？跨域有哪些解决方案？","answers":["同源 = 协议 + 域名 + 端口三者完全相同。同源策略限制：① XMLHttpRequest/fetch 读取跨域响应；② Cookie / localStorage / IndexedDB 读取；③ DOM（iframe 跨源）访问。注意 `<script>/<img>/<link>/<video>` 等标签加载跨域资源是允许的（只是 JS 无法读取内容，这正是 JSONP 的基础）。","① CORS（标准方案）：服务端返回 Access-Control-Allow-Origin（具体源或 *，带凭证时不能为 *）、Allow-Methods、Allow-Headers、Allow-Credentials: true、Max-Age、Expose-Headers。简单请求直接发；非简单请求（自定义头、application/json 等）先发 OPTIONS 预检。","② 开发环境代理：Webpack devServer.proxy / Vite server.proxy / Nginx 反向代理，让浏览器请求同源，由服务端转发（同源策略只约束浏览器）。","③ JSONP：利用 script 标签不受限，回调名传参、服务端返回 `callback(data)`；只支持 GET、安全性差（需校验回调名防 XSS）、无法捕获 HTTP 错误，已基本淘汰。","④ Nginx 反向代理 / 网关统一配置 CORS 是最常见的生产做法。","⑤ 其它：postMessage + iframe（跨窗口通信）、window.name / document.domain（历史方案，document.domain 已被现代浏览器弃用）、WebSocket（不受同源策略限制，但服务端可校验 Origin）、Chrome 扩展 / --disable-web-security 仅本地调试。"],"bullets":[],"code":[],"note":"","text":"什么是同源策略？跨域有哪些解决方案？ 同源 = 协议 + 域名 + 端口三者完全相同。同源策略限制：① XMLHttpRequest/fetch 读取跨域响应；② Cookie / localStorage / IndexedDB 读取；③ DOM（iframe 跨源）访问。注意 `<script>/<img>/<link>/<video>` 等标签加载跨域资源是允许的（只是 JS 无法读取内容，这正是 JSONP 的基础）。 ① CORS（标准方案）：服务端返回 Access-Control-Allow-Origin（具体源或 *，带凭证时不能为 *）、Allow-Methods、Allow-Headers、Allow-Credentials: true、Max-Age、Expose-Headers。简单请求直接发；非简单请求（自定义头、application/json 等）先发 OPTIONS 预检。 ② 开发环境代理：Webpack devServer.proxy / Vite server.proxy / Nginx 反向代理，让浏览器请求同源，由服务端转发（同源策略只约束浏览器）。 ③ JSONP：利用 script 标签不受限，回调名传参、服务端返回 `callback(data)`；只支持 GET、安全性差（需校验回调名防 XSS）、无法捕获 HTTP 错误，已基本淘汰。 ④ Nginx 反向代理 / 网关统一配置 CORS 是最常见的生产做法。 ⑤ 其它：postMessage + iframe（跨窗口通信）、window.name / document.domain（历史方案，document.domain 已被现代浏览器弃用）、WebSocket（不受同源策略限制，但服务端可校验 Origin）、Chrome 扩展 / --disable-web-security 仅本地调试。"},{"id":121,"num":"Q121","tag":"原理","title":"CORS 简单请求与预检请求的判定？","answers":["同时满足才是简单请求：方法是 GET/HEAD/POST 之一；头字段仅包含 Accept、Accept-Language、Content-Language、Content-Type（且值仅限 application/x-www-form-urlencoded、multipart/form-data、text/plain）、DPR/Downlink/Save-Data/Viewport-Width/Width 等安全头；请求中没有自定义头、没有使用 ReadableStream、XMLHttpRequest 未注册 upload 事件之外的高级监听器。","预检 OPTIONS 带 Origin、Access-Control-Request-Method、Access-Control-Request-Headers；服务端响应 Access-Control-Allow-Origin / Methods / Headers / Max-Age（缓存预检结果，减少往返），通过后才发真实请求。","带 Cookie 需三处配合：前端 credentials: 'include'（fetch）/ withCredentials: true（XHR），服务端 Allow-Credentials: true，且 Allow-Origin 必须是具体源（不能 *），Cookie 的 SameSite 属性也要允许跨站携带。"],"bullets":[],"code":[],"note":"","text":"CORS 简单请求与预检请求的判定？ 同时满足才是简单请求：方法是 GET/HEAD/POST 之一；头字段仅包含 Accept、Accept-Language、Content-Language、Content-Type（且值仅限 application/x-www-form-urlencoded、multipart/form-data、text/plain）、DPR/Downlink/Save-Data/Viewport-Width/Width 等安全头；请求中没有自定义头、没有使用 ReadableStream、XMLHttpRequest 未注册 upload 事件之外的高级监听器。 预检 OPTIONS 带 Origin、Access-Control-Request-Method、Access-Control-Request-Headers；服务端响应 Access-Control-Allow-Origin / Methods / Headers / Max-Age（缓存预检结果，减少往返），通过后才发真实请求。 带 Cookie 需三处配合：前端 credentials: 'include'（fetch）/ withCredentials: true（XHR），服务端 Allow-Credentials: true，且 Allow-Origin 必须是具体源（不能 *），Cookie 的 SameSite 属性也要允许跨站携带。"},{"id":122,"num":"Q122","tag":"基础","title":"常见请求/响应头与 Content-Type？","answers":["请求头：Host、User-Agent、Accept / Accept-Encoding / Accept-Language、Content-Type、Authorization（Bearer/JWT）、Cookie、Origin、Referer、If-None-Match / If-Modified-Since、Range、Cache-Control、Connection、X-Requested-With、Sec-Fetch-*。","响应头：Content-Type / Content-Length / Content-Encoding（gzip/br）、Cache-Control / ETag / Last-Modified、Set-Cookie、Access-Control-*、Location（重定向）、Content-Disposition（下载）、Strict-Transport-Security（HSTS）、Content-Security-Policy、X-Content-Type-Options、Transfer-Encoding: chunked、Vary。","常见 Content-Type：application/json、application/x-www-form-urlencoded（普通表单）、multipart/form-data（文件上传）、text/plain、text/html、application/octet-stream（二进制下载）、application/javascript、image/webp。"],"bullets":[],"code":[],"note":"加分：Vary: Accept-Encoding / Origin 决定缓存键是否区分这些头，配错会导致 CDN 缓存串内容。","text":"常见请求/响应头与 Content-Type？ 请求头：Host、User-Agent、Accept / Accept-Encoding / Accept-Language、Content-Type、Authorization（Bearer/JWT）、Cookie、Origin、Referer、If-None-Match / If-Modified-Since、Range、Cache-Control、Connection、X-Requested-With、Sec-Fetch-*。 响应头：Content-Type / Content-Length / Content-Encoding（gzip/br）、Cache-Control / ETag / Last-Modified、Set-Cookie、Access-Control-*、Location（重定向）、Content-Disposition（下载）、Strict-Transport-Security（HSTS）、Content-Security-Policy、X-Content-Type-Options、Transfer-Encoding: chunked、Vary。 常见 Content-Type：application/json、application/x-www-form-urlencoded（普通表单）、multipart/form-data（文件上传）、text/plain、text/html、application/octet-stream（二进制下载）、application/javascript、image/webp。 加分：Vary: Accept-Encoding / Origin 决定缓存键是否区分这些头，配错会导致 CDN 缓存串内容。"},{"id":123,"num":"Q123","tag":"概念","title":"Cookie 的属性有哪些？SameSite 的三个值？","answers":["属性：Name/Value、Domain（可作用域名，不能跨顶级域）、Path、Expires/Max-Age（不设则为会话 Cookie，关浏览器失效）、Size（约 4KB）、HttpOnly（禁止 JS 读取，防 XSS 窃取）、Secure（仅 HTTPS 发送）、SameSite、Priority、Partitioned（第三方 Cookie 分区，CHIPS）。","SameSite=Strict：完全禁止跨站请求携带（最严，但从外链跳回会丢登录态）；Lax（现代浏览器默认值）：允许顶级导航的 GET 等安全方法携带，禁止跨站 POST / iframe / img / fetch 携带；None：跨站也携带，但必须同时设 Secure（否则被拒绝）。","「跨站」与「跨域」不同：同站（same-site）看的是 eTLD+1（有效顶级域 + 一级域），如 a.example.com 与 b.example.com 是同站、但不同源。"],"bullets":[],"code":[],"note":"","text":"Cookie 的属性有哪些？SameSite 的三个值？ 属性：Name/Value、Domain（可作用域名，不能跨顶级域）、Path、Expires/Max-Age（不设则为会话 Cookie，关浏览器失效）、Size（约 4KB）、HttpOnly（禁止 JS 读取，防 XSS 窃取）、Secure（仅 HTTPS 发送）、SameSite、Priority、Partitioned（第三方 Cookie 分区，CHIPS）。 SameSite=Strict：完全禁止跨站请求携带（最严，但从外链跳回会丢登录态）；Lax（现代浏览器默认值）：允许顶级导航的 GET 等安全方法携带，禁止跨站 POST / iframe / img / fetch 携带；None：跨站也携带，但必须同时设 Secure（否则被拒绝）。 「跨站」与「跨域」不同：同站（same-site）看的是 eTLD+1（有效顶级域 + 一级域），如 a.example.com 与 b.example.com 是同站、但不同源。"}]},{"id":"day4-s3","day":4,"title":"4.3 前端安全","note":"","questions":[{"id":124,"num":"Q124","tag":"必考","title":"什么是 XSS？有哪些类型？如何防御？","answers":["XSS（跨站脚本）：攻击者把恶意脚本注入到页面中被执行，可窃取 Cookie/token、篡改页面、发起钓鱼、做蠕虫传播。","类型：① 存储型（恶意代码存进数据库，如评论区，所有访问者中招，危害最大）；② 反射型（恶意代码在 URL 参数里，服务端拼进 HTML 立即返回，需诱导点击）；③ DOM 型（纯前端 JS 把不可信数据写入 innerHTML/eval/document.write/location，不经过服务端）；④ 突变型（mXSS，浏览器解析修正导致转义被绕过）。","防御：① 输出编码 / 转义（按上下文区分 HTML、属性、JS、URL、CSS 编码），优先用 textContent 而非 innerHTML；② 框架默认转义（React/Vue 的 {{ }}），警惕 v-html / dangerouslySetInnerHTML；③ CSP（Content-Security-Policy）限制可执行脚本来源，禁止 inline-script / eval，配合 nonce/hash；④ Cookie 设 HttpOnly + Secure + SameSite，让 XSS 拿不到会话凭证；⑤ 输入校验与白名单富文本过滤（DOMPurify）；⑥ 避免把不可信数据拼进 eval / setTimeout 字符串 / javascript: 伪协议 / innerHTML / JSONP 回调名；⑦ Trusted Types（Chrome）从 API 层面强制安全 sink。"],"bullets":[],"code":[],"note":"追问：CSP 为什么能防 XSS？它通过 script-src 'self' 等指令限制脚本只能从可信源加载，且默认禁止内联脚本与 eval，即使攻击者注入了 <script> 标签也无法执行；但注意 JSONP 回调、unsafe-inline、宽松的 CDN 白名单都可能被绕过。","text":"什么是 XSS？有哪些类型？如何防御？ XSS（跨站脚本）：攻击者把恶意脚本注入到页面中被执行，可窃取 Cookie/token、篡改页面、发起钓鱼、做蠕虫传播。 类型：① 存储型（恶意代码存进数据库，如评论区，所有访问者中招，危害最大）；② 反射型（恶意代码在 URL 参数里，服务端拼进 HTML 立即返回，需诱导点击）；③ DOM 型（纯前端 JS 把不可信数据写入 innerHTML/eval/document.write/location，不经过服务端）；④ 突变型（mXSS，浏览器解析修正导致转义被绕过）。 防御：① 输出编码 / 转义（按上下文区分 HTML、属性、JS、URL、CSS 编码），优先用 textContent 而非 innerHTML；② 框架默认转义（React/Vue 的 {{ }}），警惕 v-html / dangerouslySetInnerHTML；③ CSP（Content-Security-Policy）限制可执行脚本来源，禁止 inline-script / eval，配合 nonce/hash；④ Cookie 设 HttpOnly + Secure + SameSite，让 XSS 拿不到会话凭证；⑤ 输入校验与白名单富文本过滤（DOMPurify）；⑥ 避免把不可信数据拼进 eval / setTimeout 字符串 / javascript: 伪协议 / innerHTML / JSONP 回调名；⑦ Trusted Types（Chrome）从 API 层面强制安全 sink。 追问：CSP 为什么能防 XSS？它通过 script-src 'self' 等指令限制脚本只能从可信源加载，且默认禁止内联脚本与 eval，即使攻击者注入了 <script> 标签也无法执行；但注意 JSONP 回调、unsafe-inline、宽松的 CDN 白名单都可能被绕过。"},{"id":125,"num":"Q125","tag":"必考","title":"什么是 CSRF？如何防御？和 XSS 有什么区别？","answers":["CSRF（跨站请求伪造）：用户已登录 A 站，攻击者诱导其访问 B 站，B 站发出对 A 站的请求（img/form/fetch），浏览器会自动带上 A 站的 Cookie，服务端误认为是用户本人操作。","防御：① CSRF Token（服务端下发随机 token，请求带在 body/自定义头里，攻击者拿不到同源 token；注意 token 不要放 Cookie）；② SameSite=Lax/Strict Cookie（现代浏览器默认值已能挡住大部分跨站 POST）；③ 校验 Origin / Referer 白名单；④ 关键操作二次验证（短信/密码/验证码）；⑤ 对状态变更接口统一用 POST + 自定义头（触发 CORS 预检，跨域无法带自定义头通过）；⑥ 双重 Cookie 校验（把 token 同时放 Cookie 和请求参数，服务端比对，注意子域可被注入 Cookie 的风险）。","区别：XSS 是「注入并执行脚本」，攻击者能在受害站点内做任何事，拿到凭证；CSRF 是「借用户的凭证发请求」，攻击者拿不到 Cookie 内容也读不到响应，只能「冒用身份做事」。XSS 可绕过大部分 CSRF 防御（因为能读页面里的 token），所以防 XSS 是前提。"],"bullets":[],"code":[],"note":"","text":"什么是 CSRF？如何防御？和 XSS 有什么区别？ CSRF（跨站请求伪造）：用户已登录 A 站，攻击者诱导其访问 B 站，B 站发出对 A 站的请求（img/form/fetch），浏览器会自动带上 A 站的 Cookie，服务端误认为是用户本人操作。 防御：① CSRF Token（服务端下发随机 token，请求带在 body/自定义头里，攻击者拿不到同源 token；注意 token 不要放 Cookie）；② SameSite=Lax/Strict Cookie（现代浏览器默认值已能挡住大部分跨站 POST）；③ 校验 Origin / Referer 白名单；④ 关键操作二次验证（短信/密码/验证码）；⑤ 对状态变更接口统一用 POST + 自定义头（触发 CORS 预检，跨域无法带自定义头通过）；⑥ 双重 Cookie 校验（把 token 同时放 Cookie 和请求参数，服务端比对，注意子域可被注入 Cookie 的风险）。 区别：XSS 是「注入并执行脚本」，攻击者能在受害站点内做任何事，拿到凭证；CSRF 是「借用户的凭证发请求」，攻击者拿不到 Cookie 内容也读不到响应，只能「冒用身份做事」。XSS 可绕过大部分 CSRF 防御（因为能读页面里的 token），所以防 XSS 是前提。"},{"id":126,"num":"Q126","tag":"概念","title":"点击劫持、SQL 注入、中间人攻击如何防？","answers":["点击劫持（Clickjacking）：用透明 iframe 覆盖在诱导按钮上，用户以为点的是 A 实际点的是 B。防御：响应头 `X-Frame-Options: DENY/SAMEORIGIN`、`CSP: frame-ancestors 'none'/'self'`（更现代），以及 JS 的 frame busting（可被 sandbox 绕过，仅兜底）。","SQL 注入：后端责任，前端只做基础校验；根本解法是参数化查询/预编译语句、ORM、最小权限、输入白名单，绝不拼接 SQL 字符串。","中间人：全站 HTTPS + HSTS（Strict-Transport-Security 强制浏览器只用 HTTPS，防止首次 HTTP 被降级）、证书校验 / 证书固定（Certificate Pinning）、公共 Wi-Fi 提示。","其它：CORS 配置过宽（Allow-Origin: * 且 Allow-Credentials 组合）、JWT 存 localStorage 被 XSS 读取、敏感信息写在 URL 被日志/Referer 泄露、第三方 SDK 供应链风险（SRI 子资源完整性 + 锁定版本）。"],"bullets":[],"code":[],"note":"","text":"点击劫持、SQL 注入、中间人攻击如何防？ 点击劫持（Clickjacking）：用透明 iframe 覆盖在诱导按钮上，用户以为点的是 A 实际点的是 B。防御：响应头 `X-Frame-Options: DENY/SAMEORIGIN`、`CSP: frame-ancestors 'none'/'self'`（更现代），以及 JS 的 frame busting（可被 sandbox 绕过，仅兜底）。 SQL 注入：后端责任，前端只做基础校验；根本解法是参数化查询/预编译语句、ORM、最小权限、输入白名单，绝不拼接 SQL 字符串。 中间人：全站 HTTPS + HSTS（Strict-Transport-Security 强制浏览器只用 HTTPS，防止首次 HTTP 被降级）、证书校验 / 证书固定（Certificate Pinning）、公共 Wi-Fi 提示。 其它：CORS 配置过宽（Allow-Origin: * 且 Allow-Credentials 组合）、JWT 存 localStorage 被 XSS 读取、敏感信息写在 URL 被日志/Referer 泄露、第三方 SDK 供应链风险（SRI 子资源完整性 + 锁定版本）。"},{"id":127,"num":"Q127","tag":"对比","title":"Cookie vs Token（JWT）做会话管理，怎么选？","answers":["Cookie-Session：服务端有状态，天然可主动失效/踢人，配合 HttpOnly + Secure + SameSite 可较好防 XSS 窃取，但存在 CSRF 风险、跨域/多端不友好、服务端需要存储与共享 session（Redis）。","JWT：无状态、自包含、适合微服务/多端/跨域，服务端不存储；但无法主动失效（需黑名单/短过期 + Refresh Token 折中）、payload 只是 Base64 编码不是加密、体积大、存 localStorage 易被 XSS 窃取、存 Cookie 又有 CSRF 问题。","实践建议：传统 Web 应用优先用「HttpOnly + SameSite=Lax 的 Session Cookie」；BFF / 移动跨端场景用 Access Token（短时，内存或 HttpOnly Cookie）+ Refresh Token（长时，HttpOnly Cookie、可轮换、可撤销）。"],"bullets":[],"code":[],"note":"高分补充：不要说「JWT 更安全」，要说 trade-off；能讲出「无状态换来的代价是不可撤销」和「存哪决定面对 XSS 还是 CSRF」才到位。","text":"Cookie vs Token（JWT）做会话管理，怎么选？ Cookie-Session：服务端有状态，天然可主动失效/踢人，配合 HttpOnly + Secure + SameSite 可较好防 XSS 窃取，但存在 CSRF 风险、跨域/多端不友好、服务端需要存储与共享 session（Redis）。 JWT：无状态、自包含、适合微服务/多端/跨域，服务端不存储；但无法主动失效（需黑名单/短过期 + Refresh Token 折中）、payload 只是 Base64 编码不是加密、体积大、存 localStorage 易被 XSS 窃取、存 Cookie 又有 CSRF 问题。 实践建议：传统 Web 应用优先用「HttpOnly + SameSite=Lax 的 Session Cookie」；BFF / 移动跨端场景用 Access Token（短时，内存或 HttpOnly Cookie）+ Refresh Token（长时，HttpOnly Cookie、可轮换、可撤销）。 高分补充：不要说「JWT 更安全」，要说 trade-off；能讲出「无状态换来的代价是不可撤销」和「存哪决定面对 XSS 还是 CSRF」才到位。"}]},{"id":"day4-s4","day":4,"title":"4.4 实时通信、性能监控与浏览器能力","note":"","questions":[{"id":128,"num":"Q128","tag":"对比","title":"短轮询、长轮询、SSE、WebSocket 的区别？","answers":["短轮询：客户端定时发请求，实现简单、浪费请求与带宽、实时性差。","长轮询（Comet）：服务端 hold 住请求直到有数据或超时，返回后客户端立刻再发；减少无效请求，但每次仍要建 HTTP 连接，服务端连接占用高。","SSE（Server-Sent Events）：基于 HTTP 的单向（服务端 → 客户端）长连接，text/event-stream，浏览器原生 EventSource 支持自动重连、Last-Event-ID 断点续传；适合通知、日志流、股价推送；只能单向、默认受同源与连接数限制（HTTP/1.1 下 6 个）、只支持文本。","WebSocket：基于 HTTP Upgrade 握手（101 Switching Protocols）后建立全双工 TCP 长连接，双向、低延迟、开销小；需自己实现心跳（ping/pong）、重连、消息去重与离线补偿；适合 IM、协同编辑、游戏、实时看板。","HTTP/2 Server Push / WebRTC / MQTT 也是可选方案，按场景取舍。"],"bullets":[],"code":[],"note":"","text":"短轮询、长轮询、SSE、WebSocket 的区别？ 短轮询：客户端定时发请求，实现简单、浪费请求与带宽、实时性差。 长轮询（Comet）：服务端 hold 住请求直到有数据或超时，返回后客户端立刻再发；减少无效请求，但每次仍要建 HTTP 连接，服务端连接占用高。 SSE（Server-Sent Events）：基于 HTTP 的单向（服务端 → 客户端）长连接，text/event-stream，浏览器原生 EventSource 支持自动重连、Last-Event-ID 断点续传；适合通知、日志流、股价推送；只能单向、默认受同源与连接数限制（HTTP/1.1 下 6 个）、只支持文本。 WebSocket：基于 HTTP Upgrade 握手（101 Switching Protocols）后建立全双工 TCP 长连接，双向、低延迟、开销小；需自己实现心跳（ping/pong）、重连、消息去重与离线补偿；适合 IM、协同编辑、游戏、实时看板。 HTTP/2 Server Push / WebRTC / MQTT 也是可选方案，按场景取舍。"},{"id":129,"num":"Q129","tag":"场景","title":"WebSocket 的心跳、重连与消息可靠性怎么设计？","answers":["心跳：客户端定时（如 30s）发 ping，服务端回 pong；连续 N 次未收到 pong 判定断连，避免「半开连接」（TCP 断线两端感知不到）。","重连：指数退避 + 随机抖动（避免服务端被同时重连打爆），设置最大重试次数；重连成功后用最后一条消息 ID / 序列号向服务端补拉离线消息。","可靠性：每条消息带唯一 msgId + 递增 seq，客户端去重；服务端做 ACK 确认与超时重发；未确认消息本地持久化；断网期间用本地队列暂存，恢复后批量补发。"],"bullets":[],"code":[],"note":"","text":"WebSocket 的心跳、重连与消息可靠性怎么设计？ 心跳：客户端定时（如 30s）发 ping，服务端回 pong；连续 N 次未收到 pong 判定断连，避免「半开连接」（TCP 断线两端感知不到）。 重连：指数退避 + 随机抖动（避免服务端被同时重连打爆），设置最大重试次数；重连成功后用最后一条消息 ID / 序列号向服务端补拉离线消息。 可靠性：每条消息带唯一 msgId + 递增 seq，客户端去重；服务端做 ACK 确认与超时重发；未确认消息本地持久化；断网期间用本地队列暂存，恢复后批量补发。"},{"id":130,"num":"Q130","tag":"原理","title":"浏览器架构：多进程与线程模型？","answers":["现代 Chrome 是多进程架构：Browser 进程（UI、地址栏、网络调度、子进程管理）、Renderer 进程（每站点/每标签页一个或多个，负责 HTML/CSS/JS 解析执行、布局绘制，运行在沙箱中）、GPU 进程（合成与栅格化）、Network Service 进程、Storage/Utility 进程、插件进程。","Renderer 内有主线程（JS 执行、DOM 构建、样式计算、布局、部分绘制）、合成线程（图层合成、滚动）、光栅化线程、Worker 线程（Web Worker 独立于主线程）。站点隔离（Site Isolation）让跨站 iframe 用独立进程，缓解 Spectre 类攻击。","意义：一个标签页崩溃不会拖垮整个浏览器、沙箱提升安全性、多进程可利用多核；代价是内存占用更高（Chrome 有进程合并策略）。"],"bullets":[],"code":[],"note":"","text":"浏览器架构：多进程与线程模型？ 现代 Chrome 是多进程架构：Browser 进程（UI、地址栏、网络调度、子进程管理）、Renderer 进程（每站点/每标签页一个或多个，负责 HTML/CSS/JS 解析执行、布局绘制，运行在沙箱中）、GPU 进程（合成与栅格化）、Network Service 进程、Storage/Utility 进程、插件进程。 Renderer 内有主线程（JS 执行、DOM 构建、样式计算、布局、部分绘制）、合成线程（图层合成、滚动）、光栅化线程、Worker 线程（Web Worker 独立于主线程）。站点隔离（Site Isolation）让跨站 iframe 用独立进程，缓解 Spectre 类攻击。 意义：一个标签页崩溃不会拖垮整个浏览器、沙箱提升安全性、多进程可利用多核；代价是内存占用更高（Chrome 有进程合并策略）。"},{"id":131,"num":"Q131","tag":"概念","title":"Performance API 与常见前端性能指标？","answers":["Performance API：performance.now()（高精度单调时钟）、performance.timing（已废弃）/ Navigation Timing Level 2 的 performance.getEntriesByType('navigation')、Resource Timing（资源各阶段耗时）、performance.mark / measure 自定义打点、PerformanceObserver 监听 longtask / layout-shift / largest-contentful-paint / event 等条目。","关键时间：TTFB（首字节）、FP（首次绘制）、FCP（首次内容绘制）、LCP（最大内容绘制，≤2.5s 为优）、FID（首次输入延迟，已被 INP 取代）、INP（交互到下一帧绘制，≤200ms）、CLS（累积布局偏移，≤0.1）、TTI（可交互时间）、TBT（总阻塞时间）、SI（速度指数）。","排查工具链：Lighthouse / PageSpeed Insights 给实验室数据 → Chrome DevTools Performance 火焰图找长任务 → Web Vitals / web-vitals 库 + 监控 SDK 采集真实用户数据（RUM）→ 按 P75/P95 分位数评估优化效果。"],"bullets":[],"code":[],"note":"","text":"Performance API 与常见前端性能指标？ Performance API：performance.now()（高精度单调时钟）、performance.timing（已废弃）/ Navigation Timing Level 2 的 performance.getEntriesByType('navigation')、Resource Timing（资源各阶段耗时）、performance.mark / measure 自定义打点、PerformanceObserver 监听 longtask / layout-shift / largest-contentful-paint / event 等条目。 关键时间：TTFB（首字节）、FP（首次绘制）、FCP（首次内容绘制）、LCP（最大内容绘制，≤2.5s 为优）、FID（首次输入延迟，已被 INP 取代）、INP（交互到下一帧绘制，≤200ms）、CLS（累积布局偏移，≤0.1）、TTI（可交互时间）、TBT（总阻塞时间）、SI（速度指数）。 排查工具链：Lighthouse / PageSpeed Insights 给实验室数据 → Chrome DevTools Performance 火焰图找长任务 → Web Vitals / web-vitals 库 + 监控 SDK 采集真实用户数据（RUM）→ 按 P75/P95 分位数评估优化效果。"},{"id":132,"num":"Q132","tag":"场景","title":"前端监控 SDK 需要采集哪些数据？","answers":["① JS 错误：window.onerror + unhandledrejection + 资源加载错误（document 上 capture 阶段监听）+ Vue/React errorHandler，堆栈配合 sourcemap 还原；② 性能：Navigation/Resource Timing、Web Vitals、Long Task、首屏时间、接口耗时；③ 接口请求：拦截 XHR/fetch 记录状态码、耗时、错误；④ 用户行为面包屑：点击、路由跳转、console、输入（脱敏）；⑤ 环境信息：UA、设备、网络（navigator.connection）、版本、用户标识、会话 ID；⑥ 白屏/卡顿检测：MutationObserver + 采样、longtask 阈值。","上报策略：批量合并、空闲/卸载时发送（sendBeacon 或 fetch keepalive）、采样率可配置、失败重试、限流降级，避免监控自身拖垮页面。"],"bullets":[],"code":[],"note":"","text":"前端监控 SDK 需要采集哪些数据？ ① JS 错误：window.onerror + unhandledrejection + 资源加载错误（document 上 capture 阶段监听）+ Vue/React errorHandler，堆栈配合 sourcemap 还原；② 性能：Navigation/Resource Timing、Web Vitals、Long Task、首屏时间、接口耗时；③ 接口请求：拦截 XHR/fetch 记录状态码、耗时、错误；④ 用户行为面包屑：点击、路由跳转、console、输入（脱敏）；⑤ 环境信息：UA、设备、网络（navigator.connection）、版本、用户标识、会话 ID；⑥ 白屏/卡顿检测：MutationObserver + 采样、longtask 阈值。 上报策略：批量合并、空闲/卸载时发送（sendBeacon 或 fetch keepalive）、采样率可配置、失败重试、限流降级，避免监控自身拖垮页面。"},{"id":133,"num":"Q133","tag":"概念","title":"什么是 Service Worker、PWA 与离线缓存？","answers":["Service Worker 是运行在浏览器后台、独立于页面的脚本（只能 HTTPS / localhost），可拦截并代理网络请求（fetch 事件）、做离线缓存、推送通知、后台同步；生命周期为 install → activate → fetch，通过 Cache Storage / IndexedDB 存储。","常见缓存策略：Cache First（静态资源）、Network First（HTML/API 及时性）、Stale-While-Revalidate（先返缓存再后台更新）、Network Only / Cache Only。","注意：更新需要 skipWaiting + clients.claim 或等所有页面关闭；它是 PWA 的核心，但调试时容易被旧 SW 缓存坑到。"],"bullets":[],"code":[],"note":"","text":"什么是 Service Worker、PWA 与离线缓存？ Service Worker 是运行在浏览器后台、独立于页面的脚本（只能 HTTPS / localhost），可拦截并代理网络请求（fetch 事件）、做离线缓存、推送通知、后台同步；生命周期为 install → activate → fetch，通过 Cache Storage / IndexedDB 存储。 常见缓存策略：Cache First（静态资源）、Network First（HTML/API 及时性）、Stale-While-Revalidate（先返缓存再后台更新）、Network Only / Cache Only。 注意：更新需要 skipWaiting + clients.claim 或等所有页面关闭；它是 PWA 的核心，但调试时容易被旧 SW 缓存坑到。"},{"id":134,"num":"Q134","tag":"对比","title":"Web Worker / SharedWorker / Service Worker 的区别？","answers":["Web Worker：在后台线程执行 JS，不能操作 DOM，通过 postMessage 与主线程通信，适合大计算、加密、图像处理、大文件分片 hash，避免阻塞 UI。","SharedWorker：多个同源标签页/iframe 共享同一个 worker 实例，可做跨标签页状态共享与通信（用 port）。","Service Worker：不服务于单个页面，是网络代理 + 事件驱动的持久层，用于离线缓存与推送，页面关闭后仍可被事件唤醒。","限制：都不能直接访问 DOM、localStorage（Service Worker 可用 IndexedDB / Cache API），传输数据用结构化克隆（大 ArrayBuffer 用 transferable 可零拷贝转移所有权）。"],"bullets":[],"code":[],"note":"","text":"Web Worker / SharedWorker / Service Worker 的区别？ Web Worker：在后台线程执行 JS，不能操作 DOM，通过 postMessage 与主线程通信，适合大计算、加密、图像处理、大文件分片 hash，避免阻塞 UI。 SharedWorker：多个同源标签页/iframe 共享同一个 worker 实例，可做跨标签页状态共享与通信（用 port）。 Service Worker：不服务于单个页面，是网络代理 + 事件驱动的持久层，用于离线缓存与推送，页面关闭后仍可被事件唤醒。 限制：都不能直接访问 DOM、localStorage（Service Worker 可用 IndexedDB / Cache API），传输数据用结构化克隆（大 ArrayBuffer 用 transferable 可零拷贝转移所有权）。"}]}]},{"id":"day5","day":5,"title":"第 5 天｜Vue 与 React 框架原理","short":"Vue 与 React 框架原理","note":"目标：框架题的评分标准是「能不能讲清原理 + 能不能落到项目问题」。建议每个原理都准备一句「我在项目里遇到过什么问题、怎么解决的」，比如 key 用 index 导致表单错位、useEffect 闭包陷阱拿到旧值。","sections":[{"id":"day5-s1","day":5,"title":"5.1 Vue2 / Vue3 响应式原理","note":"","questions":[{"id":135,"num":"Q135","tag":"必考","title":"Vue2 的响应式原理？为什么需要 $set 和重写数组方法？","answers":["Vue2 用 Object.defineProperty 递归遍历 data 的每个属性，把属性转成 getter/setter：getter 里做依赖收集（Dep 收集当前 Watcher），setter 里触发 dep.notify() 通知所有 Watcher 更新；每个组件对应一个渲染 Watcher，组件渲染时读取的数据会被收集为依赖。","整体链路：Observer（劫持数据）→ Dep（依赖管理）→ Watcher（观察者）→ 调度队列（异步批量更新，nextTick）→ 虚拟 DOM patch。","缺陷：① 只能劫持「已经存在」的属性，新增/删除属性无法侦测，需要 Vue.set / this.$set（内部手动调用 defineReactive + dep.notify）或 Vue.delete；② 数组通过下标赋值、修改 length 不会被拦截，因此需要重写 push/pop/shift/unshift/splice/sort/reverse 这 7 个变异方法（用原型拦截：Object.create(Array.prototype) 造一层 arrayMethods，在方法里调用原始方法后手动通知，并对新增元素再做 observe）；③ 初始化时要递归遍历整个对象，数据层级深时性能开销大；④ 不支持 Map/Set 等集合类型。"],"bullets":[],"code":[],"note":"","text":"Vue2 的响应式原理？为什么需要 $set 和重写数组方法？ Vue2 用 Object.defineProperty 递归遍历 data 的每个属性，把属性转成 getter/setter：getter 里做依赖收集（Dep 收集当前 Watcher），setter 里触发 dep.notify() 通知所有 Watcher 更新；每个组件对应一个渲染 Watcher，组件渲染时读取的数据会被收集为依赖。 整体链路：Observer（劫持数据）→ Dep（依赖管理）→ Watcher（观察者）→ 调度队列（异步批量更新，nextTick）→ 虚拟 DOM patch。 缺陷：① 只能劫持「已经存在」的属性，新增/删除属性无法侦测，需要 Vue.set / this.$set（内部手动调用 defineReactive + dep.notify）或 Vue.delete；② 数组通过下标赋值、修改 length 不会被拦截，因此需要重写 push/pop/shift/unshift/splice/sort/reverse 这 7 个变异方法（用原型拦截：Object.create(Array.prototype) 造一层 arrayMethods，在方法里调用原始方法后手动通知，并对新增元素再做 observe）；③ 初始化时要递归遍历整个对象，数据层级深时性能开销大；④ 不支持 Map/Set 等集合类型。"},{"id":136,"num":"Q136","tag":"必考","title":"Vue3 的响应式原理？Proxy + Reflect 好在哪？","answers":["Vue3 用 Proxy 代理整个对象，拦截 get / set / deleteProperty / has / ownKeys 等 13 种操作：get 时 track（把当前 activeEffect 收集进 target 的依赖 Map），set / delete 时 trigger（取出依赖执行），依赖存储在全局 WeakMap<target, Map<key, Set<effect>>> 结构中。","优势：① 代理整个对象而非逐个属性，能侦测属性新增、删除、in、Object.keys；② 数组下标赋值与 length 修改天然可侦测，不再需要重写 7 个方法；③ 支持 Map/Set/WeakMap/WeakSet（通过集合类型的 instrumented 方法）；④ 惰性递归——只有真正被访问到的嵌套对象才被包装成响应式，初始化性能更好；⑤ 通过 Reflect 配合 receiver 保证属性访问器里的 this 指向代理对象，避免原型链上 getter 收集错依赖。","代价：IE 不支持且无法 polyfill（所以 Vue3 不支持 IE11）；代理对象 !== 原对象（用 toRaw 可拿回原始对象）；每次访问都会产生新代理需要缓存（Vue3 用 reactiveMap 缓存）。"],"bullets":[],"code":[],"note":"高分补充：ref 是对基本类型的包装（.value + Object.defineProperty 的 get/set），reactive 只能用于对象；toRefs 解构 reactive 时保持响应性；computed 是带缓存的 effect（dirty 标记 + scheduler）；watch 是 effect 的调度器实现。","text":"Vue3 的响应式原理？Proxy + Reflect 好在哪？ Vue3 用 Proxy 代理整个对象，拦截 get / set / deleteProperty / has / ownKeys 等 13 种操作：get 时 track（把当前 activeEffect 收集进 target 的依赖 Map），set / delete 时 trigger（取出依赖执行），依赖存储在全局 WeakMap<target, Map<key, Set<effect>>> 结构中。 优势：① 代理整个对象而非逐个属性，能侦测属性新增、删除、in、Object.keys；② 数组下标赋值与 length 修改天然可侦测，不再需要重写 7 个方法；③ 支持 Map/Set/WeakMap/WeakSet（通过集合类型的 instrumented 方法）；④ 惰性递归——只有真正被访问到的嵌套对象才被包装成响应式，初始化性能更好；⑤ 通过 Reflect 配合 receiver 保证属性访问器里的 this 指向代理对象，避免原型链上 getter 收集错依赖。 代价：IE 不支持且无法 polyfill（所以 Vue3 不支持 IE11）；代理对象 !== 原对象（用 toRaw 可拿回原始对象）；每次访问都会产生新代理需要缓存（Vue3 用 reactiveMap 缓存）。 高分补充：ref 是对基本类型的包装（.value + Object.defineProperty 的 get/set），reactive 只能用于对象；toRefs 解构 reactive 时保持响应性；computed 是带缓存的 effect（dirty 标记 + scheduler）；watch 是 effect 的调度器实现。"},{"id":137,"num":"Q137","tag":"对比","title":"Vue2 与 Vue3 的区别？Vue3 为什么更快？","answers":["响应式：defineProperty → Proxy（见上两题）；API：Options API → Composition API（逻辑复用更灵活、无 this 混淆、TS 友好、按功能组织代码）；生命周期：beforeDestroy/destroyed → beforeUnmount/unmounted，新增 onActivated 等组合式 API；Fragment / Teleport / Suspense 支持；多根节点模板；v-model 可带参数且可多个；v-if 优先级高于 v-for（与 Vue2 相反）；全局 API 改为 app 实例（createApp）避免污染；Tree-shaking 支持按需引入，体积更小。","性能提升：① 编译期 PatchFlag 标记动态节点，diff 时只比对动态部分（静态节点跳过）；② hoistStatic 静态提升，静态节点只创建一次并被复用；③ cacheHandler 缓存事件处理函数，避免每次渲染生成新函数；④ Block Tree / dynamicChildren 把 diff 从整棵树递归降为「只遍历动态子节点数组」；⑤ SSR 与 Tree-shaking 优化。","其它：TypeScript 重写、更好的类型推导；Vite 官方配套；Pinia 取代 Vuex 成为官方推荐。"],"bullets":[],"code":[],"note":"","text":"Vue2 与 Vue3 的区别？Vue3 为什么更快？ 响应式：defineProperty → Proxy（见上两题）；API：Options API → Composition API（逻辑复用更灵活、无 this 混淆、TS 友好、按功能组织代码）；生命周期：beforeDestroy/destroyed → beforeUnmount/unmounted，新增 onActivated 等组合式 API；Fragment / Teleport / Suspense 支持；多根节点模板；v-model 可带参数且可多个；v-if 优先级高于 v-for（与 Vue2 相反）；全局 API 改为 app 实例（createApp）避免污染；Tree-shaking 支持按需引入，体积更小。 性能提升：① 编译期 PatchFlag 标记动态节点，diff 时只比对动态部分（静态节点跳过）；② hoistStatic 静态提升，静态节点只创建一次并被复用；③ cacheHandler 缓存事件处理函数，避免每次渲染生成新函数；④ Block Tree / dynamicChildren 把 diff 从整棵树递归降为「只遍历动态子节点数组」；⑤ SSR 与 Tree-shaking 优化。 其它：TypeScript 重写、更好的类型推导；Vite 官方配套；Pinia 取代 Vuex 成为官方推荐。"},{"id":138,"num":"Q138","tag":"必考","title":"Vue 的虚拟 DOM 与 diff 算法？key 的作用？","answers":["虚拟 DOM 是用 JS 对象描述真实 DOM 的轻量抽象，状态变化时生成新的 VNode 树，通过 diff 找出最小变更再 patch 到真实 DOM，避免全量重绘，同时提供跨平台能力（SSR、Weex、小程序）。","Vue 的 diff 采用「同层比较 + 双端指针」（Vue2）：只比较同一层级，不跨层移动；用 oldStartIdx/oldEndIdx/newStartIdx/newEndIdx 四个指针做头头、尾尾、头尾、尾头四种命中判断，命中则复用并移动指针，否则用 key 建立 oldVNode 的 map 查找可复用节点，最后处理新增与删除。Vue3 在此基础上用「最长递增子序列（LIS）」优化乱序移动，使需要 move 的节点数最少。","key 的作用：作为 VNode 的唯一标识，让 diff 能判断「同一个节点」从而复用真实 DOM 与组件实例（含内部状态）。用 index 作 key 在列表插入/删除/排序时会造成错误复用（输入框内容错位、组件状态串位、动画异常），也会让本可复用的节点被销毁重建；不写 key 时 Vue 会默认用索引，即「就地复用」策略。","key 应该用稳定的业务唯一 ID（如 item.id）；用 Math.random() 作 key 会导致每次渲染全部重建，是常见反模式。"],"bullets":[],"code":[],"note":"","text":"Vue 的虚拟 DOM 与 diff 算法？key 的作用？ 虚拟 DOM 是用 JS 对象描述真实 DOM 的轻量抽象，状态变化时生成新的 VNode 树，通过 diff 找出最小变更再 patch 到真实 DOM，避免全量重绘，同时提供跨平台能力（SSR、Weex、小程序）。 Vue 的 diff 采用「同层比较 + 双端指针」（Vue2）：只比较同一层级，不跨层移动；用 oldStartIdx/oldEndIdx/newStartIdx/newEndIdx 四个指针做头头、尾尾、头尾、尾头四种命中判断，命中则复用并移动指针，否则用 key 建立 oldVNode 的 map 查找可复用节点，最后处理新增与删除。Vue3 在此基础上用「最长递增子序列（LIS）」优化乱序移动，使需要 move 的节点数最少。 key 的作用：作为 VNode 的唯一标识，让 diff 能判断「同一个节点」从而复用真实 DOM 与组件实例（含内部状态）。用 index 作 key 在列表插入/删除/排序时会造成错误复用（输入框内容错位、组件状态串位、动画异常），也会让本可复用的节点被销毁重建；不写 key 时 Vue 会默认用索引，即「就地复用」策略。 key 应该用稳定的业务唯一 ID（如 item.id）；用 Math.random() 作 key 会导致每次渲染全部重建，是常见反模式。"},{"id":139,"num":"Q139","tag":"高频","title":"nextTick 的原理？为什么 Vue 的 DOM 更新是异步的？","answers":["Vue 检测到数据变化后不会立刻更新 DOM，而是把 Watcher 推入一个队列并去重（同一 Watcher 多次变更只入队一次），在下一个微任务周期统一 flush，这样无论改多少次数据都只做一次渲染，避免不必要的重排重绘。","nextTick(cb) 就是把回调也放进这个异步队列（或 flush 之后的微任务），因此能在 DOM 更新完成后拿到最新 DOM。","实现降级链：Promise.then（微任务）→ MutationObserver → setImmediate → setTimeout（宏任务）；Vue3 直接用 Promise.resolve().then。"],"bullets":[],"code":[],"note":"追问：为什么用微任务而不是宏任务？微任务在当前事件循环结束前执行，比 setTimeout 更早，且不会插入一次浏览器渲染，用户看不到中间态；但宏任务在 UI 事件、跨标签通信等场景也有其调度价值。","text":"nextTick 的原理？为什么 Vue 的 DOM 更新是异步的？ Vue 检测到数据变化后不会立刻更新 DOM，而是把 Watcher 推入一个队列并去重（同一 Watcher 多次变更只入队一次），在下一个微任务周期统一 flush，这样无论改多少次数据都只做一次渲染，避免不必要的重排重绘。 nextTick(cb) 就是把回调也放进这个异步队列（或 flush 之后的微任务），因此能在 DOM 更新完成后拿到最新 DOM。 实现降级链：Promise.then（微任务）→ MutationObserver → setImmediate → setTimeout（宏任务）；Vue3 直接用 Promise.resolve().then。 追问：为什么用微任务而不是宏任务？微任务在当前事件循环结束前执行，比 setTimeout 更早，且不会插入一次浏览器渲染，用户看不到中间态；但宏任务在 UI 事件、跨标签通信等场景也有其调度价值。"},{"id":140,"num":"Q140","tag":"对比","title":"computed 与 watch / watchEffect 的区别？","answers":["computed：有缓存，只有依赖的响应式数据变化才重新计算，依赖不变时多次读取直接返回缓存值；必须有返回值；适合由其它数据派生出新数据（如过滤列表、总价）。computed 默认惰性求值（用到才算），本质是一个带 dirty 标记的 effect。","watch：侦听指定数据源，数据变化时执行副作用（请求、日志、手动操作 DOM），无返回值；可拿到 oldValue/newValue、支持 deep、immediate、flush（pre/post/sync）、可停止（返回 stop 函数）；适合「数据变化后做一件事」。","watchEffect（Vue3）：自动收集回调里用到的所有依赖，立即执行一次，依赖变化时重跑，无法拿到旧值；适合依赖不固定的灵活场景。","常见坑：watch 侦听 reactive 对象时默认已开启 deep，但侦听 `() => props.obj` 这类 getter 时若对象引用不变则不会触发，需 deep: true。"],"bullets":[],"code":[],"note":"","text":"computed 与 watch / watchEffect 的区别？ computed：有缓存，只有依赖的响应式数据变化才重新计算，依赖不变时多次读取直接返回缓存值；必须有返回值；适合由其它数据派生出新数据（如过滤列表、总价）。computed 默认惰性求值（用到才算），本质是一个带 dirty 标记的 effect。 watch：侦听指定数据源，数据变化时执行副作用（请求、日志、手动操作 DOM），无返回值；可拿到 oldValue/newValue、支持 deep、immediate、flush（pre/post/sync）、可停止（返回 stop 函数）；适合「数据变化后做一件事」。 watchEffect（Vue3）：自动收集回调里用到的所有依赖，立即执行一次，依赖变化时重跑，无法拿到旧值；适合依赖不固定的灵活场景。 常见坑：watch 侦听 reactive 对象时默认已开启 deep，但侦听 `() => props.obj` 这类 getter 时若对象引用不变则不会触发，需 deep: true。"},{"id":141,"num":"Q141","tag":"基础","title":"Vue 的生命周期与父子组件执行顺序？","answers":["Vue3（组合式）：setup（最先，替代 beforeCreate/created）→ onBeforeMount → onMounted → onBeforeUpdate → onUpdated → onBeforeUnmount → onUnmounted；keep-alive 额外有 onActivated / onDeactivated；还有 onErrorCaptured、onRenderTracked / onRenderTriggered（调试用）。","父子顺序：父 setup → 父 beforeMount → 子 setup → 子 beforeMount → 子 mounted → 父 mounted；更新同理「父 beforeUpdate → 子 beforeUpdate → 子 updated → 父 updated」；销毁是「父 beforeUnmount → 子 beforeUnmount → 子 unmounted → 父 unmounted」。","常见用途：mounted 里拿 DOM / 初始化第三方库 / 发请求；beforeUnmount 里清理定时器、事件监听、取消订阅与未完成的请求；updated 里不要再改依赖数据（死循环）。","注意：Vue2 的 beforeCreate 阶段还拿不到 data/methods，created 已可访问数据但还没挂载 DOM；异步请求放 created 还是 mounted 取决于是否要尽早发起，二者差别不大，但 SSR 下 mounted 不会执行。"],"bullets":[],"code":[],"note":"","text":"Vue 的生命周期与父子组件执行顺序？ Vue3（组合式）：setup（最先，替代 beforeCreate/created）→ onBeforeMount → onMounted → onBeforeUpdate → onUpdated → onBeforeUnmount → onUnmounted；keep-alive 额外有 onActivated / onDeactivated；还有 onErrorCaptured、onRenderTracked / onRenderTriggered（调试用）。 父子顺序：父 setup → 父 beforeMount → 子 setup → 子 beforeMount → 子 mounted → 父 mounted；更新同理「父 beforeUpdate → 子 beforeUpdate → 子 updated → 父 updated」；销毁是「父 beforeUnmount → 子 beforeUnmount → 子 unmounted → 父 unmounted」。 常见用途：mounted 里拿 DOM / 初始化第三方库 / 发请求；beforeUnmount 里清理定时器、事件监听、取消订阅与未完成的请求；updated 里不要再改依赖数据（死循环）。 注意：Vue2 的 beforeCreate 阶段还拿不到 data/methods，created 已可访问数据但还没挂载 DOM；异步请求放 created 还是 mounted 取决于是否要尽早发起，二者差别不大，但 SSR 下 mounted 不会执行。"},{"id":142,"num":"Q142","tag":"基础","title":"Vue 组件通信方式有哪些？（说全 + 说场景）","answers":["① props / $emit（父子，最基础，props 单向数据流，子组件不要直接改 props）；② v-model / .sync / defineModel（父子双向语法糖，Vue3 组件可用多个 v-model）；③ ref / $refs + defineExpose（父调子方法）；④ $parent / $children（Vue2，强耦合不推荐）；⑤ provide / inject（跨层级依赖注入，适合主题、配置、全局状态，注意默认非响应式需传 ref/reactive）；⑥ 事件总线 EventBus / mitt（任意组件，Vue3 移除了 $on，需第三方库或自己写）；⑦ Vuex / Pinia（全局状态）；⑧ $attrs / $listeners（透传属性与事件，封装高阶组件）；⑨ slot 作用域插槽（父拿子的数据）；⑩ 路由参数 / query、localStorage、URL 状态、全局 window 事件。","加分：能说出「单向数据流 + 状态提升」的设计原则，以及为什么大项目要收敛到 Pinia 而不是满天飞的事件总线（难追踪、难调试、内存泄漏）。"],"bullets":[],"code":[],"note":"","text":"Vue 组件通信方式有哪些？（说全 + 说场景） ① props / $emit（父子，最基础，props 单向数据流，子组件不要直接改 props）；② v-model / .sync / defineModel（父子双向语法糖，Vue3 组件可用多个 v-model）；③ ref / $refs + defineExpose（父调子方法）；④ $parent / $children（Vue2，强耦合不推荐）；⑤ provide / inject（跨层级依赖注入，适合主题、配置、全局状态，注意默认非响应式需传 ref/reactive）；⑥ 事件总线 EventBus / mitt（任意组件，Vue3 移除了 $on，需第三方库或自己写）；⑦ Vuex / Pinia（全局状态）；⑧ $attrs / $listeners（透传属性与事件，封装高阶组件）；⑨ slot 作用域插槽（父拿子的数据）；⑩ 路由参数 / query、localStorage、URL 状态、全局 window 事件。 加分：能说出「单向数据流 + 状态提升」的设计原则，以及为什么大项目要收敛到 Pinia 而不是满天飞的事件总线（难追踪、难调试、内存泄漏）。"},{"id":143,"num":"Q143","tag":"对比","title":"v-if 与 v-show、v-for 与 v-if 的优先级？","answers":["v-if 是「真」的条件渲染：条件为假时根本不创建/销毁 DOM 与组件实例（会触发生命周期与重新渲染），切换开销大、初始渲染开销小；v-show 始终渲染，只切换 CSS display:none，初始开销大、频繁切换开销小。频繁显隐用 v-show，运行时很少改变或涉及权限/重逻辑用 v-if。","Vue2 中 v-for 优先级高于 v-if（同一元素上会先循环再判断，浪费性能且 v-if 拿不到循环变量）；Vue3 中 v-if 优先级高于 v-for（此时 v-if 里访问不到 v-for 的变量）。正确做法：把 v-if 提到外层 template，或先用 computed 过滤列表。","补充：v-for 必须加稳定 key；不要和 v-if 写在同一元素；遍历对象时顺序是 Object.keys 的顺序；v-for 支持解构与 (item, index) 以及 of/in。"],"bullets":[],"code":[],"note":"","text":"v-if 与 v-show、v-for 与 v-if 的优先级？ v-if 是「真」的条件渲染：条件为假时根本不创建/销毁 DOM 与组件实例（会触发生命周期与重新渲染），切换开销大、初始渲染开销小；v-show 始终渲染，只切换 CSS display:none，初始开销大、频繁切换开销小。频繁显隐用 v-show，运行时很少改变或涉及权限/重逻辑用 v-if。 Vue2 中 v-for 优先级高于 v-if（同一元素上会先循环再判断，浪费性能且 v-if 拿不到循环变量）；Vue3 中 v-if 优先级高于 v-for（此时 v-if 里访问不到 v-for 的变量）。正确做法：把 v-if 提到外层 template，或先用 computed 过滤列表。 补充：v-for 必须加稳定 key；不要和 v-if 写在同一元素；遍历对象时顺序是 Object.keys 的顺序；v-for 支持解构与 (item, index) 以及 of/in。"},{"id":144,"num":"Q144","tag":"概念","title":"Vue 的指令、修饰符与插槽？","answers":["常用指令：v-bind / v-on / v-model / v-if / v-show / v-for / v-slot / v-pre（跳过编译）/ v-cloak（防闪烁）/ v-once（只渲染一次）/ v-memo（Vue3.2 缓存子树）/ v-html（有 XSS 风险，必须配合 DOMPurify）。","常用修饰符：事件 .stop / .prevent / .capture / .self / .once / .passive / .left / .middle；按键 .enter / .esc / .space / .ctrl；v-model .lazy / .number / .trim；鼠标 .native（Vue2）。","插槽：默认插槽、具名插槽（v-slot:name，简写 #name）、作用域插槽（子组件用 <slot :row=\"row\"> 把数据传给父组件模板，父用 #default=\"{ row }\" 接收），是实现「可配置组件」与表格组件列模板的核心。Vue3 中 slot 编译为函数，作用域插槽性能更好。"],"bullets":[],"code":[],"note":"","text":"Vue 的指令、修饰符与插槽？ 常用指令：v-bind / v-on / v-model / v-if / v-show / v-for / v-slot / v-pre（跳过编译）/ v-cloak（防闪烁）/ v-once（只渲染一次）/ v-memo（Vue3.2 缓存子树）/ v-html（有 XSS 风险，必须配合 DOMPurify）。 常用修饰符：事件 .stop / .prevent / .capture / .self / .once / .passive / .left / .middle；按键 .enter / .esc / .space / .ctrl；v-model .lazy / .number / .trim；鼠标 .native（Vue2）。 插槽：默认插槽、具名插槽（v-slot:name，简写 #name）、作用域插槽（子组件用 <slot :row=\"row\"> 把数据传给父组件模板，父用 #default=\"{ row }\" 接收），是实现「可配置组件」与表格组件列模板的核心。Vue3 中 slot 编译为函数，作用域插槽性能更好。"},{"id":145,"num":"Q145","tag":"对比","title":"Vuex 与 Pinia 的区别？","answers":["Vuex（Vue2 时代）：有 state / getters / mutations（必须同步）/ actions（可异步）/ modules 五件套，需要通过 commit → mutation 修改状态，样板代码多、TS 支持弱、模块嵌套复杂。","Pinia：去掉 mutations，直接 this.xxx = 或 store.$patch 修改；天然 TypeScript 类型推导；每个 store 独立定义、可组合、支持多个 store 实例、无需命名空间嵌套；支持插件扩展、devtools、SSR；体积更小，是 Vue3 官方推荐。","加分：能讲清「为什么去掉 mutations」——它最初的初衷是让 devtools 追踪状态变更，但 Pinia 通过 $patch / 订阅机制同样可追踪，同步限制反而增加心智负担。"],"bullets":[],"code":[],"note":"","text":"Vuex 与 Pinia 的区别？ Vuex（Vue2 时代）：有 state / getters / mutations（必须同步）/ actions（可异步）/ modules 五件套，需要通过 commit → mutation 修改状态，样板代码多、TS 支持弱、模块嵌套复杂。 Pinia：去掉 mutations，直接 this.xxx = 或 store.$patch 修改；天然 TypeScript 类型推导；每个 store 独立定义、可组合、支持多个 store 实例、无需命名空间嵌套；支持插件扩展、devtools、SSR；体积更小，是 Vue3 官方推荐。 加分：能讲清「为什么去掉 mutations」——它最初的初衷是让 devtools 追踪状态变更，但 Pinia 通过 $patch / 订阅机制同样可追踪，同步限制反而增加心智负担。"},{"id":146,"num":"Q146","tag":"场景","title":"vue-router 的原理与两种模式、导航守卫？","answers":["hash 模式：用 URL 中 # 后面的部分，监听 hashchange，改变 hash 不向服务器发请求，兼容性好但 URL 不美观、SEO 差。","history 模式：基于 HTML5 History API（pushState / replaceState），监听 popstate，URL 干净；需要服务端配置「所有路径回退到 index.html」，否则刷新 404。","abstract 模式：非浏览器环境（SSR / 测试）用内存数组模拟。","守卫：全局 beforeEach / beforeResolve / afterEach，路由独享 beforeEnter，组件内 beforeRouteEnter / beforeRouteUpdate / beforeRouteLeave；典型应用是登录鉴权（beforeEach + 白名单 + 重定向 + 动态路由 addRoute）、权限校验、页面离开确认、滚动行为 scrollBehavior。","加分：beforeRouteEnter 里拿不到 this（组件还没创建），需要通过 next(vm => ...) 访问实例；next 必须且只能调用一次。"],"bullets":[],"code":[],"note":"","text":"vue-router 的原理与两种模式、导航守卫？ hash 模式：用 URL 中 # 后面的部分，监听 hashchange，改变 hash 不向服务器发请求，兼容性好但 URL 不美观、SEO 差。 history 模式：基于 HTML5 History API（pushState / replaceState），监听 popstate，URL 干净；需要服务端配置「所有路径回退到 index.html」，否则刷新 404。 abstract 模式：非浏览器环境（SSR / 测试）用内存数组模拟。 守卫：全局 beforeEach / beforeResolve / afterEach，路由独享 beforeEnter，组件内 beforeRouteEnter / beforeRouteUpdate / beforeRouteLeave；典型应用是登录鉴权（beforeEach + 白名单 + 重定向 + 动态路由 addRoute）、权限校验、页面离开确认、滚动行为 scrollBehavior。 加分：beforeRouteEnter 里拿不到 this（组件还没创建），需要通过 next(vm => ...) 访问实例；next 必须且只能调用一次。"},{"id":147,"num":"Q147","tag":"概念","title":"keep-alive 的原理与 LRU？","answers":["keep-alive 是抽象组件（不渲染 DOM、不出现在父链中），缓存已渲染的组件 VNode 与实例，切换时不销毁而是 deactivate/activate，触发 activated / deactivated 钩子，保留表单输入、滚动位置等状态。","支持 include / exclude（按组件 name 匹配正则/字符串/数组）与 max（最大缓存数）；超出 max 时用 LRU 策略淘汰最久未访问的 key（Vue 内部用 keys 数组 + cache 对象实现：访问时把 key 移到队尾，淘汰时删队首）。","坑：被缓存组件不会再触发 mounted / unmounted，清理逻辑要放 deactivated 或用 onActivated 重新初始化；include 依赖组件 name，匿名组件/动态组件要注意命名。"],"bullets":[],"code":[],"note":"","text":"keep-alive 的原理与 LRU？ keep-alive 是抽象组件（不渲染 DOM、不出现在父链中），缓存已渲染的组件 VNode 与实例，切换时不销毁而是 deactivate/activate，触发 activated / deactivated 钩子，保留表单输入、滚动位置等状态。 支持 include / exclude（按组件 name 匹配正则/字符串/数组）与 max（最大缓存数）；超出 max 时用 LRU 策略淘汰最久未访问的 key（Vue 内部用 keys 数组 + cache 对象实现：访问时把 key 移到队尾，淘汰时删队首）。 坑：被缓存组件不会再触发 mounted / unmounted，清理逻辑要放 deactivated 或用 onActivated 重新初始化；include 依赖组件 name，匿名组件/动态组件要注意命名。"},{"id":148,"num":"Q148","tag":"场景","title":"mixins 的问题？Composition API 如何解决？","answers":["mixins 的问题：① 命名冲突（同名选项合并规则隐晦，容易互相覆盖）；② 来源不清晰（组件里突然出现一个 data/method，不知道来自哪个 mixin）；③ 多个 mixin 之间可隐式耦合、难以复用与抽取；④ TS 类型推导差。","Composition API 用「组合函数 composable」解决：函数显式返回 ref / computed / 方法，调用处解构命名（可重命名），依赖关系与数据来源一目了然，天然支持 TS 类型推导，逻辑可跨组件复用且可嵌套组合。","加分：Vue3 仍保留 mixins 只为兼容，新代码应优先用 composables（类似 React 自定义 Hook）。"],"bullets":[],"code":[],"note":"","text":"mixins 的问题？Composition API 如何解决？ mixins 的问题：① 命名冲突（同名选项合并规则隐晦，容易互相覆盖）；② 来源不清晰（组件里突然出现一个 data/method，不知道来自哪个 mixin）；③ 多个 mixin 之间可隐式耦合、难以复用与抽取；④ TS 类型
