 = (...args) => { this.off(name, wrap); fn.apply(this, args) }     wrap.origin = fn     return this.on(name, wrap)   }   off(name, fn) {     const list = this.events.get(name) || []     this.events.set(name, list.filter(f => f !== fn && f.origin !== fn))   }   emit(name, ...args) {     ;[...(this.events.get(name) || [])].forEach(fn => fn.apply(this, args))   }   clear(name) { name ? this.events.delete(name) : this.events.clear() } }"}]},{"id":"day7-s2","day":7,"title":"7.2 必背手写题（进阶篇）","note":"","questions":[{"id":212,"num":"Q212","tag":"手写","title":"实现 JSONP（含超时与清理）。","answers":["原理：script 标签不受同源策略限制，服务端返回 `callback(data)` 形式的可执行 JS。要点：① 回调名随机且唯一，避免并发冲突；② 挂载到 window 并在结束后 delete；③ 超时与 onerror 都要 reject 并清理；④ 服务端必须白名单校验 callback 名（只允许字母数字下划线点），否则会被注入成 XSS；⑤ 只支持 GET、无 HTTP 状态码、已淘汰。"],"bullets":[],"code":[["function jsonp({ url, params = {}, timeout = 5000 }) {","  return new Promise((resolve, reject) => {","    const name = '__jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2)","    const script = document.createElement('script')","    const cleanup = () => {","      clearTimeout(timer)","      delete window[name]","      script.remove()","    }","    const timer = setTimeout(() => {","      cleanup(); reject(new Error('JSONP timeout'))","    }, timeout)","    window[name] = data => { resolve(data); cleanup() }","    script.src = url + '?' + new URLSearchParams({ ...params, callback: name }).toString()","    script.onerror = () => { cleanup(); reject(new Error('JSONP network error')) }","    document.body.appendChild(script)","  })","}"]],"note":"","text":"实现 JSONP（含超时与清理）。 原理：script 标签不受同源策略限制，服务端返回 `callback(data)` 形式的可执行 JS。要点：① 回调名随机且唯一，避免并发冲突；② 挂载到 window 并在结束后 delete；③ 超时与 onerror 都要 reject 并清理；④ 服务端必须白名单校验 callback 名（只允许字母数字下划线点），否则会被注入成 XSS；⑤ 只支持 GET、无 HTTP 状态码、已淘汰。 function jsonp({ url, params = {}, timeout = 5000 }) {   return new Promise((resolve, reject) => {     const name = '__jsonp_' + Date.now() + '_' + Math.random().toString(36).slice(2)     const script = document.createElement('script')     const cleanup = () => {       clearTimeout(timer)       delete window[name]       script.remove()     }     const timer = setTimeout(() => {       cleanup(); reject(new Error('JSONP timeout'))     }, timeout)     window[name] = data => { resolve(data); cleanup() }     script.src = url + '?' + new URLSearchParams({ ...params, callback: name }).toString()     script.onerror = () => { cleanup(); reject(new Error('JSONP network error')) }     document.body.appendChild(script)   }) }"},{"id":213,"num":"Q213","tag":"手写","title":"封装 fetch：超时、错误统一处理、AbortController 取消。","answers":["必答坑：fetch 只有在网络错误时 reject，4xx/5xx 会 resolve，必须检查 res.ok；超时要用 AbortController 真正中止请求（Promise.race 只是忽略结果，请求仍在跑）；finally 里清定时器；响应体只能读一次，需要复用要 res.clone()。"],"bullets":[],"code":[["async function request(url, { timeout = 8000, ...options } = {}) {","  const controller = new AbortController()","  const id = setTimeout(() => controller.abort(), timeout)","  try {","    const res = await fetch(url, { ...options, signal: controller.signal })","    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url)","    return await res.json()","  } finally {","    clearTimeout(id)","  }","}","// 超时竞速版（不取消请求，仅忽略结果）","const withTimeout = (p, ms) => Promise.race([","  p,","  new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))","])"]],"note":"","text":"封装 fetch：超时、错误统一处理、AbortController 取消。 必答坑：fetch 只有在网络错误时 reject，4xx/5xx 会 resolve，必须检查 res.ok；超时要用 AbortController 真正中止请求（Promise.race 只是忽略结果，请求仍在跑）；finally 里清定时器；响应体只能读一次，需要复用要 res.clone()。 async function request(url, { timeout = 8000, ...options } = {}) {   const controller = new AbortController()   const id = setTimeout(() => controller.abort(), timeout)   try {     const res = await fetch(url, { ...options, signal: controller.signal })     if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url)     return await res.json()   } finally {     clearTimeout(id)   } } // 超时竞速版（不取消请求，仅忽略结果） const withTimeout = (p, ms) => Promise.race([   p,   new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)) ])"},{"id":214,"num":"Q214","tag":"手写","title":"实现 once、memoize、retry、sleep 与轮询。","answers":["once 用闭包锁 + 缓存结果；memoize 用 Map 缓存，注意缓存键要能覆盖多参数（默认只取第一个参数，可传 resolver）；retry 用指数退避 + 抖动，且要区分可重试错误；sleep 是 Promise 化的定时器，配合 async 可做串行与轮询。"],"bullets":[],"code":[["function once(fn) {","  let called = false, result","  return function (...args) {","    if (!called) { called = true; result = fn.apply(this, args) }","    return result","  }","}","function memoize(fn, resolver = (...a) => a[0]) {","  const cache = new Map()","  return function (...args) {","    const key = resolver(...args)","    if (cache.has(key)) return cache.get(key)","    const res = fn.apply(this, args)","    cache.set(key, res)","    return res","  }","}","const sleep = ms => new Promise(r => setTimeout(r, ms))","async function retry(task, { times = 3, delay = 300 } = {}) {","  let lastErr","  for (let i = 0; i < times; i++) {","    try { return await task() }","    catch (e) {","      lastErr = e","      if (i < times - 1) await sleep(delay * 2 ** i + Math.random() * 100)","    }","  }","  throw lastErr","}","async function poll(fn, { interval = 1000, times = Infinity, shouldStop } = {}) {","  for (let i = 0; i < times; i++) {","    const res = await fn()","    if (shouldStop?.(res)) return res","    await sleep(interval)","  }","}"]],"note":"","text":"实现 once、memoize、retry、sleep 与轮询。 once 用闭包锁 + 缓存结果；memoize 用 Map 缓存，注意缓存键要能覆盖多参数（默认只取第一个参数，可传 resolver）；retry 用指数退避 + 抖动，且要区分可重试错误；sleep 是 Promise 化的定时器，配合 async 可做串行与轮询。 function once(fn) {   let called = false, result   return function (...args) {     if (!called) { called = true; result = fn.apply(this, args) }     return result   } } function memoize(fn, resolver = (...a) => a[0]) {   const cache = new Map()   return function (...args) {     const key = resolver(...args)     if (cache.has(key)) return cache.get(key)     const res = fn.apply(this, args)     cache.set(key, res)     return res   } } const sleep = ms => new Promise(r => setTimeout(r, ms)) async function retry(task, { times = 3, delay = 300 } = {}) {   let lastErr   for (let i = 0; i < times; i++) {     try { return await task() }     catch (e) {       lastErr = e       if (i < times - 1) await sleep(delay * 2 ** i + Math.random() * 100)     }   }   throw lastErr } async function poll(fn, { interval = 1000, times = Infinity, shouldStop } = {}) {   for (let i = 0; i < times; i++) {     const res = await fn()     if (shouldStop?.(res)) return res     await sleep(interval)   } }"},{"id":215,"num":"Q215","tag":"手写","title":"实现千分位格式化、大数相加、随机洗牌。","answers":["千分位用正则 `\\B(?=(\\d{3})+$)` 匹配「后面跟着 3 的倍数位数字」的非单词边界；要处理小数部分，不要直接对带小数点的字符串做正则。大数相加用字符串逐位从后往前加并维护进位。洗牌必须用 Fisher-Yates（从后往前与随机位置交换），`sort(() => Math.random() - 0.5)` 分布不均匀，是经典错误答案。"],"bullets":[],"code":[["function thousands(num) {","  const [int, dec] = String(num).split('.')","  return int.replace(/\\B(?=(\\d{3})+$)/g, ',') + (dec ? '.' + dec : '')","}","function addBig(a, b) {","  let i = a.length - 1, j = b.length - 1, carry = 0, res = ''","  while (i >= 0 || j >= 0 || carry) {","    const x = i >= 0 ? +a[i--] : 0","    const y = j >= 0 ? +b[j--] : 0","    const s = x + y + carry","    res = (s % 10) + res","    carry = Math.floor(s / 10)","  }","  return res.replace(/^0+/, '') || '0'","}","function shuffle(arr) {","  const a = [...arr]","  for (let i = a.length - 1; i > 0; i--) {","    const j = Math.floor(Math.random() * (i + 1))","    ;[a[i], a[j]] = [a[j], a[i]]","  }","  return a","}"]],"note":"","text":"实现千分位格式化、大数相加、随机洗牌。 千分位用正则 `\\B(?=(\\d{3})+$)` 匹配「后面跟着 3 的倍数位数字」的非单词边界；要处理小数部分，不要直接对带小数点的字符串做正则。大数相加用字符串逐位从后往前加并维护进位。洗牌必须用 Fisher-Yates（从后往前与随机位置交换），`sort(() => Math.random() - 0.5)` 分布不均匀，是经典错误答案。 function thousands(num) {   const [int, dec] = String(num).split('.')   return int.replace(/\\B(?=(\\d{3})+$)/g, ',') + (dec ? '.' + dec : '') } function addBig(a, b) {   let i = a.length - 1, j = b.length - 1, carry = 0, res = ''   while (i >= 0 || j >= 0 || carry) {     const x = i >= 0 ? +a[i--] : 0     const y = j >= 0 ? +b[j--] : 0     const s = x + y + carry     res = (s % 10) + res     carry = Math.floor(s / 10)   }   return res.replace(/^0+/, '') || '0' } function shuffle(arr) {   const a = [...arr]   for (let i = a.length - 1; i > 0; i--) {     const j = Math.floor(Math.random() * (i + 1))     ;[a[i], a[j]] = [a[j], a[i]]   }   return a }"},{"id":216,"num":"Q216","tag":"手写","title":"二分查找、快速排序、深比较 isEqual。","answers":["二分注意循环条件 `l <= r` 与中点溢出（JS 里可用 `(l + r) >> 1`，超大数据用 `l + ((r - l) >> 1)`）；快排给「易懂版」（非原地、空间 O(n)），能说出原地分区版与三数取中优化更好；isEqual 用 Object.is 起手、WeakMap 处理循环引用、比较原型与 Reflect.ownKeys 数量，递归比较每个键。"],"bullets":[],"code":[["function binarySearch(arr, target) {","  let l = 0, r = arr.length - 1","  while (l <= r) {","    const m = l + ((r - l) >> 1)","    if (arr[m] === target) return m","    arr[m] < target ? l = m + 1 : r = m - 1","  }","  return -1","}","function quickSort(arr) {","  if (arr.length <= 1) return arr","  const pivot = arr[0], left = [], right = []","  for (let i = 1; i < arr.length; i++) (arr[i] < pivot ? left : right).push(arr[i])","  return [...quickSort(left), pivot, ...quickSort(right)]","}","function isEqual(a, b, seen = new WeakMap()) {","  if (Object.is(a, b)) return true","  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false","  if (Object.getPrototypeOf(a) !== Object.getPrototypeOf(b)) return false","  if (seen.has(a)) return seen.get(a) === b","  seen.set(a, b)","  if (a instanceof Date) return a.getTime() === b.getTime()","  if (a instanceof RegExp) return String(a) === String(b)","  const ka = Reflect.ownKeys(a), kb = Reflect.ownKeys(b)","  return ka.length === kb.length &&","    ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && isEqual(a[k], b[k], seen))","}"]],"note":"","text":"二分查找、快速排序、深比较 isEqual。 二分注意循环条件 `l <= r` 与中点溢出（JS 里可用 `(l + r) >> 1`，超大数据用 `l + ((r - l) >> 1)`）；快排给「易懂版」（非原地、空间 O(n)），能说出原地分区版与三数取中优化更好；isEqual 用 Object.is 起手、WeakMap 处理循环引用、比较原型与 Reflect.ownKeys 数量，递归比较每个键。 function binarySearch(arr, target) {   let l = 0, r = arr.length - 1   while (l <= r) {     const m = l + ((r - l) >> 1)     if (arr[m] === target) return m     arr[m] < target ? l = m + 1 : r = m - 1   }   return -1 } function quickSort(arr) {   if (arr.length <= 1) return arr   const pivot = arr[0], left = [], right = []   for (let i = 1; i < arr.length; i++) (arr[i] < pivot ? left : right).push(arr[i])   return [...quickSort(left), pivot, ...quickSort(right)] } function isEqual(a, b, seen = new WeakMap()) {   if (Object.is(a, b)) return true   if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false   if (Object.getPrototypeOf(a) !== Object.getPrototypeOf(b)) return false   if (seen.has(a)) return seen.get(a) === b   seen.set(a, b)   if (a instanceof Date) return a.getTime() === b.getTime()   if (a instanceof RegExp) return String(a) === String(b)   const ka = Reflect.ownKeys(a), kb = Reflect.ownKeys(b)   return ka.length === kb.length &&     ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && isEqual(a[k], b[k], seen)) }"},{"id":217,"num":"Q217","tag":"手写","title":"实现极简 useState / useEffect（讲清 Hooks 原理即可）。","answers":["演示目的：状态不在函数里，而在外部数组中按「调用顺序」存放；每次 render 前把索引归零；这就是为什么 Hook 不能写在条件/循环里。真实 React 用 Fiber.memoizedState 的链表 + Scheduler 调度，这里只是心智模型。"],"bullets":[],"code":[["const hooks = []; let idx = 0","function useState(initial) {","  const i = idx++","  if (!(i in hooks)) hooks[i] = typeof initial === 'function' ? initial() : initial","  const setState = next => { hooks[i] = typeof next === 'function' ? next(hooks[i]) : next }","  return [hooks[i], setState]","}","function useEffect(cb, deps) {","  const i = idx++","  const prev = hooks[i]","  const changed = !prev || !deps || deps.some((d, k) => !Object.is(d, prev.deps[k]))","  if (changed) {","    prev?.cleanup?.()","    const record = { deps, cleanup: null }","    hooks[i] = record","    queueMicrotask(() => { record.cleanup = cb() })","  }","}","function render(Component) { idx = 0; Component() }"]],"note":"","text":"实现极简 useState / useEffect（讲清 Hooks 原理即可）。 演示目的：状态不在函数里，而在外部数组中按「调用顺序」存放；每次 render 前把索引归零；这就是为什么 Hook 不能写在条件/循环里。真实 React 用 Fiber.memoizedState 的链表 + Scheduler 调度，这里只是心智模型。 const hooks = []; let idx = 0 function useState(initial) {   const i = idx++   if (!(i in hooks)) hooks[i] = typeof initial === 'function' ? initial() : initial   const setState = next => { hooks[i] = typeof next === 'function' ? next(hooks[i]) : next }   return [hooks[i], setState] } function useEffect(cb, deps) {   const i = idx++   const prev = hooks[i]   const changed = !prev || !deps || deps.some((d, k) => !Object.is(d, prev.deps[k]))   if (changed) {     prev?.cleanup?.()     const record = { deps, cleanup: null }     hooks[i] = record     queueMicrotask(() => { record.cleanup = cb() })   } } function render(Component) { idx = 0; Component() }"},{"id":218,"num":"Q218","tag":"手写","title":"虚拟列表的核心区间计算（固定行高版）。","answers":["思路：可视区只渲染 start~end 条，用 translateY(start * itemH) 把渲染块推到正确位置，用 paddingBottom/占位元素撑起总高度让滚动条正确；buffer 缓冲减少快速滚动白屏。","追问：不定高怎么办？维护每项高度与前缀和数组（缓存测量值 + 用预估高度先渲染），用二分查找前缀和定位 startIndex，滚动后异步测量真实高度并修正总高与偏移。"],"bullets":[],"code":[["function getRange(scrollTop, viewportH, itemH, total, buffer = 5) {","  const start = Math.max(0, Math.floor(scrollTop / itemH) - buffer)","  const count = Math.ceil(viewportH / itemH) + buffer * 2","  const end = Math.min(total, start + count)","  return {","    start, end,","    offsetY: start * itemH,","    paddingBottom: (total - end) * itemH","  }","}"]],"note":"","text":"虚拟列表的核心区间计算（固定行高版）。 思路：可视区只渲染 start~end 条，用 translateY(start * itemH) 把渲染块推到正确位置，用 paddingBottom/占位元素撑起总高度让滚动条正确；buffer 缓冲减少快速滚动白屏。 追问：不定高怎么办？维护每项高度与前缀和数组（缓存测量值 + 用预估高度先渲染），用二分查找前缀和定位 startIndex，滚动后异步测量真实高度并修正总高与偏移。 function getRange(scrollTop, viewportH, itemH, total, buffer = 5) {   const start = Math.max(0, Math.floor(scrollTop / itemH) - buffer)   const count = Math.ceil(viewportH / itemH) + buffer * 2   const end = Math.min(total, start + count)   return {     start, end,     offsetY: start * itemH,     paddingBottom: (total - end) * itemH   } }"},{"id":219,"num":"Q219","tag":"手写","title":"图片懒加载（IntersectionObserver 版）与 URL 参数解析。","answers":["懒加载：给 img 用 data-src，IntersectionObserver 进入视口（可配 rootMargin 提前加载）时赋 src 并 unobserve；比监听 scroll + getBoundingClientRect 性能好得多（不在主线程做布局计算）。注意首屏 LCP 图不要懒加载。","参数解析：URLSearchParams 处理重复键、编码与空值；Object.fromEntries 把 entries 转对象，重复键会保留最后一个。"],"bullets":[],"code":[["const io = new IntersectionObserver(entries => {","  for (const e of entries) {","    if (!e.isIntersecting) continue","    const img = e.target","    img.src = img.dataset.src","    io.unobserve(img)","  }","}, { rootMargin: '200px' })","document.querySelectorAll('img[data-src]').forEach(img => io.observe(img))","const getParams = (url = location.href) =>","  Object.fromEntries(new URL(url).searchParams.entries())"]],"note":"","text":"图片懒加载（IntersectionObserver 版）与 URL 参数解析。 懒加载：给 img 用 data-src，IntersectionObserver 进入视口（可配 rootMargin 提前加载）时赋 src 并 unobserve；比监听 scroll + getBoundingClientRect 性能好得多（不在主线程做布局计算）。注意首屏 LCP 图不要懒加载。 参数解析：URLSearchParams 处理重复键、编码与空值；Object.fromEntries 把 entries 转对象，重复键会保留最后一个。 const io = new IntersectionObserver(entries => {   for (const e of entries) {     if (!e.isIntersecting) continue     const img = e.target     img.src = img.dataset.src     io.unobserve(img)   } }, { rootMargin: '200px' }) document.querySelectorAll('img[data-src]').forEach(img => io.observe(img)) const getParams = (url = location.href) =>   Object.fromEntries(new URL(url).searchParams.entries())"},{"id":220,"num":"Q220","tag":"手写","title":"实现每隔一秒打印 1,2,3,4（闭包 / let / 递归 / async 四种解法）。","answers":["考点是「闭包保存变量」与「异步循环」。推荐递归 + setTimeout 或 async + sleep（最清晰）；用 var + setTimeout 直接写会全部打印 5。"],"bullets":[],"code":[["// 解法 1：let 块级绑定","for (let i = 1; i <= 4; i++) setTimeout(() => console.log(i), i * 1000)","// 解法 2：IIFE 闭包（var 时代标准答案）","for (var i = 1; i <= 4; i++) {","  (function (j) { setTimeout(() => console.log(j), j * 1000) })(i)","}","// 解法 3：递归（无定时器堆积）","function print(n, max) {","  if (n > max) return","  setTimeout(() => { console.log(n); print(n + 1, max) }, 1000)","}","print(1, 4)","// 解法 4：async + sleep","const sleep = ms => new Promise(r => setTimeout(r, ms))",";(async () => { for (let i = 1; i <= 4; i++) { await sleep(1000); console.log(i) } })()"]],"note":"","text":"实现每隔一秒打印 1,2,3,4（闭包 / let / 递归 / async 四种解法）。 考点是「闭包保存变量」与「异步循环」。推荐递归 + setTimeout 或 async + sleep（最清晰）；用 var + setTimeout 直接写会全部打印 5。 // 解法 1：let 块级绑定 for (let i = 1; i <= 4; i++) setTimeout(() => console.log(i), i * 1000) // 解法 2：IIFE 闭包（var 时代标准答案） for (var i = 1; i <= 4; i++) {   (function (j) { setTimeout(() => console.log(j), j * 1000) })(i) } // 解法 3：递归（无定时器堆积） function print(n, max) {   if (n > max) return   setTimeout(() => { console.log(n); print(n + 1, max) }, 1000) } print(1, 4) // 解法 4：async + sleep const sleep = ms => new Promise(r => setTimeout(r, ms)) ;(async () => { for (let i = 1; i <= 4; i++) { await sleep(1000); console.log(i) } })()"},{"id":221,"num":"Q221","tag":"手写","title":"用 setTimeout 模拟 setInterval（并解释为什么）。","answers":["原因：setInterval 不管上一次回调是否执行完就按固定周期往队列里塞任务，回调耗时超过间隔时会产生任务堆积、间隔失真甚至连续执行；用递归 setTimeout 能保证「上一次执行完再等 interval」，间隔更稳定，也便于动态改间隔与停止。"],"bullets":[],"code":[["function myInterval(fn, ms) {","  let timer = null, stopped = false","  const tick = () => {","    if (stopped) return","    fn()","    timer = setTimeout(tick, ms)","  }","  timer = setTimeout(tick, ms)","  return () => { stopped = true; clearTimeout(timer) }","}","// 支持异步回调的版本：await fn() 之后再 setTimeout 更好"]],"note":"","text":"用 setTimeout 模拟 setInterval（并解释为什么）。 原因：setInterval 不管上一次回调是否执行完就按固定周期往队列里塞任务，回调耗时超过间隔时会产生任务堆积、间隔失真甚至连续执行；用递归 setTimeout 能保证「上一次执行完再等 interval」，间隔更稳定，也便于动态改间隔与停止。 function myInterval(fn, ms) {   let timer = null, stopped = false   const tick = () => {     if (stopped) return     fn()     timer = setTimeout(tick, ms)   }   timer = setTimeout(tick, ms)   return () => { stopped = true; clearTimeout(timer) } } // 支持异步回调的版本：await fn() 之后再 setTimeout 更好"},{"id":222,"num":"Q222","tag":"手写","title":"倒计时纠偏（为什么 setTimeout 做倒计时会不准）。","answers":["原因：JS 定时器受事件循环、主线程长任务、后台标签页节流（最小 1s 甚至更久）、系统休眠影响，`setInterval(1000)` 累计误差会越来越大。做法：记录「目标结束时间戳」，每次用 `endTime - Date.now()` 重新计算剩余时间，而不是在本地累减；页面从后台回来时用 visibilitychange 立即重算；服务端下发结束时间避免客户端时钟被篡改。"],"bullets":[],"code":[["function countdown(endTime, onTick, onDone) {","  let timer = null","  const tick = () => {","    const left = endTime - Date.now()","    if (left <= 0) { onDone(); return }","    onTick(Math.max(0, left))","    timer = setTimeout(tick, Math.min(1000, left % 1000 || 1000))","  }","  tick()","  document.addEventListener('visibilitychange', () => {","    if (!document.hidden) { clearTimeout(timer); tick() }","  })","  return () => clearTimeout(timer)","}"]],"note":"","text":"倒计时纠偏（为什么 setTimeout 做倒计时会不准）。 原因：JS 定时器受事件循环、主线程长任务、后台标签页节流（最小 1s 甚至更久）、系统休眠影响，`setInterval(1000)` 累计误差会越来越大。做法：记录「目标结束时间戳」，每次用 `endTime - Date.now()` 重新计算剩余时间，而不是在本地累减；页面从后台回来时用 visibilitychange 立即重算；服务端下发结束时间避免客户端时钟被篡改。 function countdown(endTime, onTick, onDone) {   let timer = null   const tick = () => {     const left = endTime - Date.now()     if (left <= 0) { onDone(); return }     onTick(Math.max(0, left))     timer = setTimeout(tick, Math.min(1000, left % 1000 || 1000))   }   tick()   document.addEventListener('visibilitychange', () => {     if (!document.hidden) { clearTimeout(timer); tick() }   })   return () => clearTimeout(timer) }"},{"id":223,"num":"Q223","tag":"手写","title":"实现一个简单的前端埋点 / 错误监控采集器。","answers":["考察点：全局错误与未处理 Promise 拒绝、资源加载错误要在捕获阶段监听（资源错误不冒泡）、上报用 sendBeacon / fetch keepalive 保证页面卸载时也能发出、批量合并与采样、避免监控自身报错造成递归。"],"bullets":[],"code":[[";(function () {","  const queue = []","  window.addEventListener('error', e => {","    if (e.target && e.target !== window && e.target.src) {","      queue.push({ type: 'resource', src: e.target.src })","    } else {","      queue.push({ type: 'js', msg: e.message, stack: e.error?.stack })","    }","  }, true)  // 捕获阶段才能拿到资源错误","  window.addEventListener('unhandledrejection', e =>","    queue.push({ type: 'promise', reason: String(e.reason) }))","  const flush = () => {","    if (!queue.length) return","    const body = JSON.stringify(queue.splice(0))","    navigator.sendBeacon?.('/api/log', body) ||","      fetch('/api/log', { method: 'POST', body, keepalive: true })","  }","  setInterval(flush, 5000)","  window.addEventListener('pagehide', flush)","})()"]],"note":"","text":"实现一个简单的前端埋点 / 错误监控采集器。 考察点：全局错误与未处理 Promise 拒绝、资源加载错误要在捕获阶段监听（资源错误不冒泡）、上报用 sendBeacon / fetch keepalive 保证页面卸载时也能发出、批量合并与采样、避免监控自身报错造成递归。 ;(function () {   const queue = []   window.addEventListener('error', e => {     if (e.target && e.target !== window && e.target.src) {       queue.push({ type: 'resource', src: e.target.src })     } else {       queue.push({ type: 'js', msg: e.message, stack: e.error?.stack })     }   }, true)  // 捕获阶段才能拿到资源错误   window.addEventListener('unhandledrejection', e =>     queue.push({ type: 'promise', reason: String(e.reason) }))   const flush = () => {     if (!queue.length) return     const body = JSON.stringify(queue.splice(0))     navigator.sendBeacon?.('/api/log', body) ||       fetch('/api/log', { method: 'POST', body, keepalive: true })   }   setInterval(flush, 5000)   window.addEventListener('pagehide', flush) })()"},{"id":224,"num":"Q224","tag":"手写","title":"实现一个简单的模板字符串解析 / 大数金额转中文？（选考）","answers":["这类「造轮子」题考的是正则 + 状态机 + 边界处理，不要慌：先问清输入范围与非法输入怎么处理，再拆「词法分析 → 语法/语义 → 输出」三步。以简易模板为例："],"bullets":[],"code":[["function render(tpl, data) {","  return tpl.replace(/\\{\\{\\s*([\\w.]+)\\s*\\}\\}/g, (_, path) => {","    const v = path.split('.').reduce((o, k) => o?.[k], data)","    return v == null ? '' : String(v)","  })","}","render('Hi {{user.name}}, {{user.age}}', { user: { name: 'Tom', age: 18 } })"]],"note":"面试官真正看的是：有没有先澄清需求、有没有考虑非法输入 / 转义 / XSS、复杂度与可维护性，而不是一次写对。","text":"实现一个简单的模板字符串解析 / 大数金额转中文？（选考） 这类「造轮子」题考的是正则 + 状态机 + 边界处理，不要慌：先问清输入范围与非法输入怎么处理，再拆「词法分析 → 语法/语义 → 输出」三步。以简易模板为例： function render(tpl, data) {   return tpl.replace(/\\{\\{\\s*([\\w.]+)\\s*\\}\\}/g, (_, path) => {     const v = path.split('.').reduce((o, k) => o?.[k], data)     return v == null ? '' : String(v)   }) } render('Hi {{user.name}}, {{user.age}}', { user: { name: 'Tom', age: 18 } }) 面试官真正看的是：有没有先澄清需求、有没有考虑非法输入 / 转义 / XSS、复杂度与可维护性，而不是一次写对。"}]},{"id":"day7-s3","day":7,"title":"7.3 场景题与设计题（中大厂必问）","note":"","questions":[{"id":225,"num":"Q225","tag":"场景","title":"设计一套登录鉴权方案（Token 存哪、如何刷新、如何退出、多端控制）？","answers":["推荐方案：Access Token 短时（15 分钟）+ Refresh Token 长时（7 天，存 HttpOnly + Secure + SameSite=Lax Cookie）；Access Token 放内存（JS 变量 / 状态库）或 HttpOnly Cookie，不放 localStorage（XSS 可直接读走）。","流程：登录成功服务端下发双 token → 请求拦截器自动带 Access Token → 401 时用 Refresh Token 静默换新，并用一个「共享的刷新 Promise」让并发的多个 401 只刷新一次（refresh 期间的请求排队，刷新完统一重放）→ Refresh 也失效则跳登录并清除状态。","退出与多端：服务端维护 token 版本/黑名单或 session 表，退出即失效 Refresh Token 并广播（WebSocket / 轮询），其他标签页通过 storage / BroadcastChannel 事件同步登出；关键操作可二次校验。","为什么这么选：Cookie 天然抗 XSS 窃取（HttpOnly）但要防 CSRF（SameSite + CSRF Token），内存 token 抗 CSRF 但刷新页面丢失（需静默恢复），localStorage 两者都不抗；讲清楚 trade-off 比背方案更重要。"],"bullets":[],"code":[],"note":"","text":"设计一套登录鉴权方案（Token 存哪、如何刷新、如何退出、多端控制）？ 推荐方案：Access Token 短时（15 分钟）+ Refresh Token 长时（7 天，存 HttpOnly + Secure + SameSite=Lax Cookie）；Access Token 放内存（JS 变量 / 状态库）或 HttpOnly Cookie，不放 localStorage（XSS 可直接读走）。 流程：登录成功服务端下发双 token → 请求拦截器自动带 Access Token → 401 时用 Refresh Token 静默换新，并用一个「共享的刷新 Promise」让并发的多个 401 只刷新一次（refresh 期间的请求排队，刷新完统一重放）→ Refresh 也失效则跳登录并清除状态。 退出与多端：服务端维护 token 版本/黑名单或 session 表，退出即失效 Refresh Token 并广播（WebSocket / 轮询），其他标签页通过 storage / BroadcastChannel 事件同步登出；关键操作可二次校验。 为什么这么选：Cookie 天然抗 XSS 窃取（HttpOnly）但要防 CSRF（SameSite + CSRF Token），内存 token 抗 CSRF 但刷新页面丢失（需静默恢复），localStorage 两者都不抗；讲清楚 trade-off 比背方案更重要。"},{"id":226,"num":"Q226","tag":"场景","title":"设计一个权限系统（路由级 + 按钮级）？","answers":["模型：RBAC（用户 → 角色 → 权限点），权限点用「资源:操作」字符串（如 order:export）或位图；后端返回当前用户权限列表，前端不硬编码。","路由级：静态路由表 + meta.requiresAuth/permissions，登录后按权限动态 addRoute / 生成路由（Vue Router addRoute / React Router 配置过滤），并在全局守卫做兜底校验（防止手敲 URL）；注意 404 路由要最后添加，否则动态路由被 404 吞掉。","按钮级：自定义指令 v-permission / 组件 <Auth code=\"...\"> / Hook usePermission；只读隐藏不够，后端接口必须再次鉴权（前端只是体验层）。","加分：菜单与路由分离、权限变更后如何刷新（重新拉取 or 重新登录）、缓存与权限变更不一致、无权限页面的友好提示、审计日志。"],"bullets":[],"code":[],"note":"","text":"设计一个权限系统（路由级 + 按钮级）？ 模型：RBAC（用户 → 角色 → 权限点），权限点用「资源:操作」字符串（如 order:export）或位图；后端返回当前用户权限列表，前端不硬编码。 路由级：静态路由表 + meta.requiresAuth/permissions，登录后按权限动态 addRoute / 生成路由（Vue Router addRoute / React Router 配置过滤），并在全局守卫做兜底校验（防止手敲 URL）；注意 404 路由要最后添加，否则动态路由被 404 吞掉。 按钮级：自定义指令 v-permission / 组件 <Auth code=\"...\"> / Hook usePermission；只读隐藏不够，后端接口必须再次鉴权（前端只是体验层）。 加分：菜单与路由分离、权限变更后如何刷新（重新拉取 or 重新登录）、缓存与权限变更不一致、无权限页面的友好提示、审计日志。"},{"id":227,"num":"Q227","tag":"场景","title":"封装一个公司级请求库，你会设计哪些能力？","answers":["基础：baseURL / 超时 / 统一 headers / 请求响应拦截器 / 统一错误码与错误提示 / 自动 JSON 转换 / 取消（AbortController）。","进阶：① 401 静默刷新 + 并发请求排队重放；② 请求去重（相同 key 的并发 GET 复用同一个 Promise）；③ 失败重试（只对幂等请求、指数退避、可配置）；④ 缓存与陈旧再验证（staleTime、按 key 失效）；⑤ 竞态保护（新请求覆盖旧请求）；⑥ 取消路由切换时的未完成请求；⑦ 上传下载进度、断点续传；⑧ 埋点与耗时上报、链路追踪 traceId；⑨ mock 与类型（泛型推导响应类型）。","加分：讲出「什么时候不该封装」（小项目直接用 fetch 或 TanStack Query 更省）、以及「请求库与服务端状态库的分工」。"],"bullets":[],"code":[],"note":"","text":"封装一个公司级请求库，你会设计哪些能力？ 基础：baseURL / 超时 / 统一 headers / 请求响应拦截器 / 统一错误码与错误提示 / 自动 JSON 转换 / 取消（AbortController）。 进阶：① 401 静默刷新 + 并发请求排队重放；② 请求去重（相同 key 的并发 GET 复用同一个 Promise）；③ 失败重试（只对幂等请求、指数退避、可配置）；④ 缓存与陈旧再验证（staleTime、按 key 失效）；⑤ 竞态保护（新请求覆盖旧请求）；⑥ 取消路由切换时的未完成请求；⑦ 上传下载进度、断点续传；⑧ 埋点与耗时上报、链路追踪 traceId；⑨ mock 与类型（泛型推导响应类型）。 加分：讲出「什么时候不该封装」（小项目直接用 fetch 或 TanStack Query 更省）、以及「请求库与服务端状态库的分工」。"},{"id":228,"num":"Q228","tag":"场景","title":"线上页面白屏 / 报错，你的排查路径是什么？","answers":["① 先确认影响面：监控大盘看错误率、版本、浏览器/机型/地域分布，判断是发版引入还是个例；② 看错误类型：JS 运行时错误（配合 sourcemap 还原到具体文件行）、资源 404/加载失败（CDN、文件名 hash 与 HTML 引用不一致）、接口 500/超时、CSP 拦截；③ 复现：同版本同环境 + 无痕/禁用插件，看控制台与 Network，检查是否有 document.write、JSONP 失败、hydration 不一致；④ 定位到代码后看是否与最近一次提交相关，用 bisect / 回滚验证；⑤ 止血：先回滚到上一版本或关 feature flag，再修；⑥ 沉淀：加 E2E 冒烟、构建产物校验、灰度发布与告警阈值。","常见根因：发版后 HTML 缓存导致引用了不存在的 hash 文件（HTML 必须 no-cache）、依赖升级破坏、环境变量配置错、CDN 节点异常、SSR 双端渲染不一致、第三方脚本阻塞。"],"bullets":[],"code":[],"note":"","text":"线上页面白屏 / 报错，你的排查路径是什么？ ① 先确认影响面：监控大盘看错误率、版本、浏览器/机型/地域分布，判断是发版引入还是个例；② 看错误类型：JS 运行时错误（配合 sourcemap 还原到具体文件行）、资源 404/加载失败（CDN、文件名 hash 与 HTML 引用不一致）、接口 500/超时、CSP 拦截；③ 复现：同版本同环境 + 无痕/禁用插件，看控制台与 Network，检查是否有 document.write、JSONP 失败、hydration 不一致；④ 定位到代码后看是否与最近一次提交相关，用 bisect / 回滚验证；⑤ 止血：先回滚到上一版本或关 feature flag，再修；⑥ 沉淀：加 E2E 冒烟、构建产物校验、灰度发布与告警阈值。 常见根因：发版后 HTML 缓存导致引用了不存在的 hash 文件（HTML 必须 no-cache）、依赖升级破坏、环境变量配置错、CDN 节点异常、SSR 双端渲染不一致、第三方脚本阻塞。"},{"id":229,"num":"Q229","tag":"场景","title":"设计一个组件库，需要考虑什么？","answers":["API 设计：受控/非受控双模式（value/defaultValue + onChange）、组合式（插槽 / children / compound components）、稳定的 props 命名与向后兼容、TypeScript 类型完备（泛型、ref 转发、事件类型）。","质量：无障碍（ARIA 属性、键盘导航、焦点管理、色彩对比度）、样式隔离与主题（CSS 变量 / Design Token / 暗色模式）、按需加载与 Tree Shaking（ESM + sideEffects）、单元测试 + 视觉回归 + E2E、文档站点与示例。","工程：Monorepo + Changesets 发版、语义化版本、SSR 兼容（不直接访问 window）、国际化、RTL 布局、弹层类组件的 Portal / z-index 管理、SSR 下 id 生成稳定（useId）。","加分：能说出「组件库最难的是 API 稳定性与破坏性变更管理」，而不是「写个 Button 很快」。"],"bullets":[],"code":[],"note":"","text":"设计一个组件库，需要考虑什么？ API 设计：受控/非受控双模式（value/defaultValue + onChange）、组合式（插槽 / children / compound components）、稳定的 props 命名与向后兼容、TypeScript 类型完备（泛型、ref 转发、事件类型）。 质量：无障碍（ARIA 属性、键盘导航、焦点管理、色彩对比度）、样式隔离与主题（CSS 变量 / Design Token / 暗色模式）、按需加载与 Tree Shaking（ESM + sideEffects）、单元测试 + 视觉回归 + E2E、文档站点与示例。 工程：Monorepo + Changesets 发版、语义化版本、SSR 兼容（不直接访问 window）、国际化、RTL 布局、弹层类组件的 Portal / z-index 管理、SSR 下 id 生成稳定（useId）。 加分：能说出「组件库最难的是 API 稳定性与破坏性变更管理」，而不是「写个 Button 很快」。"},{"id":230,"num":"Q230","tag":"场景","title":"如何实现前端灰度发布 / A/B 实验？","answers":["分流：按用户 ID / 设备 ID 哈希取模（保证同一用户稳定命中），或白名单、地域、比例、人群标签；分流逻辑放边缘（CDN / 网关 / SSR）或前端 SDK，流量与服务层要共用一个分桶标识。","实施：① 静态资源双版本 + HTML 入口按分桶切换（最简单）；② feature flag 配置中心动态下发开关（不发版即可关停）；③ 微前端/模块联邦按版本加载不同 remote；④ 客户端 SDK 在运行时决定渲染哪套 UI。","度量：埋点带实验组标识，看核心指标（错误率、性能、转化），用统计显著性判断而非「看着好像变好」；配套：快速回滚、灰度放量节奏（1% → 5% → 20% → 100%）、实验互斥与分层。","坑：用户跨设备命中不一致、缓存导致分组串味、实验代码长期不清理变成技术债。"],"bullets":[],"code":[],"note":"","text":"如何实现前端灰度发布 / A/B 实验？ 分流：按用户 ID / 设备 ID 哈希取模（保证同一用户稳定命中），或白名单、地域、比例、人群标签；分流逻辑放边缘（CDN / 网关 / SSR）或前端 SDK，流量与服务层要共用一个分桶标识。 实施：① 静态资源双版本 + HTML 入口按分桶切换（最简单）；② feature flag 配置中心动态下发开关（不发版即可关停）；③ 微前端/模块联邦按版本加载不同 remote；④ 客户端 SDK 在运行时决定渲染哪套 UI。 度量：埋点带实验组标识，看核心指标（错误率、性能、转化），用统计显著性判断而非「看着好像变好」；配套：快速回滚、灰度放量节奏（1% → 5% → 20% → 100%）、实验互斥与分层。 坑：用户跨设备命中不一致、缓存导致分组串味、实验代码长期不清理变成技术债。"},{"id":231,"num":"Q231","tag":"场景","title":"乐观更新（Optimistic UI）怎么做？失败如何回滚？","answers":["流程：用户操作后立刻更新本地 UI（不等接口）→ 发请求 → 成功则用服务端返回的真实数据校正（如数据库生成的 ID、时间戳）→ 失败则回滚到操作前快照并提示重试。","要点：① 保存快照（深拷贝或记录反向操作）；② 用唯一事务 ID 关联请求与回滚，避免并发操作互相覆盖；③ 失败后要处理「其它操作已 modify 同一份数据」的情况（用版本号 / CAS 而不是整体覆盖）；④ 给 pending 状态视觉反馈，禁用重复提交；⑤ 网络离线时进入本地队列，恢复后重放。","React 19 的 useOptimistic / useActionState 就是把这个模式标准化，答出来是加分项。"],"bullets":[],"code":[],"note":"","text":"乐观更新（Optimistic UI）怎么做？失败如何回滚？ 流程：用户操作后立刻更新本地 UI（不等接口）→ 发请求 → 成功则用服务端返回的真实数据校正（如数据库生成的 ID、时间戳）→ 失败则回滚到操作前快照并提示重试。 要点：① 保存快照（深拷贝或记录反向操作）；② 用唯一事务 ID 关联请求与回滚，避免并发操作互相覆盖；③ 失败后要处理「其它操作已 modify 同一份数据」的情况（用版本号 / CAS 而不是整体覆盖）；④ 给 pending 状态视觉反馈，禁用重复提交；⑤ 网络离线时进入本地队列，恢复后重放。 React 19 的 useOptimistic / useActionState 就是把这个模式标准化，答出来是加分项。"},{"id":232,"num":"Q232","tag":"场景","title":"国际化（i18n）与本地化要注意什么？","answers":["不只是翻译：文案抽取（不硬编码、用 key + 命名空间）、复数规则（不同语言复数形式不同，用 ICU MessageFormat）、变量插值与语序、日期/时间/数字/货币格式化（Intl.DateTimeFormat / Intl.NumberFormat）、时区处理（存 UTC、展示按用户时区）、RTL 布局（direction / 逻辑属性 margin-inline）、字体与断行、图片与图标的文化差异、本地化测试与伪语言（pseudo-locale，用超长字符串测溢出）。","工程：按需加载语言包、缺失 key 回退策略、与后端错误码文案的协同、翻译平台与 CI 校验。"],"bullets":[],"code":[],"note":"","text":"国际化（i18n）与本地化要注意什么？ 不只是翻译：文案抽取（不硬编码、用 key + 命名空间）、复数规则（不同语言复数形式不同，用 ICU MessageFormat）、变量插值与语序、日期/时间/数字/货币格式化（Intl.DateTimeFormat / Intl.NumberFormat）、时区处理（存 UTC、展示按用户时区）、RTL 布局（direction / 逻辑属性 margin-inline）、字体与断行、图片与图标的文化差异、本地化测试与伪语言（pseudo-locale，用超长字符串测溢出）。 工程：按需加载语言包、缺失 key 回退策略、与后端错误码文案的协同、翻译平台与 CI 校验。"},{"id":233,"num":"Q233","tag":"开放题","title":"「你做过最有挑战的项目 / 最大的坑」怎么答？","answers":["模板：一句话背景（业务、量级、你的角色）→ 明确问题与量化现状（如「首屏 8.2s，LCP P75 4.1s，列表 1 万条卡顿」）→ 约束条件（不能改后端 / 要兼容老浏览器 / 工期）→ 你提出的 2~3 个方案与取舍（为什么选它）→ 落地细节与关键代码思路 → 结果数据（优化前后对比 + 线上 RUM 验证）→ 复盘沉淀（规范化、工具化、文档、可复用方案）。","雷区：只讲「我用了某某框架」不讲决策；把团队成果说成个人；给不出数字；被追问细节就答不上来；选一个自己没真正做过的技术难点。"],"bullets":[],"code":[],"note":"","text":"「你做过最有挑战的项目 / 最大的坑」怎么答？ 模板：一句话背景（业务、量级、你的角色）→ 明确问题与量化现状（如「首屏 8.2s，LCP P75 4.1s，列表 1 万条卡顿」）→ 约束条件（不能改后端 / 要兼容老浏览器 / 工期）→ 你提出的 2~3 个方案与取舍（为什么选它）→ 落地细节与关键代码思路 → 结果数据（优化前后对比 + 线上 RUM 验证）→ 复盘沉淀（规范化、工具化、文档、可复用方案）。 雷区：只讲「我用了某某框架」不讲决策；把团队成果说成个人；给不出数字；被追问细节就答不上来；选一个自己没真正做过的技术难点。"},{"id":234,"num":"Q234","tag":"开放题","title":"「你平时怎么学前端 / 怎么判断一个技术方案该不该引入」？","answers":["学习：官方文档优先（MDN、React/Vue 官方、TC39 提案、规范原文）→ 动手做最小验证 → 读源码/设计文档理解取舍 → 输出（笔记、分享、PR）；对「八股文」的态度是理解原理而非死记。","技术选型四问：① 解决什么问题、现状量化指标是什么；② 收益与成本（学习成本、包体积、维护成本、迁移风险、锁死风险）；③ 生态与团队（维护活跃度、TS 支持、团队熟悉度、招人难度）；④ 退出策略（能否渐进引入、能否回滚、有没有替代）。先做 POC 与压测，再小范围灰度，用数据决定。"],"bullets":[],"code":[],"note":"","text":"「你平时怎么学前端 / 怎么判断一个技术方案该不该引入」？ 学习：官方文档优先（MDN、React/Vue 官方、TC39 提案、规范原文）→ 动手做最小验证 → 读源码/设计文档理解取舍 → 输出（笔记、分享、PR）；对「八股文」的态度是理解原理而非死记。 技术选型四问：① 解决什么问题、现状量化指标是什么；② 收益与成本（学习成本、包体积、维护成本、迁移风险、锁死风险）；③ 生态与团队（维护活跃度、TS 支持、团队熟悉度、招人难度）；④ 退出策略（能否渐进引入、能否回滚、有没有替代）。先做 POC 与压测，再小范围灰度，用数据决定。"}]},{"id":"day7-s4","day":7,"title":"7.4 面试冲刺：30 秒速答表","note":"最后半天不要再啃新知识点。用这张表做「随机抽题 → 口头作答」训练，说不顺的立刻回前面章节重看。能流畅讲出来，才算真的背会。","questions":[]},{"id":"day7-s5","day":7,"title":"7.5 七天回顾与面试前 Checklist","note":"","questions":[{"id":235,"num":"Q235","tag":"自检","title":"面试前一晚，按这份清单逐条打勾。","answers":[],"bullets":["能不看资料讲清 10 个核心原理：原型链、闭包、Event Loop、Promise、Vue3 响应式、React Fiber、Hooks、diff/key、HTTP 缓存、TLS 握手。","能徒手写出的 12 道题：防抖、节流、深拷贝、call/apply/bind、new、instanceof、Promise.all、MyPromise、并发控制、柯里化、LRU、EventEmitter。","能完整推演 3 道混合输出题（同步 + 微任务 + 宏任务 + async/await），并解释为什么。","能讲清 3 个「自己项目里的真实问题」，每个都带数字、工具名、方案取舍与验证结果。","能说清 5 组对比的区别与取舍：Vue2/Vue3、Vue/React、CJS/ESM、Webpack/Vite、Cookie/JWT。","准备好 3 个反问面试官的问题（团队技术栈与演进、这个岗位要解决的核心问题、性能/工程化现状与规划）。","简历上每个技术名词都要能接住两轮追问；不熟的不要在简历里写。"],"code":[],"note":"","text":"面试前一晚，按这份清单逐条打勾。 能不看资料讲清 10 个核心原理：原型链、闭包、Event Loop、Promise、Vue3 响应式、React Fiber、Hooks、diff/key、HTTP 缓存、TLS 握手。 能徒手写出的 12 道题：防抖、节流、深拷贝、call/apply/bind、new、instanceof、Promise.all、MyPromise、并发控制、柯里化、LRU、EventEmitter。 能完整推演 3 道混合输出题（同步 + 微任务 + 宏任务 + async/await），并解释为什么。 能讲清 3 个「自己项目里的真实问题」，每个都带数字、工具名、方案取舍与验证结果。 能说清 5 组对比的区别与取舍：Vue2/Vue3、Vue/React、CJS/ESM、Webpack/Vite、Cookie/JWT。 准备好 3 个反问面试官的问题（团队技术栈与演进、这个岗位要解决的核心问题、性能/工程化现状与规划）。 简历上每个技术名词都要能接住两轮追问；不熟的不要在简历里写。"}]},{"id":"day7-s6","day":7,"title":"7.6 资料来源与说明","note":"本宝典的题目框架与知识模块，参考了 GitHub 上多个高星前端面试仓库的目录结构与高频题型，并结合 2025—2026 年大厂真题趋势（React 19 / Vue3 编译优化 / 工程化决策 / Web Vitals / 场景设计题）整理、重写与补全答案。所有答案均为可直接口述的表达，代码示例可直接在浏览器控制台或 Node 中运行。","questions":[{"id":236,"num":"Q236","tag":"说明","title":"怎么使用这份资料效果最好？","answers":["① 不要逐字背答案：先盖住答案自己讲一遍（出声，用手机的语音备忘录录下来），讲不顺的地方就是薄弱点；② 每道题都要能接住一轮「为什么」，比如被问到 Proxy 就准备好「缺点是什么」；③ 手写题务必在编辑器里真敲一遍，边界条件（空数组、循环引用、this、取消）比主干代码更常被追问；④ 第 7 天的速答表用来做随机抽题自测，连续三天都能流畅讲完，才叫「背完」。","⑤ 八股文是入场券不是终点：面试官从「答出原理」到「讲出落地问题与优化方案」打分，把每个知识点挂到一个自己做过的真实场景上，分数会明显不同。"],"bullets":[],"code":[],"note":"","text":"怎么使用这份资料效果最好？ ① 不要逐字背答案：先盖住答案自己讲一遍（出声，用手机的语音备忘录录下来），讲不顺的地方就是薄弱点；② 每道题都要能接住一轮「为什么」，比如被问到 Proxy 就准备好「缺点是什么」；③ 手写题务必在编辑器里真敲一遍，边界条件（空数组、循环引用、this、取消）比主干代码更常被追问；④ 第 7 天的速答表用来做随机抽题自测，连续三天都能流畅讲完，才叫「背完」。 ⑤ 八股文是入场券不是终点：面试官从「答出原理」到「讲出落地问题与优化方案」打分，把每个知识点挂到一个自己做过的真实场景上，分数会明显不同。"}]}]}],"tables":[{"title":"高频问题·30 秒速答（按主题速查）","rows":[["主题","一句话答案","必带关键词"],["闭包","函数 + 定义时词法环境，外层变量被内部函数引用而常驻堆内存","词法作用域、[[Environment]]、内存泄漏"],["原型链","对象沿 [[Prototype]] 向上找属性，终点 Object.prototype → null","prototype、__proto__、constructor"],["this 绑定","new > 显式 > 隐式 > 默认；箭头函数沿作用域链继承","优先级、箭头函数不可改 this"],["Event Loop","一个宏任务 → 清空全部微任务 → 渲染 → 下一个宏任务","宏任务、微任务、queueMicrotask"],["Promise","A+ 三态不可逆 <script>
/**
 * 前端八股文工作台 · 视图层
 * 纯函数：接收 ctx（数据 + 状态 + 统计 + 工具），返回 HTML 字符串。
 * 所有交互统一用 data-action / data-* 声明，由 app.js 事件委托处理。
 */
(function (root) {
  'use strict';

  const V = {};

  function icon(name, cls) {
    return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + name + '"></use></svg>';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function masteryDot(g) {
    const cls = g === 3 ? 'g3' : g === 2 ? 'g2' : g === 1 ? 'g1' : 'g0';
    return '<i class="dot ' + cls + '"></i>';
  }
  function gradeLabel(g) {
    return g === 3 ? '已掌握' : g === 2 ? '模糊' : g === 1 ? '不会' : '未做';
  }

  /* ---------------- 顶部栏 ---------------- */
  V.header = function (ctx) {
    const r = ctx.route;
    const titles = {
      home: ['工作台', '前端八股 · 7 天速背'],
      library: ['题库', ctx.data.total + ' 道题 · ' + ctx.data.stats.chapters + ' 天'],
      day: ['第 ' + r.day + ' 天', ctx.chapter ? ctx.chapter.short : ''],
      question: [ctx.q ? ctx.q.num : '题目', ctx.q ? gradeLabel(ctx.h.grade(ctx.q.id)) : ''],
      review: ['翻卡自测', '先讲一遍，再看答案'],
      run: ['自测中', '第 ' + (ctx.ui.reviewIndex + 1) + ' / ' + ctx.ui.reviewQueue.length + ' 题'],
      cheats: ['速查表', '面试前最后半天'],
      mine: ['我的', '进度 · 设置 · 数据'],
      list: [ctx.route.kind === 'fav' ? '收藏夹' : ctx.route.kind === 'wrong' ? '错题本' : '模糊题', '共 ' + ctx.list.length + ' 题']
    };
    const t = titles[r.view] || ['八股速背', ''];
    let actions = '';
    if (r.view === 'question' || r.view === 'run') {
      const id = r.view === 'question' ? ctx.q.id : ctx.ui.currentQId;
      actions = '<button type="button" class="icon-btn ' + (ctx.h.isFav(id) ? 'on' : '') +
        '" data-action="toggle-fav" data-id="' + id + '" aria-label="收藏">' + icon('star') + '</button>';
    } else if (r.view === 'home' || r.view === 'library' || r.view === 'cheats' || r.view === 'mine' || r.view === 'review' || r.view === 'day' || r.view === 'list') {
      actions = '<button type="button" class="icon-btn" data-action="toggle-theme" aria-label="切换主题">' + icon(ctx.prefs.themeResolved === 'dark' ? 'sun' : 'moon') + '</button>';
    }
    let back = '';
    if (['day', 'question', 'run', 'list'].indexOf(r.view) >= 0) {
      back = '<button type="button" class="icon-btn" data-action="back" aria-label="返回">' + icon('back') + '</button>';
    }
    return back + '<div class="h-title">' + esc(t[0]) + '<small>' + esc(t[1]) + '</small></div>' + actions;
  };

  /* ---------------- 工作台 ---------------- */
  V.home = function (ctx) {
    const s = ctx.stats, d = ctx.data;
    const day = s.suggestDay;
    const plan = d.plan[day - 1];
    const dp = s.byDay[day];
    const goal = ctx.prefs.dailyGoal || 30;
    const goalPct = Math.min(100, pct(s.todayCount, goal));

    let html = '<div class="page">';

    html += '<div class="card hero-card">' +
      '<div class="hero-kicker">今日计划 · DAY ' + day + ' / 7</div>' +
      '<div class="hero-title">' + esc(plan.theme) + '</div>' +
      '<div class="hero-sub">' + esc(plan.focus) + '</div>' +
      '<div class="hero-progress"><div class="progress"><div class="progress-fill" style="width:' + dp.pct + '%"></div></div>' +
      '<div class="progress-caption"><span>本天进度 ' + dp.done + ' / ' + dp.total + ' 题</span><span>' + dp.pct + '%</span></div></div>' +
      '<button type="button" class="btn btn-light hero-btn" data-action="review-start" data-scope="today">' + icon('play') + '开始今日自测</button>' +
      '</div>';

    html += '<div class="stat-grid" style="margin-top:.85rem">' +
      '<div class="stat"><div class="stat-num">' + s.mastered + '</div><div class="stat-label">已掌握</div></div>' +
      '<div class="stat"><div class="stat-num">' + s.done + '</div><div class="stat-label">已刷题</div></div>' +
      '<div class="stat"><div class="stat-num">' + s.streak + '</div><div class="stat-label">连续打卡</div></div>' +
      '</div>';

    html += '<div class="card" style="margin-top:.85rem">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:700">' +
      '<span>' + icon('target') + ' 今日目标</span><span style="color:var(--text-3);font-weight:600">' + s.todayCount + ' / ' + goal + ' 题</span></div>' +
      '<div class="progress solid" style="margin-top:.6rem"><div class="progress-fill" style="width:' + goalPct + '%"></div></div>' +
      '<p class="tip-line">' + (s.todayCount >= goal ? '今日目标已完成，可以再刷一轮错题巩固。' : '再刷 ' + (goal - s.todayCount) + ' 题达成今日目标，别断打卡。') + '</p>' +
      '</div>';

    html += '<div class="section-head"><h2>七天计划</h2><button type="button" class="link" data-action="go" data-path="#/library">' + '全部题库 ' + icon('chevron') + '</button></div>';
    html += '<div class="day-list">';
    d.chapters.forEach(function (c) {
      const st = s.byDay[c.day];
      const done = st.done >= st.total && st.total > 0;
      html += '<button type="button" class="day-item ' + (done ? 'done' : '') + '" data-action="go" data-path="#/day/' + c.day + '">' +
        '<span class="day-num">' + (done ? icon('check') : c.day) + '</span>' +
        '<span class="day-info"><strong>第 ' + c.day + ' 天 · ' + esc(c.short) + '</strong>' +
        '<small>' + esc(d.plan[c.day - 1].tip) + '</small>' +

  /* ---------------- 题库 ---------------- */
  V.library = function (ctx) {

      '<button id="search-clear-btn" type="button" class="icon-btn ' + (term ? '' : 'hidden') + '" style="width:1.9rem;height:1.9rem;border:0;background:transparent" data-action="search-clear" aria-label="清空">' + icon('x') + '</button>' +
      '</div>';

    // 搜索结果单独容器：输入时只替换这块，避免重建输入框导致手机键盘收起
    html += '<div id="search-results" class="' + (term ? '' : 'hidden') + '">' + (term ? V.searchBlock(ctx) : '') + '</div>';

    html += '<div class="section-head"><h2>按天浏览</h2><span style="font-size:.72rem;color:var(--text-3)">' + ctx.data.total + ' 题</span></div>';

      const st = ctx.stats.byDay[c.day];

        '<strong>' + esc(c.short) + '</strong><small>' + esc(c.sections.map(function (s) { return s.title.replace(/^[\d.]+\s*/, ''); }).slice(0, 2).join(' · ')) + '</small>' +
        '<span class="mini-bar"><i style="width:' + st.pct + '%"></i></span></span>' +
        '<span style="font-size:.7rem;color:var(--text-3);white-space:nowrap">' + st.done + '/' + st.total + '</span>' + icon('chevron') + '</button>';
    });
    html += '</div>';

    html += '<div class="section-head"><h2>按掌握度筛选</h2></div>';
    html += '<div class="chip-row">' +
      V.chip('全部 ' + ctx.data.total, 'all', ctx.ui.libraryFilter) +
      V.chip('未做 ' + ctx.stats.untouched, 'new', ctx.ui.libraryFilter) +
      V.chip('模糊 ' + ctx.stats.fuzzy, 'fuzzy', ctx.ui.libraryFilter) +
      V.chip('不会 ' + ctx.stats.wrong, 'wrong', ctx.ui.libraryFilter) +
      V.chip('已掌握 ' + ctx.stats.mastered, 'mastered', ctx.ui.libraryFilter) +
      '</div>';
    const filtered = ctx.filteredQuestions;
    html += '<div class="section-head"><h2>题目</h2><span style="font-size:.72rem;color:var(--text-3)">' + filtered.length + ' 题</span></div>';

      (filtered.length > 60 ? '<p class="tip-line">仅显示前 60 题，用搜索框可精确查找。</p>' : '')
      : V.empty('这里空空如也', '去刷几道题再回来看看');

    return html + '</div>';
  };

  V.searchBlock = function (ctx) {
    const list = ctx.searchResults;
    let h = '<div class="section-head"><h2>搜索结果</h2><span style="font-size:.72rem;color:var(--text-3)">' + list.length + ' 题</span></div>';
    h += list.length ? '<div class="q-list">' + list.map(function (q) { return V.qItem(ctx, q); }).join('') + '</div>'
      : V.empty('没有匹配的题目', '换个关键词试试，比如「闭包」「缓存」「useEffect」');
    return h;
  };

  V.chip = function (label, key, cur) {
    return '<button type="button" class="chip ' + (cur === key ? 'active' : '') + '" data-action="set-filter" data-filter="' + key + '">' + label + '</button>';
  };

  V.qItem = function (ctx, q) {
    const g = ctx.h.grade(q.id);
    return '<button type="button" class="q-item" data-action="go" data-path="#/q/' + q.id + '">' +
      '<span class="q-num">' + q.num + '</span><span class="q-body">' +
      '<span class="q-title">' + esc(q.title) + '</span>' +
      '<span class="q-meta"><span class="tag">' + esc(q.tag) + '</span>' +
      masteryDot(g) + '<span style="font-size:.68rem;color:var(--text-3)">' + gradeLabel(g) + '</span>' +
      (q.code.length ? '<span style="font-size:.68rem;color:var(--text-3)">' + icon('code') + ' ' + q.code.length + '</span>' : '') +
      '</span></span>' + icon('chevron') + '</button>';
  };

  /* ---------------- 某天详情 ---------------- */
  V.day = function (ctx) {

      '<div style="font-size:.82rem;font-weight:700">第 ' + c.day + ' 天 · ' + esc(c.short) + '</div>' +
      '<div style="font-size:.72rem;color:var(--text-2);margin-top:.25rem">' + esc(ctx.data.plan[c.day - 1].focus) + '</div>' +

      '<div style="font-size:.7rem;color:var(--text-3);margin-top:.3rem">已完成 ' + s.done + ' / ' + s.total + ' 题（' + s.pct + '%）</div></div>';

    html += '<button type="button" class="btn btn-primary btn-block" style="margin:.8rem 0" data-action="review-start" data-scope="day" data-day="' + c.day + '">' + icon('play') + '开始本天自测</button>';

    c.sections.forEach(function (sec) {

  /* ---------------- 题目详情 ---------------- */
  V.question = function (ctx) {
    const q = ctx.q, g = ctx.h.grade(q.id);
    let html = '<div class="page">';
    html += '<div class="card q-head"><div class="q-line"><span class="tag">' + esc(q.tag) + '</span>' +
      '<span style="font-size:.72rem;color:var(--text-3)">' + q.num + ' · 第 ' + q.day + ' 天 · ' + esc(q.sectionTitle) + '</span></div>' +

      '<div class="q-sub">' + masteryDot(g) + '<span>' + gradeLabel(g) + '</span>' +

      '</div></div>';

    html += '<div class="card"><div class="section-head" style="margin:0 0 .6rem"><h2>参考答案</h2>' +

      html += '<div class="code-block"><div class="code-head"><span>代码 ' + (i + 1) + ' · ' + block.length + ' 行</span>' +

        '<pre class="code-body"><code>' + esc(block.join('\n')) + '</code></pre></div>';
    });
    if (q.note) html += '<div class="note-box">' + icon('sparkle') + '<div><strong>追问 / 记忆点　</strong>' + esc(q.note) + '</div></div>';
    html += '</div>';

    html += '<div class="card"><div style="font-size:.82rem;font-weight:700;margin-bottom:.15rem">自评掌握度</div>' +
      '<p class="tip-line" style="margin:0">评完后会自动记录到错题本 / 模糊题，并影响后续抽题权重。</p>' +
      '<div class="mastery-row">' +
      '<button type="button" class="grade-btn g1 ' + (g === 1 ? 'current' : '') + '" data-action="grade" data-id="' + q.id + '" data-grade="1">不会<small>加入错题本</small></button>' +
      '<button type="button" class="grade-btn g2 ' + (g === 2 ? 'current' : '') + '" data-action="grade" data-id="' + q.id + '" data-grade="2">模糊<small>优先复习</small></button>' +
      '<button type="button" class="grade-btn g3 ' + (g === 3 ? 'current' : '') + '" data-action="grade" data-id="' + q.id + '" data-grade="3">会了<small>降低权重</small></button>' +
      '</div></div>';

    html += '<div class="q-nav">' +
      '<button type="button" class="btn btn-ghost" data-action="q-prev" data-id="' + q.id + '">' + icon('back') + '上一题</button>' +
      '<button type="button" class="btn btn-ghost" data-action="q-next" data-id="' + q.id + '">下一题' + icon('next') + '</button>' +
      '</div>';
    return html + '</div>';
  };

  /* ---------------- 自测入口 ---------------- */
  V.review = function (ctx) {
    const s = ctx.stats, scope = ctx.ui.reviewScope, size = ctx.ui.reviewSize;
    let html = '<div class="page">';
    html += '<div class="card hero-card" style="padding:1.1rem">' +
      '<div class="hero-kicker">RECITE MODE</div><div class="hero-title">翻卡自测</div>' +
      '<div class="hero-sub">先出声讲一遍，再翻答案自评。讲不顺的才是真薄弱点。</div></div>';

    html += '<div class="section-head"><h2>抽题范围</h2></div><div class="chip-row">';
    const scopes = [
      ['today', '今日计划（第 ' + s.suggestDay + ' 天）'],
      ['weak', '错题 + 模糊优先'],
      ['wrong', '仅错题 ' + s.wrong],
      ['fav', '我的收藏 ' + ctx.h.favCount()],
      ['random', '随机模拟面试'],
      ['all', '全部题库（按题量抽）']
    ];
    scopes.forEach(function (x) {
      html += '<button type="button" class="chip ' + (scope === x[0] ? 'active' : '') + '" data-action="set-scope" data-scope="' + x[0] + '">' + x[1] + '</button>';
    });
    html += '</div>';

    html += '<div class="section-head"><h2>题量</h2></div><div class="seg">' +

      }).join('') + '</div>';

    html += '<div class="card" style="margin-top:1rem"><div class="stat-grid">' +
      '<div class="stat"><div class="stat-num">' + s.reviewedTotal + '</div><div class="stat-label">累计自评</div></div>' +
      '<div class="stat"><div class="stat-num">' + s.todayCount + '</div><div class="stat-label">今日自评</div></div>' +
      '<div class="stat"><div class="stat-num">' + s.pct + '%</div><div class="stat-label">总覆盖率</div></div>' +
      '</div></div>';

    html += '<button type="button" class="btn btn-primary btn-block" style="margin-top:.4rem" data-action="review-start" data-scope="' + scope + '">' + icon('play') + '开始自测</button>';
    html += '<p class="tip-line">抽题权重：未做 &gt; 不会 &gt; 模糊 &gt; 已掌握，越薄弱越常出现。</p>';
    return html + '</div>';
  };

  /* ---------------- 翻卡运行中 ---------------- */
  V.run = function (ctx) {
    const ui = ctx.ui, q = ctx.ui.currentQ;
    const total = ui.reviewQueue.length, idx = ui.reviewIndex;
    if (!q) return V.reviewSummary(ctx);
    let html = '<div class="page">';
    html += '<div class="review-footer" style="margin:0 0 .8rem">' +
      '<span>' + (idx + 1) + ' / ' + total + '</span>' +
      '<div class="progress solid"><div class="progress-fill" style="width:' + pct(idx, total) + '%"></div></div>' +
      '<button type="button" class="icon-btn" style="width:2rem;height:2rem" data-action="review-quit" aria-label="结束">' + icon('x') + '</button></div>';

    html += '<div class="flash-wrap"><div class="flash-card ' + (ui.revealed ? 'revealed' : '') + '">' +
      '<div class="flash-top"><span>' + q.num + ' · 第 ' + q.day + ' 天</span><span class="tag">' + esc(q.tag) + '</span></div>' +
      '<div class="flash-title">' + esc(q.title) + '</div>';
    if (!ui.revealed) {
      html += '<div class="reveal-mask" style="margin-top:auto">' + icon('info') +
        '<span>先自己在心里（或出声）讲一遍，再点下面的按钮对答案</span></div>';
    } else {
      html += '<div class="flash-answer">';
      q.answers.slice(0, 3).forEach(function (a) { html += '<p class="answer-text">' + esc(a) + '</p>'; });
      if (q.code.length) html += '<p class="tip-line">' + icon('code') + ' 本题含 ' + q.code.length + ' 段代码，详见题目详情页。</p>';
      if (q.note) html += '<div class="note-box">' + icon('sparkle') + '<div>' + esc(q.note) + '</div></div>';
      html += '<button type="button" class="btn btn-ghost btn-sm btn-block" data-action="go" data-path="#/q/' + q.id + '">查看完整答案与代码</button>';
      html += '</div>';
    }
    html += '</div></div>';

    if (!ui.revealed) {
      html += '<div class="flash-actions">' +
        '<button type="button" class="btn btn-ghost" data-action="review-skip">跳过</button>' +
        '<button type="button" class="btn btn-primary" data-action="review-reveal">' + icon('sparkle') + '显示答案</button></div>';
    } else {
      html += '<div class="section-head" style="margin-bottom:.35rem"><h2>这道题我…</h2></div><div class="mastery-row">' +
        '<button type="button" class="grade-btn g1" data-action="review-grade" data-grade="1">不会<small>加入错题本</small></button>' +
        '<button type="button" class="grade-btn g2" data-action="review-grade" data-grade="2">模糊<small>优先复习</small></button>' +
        '<button type="button" class="grade-btn g3" data-action="review-grade" data-grade="3">会了<small>降低权重</small></button>' +
        '</div>';
    }
    html += '<p class="tip-line">不会 ' + ui.counts[1] + ' · 模糊 ' + ui.counts[2] + ' · 会了 ' + ui.counts[3] + '</p>';
    return html + '</div>';
  };

      '<div class="setting-row">' + icon('target') +
      '<div class="s-body"><strong>每日目标</strong><small>每天自评 ' + p.dailyGoal + ' 题</small></div>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-action="goal-cycle">' + p.dailyGoal + ' 题</button></div>' +
      '</div>';

    html += '<div class="section-head"><h2>数据管理</h2></div><div class="setting-group">' +
      '<button type="button" class="setting-row" style="width:100%;text-align:left" data-action="export">' + icon('download') +
      '<div class="s-body"><strong>导出备份</strong><small>把进度、收藏、设置导出为 JSON</small></div>' + icon('chevron') + '</button>' +
      '<button type="button" class="setting-row" style="width:100%;text-align:left" data-action="import">' + icon('upload') +
      '<div class="s-body"><strong>导入备份</strong><small>从 JSON 文件恢复进度</small></div>' + icon('chevron') + '</button>' +
      '<button type="button" class="setting-row" style="width:100%;text-align:left" data-action="reset">' + icon('refresh') +
      '<div class="s-body"><strong>清空学习数据</strong><small>重置掌握度、打卡与收藏</small></div>' + icon('chevron') + '</button>' +
      '</div>';

    html += '<div class="section-head"><h2>安装到手机</h2></div><div class="setting-group">' +
      '<button type="button" class="setting-row" style="width:100%;text-align:left" data-action="install-guide">' + icon('download') +
      '<div class="s-body"><strong>添加到主屏幕</strong><small>全屏、离线、像原生 App</small></div>' + icon('chevron') + '</button>' +
      '<button type="button" class="setting-row" style="width:100%;text-align:left" data-action="about">' + icon('info') +
      '<div class="s-body"><strong>关于本题库</strong><small>v' + ctx.data.version + ' · ' + ctx.data.total + ' 题 · 离线可用</small></div>' + icon('chevron') + '</button>' +
      '</div>';
    html += '<p class="tip-line">所有学习数据仅保存在本机浏览器，不会上传。</p>';
    return html + '</div>';
  };

  V.row = function (ic, title, sub, path) {
    return '<button type="button" class="row-item" data-action="go" data-path="' + path + '">' +
      icon(ic, 'lead') + '<span class="r-body"><strong>' + title + '</strong><small>' + sub + '</small></span>' +
      '<span class="r-tail">' + icon('chevron') + '</span></button>';
  };

  /* ---------------- 收藏 / 错题 / 模糊列表 ---------------- */
  V.list = function (ctx) {
    let html = '<div class="page">';
    if (!ctx.list.length) return html + V.empty('这里还没有题目', '去题库刷几道并自评后，题目会自动归类到这里') + '</div>';
    html += '<div class="q-list">' + ctx.list.map(function (q) { return V.qItem(ctx, q); }).join('') + '</div>';
    html += '<button type="button" class="btn btn-primary btn-block" style="margin-top:1rem" data-action="review-start" data-scope="' +
      (ctx.route.kind === 'fav' ? 'fav' : ctx.route.kind === 'wrong' ? 'wrong' : 'weak') + '">' + icon('play') + '针对性自测</button>';
    return html + '</div>';
  };

  V.empty = function (title, sub) {
    return '<div class="empty">' + icon('info') + '<p><strong style="color:var(--text-2)">' + esc(title) + '</strong><br>' + esc(sub) + '</p></div>';
  };

  V.render = function (ctx) {
    switch (ctx.route.view) {
      case 'home': return V.home(ctx);
      case 'library': return V.library(ctx);
      case 'day': return V.day(ctx);
      case 'question': return V.question(ctx);
      case 'review': return V.review(ctx);
      case 'run': return V.run(ctx);
      case 'cheats': return V.cheats(ctx);
      case 'mine': return V.mine(ctx);
      case 'list': return V.list(ctx);
      default: return V.home(ctx);
    }
  };

  root.BaguwenViews = V;
  root.BaguwenHelpers = { esc: esc, icon: icon, pct: pct, gradeLabel: gradeLabel };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * 前端八股文工作台 · 应用主逻辑
 * 职责：状态持久化、路由、抽题算法、事件委托、PWA 安装与更新。
 */
(function () {
  'use strict';

  const DATA = window.__BAGUWEN_DATA__;
  const V = window.BaguwenViews;
  const H = window.BaguwenHelpers;
  const main = document.getElementById('app-main');
  const header = document.getElementById('app-header');

  if (!DATA || !V || !window.BaguwenStateStore) {
    main.innerHTML = '<div class="empty"><p>题库数据加载失败，请联网打开一次后重试。</p></div>';
    return;
  }

  const store = new window.BaguwenStateStore();

  /* ---------- 扁平索引（运行时补齐上下文字段） ---------- */
  const allQuestions = [];
  const byId = {};
  DATA.chapters.forEach(function (c) {
    c.sections.forEach(function (s) {
      s.questions.forEach(function (q) {
        q.day = c.day;
        q.sectionTitle = s.title;
        q.chapterShort = c.short;
        allQuestions.push(q);
        byId[q.id] = q;
      });
    });
  });

  const DEF_PROGRESS = { grades: {}, history: {}, reviewedTotal: 0, lastActive: '', dayCursor: 1 };
  const DEF_PREFS = { theme: 'auto', fontScale: 1, dailyGoal: 30, installDismissed: false };
  const DEF_FAV = { ids: [] };
  const DEF_SESSION = { route: '', review: null };

  let progress, prefs, favorites, session;
  let ctx = {};
  let currentRoute = { view: 'home' };
  let deferredPrompt = null;
  let toastTimer = null;
  let noScrollOnce = false;

  const ui = {
    searchTerm: '', libraryFilter: 'all',
    reviewScope: 'today', reviewSize: 20, tableKind: 'speed',
    reviewQueue: [], reviewIndex: 0, revealed: false,
    counts: { 1: 0, 2: 0, 3: 0 },
    currentQ: null, currentQId: null
  };

  /* ---------- 工具 ---------- */
  function todayKey(d) {
    const x = d || new Date();
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  function grade(id) { return (progress.grades && progress.grades[id]) || 0; }
  function isFav(id) { return favorites.ids.indexOf(Number(id)) >= 0; }
  function favCount() { return favorites.ids.length; }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- 主题与字号 ---------- */
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : { matches: false, addEventListener: function () {} };
  function resolvedTheme() {
    return prefs.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : prefs.theme;
  }
  function applyPrefs() {
    const t = resolvedTheme();
    document.documentElement.dataset.theme = t;
    document.documentElement.style.setProperty('--fs', String(prefs.fontScale || 1));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#0d1726' : '#1F4E79');
  }
  if (mq.addEventListener) {
    mq.addEventListener('change', function () {
      if (prefs && prefs.theme === 'auto') { applyPrefs(); render(); }
    });
  }

  /* ---------- 统计 ---------- */
  function computeStats() {
    const g = progress.grades || {};
    let done = 0, mastered = 0, fuzzy = 0, wrong = 0, untouched = 0;
    const byDay = {};
    DATA.chapters.forEach(function (c) {
      const qs = allQuestions.filter(function (q) { return q.day === c.day; });
      let d = 0;
      qs.forEach(function (q) { if (g[q.id]) d++; });
      byDay[c.day] = { total: qs.length, done: d, pct: qs.length ? Math.round(d / qs.length * 100) : 0 };
    });
    allQuestions.forEach(function (q) {
      const v = g[q.id] || 0;
      if (!v) untouched++;
      else { done++; if (v === 1) wrong++; else if (v === 2) fuzzy++; else mastered++; }
    });
    let streak = 0;
    const d = new Date();
    if (!(progress.history || {})[todayKey(d)]) d.setDate(d.getDate() - 1);
    while ((progress.history || {})[todayKey(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    let suggestDay = 7;
    for (let i = 1; i <= DATA.chapters.length; i++) {
      if (byDay[i].done < byDay[i].total) { suggestDay = i; break; }
    }
    return {
      total: allQuestions.length, done: done, mastered: mastered, fuzzy: fuzzy,
      wrong: wrong, untouched: untouched, pct: Math.round(done / allQuestions.length * 100),
      byDay: byDay, streak: streak,
      todayCount: (progress.history || {})[todayKey()] || 0,
      reviewedTotal: progress.reviewedTotal || 0,
      suggestDay: suggestDay
    };
  }

  /* ---------- 抽题 ---------- */
  function buildQueue(scope, size, day) {
    let pool = allQuestions.slice();
    if (scope === 'today') pool = pool.filter(function (q) { return q.day === (day || computeStats().suggestDay); });
    else if (scope === 'day') pool = pool.filter(function (q) { return q.day === day; });
    else if (scope === 'wrong') pool = pool.filter(function (q) { return grade(q.id) === 1; });
    else if (scope === 'fav') pool = pool.filter(function (q) { return isFav(q.id); });
    const weighted = (scope === 'weak' || scope === 'today' || scope === 'day');
    return pool.map(function (q) {
      const g = grade(q.id);
      const w = weighted ? (g === 0 ? 0 : g === 1 ? 1 : g === 2 ? 2 : 3) : 0;
      return { q: q, score: w * 10 + Math.random() * 9.5 };
    }).sort(function (a, b) { return a.score - b.score; })
      .slice(0, size).map(function (x) { return x.q; });
  }

  /* ---------- 路由 ---------- */
  function parseRoute() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const pathPart = raw.split('?')[0];
    const parts = pathPart.split('/').filter(Boolean);
    const alias = { q: 'question' };
    let view = parts[0] ? (alias[parts[0]] || parts[0]) : 'home';
    const valid = ['home', 'library', 'day', 'question', 'review', 'run', 'cheats', 'mine', 'list'];
    if (valid.indexOf(view) < 0) view = 'home';
    const second = parts[1];
    const r = {
      view: view,
      day: view === 'day' ? (parseInt(second, 10) || 1) : 1,
      id: view === 'question' ? (parseInt(second, 10) || 0) : 0,
      kind: view === 'list' ? (second || 'wrong') : ''
    };
    if (view === 'question' && !byId[r.id]) r.view = 'home';
    if (view === 'day' && !DATA.chapters[r.day - 1]) r.view = 'library';
    if (view === 'run' && !ui.reviewQueue.length) r.view = 'review';
    return r;
  }
  function applyQuery() {
    const raw = (location.hash || '');
    const q = raw.split('?')[1];
    if (!q) return;
    try {
      const p = new URLSearchParams(q);
      if (p.get('scope')) ui.reviewScope = p.get('scope');
      if (p.get('table')) ui.tableKind = p.get('table');
    } catch (e) { /* ignore */ }
  }
  function go(path) {
    if (location.hash === path) { render(); return; }
    location.hash = path;
  }
  function updateTabs(view) {
    const map = { day: 'library', question: 'library', list: 'mine', run: 'review' };
    const cur = map[view] || view;
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('active', b.dataset.nav === cur);
    });
  }

  /* ---------- 构建视图上下文 ---------- */
  function buildCtx(route) {
    const s = computeStats();
    const term = ui.searchTerm.trim().toLowerCase();
    const searchResults = term
      ? allQuestions.filter(function (q) { return q.text.toLowerCase().indexOf(term) >= 0; }).slice(0, 80)
      : [];
    const filteredQuestions = allQuestions.filter(function (q) {
      const g = grade(q.id);
      switch (ui.libraryFilter) {
        case 'new': return g === 0;
        case 'fuzzy': return g === 2;
        case 'wrong': return g === 1;
        case 'mastered': return g === 3;
        default: return true;
      }
    });
    let list = [];
    if (route.view === 'list') {
      list = allQuestions.filter(function (q) {
        if (route.kind === 'fav') return isFav(q.id);
        if (route.kind === 'wrong') return grade(q.id) === 1;
        return grade(q.id) === 2;
      });
    }
    ui.currentQ = route.view === 'run' ? ui.reviewQueue[ui.reviewIndex] : null;
    ui.currentQId = ui.currentQ ? ui.currentQ.id : null;
    ctx = {
      data: DATA, stats: s, route: route, ui: ui,
      prefs: Object.assign({}, prefs, { themeResolved: resolvedTheme() }),
      h: { grade: grade, isFav: isFav, favCount: favCount },
      searchResults: searchResults, filteredQuestions: filteredQuestions,
      list: list,
      chapter: route.view === 'day' ? DATA.chapters[route.day - 1] : null,
      q: route.view === 'question' ? byId[route.id] : null
    };
    return ctx;
  }

  function render() {
    currentRoute = parseRoute();
    const c = buildCtx(currentRoute);
    header.innerHTML = V.header(c);
    main.innerHTML = V.render(c);
    updateTabs(currentRoute.view);
    if (!noScrollOnce) window.scrollTo(0, 0);
    noScrollOnce = false;
    saveSession();
  }

  function saveSession() {
    store.save('session', {
      route: location.hash,
      review: {
        queue: ui.reviewQueue.map(function (q) { return q.id; }),
        index: ui.reviewIndex, scope: ui.reviewScope, size: ui.reviewSize,
        revealed: ui.revealed, counts: clone(ui.counts)
      }
    });
  }

  /* ---------- 业务动作 ---------- */
  async function setGrade(id, g) {
    if (!id) return;
    progress.grades[id] = g;
    progress.reviewedTotal = (progress.reviewedTotal || 0) + 1;
    const t = todayKey();
    progress.history[t] = (progress.history[t] || 0) + 1;
    progress.lastActive = t;
    await store.save('progress', {
      grades: progress.grades, reviewedTotal: progress.reviewedTotal,
      history: progress.history, lastActive: t
    });
    toast(g === 3 ? '已掌握，干得漂亮' : g === 2 ? '标记为模糊，会优先再考你' : '已加入错题本');
  }

  async function toggleFav(id) {
    if (!id) return;
    const n = Number(id), i = favorites.ids.indexOf(n);
    if (i >= 0) favorites.ids.splice(i, 1); else favorites.ids.push(n);
    await store.save('favorites', { ids: favorites.ids });
    toast(i >= 0 ? '已取消收藏' : '已收藏');
    render();
  }

  function startReview(scope, day) {
    ui.reviewScope = scope || ui.reviewScope;
    const size = ui.reviewSize;
    ui.reviewQueue = buildQueue(ui.reviewScope, size, day);
    if (!ui.reviewQueue.length) { toast('这个范围暂时没有题目'); return; }
    ui.reviewIndex = 0;
    ui.revealed = false;
    ui.counts = { 1: 0, 2: 0, 3: 0 };
    go('#/run');
  }

  function nextQuestion() {
    ui.reviewIndex++;
    ui.revealed = false;
    render();
  }

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
      document.body.removeChild(ta);
    }
    toast(okMsg || '已复制');
  }

  /* ---------- 弹窗 ---------- */
  function showModal(html) {
    document.getElementById('modal-root').innerHTML =
      '<div class="modal-backdrop" data-action="close-modal"><div class="modal">' + html + '</div></div>';
  }
  function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
  function confirmModal(title, text, okLabel, onOk) {
    window.__baguwenConfirm = onOk;
    showModal('<h3>' + H.esc(title) + '</h3><p>' + H.esc(text) + '</p>' +
      '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-action="close-modal">取消</button>' +
      '<button type="button" class="btn btn-primary" data-action="confirm-ok">' + H.esc(okLabel) + '</button></div>');
  }

  /* ---------- 安装引导 ---------- */
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
  function showBanner() {
    if (isStandalone() || prefs.installDismissed) return;
    document.getElementById('install-banner').classList.remove('hidden');
  }
  function hideBanner() { document.getElementById('install-banner').classList.add('hidden'); }
  function installGuide() {
    let extra = '';
    if (deferredPrompt) extra = '<button type="button" class="btn btn-primary btn-block" data-action="install">立即安装</button>';
    showModal('<h3>添加到主屏幕</h3><ol>' +
      '<li><b>iPhone / iPad</b>：用 Safari 打开，点底部「分享」→「添加到主屏幕」</li>' +
      '<li><b>Android / Chrome</b>：点右上角菜单 →「安装应用」或「添加到主屏幕」</li>' +
      '<li><b>桌面 Chrome / Edge</b>：点地址栏右侧的安装图标</li>' +
      '</ol><p>安装后全屏运行、断网也能刷题；学习进度仍保存在本机，不会上传。</p>' +
      extra + '<div class="modal-actions" style="margin-top:.6rem"><button type="button" class="btn btn-ghost btn-block" data-action="close-modal">知道了</button></div>');
  }
  function aboutModal() {
    showModal('<h3>关于本题库</h3><p>版本 v' + DATA.version + ' · 整理于 ' + DATA.generated + '<br>' +
      DATA.total + ' 道题 / ' + DATA.stats.chapters + ' 天 / ' + DATA.stats.sections + ' 个知识模块 / ' +
      DATA.stats.codeLines + ' 行可运行代码。</p>' +
      '<p>题型框架参考 GitHub 上的 Front-End-Interview-Notebook、webQd、InterviewMap、Daily-Interview-Question 等高星题库，并结合 2025—2026 大厂真题趋势重写答案。</p>' +
      '<p>纯静态 PWA，Service Worker 预缓存全部资源，首次打开后即可完全离线使用。</p>' +
      '<div class="modal-actions"><button type="button" class="btn btn-primary btn-block" data-action="close-modal">关闭</button></div>');
  }

  /* ---------- 事件委托 ---------- */
  document.getElementById('tabbar').addEventListener('click', function (e) {
    const b = e.target.closest('[data-nav]');
    if (!b) return;
    const map = { home: '#/home', library: '#/library', review: '#/review', cheats: '#/cheats', mine: '#/mine' };
    go(map[b.dataset.nav]);
  });

  document.addEventListener('click', async function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;

    if (a === 'close-modal') {
      if (el.classList.contains('modal-backdrop') && e.target !== el) return;
      closeModal(); return;
    }
    if (a === 'go') { go(el.dataset.path); return; }
    if (a === 'back') { if (history.length > 1) history.back(); else go('#/home'); return; }
    if (a === 'toggle-fav') { await toggleFav(el.dataset.id); return; }
    if (a === 'toggle-theme') {
      prefs.theme = resolvedTheme() === 'dark' ? 'light' : 'dark';
      await store.save('prefs', { theme: prefs.theme });
      applyPrefs(); render(); return;
    }
    if (a === 'font-inc' || a === 'font-dec') {
      prefs.fontScale = Math.min(1.35, Math.max(0.85, Math.round((prefs.fontScale + (a === 'font-inc' ? 0.1 : -0.1)) * 10) / 10));
      await store.save('prefs', { fontScale: prefs.fontScale });
      applyPrefs(); render(); return;
    }
    if (a === 'goal-cycle') {
      const opts = [20, 30, 50, 80];
      prefs.dailyGoal = opts[(opts.indexOf(prefs.dailyGoal) + 1) % opts.length];
      await store.save('prefs', { dailyGoal: prefs.dailyGoal });
      render(); return;
    }
    if (a === 'set-filter') { ui.libraryFilter = el.dataset.filter; render(); return; }
    if (a === 'set-scope') { ui.reviewScope = el.dataset.scope; render(); return; }
    if (a === 'set-size') { ui.reviewSize = parseInt(el.dataset.size, 10) || 20; render(); return; }
    if (a === 'set-table') { ui.tableKind = el.dataset.kind; render(); return; }
    if (a === 'search-clear') {
      ui.searchTerm = ''; render();
      const inp = document.getElementById('search-input');
      if (inp) inp.focus();
      return;
    }
    if (a === 'grade') {
      await setGrade(parseInt(el.dataset.id, 10), parseInt(el.dataset.grade, 10));
      render(); return;
    }
    if (a === 'q-prev' || a === 'q-next') {
      const id = parseInt(el.dataset.id, 10) + (a === 'q-next' ? 1 : -1);
      if (byId[id]) go('#/q/' + id); else toast(a === 'q-next' ? '已经是最后一题了' : '已经是第一题了');
      return;
    }
    if (a === 'copy-code') {
      const q = byId[parseInt(el.dataset.id, 10)];
      const block = q && q.code[parseInt(el.dataset.block, 10)];
      if (block) await copyText(block.join('\n'), '代码已复制');
      return;
    }
    if (a === 'copy-answer') {
      const q = byId[parseInt(el.dataset.id, 10)];
      if (!q) return;
      const parts = [q.num + ' ' + q.title, ''].concat(q.answers, q.bullets);
      if (q.note) parts.push('★ ' + q.note);
      await copyText(parts.join('\n'), '答案已复制');
      return;
    }
    if (a === 'review-start') {
      startReview(el.dataset.scope, el.dataset.day ? parseInt(el.dataset.day, 10) : null);
      return;
    }
    if (a === 'review-reveal') { ui.revealed = true; render(); return; }
    if (a === 'review-grade') {
      const g = parseInt(el.dataset.grade, 10);
      if (ui.currentQId) await setGrade(ui.currentQId, g);
      ui.counts[g] = (ui.counts[g] || 0) + 1;
      nextQuestion(); return;
    }
    if (a === 'review-skip') { nextQuestion(); return; }
    if (a === 'review-quit') { go('#/review'); return; }
    if (a === 'install') {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        hideBanner();
        toast(choice && choice.outcome === 'accepted' ? '正在安装…' : '已取消安装');
      } else {
        closeModal(); installGuide();
      }
      return;
    }
    if (a === 'dismiss-install') {
      prefs.installDismissed = true;
      await store.save('prefs', { installDismissed: true });
      hideBanner(); return;
    }
    if (a === 'install-guide') { installGuide(); return; }
    if (a === 'about') { aboutModal(); return; }
    if (a === 'apply-update') {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      else location.reload();
      return;
    }
    if (a === 'export') {
      const payload = await store.exportAll();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = 'baguwen-backup-' + todayKey() + '.json';
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('备份已导出'); return;
    }
    if (a === 'import') {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.json,application/json';
      input.addEventListener('change', async function () {
        const f = input.files && input.files[0];
        if (!f) return;
        try {
          const obj = JSON.parse(await f.text());
          await store.importAll(obj);
          toast('导入成功，正在刷新…');
          setTimeout(function () { location.reload(); }, 800);
        } catch (err) { toast('文件格式不正确'); }
      });
      input.click(); return;
    }
    if (a === 'reset') {
      confirmModal('清空学习数据', '将删除全部掌握度、打卡记录与收藏，且无法恢复。建议先导出备份。', '确认清空',
        async function () { await store.clear(); location.reload(); });
      return;
    }
    if (a === 'confirm-ok') {
      const fn = window.__baguwenConfirm;
      closeModal();
      if (fn) await fn();
      return;
    }
  });

  /* 搜索输入：只局部替换结果区，保持输入框焦点与手机键盘 */
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'search-input') return;
    ui.searchTerm = e.target.value;
    const term = ui.searchTerm.trim().toLowerCase();
    ctx.searchResults = term
      ? allQuestions.filter(function (q) { return q.text.toLowerCase().indexOf(term) >= 0; }).slice(0, 80)
      : [];
    const wrap = document.getElementById('search-results');
    const browse = document.getElementById('library-browse');
    const clearBtn = document.getElementById('search-clear-btn');
    if (wrap) { wrap.innerHTML = term ? V.searchBlock(ctx) : ''; wrap.classList.toggle('hidden', !term); }
    if (browse) browse.classList.toggle('hidden', !!term);
    if (clearBtn) clearBtn.classList.toggle('hidden', !term);
  });

  window.addEventListener('hashchange', function () { applyQuery(); render(); });

  /* ---------- PWA ---------- */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (!isStandalone()) showBanner();
  });
  window.addEventListener('appinstalled', function () { hideBanner(); toast('安装成功，可从主屏打开'); });

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            document.getElementById('update-banner').classList.remove('hidden');
          }
        });
      });
    }).catch(function (err) { console.warn('[SW] register failed', err); });
    navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); });
  }

  /* ---------- 启动 ---------- */
  async function boot() {
    progress = Object.assign({}, DEF_PROGRESS, (await store.load('progress')) || {});
    progress.grades = progress.grades || {};
    progress.history = progress.history || {};
    prefs = Object.assign({}, DEF_PREFS, (await store.load('prefs')) || {});
    favorites = Object.assign({}, DEF_FAV, (await store.load('favorites')) || {});
    favorites.ids = favorites.ids || [];
    session = Object.assign({}, DEF_SESSION, (await store.load('session')) || {});

    if (session.review && session.review.queue && session.review.queue.length) {
      ui.reviewQueue = session.review.queue.map(function (id) { return byId[id]; }).filter(Boolean);
      ui.reviewIndex = Math.min(session.review.index || 0, ui.reviewQueue.length);
      ui.reviewScope = session.review.scope || 'today';
      ui.reviewSize = session.review.size || 20;
      ui.revealed = !!session.review.revealed;
      ui.counts = session.review.counts || { 1: 0, 2: 0, 3: 0 };
    }

    if (!location.hash && session.route) {
      history.replaceState(null, '', session.route);
    }
    applyPrefs();
    applyQuery();
    render();
    registerSW();
    // iOS 没有 beforeinstallprompt，主动给一次轻量提示
    if (isIOS() && !isStandalone() && !prefs.installDismissed) {
      setTimeout(function () {
        document.getElementById('install-title').textContent = '添加到主屏幕';
        document.getElementById('install-desc').textContent = '点 Safari 分享按钮 →「添加到主屏幕」，即可全屏离线刷题。';
        showBanner();
      }, 1200);
    }
  }

  boot();
})();

</script>
</body>
</html>
