  <header class="topbar" id="topbar">
    <div class="searchbox"><span class="search-ico"></span><span class="search-ph">关键词</span></div>
    <div class="brand-logo"><img id="logoImg" src="images/img_001.jpg" alt="" data-hl-kind="img" data-hl-path="logo" data-hl-label="网站Logo"></div>
  </header>

  <section class="banner" id="banner">
    <div class="banner-track" id="bannerTrack"></div>
    <div class="banner-dots" id="bannerDots"></div>
  </section>

  <section class="mod" id="hot">
    <div class="mod-hd"><h2 id="hotTitle" data-hl-kind="text" data-hl-path="hotTitle" data-hl-label="人气课程标题">人气课程</h2><span class="hd-line"></span></div>
    <div class="course-grid" id="hotCourses"></div>
    <div class="more-wrap"><a class="more-btn" href="#courses">更多</a></div>
  </section>

  <section class="mod mod-hl" id="high">

    <p class="hl-lead" id="highLead" data-hl-kind="text" data-hl-path="highLead" data-hl-label="板块引言">HIGH LIFE只提供</p>
    <h2 class="hl-title" id="highTitle" data-hl-kind="text" data-hl-path="highTitle" data-hl-label="板块标题">高品质课程</h2>
    <div class="more-wrap"><a class="more-btn" href="#courses">更多</a></div>
  </section>

  <section class="mod" id="partners">
    <div class="mod-hd"><h2 id="partnerTitle" data-hl-kind="text" data-hl-path="partnerTitle" data-hl-label="合作伙伴标题">我们重要合作伙伴</h2><span class="hd-line"></span></div>
    <div class="partner-grid" id="partnerGrid"></div>
    <div class="more-wrap"><a class="more-btn" href="#about">更多</a></div>
  </section>

  <section class="feature-bg" id="about">
    <img id="aboutImg" src="images/img_019.jpg" alt="" data-hl-kind="img" data-hl-path="aboutImg" data-hl-label="关于我们大图">
    <div class="feature-bg-txt">
      <p id="aboutLead" data-hl-kind="text" data-hl-path="aboutLead" data-hl-label="关于我们文案">通过与国外优秀手作培训平台的合作，实现国际技术交流。</p>
      <h2 id="aboutTitle" data-hl-kind="text" data-hl-path="aboutTitle" data-hl-label="关于我们口号">国际化 · 专业化 · 平台化</h2>
    </div>
  </section>

  <section class="why" id="whySec">
    <div class="why-hd"><h2 id="whyTitle" data-hl-kind="text" data-hl-path="whyTitle" data-hl-label="Why标题">Why choose us？</h2><span id="whySub" data-hl-kind="text" data-hl-path="whySub" data-hl-label="Why副标题">为什么选择我们</span></div>
    <div class="why-list" id="whyList"></div>
  </section>

  <section class="mod" id="courses">
    <div class="mod-hd"><h2 id="coursesTitle" data-hl-kind="text" data-hl-path="coursesTitle" data-hl-label="课程板块标题">我们的课程</h2><span class="hd-line"></span></div>
    <div class="course-grid" id="allCourses"></div>
    <div class="more-wrap"><a class="more-btn" href="#courses">更多</a></div>
  </section>

  <section class="contact" id="contact">
    <p id="contactIntro" data-hl-kind="text" data-hl-path="contact.intro" data-hl-label="联系引言"></p>
    <p id="contactEmail" data-hl-kind="text" data-hl-path="contact.email" data-hl-label="Email"></p>
    <p id="contactTel" data-hl-kind="text" data-hl-path="contact.tel" data-hl-label="电话"></p>
    <p class="addr" id="contactAddr" data-hl-kind="text" data-hl-path="contact.addr" data-hl-label="地址"></p>
    <p class="cbrand" id="contactBrand" data-hl-kind="text" data-hl-path="contact.brand" data-hl-label="品牌名"></p>
    <div class="cform">
      <label id="formLabel" data-hl-kind="text" data-hl-path="contact.formLabel" data-hl-label="表单提示语"></label>
      <input type="text" placeholder="Email：">
      <button type="button" id="submitBtn">提交</button>
      <span class="form-tip" id="formTip"></span>
    </div>
  </section>

  <footer class="footer" id="footerText" data-hl-kind="text" data-hl-path="footer" data-hl-label="页脚文字"></footer>
