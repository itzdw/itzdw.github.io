<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIGH LIFE 管理后台</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<style>
  html,body,#app{height:100%;margin:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .login-page{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#469bb7,#69cbe8)}
  .login-card{width:360px;background:#fff;border-radius:10px;padding:34px 30px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
  .login-card h1{font-size:20px;margin:0 0 6px;color:#222;text-align:center}
  .login-card .sub{text-align:center;color:#999;font-size:13px;margin-bottom:24px}
  .login-card .logo{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:#eef8fb;display:flex;align-items:center;justify-content:center;font-size:24px;color:#469bb7}
  .dash{height:100vh;display:flex;flex-direction:column;background:#f5f7f9}
  .dash-header{height:56px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .dash-header .brand{font-size:17px;font-weight:600;color:#469bb7}
  .dash-body{flex:1;display:flex;min-height:0}
  .side{width:200px;background:#fff;border-right:1px solid #eef0f2;padding-top:12px}
  .main{flex:1;padding:20px 24px;overflow:auto}
  .stat-row{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .stat-card{flex:1;min-width:160px;background:#fff;border-radius:8px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .stat-card .n{font-size:28px;font-weight:600;color:#469bb7}
  .stat-card .l{font-size:13px;color:#888;margin-top:4px}
  .panel{background:#fff;border-radius:8px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .thumb{width:46px;height:46px;object-fit:cover;border-radius:4px}
  .hint{font-size:12px;color:#999;margin-top:10px;line-height:1.7}
  .notice{background:#fff8e6;border:1px solid #ffe0a3;border-radius:6px;padding:12px 14px;font-size:13px;color:#8a6d1f;margin-bottom:16px;line-height:1.8}
  .dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e6a23c;margin-right:6px}
  .code-area{width:100%;height:320px;font-family:Consolas,Monaco,monospace;font-size:12px;line-height:1.6;border:1px solid #dcdfe6;border-radius:4px;padding:12px;box-sizing:border-box;resize:vertical}
</style>
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <div v-if="!logged" class="login-page">
    <div class="login-card">
      <div class="logo">H</div>
      <h1>HIGH LIFE 管理后台</h1>
      <div class="sub">课程数据文件编辑器</div>
      <el-form ref="loginForm" :model="login" :rules="rules" label-position="top" @keyup.enter="doLogin">
        <el-form-item label="管理员账号" prop="user">
          <el-input v-model="login.user" placeholder="请输入账号" prefix-icon="User"></el-input>
        </el-form-item>
        <el-form-item label="密码" prop="pwd">
          <el-input v-model="login.pwd" type="password" placeholder="请输入密码" show-password prefix-icon="Lock"></el-input>
        </el-form-item>
        <el-button type="primary" style="width:100%;margin-top:6px" @click="doLogin">登录</el-button>
      </el-form>
      <div class="hint">演示账号：admin&nbsp;&nbsp;密码：admin123</div>
    </div>
  </div>

  <!-- 后台 -->
  <div v-else class="dash">
    <div class="dash-header">
      <div class="brand">HIGH LIFE 管理后台</div>
      <div><span style="color:#888;margin-right:14px">管理员：{{ login.user }}</span><el-button size="small" @click="logout">退出</el-button></div>
    </div>
    <div class="dash-body">
      <div class="side">
        <el-menu :default-active="menu" @select="k=>menu=k">
          <el-menu-item index="dash"><span>数据看板</span></el-menu-item>
          <el-menu-item index="courses"><span>课程管理</span></el-menu-item>
          <el-menu-item index="export"><span>生成 data.js</span></el-menu-item>
          <el-menu-item index="site"><span>站点信息</span></el-menu-item>
        </el-menu>
      </div>
      <div class="main">
        <!-- 看板 -->
        <template v-if="menu==='dash'">
          <div class="notice">
            数据源说明：本站点课程数据存放在静态文件 <b>js/data.js</b> 中。<br>
            在"课程管理"里增删改后，需到"生成 data.js"复制新内容，覆盖服务器上的 <b>js/data.js</b>，刷新前台即对所有访客生效。<br>
            <span v-if="dirty" style="color:#c45606"><span class="dirty-dot"></span>当前有未导出的修改，请到"生成 data.js"导出。</span>
            <span v-else style="color:#3b7a3b">当前数据与 data.js 一致。</span>
          </div>
          <div class="stat-row">
            <div class="stat-card"><div class="n">{{ courses.length }}</div><div class="l">课程总数</div></div>
            <div class="stat-card"><div class="n">{{ hotCount }}</div><div class="l">首页人气课程</div></div>
            <div class="stat-card"><div class="n">9</div><div class="l">合作伙伴</div></div>
          </div>
          <div class="panel">
            <div class="toolbar"><h3 style="margin:0">最近课程</h3><el-button size="small" type="primary" @click="menu='courses'">管理课程</el-button></div>
            <el-table :data="courses.slice(0,6)" size="small" border>
              <el-table-column label="课程封面" width="80"><template #default="s"><img class="thumb" :src="s.row.img"></template></el-table-column>
              <el-table-column prop="name" label="课程名称"></el-table-column>
              <el-table-column prop="price" label="价格" width="100"></el-table-column>
            </el-table>
          </div>
        </template>

        <!-- 课程管理 -->
        <template v-else-if="menu==='courses'">
          <div class="notice">
            这里的修改只存在于当前页面内存中。<b>必须</b>到"生成 data.js"导出并覆盖服务器上的 js/data.js，修改才会真正保存并对所有访客生效。
          </div>
          <div class="panel">
            <div class="toolbar">
              <h3 style="margin:0">课程管理</h3>
              <div>
                <el-button type="primary" size="small" @click="openAdd">+ 新增课程</el-button>
                <el-button size="small" style="margin-left:8px" @click="menu='export'">生成 data.js</el-button>
              </div>
            </div>
            <el-table :data="courses" size="small" border>
              <el-table-column label="封面" width="80"><template #default="s"><img class="thumb" :src="s.row.img"></template></el-table-column>
              <el-table-column prop="name" label="课程名称" show-overflow-tooltip></el-table-column>
              <el-table-column prop="price" label="价格" width="100"></el-table-column>
              <el-table-column label="操作" width="150">
                <template #default="s">
                  <el-button size="small" @click="openEdit(s.row)">编辑</el-button>
                  <el-button size="small" type="danger" @click="del(s.row.id)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- 生成 data.js -->
        <template v-else-if="menu==='export'">
          <div class="notice">
            <b>如何使用：</b><br>
            1. 点"生成"得到最新的 data.js 内容；<br>
            2. 点"复制内容"（或"下载 data.js"）；<br>
            3. 到 GitHub 仓库 <b>itzdw.github.io/highlife/js/data.js</b> 点编辑，把内容粘贴覆盖并提交；<br>
            4. 等几十秒 Pages 更新后，刷新前台即可看到新数据（所有访客同步）。
          </div>
          <div class="panel">
            <div class="toolbar">
              <h3 style="margin:0">生成 data.js</h3>
              <div>
                <el-button type="primary" size="small" @click="generate">生成</el-button>
                <el-button size="small" @click="copyCode">复制内容</el-button>
                <el-button size="small" @click="download">下载 data.js</el-button>
              </div>
            </div>
            <textarea class="code-area" v-model="code" spellcheck="false" placeholder="点击“生成”按钮，这里会显示完整的 data.js 内容"></textarea>
            <div class="hint">生成的内容可直接覆盖 js/data.js 文件；下载得到的文件名就是 data.js，可直接上传替换。</div>
          </div>
        </template>

        <!-- 站点信息 -->
        <template v-else>
          <div class="panel" style="max-width:560px">
            <h3 style="margin:0 0 16px">站点信息</h3>
            <el-descriptions :column="1" border>
              <el-descriptions-item label="站点名称">highlife-culture</el-descriptions-item>
              <el-descriptions-item label="简介">蜡烛、手工皂专业课程国际培训平台</el-descriptions-item>
              <el-descriptions-item label="Email">bella_highlife@qq.com</el-descriptions-item>
              <el-descriptions-item label="Tel">18601365446</el-descriptions-item>
              <el-descriptions-item label="地址">天津滨海新区中新生态城世茂玖熙 3402</el-descriptions-item>
              <el-descriptions-item label="数据源">js/data.js（静态文件）</el-descriptions-item>
              <el-descriptions-item label="管理员">admin</el-descriptions-item>
            </el-descriptions>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- 课程编辑弹窗 -->
  <el-dialog v-model="dialog" :title="editing?'编辑课程':'新增课程'" width="480px">
    <el-form :model="form" label-width="80px">
      <el-form-item label="课程名称"><el-input v-model="form.name" placeholder="请输入课程名称"></el-input></el-form-item>
      <el-form-item label="价格"><el-input v-model="form.price" placeholder="如 ￥9800"></el-input></el-form-item>
      <el-form-item label="封面图">
        <el-select v-model="form.img" placeholder="选择封面" style="width:100%">
          <el-option v-for="c in imgOptions" :key="c.v" :label="c.l" :value="c.v"></el-option>
        </el-select>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="dialog=false">取消</el-button>
      <el-button type="primary" @click="save">保存</el-button>
    </template>
  </el-dialog>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/element-plus.full.min.js"></script>
<script src="js/data.js"></script>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup(){
    const logged = ref(false);
    const login = ref({user:'',pwd:''});
    const rules = {
      user:[{required:true,message:'请输入账号',trigger:'blur'}],
      pwd:[{required:true,message:'请输入密码',trigger:'blur'}]
    };
    const menu = ref('dash');
    const courses = ref([]);
    const dirty = ref(false);
    const code = ref('');
    const dialog = ref(false);
    const editing = ref(false);
    const form = ref({id:null,name:'',price:'',img:''});
    const imgOptions = [];
    for(let i=3;i<=8;i++) imgOptions.push({v:'images/img_00'+i+'.jpg',l:'课程图 '+i});
    for(let i=24;i<=31;i++) imgOptions.push({v:'images/img_0'+i+'.jpg',l:'课程图 '+i});
    const hotCount = computed(()=>Math.min(courses.value.length,6));

    // 数据来自 data.js（静态文件），深拷贝到内存，修改不写 localStorage
    function load(){
      const src = Array.isArray(window.HIGHLIFE_COURSES) ? window.HIGHLIFE_COURSES : [];
      courses.value = JSON.parse(JSON.stringify(src));
      dirty.value = false;
    }
    function doLogin(){
      if(login.value.user==='admin' && login.value.pwd==='admin123'){
        logged.value = true; sessionStorage.setItem('hl_admin','1'); load();
        ElementPlus.ElMessage.success('登录成功');
      } else { ElementPlus.ElMessage.error('账号或密码错误'); }
    }
    function logout(){ logged.value=false; sessionStorage.removeItem('hl_admin'); login.value={user:'',pwd:''}; }
    function openAdd(){ editing.value=false; form.value={id:Date.now(),name:'',price:'',img:imgOptions[0].v}; dialog.value=true; }
    function openEdit(row){ editing.value=true; form.value=Object.assign({},row); dialog.value=true; }
    function save(){
      if(!form.value.name.trim()){ ElementPlus.ElMessage.warning('请填写课程名称'); return; }
      if(editing.value){
        const i = courses.value.findIndex(c=>c.id===form.value.id);
        if(i>=0) courses.value[i] = Object.assign({},form.value);
      } else {
        courses.value.push(Object.assign({},form.value));
      }
      dirty.value = true; dialog.value=false; ElementPlus.ElMessage.success('已修改（记得生成 data.js 并覆盖文件）');
    }
    function del(id){ courses.value = courses.value.filter(c=>c.id!==id); dirty.value=true; ElementPlus.ElMessage.success('已删除（记得生成 data.js 并覆盖文件）'); }

    function generate(){
      const esc = s => JSON.stringify(String(s == null ? '' : s));
      const lines = [
        '/* HIGH LIFE 课程数据 —— 唯一数据源，修改后刷新前台即生效 */',
        'var HIGHLIFE_COURSES = ['
      ];
      courses.value.forEach(c=>{
        lines.push('  { id: ' + Number(c.id) + ', name: ' + esc(c.name) + ', price: ' + esc(c.price) + ', img: ' + esc(c.img) + ' },');
      });
      lines.push('];');
      lines.push('window.HIGHLIFE_COURSES = HIGHLIFE_COURSES;');
      code.value = lines.join('\n');
      ElementPlus.ElMessage.success('已生成，请复制或下载后覆盖 js/data.js');
    }
    function copyCode(){
      if(!code.value){ ElementPlus.ElMessage.warning('请先点“生成”'); return; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code.value).then(()=>ElementPlus.ElMessage.success('已复制到剪贴板')).catch(()=>fallbackCopy());
      } else { fallbackCopy(); }
    }
    function fallbackCopy(){
      const ta = document.querySelector('.code-area');
      if(ta){ ta.select(); try{ document.execCommand('copy'); ElementPlus.ElMessage.success('已复制'); }catch(e){ ElementPlus.ElMessage.error('复制失败，请手动选择复制'); } }
    }
    function download(){
      if(!code.value){ ElementPlus.ElMessage.warning('请先点“生成”'); return; }
      const blob = new Blob([code.value], {type:'text/javascript;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='data.js'; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      ElementPlus.ElMessage.success('已下载 data.js');
    }

    onMounted(()=>{ if(sessionStorage.getItem('hl_admin')==='1'){ logged.value=true; load(); } });
    return { logged,login,rules,doLogin,logout,menu,courses,dirty,code,hotCount,dialog,editing,form,imgOptions,openAdd,openEdit,save,del,generate,copyCode,download };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
